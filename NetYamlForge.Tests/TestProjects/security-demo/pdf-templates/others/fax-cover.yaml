# FAX 送付状テンプレート - 03
# ソースファイル：templates/business/fax/fax03.pdf
name: fax-cover-03
filenameTemplate: "FAX 送付状_{date:yyyyMMddHHmm}.pdf"
pageSize: A4
orientation: portrait
margins: [40, 40, 40, 40]

theme:
  primaryColor: "8B4513"
  labelColor: "A07855"
  labelTextColor: "ffffff"
  subtleBackground: "FDF5E6"
  oddRowColor: "FAF0E6"
  borderColor: "D2B48C"

dataSources:
  recipient:
    query: "SELECT Id, Name, Department, FaxNumber, Phone FROM Contact WHERE Id = @RecipientId"

sections:
  # ヘッダー
  - type: row
    columnWidths: [30, 70]
    marginBottom: 4
    cells:
      - vAlign: middle
        elements:
          - type: paragraph
            text: "FAX"
            fontSize: 36
            color: primary
            align: left
            bold: true
      - vAlign: bottom
        elements:
          - type: paragraph
            field: SendDate
            prefix: "送信日時："
            fontSize: 10
            align: right

  # 区切り線
  - type: line
    lineWeight: 3
    color: primary
    marginBottom: 10

  # 宛先情報
  - type: paragraph
    text: "【送 信 先】"
    fontSize: 9
    color: "666666"
    marginBottom: 2

  - type: labelTable
    columnWidths: [25, 75]
    labelBackground: subtle
    borderWeight: 0.5
    cellPadding: 4
    fontSize: 9.5
    rows:
      - label: "会社名"
        field: "recipient.Name"
        suffix: " 御中"
      - label: "部署名"
        field: "recipient.Department"
      - label: "ご担当者"
        field: "recipient.ContactName"
        suffix: " 様"
      - label: "FAX 番号"
        field: "recipient.FaxNumber"
      - label: "電話番号"
        field: "recipient.Phone"

  # 送信者情報
  - type: paragraph
    text: "【送 信 者】"
    fontSize: 9
    color: "666666"
    marginTop: 8
    marginBottom: 2

  - type: labelTable
    columnWidths: [25, 75]
    labelBackground: null
    borderWeight: 0.5
    cellPadding: 4
    fontSize: 9.5
    rows:
      - label: "会社名"
        field: SenderCompany
      - label: "部署名"
        field: SenderDepartment
      - label: "氏名"
        field: SenderName
      - label: "FAX 番号"
        field: SenderFax
      - label: "電話番号"
        field: SenderPhone
      - label: "メール"
        field: SenderEmail

  # 送信情報
  - type: paragraph
    text: "【送 信 情 報】"
    fontSize: 9
    color: "666666"
    marginTop: 8
    marginBottom: 2

  - type: labelTable
    columnWidths: [30, 70]
    labelBackground: subtle
    borderWeight: 0.5
    cellPadding: 4
    fontSize: 9.5
    rows:
      - label: "送信日時"
        field: SendDate
        format: "yyyy/MM/dd HH:mm"
      - label: "総ページ数"
        field: TotalPages
        suffix: " ページ"
      - label: "本文書数"
        field: DocumentCount
        suffix: " 通"

  # メッセージ欄
  - type: paragraph
    text: "【ご 挨 拶】"
    fontSize: 9
    color: "666666"
    marginTop: 8
    marginBottom: 2

  - type: row
    columnWidths: [100]
    cells:
      - borderWeight: 0.5
        padding: 8
        minHeight: 80
        elements:
          - type: paragraph
            template: |
              {Message}
              
              平素は大変お世話になっております。
              下記書類を FAX にてお送りいたします。
              ご査収のほど、よろしくお願い申し上げます。
            fontSize: 9
            lineHeight: 1.6

  # 脚注
  - type: paragraph
    text: "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    fontSize: 7
    color: "999999"
    marginTop: 12
    marginBottom: 2

  - type: paragraph
    text: "※本 FAX は送信元の了承を得て送信されています。"
    fontSize: 6.5
    color: "999999"
    align: center

  - type: paragraph
    field: Remarks
    fontSize: 7
    color: "666666"
    marginTop: 4

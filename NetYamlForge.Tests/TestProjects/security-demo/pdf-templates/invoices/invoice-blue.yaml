# 請求書テンプレート - Blue (青)
# ソースファイル：templates/business/invoices/invoice-blue.pdf
name: invoice-blue
filenameTemplate: "請求書（青）_{date:yyyyMMdd}.pdf"
pageSize: A4
orientation: portrait
margins: [40, 40, 40, 40]

theme:
  primaryColor: "0066CC"
  labelColor: "4DA6FF"
  labelTextColor: "ffffff"
  subtleBackground: "E6F2FF"
  oddRowColor: "F5F9FF"
  borderColor: "99CCFF"

dataSources:
  customer:
    query: "SELECT Id, Name, Address FROM Customer WHERE Id = @CustomerId"
  items:
    query: "SELECT * FROM JpInvoiceItem WHERE InvoiceId = @Id ORDER BY LineNo"

sections:
  # タイトルヘッダー
  - type: row
    columnWidths: [50, 50]
    marginBottom: 4
    cells:
      - vAlign: middle
        paddingLeft: 20
        elements:
          - type: paragraph
            text: "Invoice"
            fontSize: 24
            color: primary
            align: left
            bold: true
          - type: paragraph
            text: "請求書"
            fontSize: 14
            color: "666666"
            align: left
            marginTop: 2
      - vAlign: middle
        paddingRight: 20
        elements:
          - type: paragraph
            field: InvoiceNo
            prefix: "No. "
            fontSize: 14
            align: right
            bold: true
            color: primary
          - type: paragraph
            field: IssueDate
            prefix: "Date: "
            fontSize: 9
            align: right
            marginTop: 2

  # 区切り線
  - type: line
    lineWeight: 3
    color: primary
    marginBottom: 8

  # 顧客情報
  - type: paragraph
    field: "customer.Name"
    suffix: " 御中"
    fontSize: 14
    bold: true
    marginBottom: 2

  - type: paragraph
    field: "customer.Address"
    fontSize: 9
    marginBottom: 8

  # 基本情報グリッド
  - type: labelTable
    columnWidths: [33, 33, 34]
    labelBackground: subtle
    labelTextColor: primary
    borderWeight: 0.5
    borderColor: labelColor
    cellPadding: 5
    fontSize: 8.5
    rows:
      - label: "請求日"
        field: IssueDate
      - label: "お支払期限"
        field: DueDate
      - label: "T 番号"
        field: RegistrationNo

  # 明細テーブル
  - type: dataTable
    dataSource: items
    minRows: 10
    borderWeight: 0.75
    borderColor: labelColor
    cellPadding: 5
    fontSize: 8.5
    labelBackground: primary
    labelTextColor: labelText
    oddRowBackground: oddRow
    columns:
      - field: _rowNumber
        label: "No."
        width: 6
        align: center
      - field: ItemName
        label: "品目名"
        width: 38
        align: left
      - field: Quantity
        label: "数量"
        width: 10
        align: right
        format: quantity
      - field: UnitPrice
        label: "単価"
        width: 14
        align: right
        format: currency
      - field: Amount
        label: "金額"
        width: 16
        align: right
        format: currency
        bold: true

  # 合計セクション
  - type: row
    columnWidths: [55, 45]
    marginTop: 4
    cells:
      - elements: []
      - elements:
          - type: labelTable
            columnWidths: [50, 50]
            labelBackground: subtle
            borderWeight: 0.5
            cellPadding: 4
            fontSize: 9
            rows:
              - label: "小計"
                field: Subtotal
                format: "¥#,##0"
              - label: "消費税"
                field: TaxAmount
                format: "¥#,##0"
              - label: "合計"
                field: Total
                format: "¥#,##0"
                bold: true
                labelBackground: primary
                labelTextColor: labelText

  # フッター注記
  - type: paragraph
    text: "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    fontSize: 8
    color: labelColor
    marginTop: 12
    marginBottom: 2

  - type: paragraph
    field: Remarks
    fontSize: 8
    color: "666666"

  - type: paragraph
    field: PreparedBy
    prefix: "担当："
    fontSize: 8
    marginTop: 4

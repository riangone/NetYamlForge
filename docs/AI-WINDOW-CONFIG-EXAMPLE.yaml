# AI 窗口系统配置示例
# 适用于 auto-dealer 项目
# 路径: projects/auto-dealer-demo/config/ai-window.yml

apiVersion: v1
kind: AIWindow
metadata:
  name: customer-ai-service
  displayName: 客户 AI 智能窗口
  namespace: auto-dealer-demo
  version: "1.0"

spec:
  # ============================================
  # LLM 配置
  # ============================================
  llm:
    # 提供商选择: "qwen" | "openai" | "azure" | "claude"
    provider: "qwen"
    
    # 模型配置 (Qwen)
    qwen:
      model: "qwen-turbo"  # qwen-turbo | qwen-plus | qwen-long
      apiEndpoint: "https://dashscope.aliyuncs.com/api/v1/services/aigc/text-generation/generation"
      apiKey: "${AI_LLM_API_KEY}"  # 从环境变量读取
      
      # 超时和重试
      timeout: 30000  # ms
      maxRetries: 3
      retryDelayMs: 1000
    
    # 系统提示词 - 定义 AI 的行为和风格
    systemPrompt: |
      你是一个专业的自动车经销商客服助手。
      
      你的核心职责:
      1. 回答关于营业时间、车型、价格的常见问题
      2. 帮助客户预约服务、检查或试驾
      3. 查询客户的合同状态、支付信息、服务历史
      4. 当无法回答或客户需要时，友好地转接给人工客服
      5. 提供专业、礼貌的服务体验
      
      重要原则:
      - 始终保持礼貌和专业
      - 优先保护客户隐私：不要主动显示财务信息，除非客户要求
      - 对自己无法确定的信息要坦白说"不确定，为您转接专家"
      - 如果检测到客户情绪不好，立即提出转接人工客服
      - 回答要简洁明了，避免过长的文本
      - 对日期和时间要特别小心，确保格式准确
      
      你拥有以下工具的访问权限:
      - 知识库: 营业信息、常见问题解答
      - 客户数据库: 合同、支付、服务历史 (需要验证)
      - 预约系统: 查询和创建服务预约
      - 库存系统: 新车和中古车库存查询
      
      当用户表达以下需求时，提供特殊处理:
      - "我想预约" → 帮助他们完成预约流程
      - "我的账单是什么?" → 请他们验证身份后查询
      - "我不满意" → 立即转接质量部门
      - "我是 VIP 客户" → 确认后标记为优先处理

    # 模型参数调整
    parameters:
      temperature: 0.3         # 0.0-2.0, 越低越确定，越高越创意
      topP: 0.9                # 核采样，控制多样性
      topK: 0                  # 0 = 禁用
      maxTokens: 1024          # 最大回复长度
      presencePenalty: 0.0     # 是否重复同一话题
      frequencyPenalty: 0.0    # 是否重复同一词汇

  # ============================================
  # 多渠道集成
  # ============================================
  channels:
    # Web 聊天框
    - id: web-chat
      name: web
      displayName: Web 聊天框
      enabled: true
      type: web
      config:
        # 脚本嵌入配置
        scriptUrl: "/js/ai-chat-widget.js"
        scriptIntegrity: "sha384-xxxxx"  # SRI 完整性检查
        
        # 聊天框样式
        position: "bottom-right"         # bottom-right | bottom-left | top-right | top-left
        width: "380px"
        height: "600px"
        borderRadius: "12px"
        primaryColor: "#0066cc"
        
        # 功能开关
        features:
          allowFileUpload: false
          allowImageUpload: true
          showTypingIndicator: true
          offerSurvey: true              # 对话结束时显示满意度调查
          
        # 离线消息
        offlineMessage: |
          我们暂时离线，但您的消息已保存。
          我们会在营业时间内尽快回复您。
        
        # 初始消息
        initialMessages:
          - "👋 欢迎来到我们的客服中心!"
          - "请问有什么可以帮您？"
    
    # LINE 官方账号集成
    - id: line-official
      name: line
      displayName: LINE 官方账号
      enabled: true
      type: messaging
      config:
        channelId: "${LINE_CHANNEL_ID}"
        channelSecret: "${LINE_CHANNEL_SECRET}"
        accessToken: "${LINE_ACCESS_TOKEN}"
        
        # Webhook 配置
        webhook:
          path: "/api/webhooks/line"
          verify: true
        
        # Rich Menu 配置
        richMenu:
          enabled: true
          areas:
            - label: "营业时间"
              action:
                type: postback
                data: "intent:business_hours"
            - label: "预约服务"
              action:
                type: postback
                data: "intent:book_service"
            - label: "查询订单"
              action:
                type: postback
                data: "intent:order_query"
            - label: "联系客服"
              action:
                type: postback
                data: "action:request_handover"
    
    # Email 集成
    - id: email-gateway
      name: email
      displayName: 电子邮件
      enabled: false
      type: email
      config:
        # 接收邮件设置
        inbound:
          protocol: "imap"
          host: "imap.gmail.com"
          port: 993
          username: "${EMAIL_USERNAME}"
          password: "${EMAIL_PASSWORD}"
          folder: "INBOX"
          pollIntervalMs: 60000  # 每 60 秒检查一次
        
        # 发送邮件设置
        outbound:
          protocol: "smtp"
          host: "smtp.gmail.com"
          port: 587
          username: "${EMAIL_USERNAME}"
          password: "${EMAIL_PASSWORD}"
          from: "noreply@auto-dealer.com"
          fromName: "自动车经销商"
        
        # 自动回复
        autoReply: |
          感谢您的邮件！
          我们已收到您的消息，AI 助手正在处理您的问题。
          我们会尽快给您答复。
          
          预计响应时间：营业时间内 1-2 小时

  # ============================================
  # 知识库配置
  # ============================================
  knowledgeBase:
    # 是否启用本地知识库
    enabled: true
    
    # 知识库条目
    entries:
      # 1. 营业信息类
      - id: kb-001
        title: 营业时间
        category: business_info
        priority: 100
        keywords:
          - 営業時間
          - 何時まで
          - 営業日
          - オープン
          - クローズ
          - 平日
          - 土曜
        content: |
          我们的营业时间如下：
          
          **平日 (月～金):**
          9:00 - 18:00 (中午不休息)
          
          **土曜:**
          9:00 - 17:00
          
          **日曜・祝日:**
          休業
          
          **年末年始 (12月29日 - 1月3日):**
          休業
          
          如需预约特殊时间，请致电 XX-XXXX-XXXX。
      
      - id: kb-002
        title: 新车价格范围
        category: product_info
        priority: 90
        keywords:
          - 新車
          - 価格
          - いくら
          - 値段
          - コスト
        content: |
          我们提供多个品牌和车型，价格范围如下：
          
          **入门级车型:**
          ¥2,500,000 - ¥3,500,000
          
          **中级车型:**
          ¥3,500,000 - ¥5,500,000
          
          **豪华车型:**
          ¥5,500,000 以上
          
          各车型的详细价格和配置，请拨打我们的销售热线查询。
          我们也可以根据您的预算为您推荐合适的车型。
      
      - id: kb-003
        title: 融资方案
        category: financing
        priority: 85
        keywords:
          - ローン
          - 金利
          - 返済
          - クレジット
          - 分割払い
          - 頭金
        content: |
          我们与多家金融机构合作，为您提供灵活的融资方案：
          
          **贷款条件:**
          - 利率范围：2.9% - 4.9%
          - 还款期限：12-84 个月 (1-7 年)
          - 首付比例：0% - 30%
          
          **融资流程:**
          1. 选择车辆
          2. 提交贷款申请
          3. 金融机构审核 (1-3 个工作日)
          4. 合同签署
          5. 资金到账
          
          建议您直接与我们的融资顾问联系，了解最适合您的方案。
      
      - id: kb-004
        title: 预约流程
        category: service
        priority: 95
        keywords:
          - 予約
          - 予定
          - 申し込み
          - ブッキング
          - 点検
          - サービス
        content: |
          预约我们的服务非常简单：
          
          **方式:**
          1. 通过本聊天窗口预约
          2. 拨打 XX-XXXX-XXXX
          3. 访问我们的网站 www.auto-dealer.com/booking
          
          **预约步骤:**
          1. 选择服务类型 (点检、修理、车检等)
          2. 选择首选日期和时间
          3. 提供车辆信息 (车牌、车型)
          4. 确认预约
          
          **预约后:**
          - 您将收到确认邮件/短信
          - 预约前 24 小时会收到提醒
          - 如需取消/改期，请至少提前 24 小时通知
      
      - id: kb-005
        title: 保修政策
        category: warranty
        priority: 80
        keywords:
          - 保証
          - 保修
          - ワランティ
          - 新車
          - 中古車
        content: |
          我们的保修政策如下：
          
          **新车保修:**
          - 期限：3 年或 100,000 km（先到者为准）
          - 范围：除正常磨损外的所有缺陷
          - 费用：完全免费
          
          **中古车保修:**
          - 期限：1 年或 50,000 km（由车龄和状况决定）
          - 范围：主要部件 (引擎、变速箱、底盘)
          - 费用：完全免费
          
          **保修不包括:**
          - 定期维护 (机油更换、轮胎更换)
          - 正常磨损的零件
          - 由于不当使用导致的损伤
          - 改装部件导致的故障
          
          欲了解更多详情，请咨询我们的服务顾问。

  # ============================================
  # 意图和路由规则
  # ============================================
  intents:
    - id: business_hours
      name: 营业时间查询
      trigger_keywords:
        - 営業時間
        - 何時まで
        - 営業日
      response_template: "kb-001"  # 引用知识库条目
      confidence_threshold: 0.7
    
    - id: book_service
      name: 预约服务
      trigger_keywords:
        - 予約
        - 予定
        - サービス
      requires_authentication: false  # 匿名用户可预约
      follow_up_action: appointment_form
      response_template: custom  # 使用自定义响应
    
    - id: order_query
      name: 订单查询
      trigger_keywords:
        - 注文状態
        - 配送
        - いつ届く
      requires_authentication: true  # 必须验证身份
      follow_up_action: customer_data_lookup
    
    - id: complaint
      name: 投诉
      trigger_keywords:
        - 不満
        - クレーム
        - 問題
      sentiment_threshold: -0.5  # 负面情感检测
      priority: high
      auto_handover: true  # 自动转接

  # ============================================
  # 转接规则
  # ============================================
  handover:
    # 自动转接条件
    autoHandoverTriggers:
      # 置信度过低
      - condition: "confidence < 0.5"
        reason: "LowConfidence"
        targetDepartment: "sales"
        message: "複雑なご質問ですので、専門の担当者にお繋ぎいたします。"
        priority: medium
      
      # 检测到负面情感
      - condition: "sentiment < -0.7"
        reason: "NegativeSentiment"
        targetDepartment: "quality"
        message: "ご不便をおかけして申し訳ございません。品質管理部にお繋ぎいたします。"
        priority: high
      
      # 客户主动请求
      - condition: "intent == customer_request_handover"
        reason: "CustomerRequest"
        targetDepartment: "sales"
        message: "かしこまりました。お待たせしません。"
        priority: medium
      
      # VIP 客户
      - condition: "customer_tier == vip"
        reason: "VipCustomer"
        targetDepartment: "sales"
        preferredAgents: ["agent_001", "agent_003"]
        message: "VIP 顧客様専任の担当者にお繋ぎいたします。"
        priority: high
    
    # 路由配置
    routing:
      # 销售部门
      - department: "sales"
        queue_name: "sales_queue"
        description: "销售咨询、新车销售、融资"
        agentAssignmentStrategy: "round_robin"  # round_robin | least_busy | skill_match
        maxWaitTime: 300  # 秒
      
      # 服务部门
      - department: "service"
        queue_name: "service_queue"
        description: "服务预约、维护、修理"
        agentAssignmentStrategy: "least_busy"
        maxWaitTime: 300
      
      # 质量部门
      - department: "quality"
        queue_name: "quality_queue"
        description: "投诉、建议、问题解决"
        agentAssignmentStrategy: "skill_match"
        maxWaitTime: 600
        requiresApproval: true  # 转接前需要审批
    
    # 转接失败处理
    fallbackBehavior:
      maxRetries: 3
      escalateToManager: true
      sendOfflineMessage: true
      offlineMessage: |
        抱歉，我们暂时无法将您转接给客服代表。
        我们已记录您的信息，我们会在营业时间内尽快回复您。
        
        您的参考号：{conversation_id}
        预计回复时间：1-2 小时

  # ============================================
  # 情感分析配置
  # ============================================
  sentiment:
    enabled: true
    provider: "openai"  # or "huggingface"
    model: "text-davinci-003"
    
    # 情感评分阈值
    thresholds:
      positive: 0.3        # 情感分数 > 0.3 为正面
      neutral: -0.3        # 情感分数 -0.3 ~ 0.3 为中立
      negative: -0.3       # 情感分数 < -0.3 为负面
    
    # 检测到负面情感时的行动
    negativeActions:
      - markForReview: true
      - addToHighPriorityQueue: true
      - sendWarningToAgent: true
      - offerImmediateHandover: true

  # ============================================
  # 学习和改进
  # ============================================
  learning:
    # 启用用户反馈收集
    collectFeedback: true
    feedbackDelay: 5000  # 对话结束后 5 秒显示反馈表单
    
    # 启用对话分析
    analyzeConversations: true
    analysisInterval: 86400  # 每 24 小时分析一次
    
    # 推荐知识库条目更新
    suggestKbUpdates: true
    updateSuggestionThreshold: 3  # 如果 3 个用户问同一问题但 AI 无法回答，建议新增 KB
    
    # A/B 测试
    abTesting:
      enabled: false
      experiments:
        - id: exp-001
          name: "提示词优化 v2"
          splitRatio: 0.5  # 50% 用户使用新提示词
          duration: 604800  # 7 天

  # ============================================
  # 性能和安全配置
  # ============================================
  performance:
    # 缓存
    caching:
      enabled: true
      ttl: 3600  # 秒
      strategy: "lru"  # least_recently_used
    
    # 速率限制
    rateLimit:
      enabled: true
      messagesPerMinute: 10
      conversationsPerHour: 100
    
    # 超时
    timeout:
      llmApiCall: 30000  # 30 秒
      databaseQuery: 10000  # 10 秒
      totalRequestTime: 60000  # 60 秒
  
  security:
    # HTTPS 强制
    requireHttps: true
    
    # CORS 配置
    cors:
      allowedOrigins:
        - "https://www.auto-dealer.com"
        - "https://admin.auto-dealer.com"
    
    # API 密钥验证
    apiKeyVerification: true
    
    # 数据加密
    encryption:
      enabled: true
      algorithm: "AES-256-GCM"
    
    # IP 白名单 (可选)
    ipWhitelist: []

  # ============================================
  # 监控和日志
  # ============================================
  monitoring:
    # 指标收集
    metrics:
      enabled: true
      interval: 60  # 秒
      prometheus:
        enabled: true
        port: 9090
    
    # 日志
    logging:
      level: "info"  # debug, info, warn, error
      format: "json"
      destination: "elasticsearch"
      retention: 30  # 天
    
    # 告警
    alerts:
      - metric: "response_time"
        condition: "> 5000"  # 毫秒
        action: "notify_ops"
      
      - metric: "error_rate"
        condition: "> 0.01"  # 1%
        action: "page_oncall"
      
      - metric: "queue_depth"
        condition: "> 10"
        action: "notify_managers"

  # ============================================
  # 特性开关
  # ============================================
  features:
    enableFileUpload: false
    enableImageRecognition: false  # 将来的功能
    enableVideoCall: false         # 将来的功能
    enableScheduledMessages: false
    enableProactiveChat: false
    enableMultiLanguage: false
    
    # 试验性功能
    experimental:
      enableVoiceInput: false
      enableContextualRecommendations: false

  # ============================================
  # 通知配置
  # ============================================
  notifications:
    # 新消息通知
    newMessage:
      email: true
      sms: false
      push: true
    
    # 转接通知
    handover:
      notifyCustomer: true
      notifyAgent: true
      estimatedWaitTimeNotification: true
    
    # 反馈通知
    feedback:
      collectAfterConversation: true
      remindIfNoResponse: true

  # ============================================
  # SLA (服务级别协议)
  # ============================================
  sla:
    responseTime: 2000  # 首次回复 < 2 秒
    handoverTime: 300   # 转接 < 5 分钟
    resolutionTime: 1800  # 解决 < 30 分钟
    availabilityTarget: 0.999  # 99.9%

---
# 数据库迁移配置
apiVersion: batch/v1
kind: Migration
metadata:
  name: ai-window-schema
spec:
  version: "1.0"
  tables:
    - name: ai_conversation
      columns:
        - name: conversation_id
          type: UUID
          primaryKey: true
        - name: user_id
          type: VARCHAR(255)
          required: true
        - name: channel
          type: VARCHAR(50)
        - name: project_id
          type: VARCHAR(100)
        - name: status
          type: VARCHAR(50)
        - name: created_at
          type: TIMESTAMP
          default: "CURRENT_TIMESTAMP"
      indexes:
        - columns: [user_id, channel]
        - columns: [project_id, status]

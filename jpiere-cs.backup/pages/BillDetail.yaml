title: 請求詳細
description: "請求ヘッダ情報と明細・入金状況を表示"

sections:
  # 請求ヘッダ情報
  - id: bill_header
    title: 請求情報
    component: table
    sourceType: custom
    source: |
      SELECT
        b.document_no AS 請求番号,
        CASE b.doc_status
          WHEN 'DR' THEN '下書き'
          WHEN 'CO' THEN '確定'
          WHEN 'VO' THEN '無効'
        END AS 状態,
        bp.name AS 取引先,
        b.date_billed AS 請求日,
        b.date_due AS 支払期限,
        b.date_sent AS 送付日,
        b.grand_total AS 請求額,
        b.pay_amt AS 入金額,
        b.outstanding_amt AS 残高,
        CASE b.payment_rule
          WHEN 'T' THEN '翌月払い'
          WHEN 'I' THEN '即時'
        END AS 支払方法
      FROM bills b
      JOIN business_partners bp ON b.business_partner_id = bp.id
      WHERE b.id = @entityId
    columns: [請求番号, 状態, 取引先, 請求日, 支払期限, 送付日, 請求額, 入金額, 残高, 支払方法]
    pageSize: 1
    editable: false
    readOnly: true

  # 請求明細
  - id: bill_lines
    title: 請求明細
    component: table
    sourceType: custom
    source: |
      SELECT
        bl.line_no AS 行番,
        bl.description AS 説明,
        bl.period_from AS 期間開始,
        bl.period_to AS 期間終了,
        bl.total_lines AS 小計,
        bl.grand_total AS 合計,
        bl.tax_amt AS 税額,
        bl.pay_amt AS 入金額
      FROM bill_lines bl
      WHERE bl.bill_id = @entityId AND bl.is_active = 1
      ORDER BY bl.line_no ASC
    columns: [行番, 説明, 期間開始, 期間終了, 小計, 合計, 税額, 入金額]
    pageSize: 20
    editable: false
    readOnly: true

  # 入金ステータス
  - id: payment_status
    title: 入金ステータス
    component: stat_cards
    sourceType: custom
    source: |
      SELECT '請求額' AS metric_name,
             CASE WHEN grand_total >= 1000000
               THEN CAST(ROUND(grand_total / 10000, 1) AS TEXT) || '万円'
               ELSE CAST(grand_total AS TEXT)
             END AS metric_value,
             '💰' AS metric_icon, NULL AS metric_delta
      FROM bills WHERE id = @entityId
      UNION ALL
      SELECT '入金額',
             CASE WHEN pay_amt >= 1000000
               THEN CAST(ROUND(pay_amt / 10000, 1) AS TEXT) || '万円'
               ELSE CAST(pay_amt AS TEXT)
             END,
             '✅', NULL
      FROM bills WHERE id = @entityId
      UNION ALL
      SELECT '未収残高',
             CASE WHEN outstanding_amt >= 1000000
               THEN CAST(ROUND(outstanding_amt / 10000, 1) AS TEXT) || '万円'
               ELSE CAST(outstanding_amt AS TEXT)
             END,
             CASE WHEN outstanding_amt > 0 THEN '⚠️' ELSE '🆗' END,
             NULL
      FROM bills WHERE id = @entityId
    columns: [metric_name, metric_value, metric_icon, metric_delta]
    labelField: metric_name
    valueField: metric_value
    iconField: metric_icon
    deltaField: metric_delta
    pageSize: 5
    editable: false
    readOnly: true

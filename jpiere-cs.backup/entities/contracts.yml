imports: []
entities:
  contracts:
    table: contracts
    key: id
    displayName: 契約管理
    softDelete: false
    isPublic: false

    hooks:
      beforeCreate:
        - contract_document_no
        - contract_amount_calculate
      beforeUpdate:
        - contract_amount_calculate
        - contract_status

    joins:
      - type: left
        table: business_partners
        alias: bp
        on: contracts.business_partner_id = bp.id
      - type: left
        table: contract_categories
        alias: cc
        on: contracts.contract_category_id = cc.id

    forms:
      document_no:
        type: string
        required: true
        label: 契約番号
        editable: true
      name:
        type: string
        required: true
        label: 契約名称
        editable: true
      contract_type:
        type: string
        required: true
        label: 契約種別
        editable: true
        options:
          - SAL
          - PUR
          - BOT
        optionLabels:
          SAL: 販売契約
          PUR: 購買契約
          BOT: 両方
      doc_status:
        type: string
        required: true
        label: 書類ステータス
        editable: true
        options:
          - DR
          - IN
          - CO
          - CL
          - VO
        optionLabels:
          DR: 下書き
          IN: 進行中
          CO: 確定
          CL: 解約
          VO: 無効
      contract_status:
        type: string
        required: true
        label: 契約ステータス
        editable: true
        options:
          - WP
          - AC
          - EX
          - CA
        optionLabels:
          WP: 交渉中
          AC: 有効
          EX: 期限切れ
          CA: 解約
      business_partner_id:
        type: int
        required: true
        label: 取引先
        editable: true
        foreignKey:
          entity: business_partners
          displayColumn: name
      contract_category_id:
        type: int
        label: 契約カテゴリ
        editable: true
        foreignKey:
          entity: contract_categories
          displayColumn: name
      contract_template_id:
        type: int
        label: 契約テンプレート
        editable: true
        foreignKey:
          entity: contract_templates
          displayColumn: name
      sales_rep:
        type: string
        label: 営業担当者
        editable: true
      date_acct:
        type: date
        required: true
        label: 会計日付
        editable: true
      period_date_from:
        type: date
        required: true
        label: 契約開始日
        editable: true
      period_date_to:
        type: date
        label: 契約終了日
        editable: true
      auto_renewal:
        type: boolean
        label: 自動更新
        editable: true
      monthly_revenue_amt:
        type: decimal
        label: 月次売上金額
        editable: true
      total_doc_amt:
        type: decimal
        label: 契約総額
        editable: true
      currency:
        type: string
        label: 通貨
        editable: true
      description:
        type: textarea
        label: 備考
        editable: true
      is_active:
        type: boolean
        label: 有効
        editable: true

    columns:
      id:
        type: int
        identity: true
        label: ID
        sortable: true
      document_no:
        type: string
        required: true
        label: 契約番号
        searchable: true
        sortable: true
      name:
        type: string
        required: true
        label: 契約名称
        searchable: true
        sortable: true
      partner_name:
        type: string
        label: 取引先
        expression: bp.name
        searchable: true
        sortable: true
      contract_type:
        type: string
        label: 種別
        sortable: true
      doc_status:
        type: string
        label: 書類状態
        sortable: true
      contract_status:
        type: string
        label: 契約状態
        sortable: true
      period_date_from:
        type: date
        label: 開始日
        sortable: true
      period_date_to:
        type: date
        label: 終了日
        sortable: true
      monthly_revenue_amt:
        type: decimal
        label: 月次売上
        sortable: true
      total_doc_amt:
        type: decimal
        label: 契約総額
        sortable: true

    paging:
      pageSize: 25
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 2
        order:
          - document_no
          - name
          - business_partner_id
          - contract_type
          - doc_status
          - contract_status
          - contract_category_id
          - contract_template_id
          - sales_rep
          - date_acct
          - period_date_from
          - period_date_to
          - auto_renewal
          - monthly_revenue_amt
          - total_doc_amt
          - currency
          - description
          - is_active
      filters:
        columns: 4
        order:
          - business_partner_id
          - contract_status
          - doc_status
          - document_no

    filters:
      business_partner_id:
        type: dropdown
        label: 取引先
        expression: contracts.business_partner_id
        foreignKey:
          entity: business_partners
          displayColumn: name
      contract_status:
        type: dropdown
        label: 契約状態
        expression: contracts.contract_status
        options:
          - WP
          - AC
          - EX
          - CA
        optionLabels:
          WP: 交渉中
          AC: 有効
          EX: 期限切れ
          CA: 解約
      doc_status:
        type: dropdown
        label: 書類状態
        expression: contracts.doc_status
        options:
          - DR
          - IN
          - CO
          - CL
          - VO
        optionLabels:
          DR: 下書き
          IN: 進行中
          CO: 確定
          CL: 解約
          VO: 無効
      document_no:
        type: like
        label: 契約番号

    exports:
      contracts_csv:
        label: "契約一覧 CSV"
        format: csv
        filename: "contracts_{date:yyyyMMdd}.csv"
        columns:
          - document_no
          - name
          - partner_name
          - contract_type
          - contract_status
          - period_date_from
          - period_date_to
          - monthly_revenue_amt
          - total_doc_amt

    links:
      contract_lines:
        label: 契約明細
        targetEntity: contract_lines
        filter:
          contract_id: id
      bills:
        label: 請求
        targetEntity: bills
        filter:
          linked_contract_id: id
      recognitions:
        label: 売上計上
        targetEntity: recognitions
        filter:
          linked_contract_id: id
      todos:
        label: TODO
        targetEntity: todos
        filter:
          linked_contract_id: id

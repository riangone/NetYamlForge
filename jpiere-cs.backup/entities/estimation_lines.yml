imports: []
entities:
  estimation_lines:
    table: estimation_lines
    key: id
    displayName: 見積明細
    softDelete: false
    isPublic: false

    joins:
      - type: left
        table: estimations
        alias: e
        on: estimation_lines.estimation_id = e.id
      - type: left
        table: products
        alias: p
        on: estimation_lines.product_id = p.id

    forms:
      estimation_id:
        type: int
        required: true
        label: 見積
        editable: true
        foreignKey:
          entity: estimations
          displayColumn: document_no
      line_no:
        type: int
        required: true
        label: 行番号
        editable: true
      product_id:
        type: int
        label: 商品
        editable: true
        foreignKey:
          entity: products
          displayColumn: name
      description:
        type: textarea
        label: 説明
        editable: true
      date_ordered:
        type: date
        required: true
        label: 受注日
        editable: true
      date_promised:
        type: date
        label: 納期
        editable: true
      qty_ordered:
        type: decimal
        required: true
        label: 数量
        editable: true
      uom:
        type: string
        label: 単位
        editable: true
      unit_price:
        type: decimal
        required: true
        label: 単価
        editable: true
      line_amt:
        type: decimal
        required: true
        label: 明細金額
        editable: true
      discount:
        type: decimal
        label: 割引率(%)
        editable: true
      is_active:
        type: boolean
        label: 有効
        editable: true

    columns:
      id:
        type: int
        identity: true
        label: ID
        sortable: true
      estimation_no:
        type: string
        label: 見積番号
        expression: e.document_no
        searchable: true
        sortable: true
      line_no:
        type: int
        required: true
        label: 行番号
        sortable: true
      product_name:
        type: string
        label: 商品
        expression: p.name
        searchable: true
      qty_ordered:
        type: decimal
        required: true
        label: 数量
        sortable: true
      unit_price:
        type: decimal
        required: true
        label: 単価
        sortable: true
      line_amt:
        type: decimal
        required: true
        label: 明細金額
        sortable: true

    paging:
      pageSize: 25
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 2
        order:
          - estimation_id
          - line_no
          - product_id
          - qty_ordered
          - uom
          - unit_price
          - line_amt
          - discount
          - date_ordered
          - date_promised
          - description
          - is_active
      filters:
        columns: 3
        order:
          - estimation_id

    filters:
      estimation_id:
        type: dropdown
        label: 見積
        expression: estimation_lines.estimation_id
        foreignKey:
          entity: estimations
          displayColumn: document_no

imports: []
entities:
  estimations:
    table: estimations
    key: id
    displayName: 見積管理
    softDelete: false
    isPublic: false

    hooks:
      beforeCreate:
        - estimation_document_no
        - estimation_total
      beforeUpdate:
        - estimation_total
        - estimation_to_contract

    joins:
      - type: left
        table: business_partners
        alias: bp
        on: estimations.business_partner_id = bp.id

    forms:
      document_no:
        type: string
        required: true
        label: 見積番号
        editable: true
      estimation_date:
        type: date
        required: true
        label: 見積日
        editable: true
      version:
        type: int
        required: true
        label: バージョン
        editable: true
      doc_status:
        type: string
        required: true
        label: ステータス
        editable: true
        options:
          - DR
          - IN
          - CO
          - VO
        optionLabels:
          DR: 下書き
          IN: 提出済み
          CO: 受注確定
          VO: 失注
      business_partner_id:
        type: int
        required: true
        label: 取引先
        editable: true
        foreignKey:
          entity: business_partners
          displayColumn: name
      sales_rep:
        type: string
        label: 営業担当者
        editable: true
      date_promised:
        type: date
        label: 納期
        editable: true
      currency:
        type: string
        label: 通貨
        editable: true
      total_lines:
        type: decimal
        label: 小計
        editable: false
      grand_total:
        type: decimal
        label: 合計（税込）
        editable: false
      description:
        type: textarea
        label: 備考
        editable: true
      is_active:
        type: boolean
        label: 有効
        editable: true

    columns:
      id:
        type: int
        identity: true
        label: ID
        sortable: true
      document_no:
        type: string
        required: true
        label: 見積番号
        searchable: true
        sortable: true
      estimation_date:
        type: date
        label: 見積日
        sortable: true
      partner_name:
        type: string
        label: 取引先
        expression: bp.name
        searchable: true
        sortable: true
      doc_status:
        type: string
        label: ステータス
        sortable: true
      total_lines:
        type: decimal
        label: 小計
        sortable: true
      grand_total:
        type: decimal
        label: 合計（税込）
        sortable: true

    paging:
      pageSize: 25
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 2
        order:
          - document_no
          - estimation_date
          - version
          - doc_status
          - business_partner_id
          - sales_rep
          - date_promised
          - currency
          - total_lines
          - grand_total
          - description
          - is_active
      filters:
        columns: 4
        order:
          - business_partner_id
          - doc_status
          - document_no

    filters:
      business_partner_id:
        type: dropdown
        label: 取引先
        expression: estimations.business_partner_id
        foreignKey:
          entity: business_partners
          displayColumn: name
      doc_status:
        type: dropdown
        label: ステータス
        expression: estimations.doc_status
        options:
          - DR
          - IN
          - CO
          - VO
        optionLabels:
          DR: 下書き
          IN: 提出済み
          CO: 受注確定
          VO: 失注
      document_no:
        type: like
        label: 見積番号

    links:
      estimation_lines:
        label: 見積明細
        targetEntity: estimation_lines
        filter:
          estimation_id: id

capabilities:
  - icon: 🧭
    title: YAML 中心化配置
    titleKey: home.capabilities.yamlCentered.title
    description: 页面结构、字段呈现、导航入口与文案统一由 YAML 管理，降低维护复杂度。
    descriptionKey: home.capabilities.yamlCentered.description
    badge: Core
    badgeKey: home.capabilities.yamlCentered.badge
  - icon: 🛡️
    title: 企业级访问控制
    titleKey: home.capabilities.enterpriseAccessControl.title
    description: 内置认证、角色授权与审计日志，适配企业内部系统安全要求。
    descriptionKey: home.capabilities.enterpriseAccessControl.description
    badge: Security
    badgeKey: home.capabilities.enterpriseAccessControl.badge
  - icon: 🧩
    title: 可插拔业务扩展
    titleKey: home.capabilities.pluggableExtensions.title
    description: 支持 Hook 与业务逻辑扩展，保持平台稳定同时满足项目定制化。
    descriptionKey: home.capabilities.pluggableExtensions.description
    badge: Extensibility
    badgeKey: home.capabilities.pluggableExtensions.badge
  - icon: 📊
    title: 运营指标可视化
    titleKey: home.capabilities.analyticsReady.title
    description: Dashboard 与运营页面由配置驱动，快速搭建管理视图与监控面板。
    descriptionKey: home.capabilities.analyticsReady.description
    badge: Analytics
    badgeKey: home.capabilities.analyticsReady.badge


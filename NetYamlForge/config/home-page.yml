capabilities:
  - icon: 🧭
    title: YAML 声明式 UI
    description: 页面、字段、校验与操作完全由 YAML 声明，无需编写冗长的 Razor 代码。
    badge: Core
  - icon: 🛡️
    title: 细粒度权限控制
    description: 基于角色的访问控制 (RBAC) 深度集成，确保企业数据资产安全。
    badge: Security
  - icon: 📊
    title: 低代码看板
    description: 通过简单的 SQL 或聚合定义，快速构建可视化运营指标看板。
    badge: Analytics
  - icon: 🧩
    title: 灵活业务扩展
    description: 支持 C# Hooks 与 API 扩展，满足复杂多变的行业业务逻辑。
    badge: Extensibility

solutions:
  - name: 零售 ERP 方案
    audience: 零售商 / 供应链团队
    summary: 覆盖从采购、库存到销售的全链路管理，支持多店协同。
    status: Production
  - name: 文档审批系统
    audience: 企业行政 / 法务部门
    summary: 电子文档集中管理与自动化审批流程，提升办公效率。
    status: Production
  - name: 任务协同平台
    audience: 项目团队 / 运营人员
    summary: 轻量级任务看板与项目追踪，支持灵活的自定义字段。
    status: Beta


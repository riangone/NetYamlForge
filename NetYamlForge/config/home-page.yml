hero:
  eyebrow: NetYamlForge Platform
  title: 统一元数据驱动的企业级开发平台
  description: 通过 YAML 定义 UI 与业务逻辑，大幅提升中后台系统的交付速度与维护性。内置权限、审计、国际化与多租户支持。
  primaryActionLabel: 浏览产品工作区

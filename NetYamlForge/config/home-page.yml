capabilities:
  - icon: 🧭
    title: YAML 声明式 UI
    description: 页面、字段、校验与操作完全由 YAML 声明，无需编写冗长的 Razor 代码。
    badge: Core
  - icon: 🛡️
    title: 细粒度权限控制
    description: 基于角色的访问控制 (RBAC) 深度集成，确保企业数据资产安全。
    badge: Security
  - icon: 📊
    title: 低代码看板
    description: 通过简单的 SQL 或聚合定义，快速构建可视化运营指标看板。
    badge: Analytics
  - icon: 🧩
    title: 灵活业务扩展
    description: 支持 C# Hooks 与 API 扩展，满足复杂多变的行业业务逻辑。
    badge: Extensibility

solutions:
  - name: 智能体自举演进中枢 (Agent Studio)
    audience: AI 架构师 / 全栈开发者 / 自动化运维团队
    summary: 驱动 Claude、Antigravity 与 OpenCode 三阶段闭环推演、规格落盘与热重载。
    status: Official Live
  - name: 现代高效待办工作台 (Todo Workspace)
    audience: 敏捷团队 / 效率追求者 / 任务管理者
    summary: 业务前台卡片流与底层 DynamicEntity 双轨解耦，四维指标看板与紧急预警。
    status: Production
  - name: 标准博客与发布平台 (Modern Blog)
    audience: 内容创作者 / 技术博主 / 运营团队
    summary: 文章一览流与单篇沉浸式阅读独立解耦，Markdown HTML 内生安全消毒。
    status: Production
  - name: 全声明式知识库门户 (Wiki Hub)
    audience: 企业架构师 / 技术文档工程师 / 规范管理者
    summary: 零手写 Razor 视图，100% 声明式 YAML 积木装配（SectionMarkdown / Kanban）。
    status: Zero-Razor


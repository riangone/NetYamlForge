capabilities:
  - icon: 🧭
    title: YAML 声明式 UI
    description: 页面、字段、校验与操作完全由 YAML 声明，无需编写冗长的 Razor 代码。
    badge: Core
  - icon: 🛡️
    title: 细粒度权限控制
    description: 基于角色的访问控制 (RBAC) 深度集成，确保企业数据资产安全。
    badge: Security
  - icon: 📊
    title: 低代码看板
    description: 通过简单的 SQL 或聚合定义，快速构建可视化运营指标看板。
    badge: Analytics
  - icon: 🧩
    title: 灵活业务扩展
    description: 支持 C# Hooks 与 API 扩展，满足复杂多变的行业业务逻辑。
    badge: Extensibility

solutions:
  - name: 工业级 ERP 契约服务 (JPiere)
    audience: 企业信息化 / 供应链团队
    summary: 承载 28 个关联实体，覆盖合同生命周期、报价审批、订单跟踪与原生 C# 业务 Hooks。
    status: Enterprise
  - name: 安全护栏与运行时沙箱 (Security)
    audience: 架构师 / AI Agent 开发者
    summary: 编译期 AST 阻断非法 SQL 与未白名单 Join，运行期隔离路径穿越与 API 默认拒绝。
    status: Reference
  - name: 智能体互联协议 (AI Card / AHP)
    audience: AI 工程师 / 开放网络极客
    summary: 声明式 AI 身份管理、有限状态机守卫与动态 QR 令牌生命周期，实现 Agent 受控握手。
    status: PoC
  - name: 企业级动态表单 (FormForge)
    audience: 内部 IT / 业务运营人员
    summary: 零代码拖拽构建表单、字段级动态验证、内网外网双模填报与数据一键导出。
    status: Production


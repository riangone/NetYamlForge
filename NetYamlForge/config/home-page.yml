hero:
  eyebrow: Enterprise Product Platform
  eyebrowKey: home.hero.eyebrow
  title: 统一 YAML 定义，快速交付企业业务产品
  titleKey: home.hero.title
  description: 通过元数据驱动的方式统一构建 Dashboard、运营工作台与 CRUD 页面，减少重复开发并提升交付一致性。
  descriptionKey: home.hero.description
  primaryActionLabel: 浏览产品工作区
  primaryActionLabelKey: home.hero.primaryActionLabel
  primaryActionUrl: "#products"
  secondaryActionLabel: 查看平台说明
  secondaryActionLabelKey: home.hero.secondaryActionLabel
  secondaryActionUrl: "/Home/Privacy"
  highlights:
    - Multi-Project Governance
    - YAML-first UI Definition
    - Built-in Auth & Audit
    - SQL Provider Abstraction
  highlightKeys:
    - home.hero.highlights.multiProjectGovernance
    - home.hero.highlights.yamlFirstUiDefinition
    - home.hero.highlights.builtInAuthAudit
    - home.hero.highlights.sqlProviderAbstraction


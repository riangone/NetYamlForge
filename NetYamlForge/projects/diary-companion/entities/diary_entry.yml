imports: []
entities:
  diary_entry:
    table: DiaryEntry
    key: Id
    displayName: 个人日记
    softDelete: false
    isPublic: false
    api: enabled

    forms:
      Title:
        type: string
        required: true
        label: 日记标题
        labelKey: projects.diary-companion.entity.diary_entry.fields.title
        editable: true
        placeholder: "今天发生了什么有趣的事？"
      Content:
        type: textarea
        required: false
        label: 日记内容
        labelKey: projects.diary-companion.entity.diary_entry.fields.content
        editable: true
        placeholder: "写下你的心情、所思所想..."
      Weather:
        type: string
        required: true
        label: 今日天气
        labelKey: projects.diary-companion.entity.diary_entry.fields.weather
        editable: true
        options:
          - 晴朗
          - 多云
          - 阴天
          - 雨天
          - 雪天
          - 微风
      MoodBefore:
        type: string
        required: true
        label: 记录前心情
        labelKey: projects.diary-companion.entity.diary_entry.fields.moodBefore
        editable: true
        options:
          - 喜悦
          - 平静
          - 焦虑
          - 忧郁
          - 愤怒
          - 疲惫
      Location:
        type: string
        required: false
        label: 地理位置
        labelKey: projects.diary-companion.entity.diary_entry.fields.location
        editable: true
        placeholder: "你在哪里写下这篇日记？(可选)"
      ImageBase64:
        type: string
        label: 上传图片
        labelKey: projects.diary-companion.entity.diary_entry.fields.imageBase64
        editable: true
        placeholder: "点击或拖拽上传图片"
      ImageThumbnailBase64:
        type: string
        label: 缩略图片数据
        labelKey: projects.diary-companion.entity.diary_entry.fields.imageThumbnailBase64
        editable: true
      ImageLabel:
        type: string
        label: 图片标注
        labelKey: projects.diary-companion.entity.diary_entry.fields.imageLabel
        editable: true
        placeholder: "为图片写一段标注"
      Sentiment:
        type: string
        label: AI 情绪评估
        labelKey: projects.diary-companion.entity.diary_entry.fields.sentiment
        editable: true
        placeholder: "保存后由 AI 自动评估"
      AiResponse:
        type: textarea
        label: AI 心灵伴侣寄语
        labelKey: projects.diary-companion.entity.diary_entry.fields.aiResponse
        editable: true
        placeholder: "保存后由 AI 为你写下暖心寄语"
      AiLanguage:
        type: string
        required: false
        label: AI 评估语言
        labelKey: projects.diary-companion.entity.diary_entry.fields.aiLanguage
        editable: true
        options:
          - zh-CN
          - en-US
          - ja-JP
          - ko-KR
        optionLabels:
          zh-CN: 简体中文
          en-US: English
          ja-JP: 日本語
          ko-KR: 한국어
      AiProvider:
        type: string
        required: false
        label: AI 厂商
        labelKey: projects.diary-companion.entity.diary_entry.fields.aiProvider
        editable: true
        options:
          - antigravity
          - claude
          - opencode
        optionLabels:
          antigravity: Antigravity (Gemini)
          claude: Claude
          opencode: OpenCode (GPT-OSS)
      AiModel:
        type: string
        required: false
        label: AI 模型
        labelKey: projects.diary-companion.entity.diary_entry.fields.aiModel
        editable: true
        options:
          # Antigravity
          - Gemini 3.5 Flash (Medium)
          - Gemini 3.5 Flash (High)
          - Gemini 3.5 Flash (Low)
          - Gemini 3.1 Pro (Low)
          - Gemini 3.1 Pro (High)
          - Claude Sonnet 4.6 (Thinking)
          - Claude Opus 4.6 (Thinking)
          - GPT-OSS 120B (Medium)
          # Claude
          - claude-sonnet-4-6
          - claude-opus-4-8
          - claude-haiku-4-5-20251001
          # OpenCode
          - opencode/deepseek-v4-flash-free
          - opencode/mimo-v2.5-free
          - opencode/nemotron-3-ultra-free
          - opencode/north-mini-code-free
          - opencode/big-pickle
        optionLabels:
          Gemini 3.5 Flash (Medium): Gemini 3.5 Flash (Medium)
          Gemini 3.5 Flash (High): Gemini 3.5 Flash (High)
          Gemini 3.5 Flash (Low): Gemini 3.5 Flash (Low)
          Gemini 3.1 Pro (Low): Gemini 3.1 Pro (Low)
          Gemini 3.1 Pro (High): Gemini 3.1 Pro (High)
          Claude Sonnet 4.6 (Thinking): Claude Sonnet 4.6 (Thinking)
          Claude Opus 4.6 (Thinking): Claude Opus 4.6 (Thinking)
          GPT-OSS 120B (Medium): GPT-OSS 120B (Medium)
          claude-sonnet-4-6: Claude Sonnet 4.6
          claude-opus-4-8: Claude Opus 4.8
          claude-haiku-4-5-20251001: Claude Haiku 4.5
          opencode/deepseek-v4-flash-free: DeepSeek V4 Flash (Free)
          opencode/mimo-v2.5-free: MiMo v2.5 (Free)
          opencode/nemotron-3-ultra-free: Nemotron 3 Ultra (Free)
          opencode/north-mini-code-free: North Mini Code (Free)
          opencode/big-pickle: Big Pickle
      AiLevel:
        type: string
        required: false
        label: AI 级别
        labelKey: projects.diary-companion.entity.diary_entry.fields.aiLevel
        editable: true
        options:
          - Low
          - Medium
          - High
          - Thinking
          - Max
        optionLabels:
          Low: Low (低级/快速)
          Medium: Medium (中级/标准)
          High: High (高级/深入)
          Thinking: Thinking (思考模式)
          Max: Max (最大化/最慢)

    columns:
      Id:
        type: int
        identity: true
        label: ID
        labelKey: projects.diary-companion.entity.diary_entry.fields.id
        sortable: true
      Title:
        type: string
        label: 日记标题
        labelKey: projects.diary-companion.entity.diary_entry.fields.title
        searchable: true
        sortable: true
      Content:
        type: string
        label: 日记内容
        labelKey: projects.diary-companion.entity.diary_entry.fields.content
      Weather:
        type: string
        label: 天气
        labelKey: projects.diary-companion.entity.diary_entry.fields.weather
        sortable: true
      MoodBefore:
        type: string
        label: 记录前心情
        labelKey: projects.diary-companion.entity.diary_entry.fields.moodBefore
        sortable: true
      Location:
        type: string
        label: 地理位置
        labelKey: projects.diary-companion.entity.diary_entry.fields.location
        searchable: true
        sortable: true
      ImageBase64:
        type: string
        label: 图片数据
        labelKey: projects.diary-companion.entity.diary_entry.fields.imageBase64
      ImageThumbnailBase64:
        type: string
        label: 缩略图片数据
        labelKey: projects.diary-companion.entity.diary_entry.fields.imageThumbnailBase64
      ImageLabel:
        type: string
        label: 图片标注
        labelKey: projects.diary-companion.entity.diary_entry.fields.imageLabel
      Sentiment:
        type: string
        label: AI 情绪评估
        labelKey: projects.diary-companion.entity.diary_entry.fields.sentiment
        sortable: true
      AiResponse:
        type: string
        label: AI 心灵伴侣寄语
        labelKey: projects.diary-companion.entity.diary_entry.fields.aiResponse
      AiLanguage:
        type: string
        label: AI 评估语言
        labelKey: projects.diary-companion.entity.diary_entry.fields.aiLanguage
      AiProvider:
        type: string
        label: AI 厂商
        labelKey: projects.diary-companion.entity.diary_entry.fields.aiProvider
      AiModel:
        type: string
        label: AI 模型
        labelKey: projects.diary-companion.entity.diary_entry.fields.aiModel
      AiLevel:
        type: string
        label: AI 级别
        labelKey: projects.diary-companion.entity.diary_entry.fields.aiLevel
      CreatedAt:
        type: datetime
        label: 记录时间
        labelKey: projects.diary-companion.entity.diary_entry.fields.createdAt
        sortable: true

    hooks:
      beforeCreate:
        - now:CreatedAt
        - analyze_diary_mood
      beforeUpdate:
        - analyze_diary_mood

    paging:
      pageSize: 15
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 1
        order:
          - Title
          - Weather
          - MoodBefore
          - AiLanguage
          - AiProvider
          - AiModel
          - AiLevel
          - Location
          - ImageBase64
          - ImageLabel
          - Content
          - Sentiment
          - AiResponse
      filters:
        columns: 3
        order:
          - Weather
          - MoodBefore
          - Sentiment

    filters:
      Weather:
        type: dropdown
        label: 天气
        labelKey: projects.diary-companion.entity.diary_entry.fields.weather
        options:
          - 晴朗
          - 多云
          - 阴天
          - 雨天
          - 雪天
          - 微风
      MoodBefore:
        type: dropdown
        label: 记录前心情
        labelKey: projects.diary-companion.entity.diary_entry.fields.moodBefore
        options:
          - 喜悦
          - 平静
          - 焦虑
          - 忧郁
          - 愤怒
          - 疲惫
      Sentiment:
        type: dropdown
        label: AI 情绪评估
        labelKey: projects.diary-companion.entity.diary_entry.fields.sentiment
        options:
          - 积极
          - 平和
          - 消极

title: 记录我的心路历程
isPublic: true

ui:
  page:
    layout: single
    density: comfortable

sections:
  - id: diary_detail
    title: 日记详情
    sourceType: custom
    source: >
      SELECT Id, Title, Content, Weather, MoodBefore, Location, Sentiment, AiResponse, CreatedAt, ImageBase64, ImageLabel
      FROM DiaryEntry
      WHERE Id = @id
    columns: [Id, Title, Content, Weather, MoodBefore, Location, Sentiment, AiResponse, CreatedAt, ImageBase64, ImageLabel]
    pageSize: 1
    editable: false
    readOnly: true
    component: interactive_form
    targetTable: DiaryEntry
    forms:
      create:
        fields:
          - Title
          - Location
          - Weather
          - MoodBefore
          - ImageBase64
          - ImageLabel
          - Content
      edit:
        fields:
          - Title
          - Location
          - Weather
          - MoodBefore
          - ImageBase64
          - ImageLabel
          - Content
    fieldDefs:
      Title:
        type: string
        required: true
        label: 日记标题
      Content:
        type: textarea
        required: false
        label: 日记内容
      Weather:
        type: string
        required: true
        label: 今日天气
      MoodBefore:
        type: string
        required: true
        label: 记录前心情
      Location:
        type: string
        required: false
        label: 写日记的地点
      ImageBase64:
        type: string
        required: false
        label: 上传图片
      ImageLabel:
        type: string
        required: false
        label: 图片标注


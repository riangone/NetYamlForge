title: Diary Form
titleKey: projects.diary-companion.pages.DiaryForm.title
isPublic: true

ui:
  page:
    layout: single
    density: comfortable

sections:
  - id: diary_detail
    titleKey: projects.diary-companion.pages.DiaryForm.sections.diary_detail.title
    sourceType: custom
    source: >
      SELECT Id, Title, Content, Weather, MoodBefore, Location, Sentiment, AiResponse, CreatedAt, ImageBase64, ImageLabel, AiLanguage
      FROM DiaryEntry
      WHERE Id = @id
    columns: [Id, Title, Content, Weather, MoodBefore, Location, Sentiment, AiResponse, CreatedAt, ImageBase64, ImageLabel, AiLanguage]
    pageSize: 1
    editable: false
    readOnly: true
    component: interactive_form
    targetTable: DiaryEntry
    forms:
      create:
        fields:
          - Title
          - Weather
          - MoodBefore
          - AiLanguage
          - Location
          - ImageBase64
          - ImageLabel
          - Content
      edit:
        fields:
          - Title
          - Weather
          - MoodBefore
          - AiLanguage
          - Location
          - ImageBase64
          - ImageLabel
          - Content
    fieldDefs:
      Title:
        type: string
        required: true
        label: 日记标题
      Content:
        type: textarea
        required: false
        label: 日记内容
      Weather:
        type: string
        required: true
        label: 今日天气
      MoodBefore:
        type: string
        required: true
        label: 记录前心情
      Location:
        type: string
        required: false
        label: 写日记的地点
      ImageBase64:
        type: string
        required: false
        label: 上传图片
      ImageLabel:
        type: string
        required: false
        label: 图片标注
      AiLanguage:
        type: select
        required: false
        label: AI 评估语言
        options:
          zh-CN: 简体中文
          en-US: English
          ja-JP: 日本語
          ko-KR: 한국어


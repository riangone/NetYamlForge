title: Home
titleKey: projects.diary-companion.pages.HomePage.title
isPublic: true

ui:
  page:
    layout: single
    density: comfortable

sections:
  - id: diary_list
    titleKey: projects.diary-companion.pages.HomePage.sections.diary_list.title
    sourceType: custom
    source: >
      SELECT Id, Title, Content, Weather, MoodBefore, Location, Sentiment, AiResponse, CreatedAt, ImageThumbnailBase64, ImageLabel
      FROM DiaryEntry
      ORDER BY CreatedAt DESC
    columns: [Id, Title, Content, Weather, MoodBefore, Location, Sentiment, AiResponse, CreatedAt, ImageThumbnailBase64, ImageLabel]
    pageSize: 10
    defaultSort: CreatedAt
    defaultSortDir: desc
    editable: false
    readOnly: true
    component: fancy_diary_list
    targetTable: DiaryEntry

  - id: mood_stats
    titleKey: projects.diary-companion.pages.HomePage.sections.mood_stats.title
    sourceType: custom
    source: >
      SELECT MoodBefore, COUNT(*) AS count
      FROM DiaryEntry
      GROUP BY MoodBefore
    columns: [MoodBefore, count]
    pageSize: 10
    editable: false
    readOnly: true
    component: mood_board
    descriptionKey: projects.diary-companion.pages.HomePage.sections.mood_stats.description

title: 智能日记首页
isPublic: true

ui:
  page:
    layout: single
    density: comfortable

sections:
  - id: diary_list
    title: 我的日记列表
    sourceType: custom
    source: >
      SELECT Id, Title, Content, Weather, MoodBefore, Location, Sentiment, AiResponse, CreatedAt, ImageThumbnailBase64, ImageLabel
      FROM DiaryEntry
      ORDER BY CreatedAt DESC
    columns: [Id, Title, Content, Weather, MoodBefore, Location, Sentiment, AiResponse, CreatedAt, ImageThumbnailBase64, ImageLabel]
    pageSize: 10
    defaultSort: CreatedAt
    defaultSortDir: desc
    editable: false
    readOnly: true
    component: fancy_diary_list
    targetTable: DiaryEntry

  - id: mood_stats
    title: 情绪分布
    sourceType: custom
    source: >
      SELECT MoodBefore, COUNT(*) AS count
      FROM DiaryEntry
      GROUP BY MoodBefore
    columns: [MoodBefore, count]
    pageSize: 10
    editable: false
    readOnly: true
    component: mood_board
    description: "日记不仅是发生事情的记录，更是你与自己对话的容器。无论今天天气如何，心情怎样，写下来，本身就是一种治愈的过程。"

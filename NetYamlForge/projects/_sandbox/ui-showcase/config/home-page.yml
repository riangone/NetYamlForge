hero:
  eyebrow: 🎨 UI Showcase — 设计系统与组件库
  title: 企业级 UI 设计规范与组件库
  description: 基于 DaisyUI 和 Tailwind CSS 的视觉系统深度展示，为子项目开发提供标准化的设计指南与交互参考。
  primaryActionLabel: KPI 总览
  primaryActionUrl: /ui-showcase/Page/KpiOverview
  secondaryActionLabel: 组件列表
  secondaryActionUrl: /ui-showcase/DynamicEntity/List/component_demo
  highlights:
    - 响应式设计
    - 现代配色体系
    - 标准交互模式
    - 无障碍友好

metrics:
  - label: 视觉体系
    value: "DaisyUI"
    trend: "组件丰富"
    tone: text-primary
  - label: 样式底层
    value: "Tailwind"
    trend: "原子级控制"
    tone: text-success
  - label: 设计标准
    value: "NYF-v1"
    trend: "统一体验"
    tone: text-secondary

capabilitiesSectionTitle: 核心能力
capabilities:
  - icon: 🎨
    title: 样式指南
    description: 预设统一的色彩体系、字体规范及图标库使用指南，确保全平台视觉一致性。
    badge: 设计
  - icon: 🖱️
    title: 交互模式标准
    description: 展示列表导航、详情编辑、仪表盘分析等典型页面的交互标准与最佳实践。
    badge: 交互
  - icon: 📱
    title: 响应式适配
    description: 演示核心组件在不同屏幕尺寸下的自适应表现，确保移动端与桌面端的无缝切换。
    badge: 兼容
  - icon: 🔥
    title: 可视化图表
    description: 集成热力图、雷达图、饼图、趋势线等多种数据可视化组件，满足分析场景需求。
    badge: 图表


title: Product Share
description: pie_chart コンポーネントのデモ — ドーナツグラフ + 凡例テーブル

sections:
  - id: category_pie
    title: カテゴリ別売上シェア（pie_chart）
    component: pie_chart
    sourceType: custom
    source: |
      SELECT category_name, sales_amount, order_count,
             ROUND(sales_amount * 100.0 / SUM(sales_amount) OVER(), 1) AS share_pct
      FROM category_sales
      ORDER BY sales_amount DESC
    columns: [category_name, sales_amount, order_count, share_pct]
    labelField: category_name
    valueField: sales_amount
    pageSize: 20
    editable: false
    readOnly: true

  - id: category_bar
    title: カテゴリ別注文数（bar_chart）
    component: bar_chart
    sourceType: custom
    source: |
      SELECT category_name, order_count FROM category_sales ORDER BY order_count DESC
    columns: [category_name, order_count]
    xField: category_name
    yField: order_count
    color: "rgba(34,197,94,0.75)"
    pageSize: 20
    editable: false
    readOnly: true

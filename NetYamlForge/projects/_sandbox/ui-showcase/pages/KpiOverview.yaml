title: KPI Overview
description: stat_cards コンポーネントのデモ — 値・アイコン・前期比デルタを表示

sections:
  - id: kpi_cards
    title: 今月のKPI
    component: stat_cards
    sourceType: custom
    source: |
      SELECT metric_name, metric_value, metric_icon, metric_delta, metric_sub
      FROM kpi_metrics
      ORDER BY id
    columns:
      - metric_name
      - metric_value
      - metric_icon
      - metric_delta
      - metric_sub
    labelField: metric_name
    valueField: metric_value
    iconField: metric_icon
    deltaField: metric_delta
    subValueField: metric_sub
    pageSize: 20
    editable: false
    readOnly: true

  - id: kpi_table
    title: KPI詳細テーブル（table コンポーネント）
    component: table
    sourceType: custom
    source: |
      SELECT metric_name AS 指標, metric_value AS 値,
             metric_icon AS アイコン, metric_delta AS 前期比, metric_sub AS 補足
      FROM kpi_metrics
      ORDER BY id
    columns:
      - 指標
      - 値
      - アイコン
      - 前期比
      - 補足
    pageSize: 20
    editable: false
    readOnly: true

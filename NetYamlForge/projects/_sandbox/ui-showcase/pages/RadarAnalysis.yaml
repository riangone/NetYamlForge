title: Radar Analysis
description: radar_chart コンポーネントのデモ — スパイダーチャートで多軸比較

sections:
  - id: team_radar
    title: チームスキルレーダー（radar_chart — 多系列）
    component: radar_chart
    sourceType: custom
    source: |
      SELECT skill_axis, alice_score, bob_score, carol_score
      FROM team_radar
      ORDER BY id
    columns: [skill_axis, alice_score, bob_score, carol_score]
    labelField: skill_axis
    yField: "alice_score,bob_score,carol_score"
    pageSize: 20
    editable: false
    readOnly: true

  - id: single_radar
    title: Alice のスキルプロファイル（radar_chart — 単系列）
    component: radar_chart
    sourceType: custom
    source: |
      SELECT skill_axis, alice_score FROM team_radar ORDER BY id
    columns: [skill_axis, alice_score]
    labelField: skill_axis
    yField: alice_score
    pageSize: 20
    editable: false
    readOnly: true

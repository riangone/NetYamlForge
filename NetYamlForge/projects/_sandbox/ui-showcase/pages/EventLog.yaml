title: Event Log
description: timeline / detail_card コンポーネントのデモ

sections:
  - id: project_timeline
    title: プロジェクトタイムライン（timeline）
    component: timeline
    sourceType: custom
    source: |
      SELECT event_date, event_name, description, event_type
      FROM events
      ORDER BY id
    columns: [event_date, event_name, description, event_type]
    dateField: event_date
    eventField: event_name
    descField: description
    pageSize: 20
    editable: false
    readOnly: true

  - id: latest_event
    title: 直近イベント詳細（detail_card）
    component: detail_card
    sourceType: custom
    source: |
      SELECT id, event_date AS 日時, event_name AS イベント名,
             description AS 説明, event_type AS 種別
      FROM events
      ORDER BY id DESC
      LIMIT 3
    columns: [id, 日時, イベント名, 説明, 種別]
    pageSize: 3
    editable: false
    readOnly: true

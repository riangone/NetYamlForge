capabilitiesSectionTitle: 核心功能
capabilities:
  - icon: 🧩
    title: 动态 UI 组件库
    description: 全面展示所有预设的表单控件、列表布局方案，及如何通过 YAML 零代码构建界面。
    badge: 前端
  - icon: ⚓
    title: 业务逻辑钩子
    description: 演示如何在数据生命周期的各个阶段（增删改查前后）插入自定义业务代码逻辑。
    badge: 后端
  - icon: 🔍
    title: 高级查询引擎
    description: 体验强大的多维过滤器、复杂排序、数据导出及批量处理能力在实际场景的应用。
    badge: 数据
  - icon: 🚀
    title: 自动化批量作业
    description: 展示如何配置异步任务与批量作业，处理高耗时或大规模数据的后台任务。
    badge: 系统


jobs:
  kb_embedding:
    displayName: "Generate Article Embeddings"
    schedule:
      cron: "0 */6 * * *"
      timezone: "UTC"
    type: "ai_embedding_generator"
    batchSize: 20
    embeddingConfig:
      sourceTable: "articles"
      primaryKey: "id"
      statusField: "embedding_status"
      statusValue: "pending"
      embeddingTable: "article_embeddings"
      textFields:
        - field: "title"
        - field: "summary"
        - field: "content"

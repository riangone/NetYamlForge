title: 🔍 ベクトル意味検索
description: "Gemini Embedding による自然言語セマンティック検索 — 日本語・英語・中国語対応"

sections:
  # ─── ベクトル検索メインUI ───
  - id: vector_search_main
    title: 🧠 セマンティック検索
    component: vector_search
    sourceType: custom
    source: "SELECT 1"
    columns: []
    editable: false
    readOnly: true

  # ─── 業種別分布 ───
  - id: industry_stats
    title: 業種別名刺数
    component: pie_chart
    sourceType: custom
    source: |
      SELECT COALESCE(industry,'未分類') AS label,
             COUNT(*) AS value
      FROM business_cards
      WHERE embedding_status = 'done'
      GROUP BY industry
      ORDER BY value DESC
      LIMIT 10
    columns: [label, value]
    xField: label
    yField: value
    pageSize: 10
    editable: false
    readOnly: true

  # ─── ベクトル化済み名刺一覧 ───
  - id: embedded_cards
    title: 📋 検索対象名刺（ベクトル化済み）
    component: table
    sourceType: custom
    source: |
      SELECT
        bc.card_no                                       AS 名刺番号,
        bc.last_name || ' ' || COALESCE(bc.first_name,'') AS 氏名,
        COALESCE(bc.title,'—')                           AS 役職,
        COALESCE(bc.company_name,'—')                    AS 会社名,
        COALESCE(bc.industry,'—')                        AS 業種,
        COALESCE(bc.email,'—')                           AS メール,
        CASE bc.embedding_status
          WHEN 'done'       THEN '✅ 完了'
          WHEN 'pending'    THEN '⏳ 待機'
          WHEN 'processing' THEN '⚙️ 処理中'
          WHEN 'failed'     THEN '❌ 失敗'
          ELSE bc.embedding_status
        END                                              AS ベクトル状態,
        bc.created_at                                    AS 登録日時
      FROM business_cards bc
      ORDER BY bc.embedding_status ASC, bc.created_at DESC
      LIMIT 100
    columns: [名刺番号, 氏名, 役職, 会社名, 業種, メール, ベクトル状態, 登録日時]
    pageSize: 20
    editable: false
    readOnly: true
    rowColorRules:
      - condition: "ベクトル状態 LIKE '%完了%'"
        colorClass: row-success
      - condition: "ベクトル状態 LIKE '%失敗%'"
        colorClass: row-danger
      - condition: "ベクトル状態 LIKE '%処理中%'"
        colorClass: row-info

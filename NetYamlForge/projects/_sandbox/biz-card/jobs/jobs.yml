jobs:
  # 名刺AI解析ワーカー（取込ジョブのpending → AI OCR解析 → business_cards登録）
  card_parse_worker:
    displayName: 名刺AI解析ワーカー
    description: "pendingの取込ジョブを処理し、AI OCRで名刺情報を抽出・business_cardsへ登録"
    enabled: true

    schedule:
      cron: "*/3 * * * *"
      timezone: "Asia/Tokyo"

    type: biz_card_parser
    aiProvider: lmstudio
    batchSize: 3

    bizCardParseConfig:
      importTable: import_jobs
      cardsTable: business_cards
      embeddingTable: card_embeddings
      autoEmbed: true

    onFailure:
      retryCount: 2
      retryInterval: 180
      logError: true

  # ベクトル埋め込み生成ワーカー（インライン埋め込みに漏れた名刺を補完）
  embedding_worker:
    displayName: ベクトル埋め込み生成
    description: "embedding_status=pendingの名刺にベクトル埋め込みを付与"
    enabled: true

    schedule:
      cron: "*/5 * * * *"
      timezone: "Asia/Tokyo"

    type: ai_embedding_generator
    batchSize: 10

    embeddingConfig:
      sourceTable: business_cards
      primaryKey: id
      statusField: embedding_status
      statusValue: pending
      embeddingTable: card_embeddings
      updateStatusAfterEmbed: true
      doneStatusValue: done
      textFields:
        - field: company_name
          prefix: "会社"
        - field: last_name
        - field: first_name
        - field: title
          prefix: "役職"
        - field: department
          prefix: "部署"
        - field: email
          prefix: "メール"
        - field: industry
          prefix: "業界"
        - field: address
          prefix: "住所"
        - field: notes

    onFailure:
      retryCount: 3
      retryInterval: 300
      logError: true

  # 商業活動フォローアップリマインダー
  activity_reminder:
    displayName: 活動フォローアップリマインダー
    description: "本日フォロー期限の商業活動を集計・CSV出力"
    enabled: true

    schedule:
      cron: "0 9 * * *"
      timezone: "Asia/Tokyo"

    type: sql_to_csv
    settings:
      sqlFile: jobs/sql/today_followups.sql
      outputFile: "jobs/output/followup_{date:yyyyMMdd}.csv"
      includeHeader: true
      delimiter: ","

    onFailure:
      retryCount: 1
      retryInterval: 300
      logError: true

  # 月次名刺統計レポート
  monthly_report:
    displayName: 月次名刺統計レポート
    description: "月間の名刺受取数・商業活動統計をCSVで出力"
    enabled: true

    schedule:
      cron: "0 8 1 * *"
      timezone: "Asia/Tokyo"

    type: sql_to_csv
    settings:
      sqlFile: jobs/sql/monthly_report.sql
      outputFile: "jobs/output/monthly_report_{date:yyyyMM}.csv"
      includeHeader: true
      delimiter: ","

    onFailure:
      retryCount: 1
      retryInterval: 600
      logError: true

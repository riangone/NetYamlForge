# 領収書テンプレート - 02 (標準)
# ソースファイル：templates/business/receipts/receipt-02.pdf
name: receipt-02
filenameTemplate: "領収書_{date:yyyyMMdd}.pdf"
pageSize: A4
orientation: portrait
margins: [40, 48, 40, 48]

theme:
  primaryColor: "2C5F2D"
  labelColor: "588157"
  labelTextColor: "ffffff"
  subtleBackground: "E8F5E9"
  oddRowColor: "F1F8E9"
  borderColor: "A3B18A"

dataSources:
  customer:
    query: "SELECT Id, Name, Address FROM Customer WHERE Id = @CustomerId"

sections:
  # タイトル
  - type: paragraph
    text: "領 収 書"
    fontSize: 24
    color: primary
    align: center
    bold: true
    marginTop: 10
    marginBottom: 8

  # 番号と日付
  - type: row
    columnWidths: [50, 50]
    marginBottom: 8
    cells:
      - vAlign: middle
        elements:
          - type: paragraph
            field: ReceiptNo
            prefix: "領収第 "
            suffix: " 号"
            fontSize: 10
      - vAlign: middle
        elements:
          - type: paragraph
            field: ReceivedDate
            prefix: "発行日："
            fontSize: 10
        paddingRight: 20

  # 区切り線
  - type: line
    lineWeight: 2
    color: primary
    marginBottom: 10

  # 顧客情報
  - type: paragraph
    text: "上記正に領収いたしました"
    fontSize: 10
    marginBottom: 4

  - type: paragraph
    field: "customer.Name"
    suffix: " 御中"
    fontSize: 13
    bold: true
    marginBottom: 2

  - type: paragraph
    field: "customer.Address"
    fontSize: 9
    marginBottom: 8

  # 受領情報テーブル
  - type: labelTable
    columnWidths: [30, 70]
    labelBackground: subtle
    labelTextColor: primary
    borderWeight: 0.75
    cellPadding: 5
    fontSize: 9
    rows:
      - label: "但し書き"
        field: Purpose
        placeholder: "○○代金として"
      - label: "受領金額"
        field: Amount
        format: "¥#,##0"
        bold: true
        fontSize: 11
      - label: "内訳"
        field: Details
        placeholder: "（内訳がある場合）"

  # 支払方法
  - type: row
    columnWidths: [50, 50]
    marginTop: 8
    marginBottom: 8
    cells:
      - vAlign: top
        elements:
          - type: labelTable
            columnWidths: [40, 60]
            labelBackground: null
            borderWeight: 0.5
            cellPadding: 3
            fontSize: 8.5
            rows:
              - label: "支払方法"
                field: PaymentMethod
                placeholder: "現金 / 振込 / 小切手"
              - label: "入金日"
                field: DepositDate
      - vAlign: top
        paddingLeft: 12
        elements:
          - type: labelTable
            columnWidths: [40, 60]
            labelBackground: null
            borderWeight: 0.5
            cellPadding: 3
            fontSize: 8.5
            rows:
              - label: "請求書番号"
                field: InvoiceNo
              - label: "担当者"
                field: PreparedBy

  # 会社情報
  - type: row
    columnWidths: [30, 70]
    marginTop: 12
    cells:
      - vAlign: top
        elements:
          - type: paragraph
            field: CompanyStamp
            fontSize: 12
            align: center
      - vAlign: bottom
        paddingLeft: 16
        elements:
          - type: paragraph
            field: CompanyName
            fontSize: 10
            bold: true
          - type: paragraph
            field: CompanyAddress
            fontSize: 8
            marginTop: 2
          - type: paragraph
            field: CompanyPhone
            prefix: "TEL: "
            fontSize: 8

  # 注記
  - type: paragraph
    text: "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
    fontSize: 7
    color: "999999"
    marginTop: 16
    marginBottom: 2

  - type: paragraph
    text: "※本領収書は上記金額を確かに受領したことを証するものです。"
    fontSize: 7
    color: "666666"

  - type: paragraph
    field: Remarks
    fontSize: 8
    marginTop: 4

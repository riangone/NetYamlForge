  title: Start with data input, then run operations
  titleKey: projects.salesforce-crm.home.hero.title
  description: Most pages are analytics and execution consoles. First register Customer -> Order -> Order Detail from Operation Workbench.
  descriptionKey: projects.salesforce-crm.home.hero.description
  primaryActionLabel: Open Operation Workbench

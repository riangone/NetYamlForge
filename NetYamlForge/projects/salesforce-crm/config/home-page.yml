  secondaryActionLabel: Create Customer
  secondaryActionLabelKey: projects.salesforce-crm.home.hero.secondaryAction
  secondaryActionUrl: /salesforce-crm/DynamicEntity/CreatePage?entity=customer
  highlights:
    - Input start point is explicitly guided
    - Workflow follows Customer -> Order -> Service
  highlightKeys:
    - projects.salesforce-crm.home.hero.highlights.0
    - projects.salesforce-crm.home.hero.highlights.1


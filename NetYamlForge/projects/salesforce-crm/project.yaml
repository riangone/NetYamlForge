name: salesforce-crm
displayName: Salesforce CRM Clone
version: "1.0.0"

# AI向けヒント: このプロジェクトに変更を加える前に必ず参照すること
aiHints:
  primaryLanguage: ja-JP
  authRequired: true
  customHooks:
    - crm_order_data_guard          # 注文の必須フィールド検証
    - crm_order_status_transition   # 注文ステータス遷移ルール（Open→Shipped→Closed）
    - crm_order_audit_trail         # 注文変更の監査ログ
    - crm_order_delete_guard        # Shipped/Closed 注文の削除防止
    - crm_orderdetail_guard         # 注文明細の在庫チェック
    - crm_orderdetail_projection    # 合計金額の自動計算
    - crm_orderdetail_inventory_sync # 在庫数の同期更新
    - crm_customer_lifecycle_guard  # 顧客ライフサイクル制約
    - crm_customer_delete_guard     # アクティブ注文を持つ顧客の削除防止
    - crm_customer_audit_trail      # 顧客変更の監査ログ
    - crm_product_inventory_guard   # 在庫数の負値防止
    - crm_product_delete_guard      # 注文に紐づく商品の削除防止
    - crm_product_audit_trail       # 商品変更の監査ログ
  protectedEntities:
    - order       # ステータス遷移ルールあり。crm_order_status_transition を参照
    - orderdetail # 在庫と連動。直接編集は crm_orderdetail_guard を通過する必要あり
  statusTransitions:
    order:
      Open: [Shipped, Cancelled]
      Shipped: [Closed]
      Closed: []
      Cancelled: []
  notes:
    - "注文ステータスは Open→Shipped→Closed の一方向遷移のみ許可"
    - "Shipped 以降の注文は削除不可（crm_order_delete_guard）"
    - "orderdetail の UnitPrice × Quantity は crm_orderdetail_projection が自動計算"

database:
  type: sqlite
  path: ../northwind-sqlite3/database/northwind.db
features:
  multiLanguage: true
  userAuthentication: true
layout:
  dashboardTheme: workspace
  header:
    title: Salesforce CRM Clone

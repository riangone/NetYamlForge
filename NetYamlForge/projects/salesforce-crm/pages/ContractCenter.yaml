title: Contract Center
description: Contract lifecycle center covering active terms, renewal windows, and commercial risk.

sections:
  - id: contracts
    title: Contracts
    sourceType: custom
    source: |
      SELECT
        o.OrderId AS ContractId,
        c.CompanyName AS Account,
        o.OrderDate AS StartDate,
        date(o.OrderDate, '+365 day') AS EndDate,
        CASE
          WHEN o.Status = 'Shipped' THEN 'Active'
          WHEN o.Status = 'Open' THEN 'Draft'
          ELSE 'AtRisk'
        END AS ContractState,
        CASE
          WHEN julianday(date(o.OrderDate, '+365 day')) - julianday('now') <= 30 THEN 'RenewalDue'
          ELSE 'Normal'
        END AS RenewalState,
        ROUND(COALESCE(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)), 0), 2) AS ContractValue
      FROM Orders o
      JOIN Customers c ON c.CustomerId = o.CustomerId
      LEFT JOIN OrderDetails od ON od.OrderId = o.OrderId
      GROUP BY o.OrderId, c.CompanyName, o.OrderDate, o.Status
      ORDER BY EndDate ASC
    columns:
      - ContractId
      - Account
      - StartDate
      - EndDate
      - ContractState
      - RenewalState
      - ContractValue
    pageSize: 50
    editable: false
    readOnly: true

title: Knowledge Base
description: Curated service knowledge articles with lifecycle state and effectiveness signals.

sections:
  - id: knowledge_articles
    title: Knowledge Articles
    source_type: custom
    source: |
      SELECT 1001 AS ArticleId, 'Order Delay Resolution Playbook' AS Title, 'Service' AS Domain, 'Published' AS State, 92 AS UsefulnessScore, datetime('now', '-2 day') AS UpdatedAt
      UNION ALL
      SELECT 1002, 'Lead Qualification Checklist', 'Sales', 'Published', 88, datetime('now', '-7 day')
      UNION ALL
      SELECT 1003, 'SLA Escalation SOP', 'Support Ops', 'Review', 81, datetime('now', '-1 day')
      UNION ALL
      SELECT 1004, 'Forecast Commit Policy', 'Revenue Ops', 'Draft', 74, datetime('now', '-10 day')
      UNION ALL
      SELECT 1005, 'Webhook Retry Troubleshooting', 'Integration', 'Published', 90, datetime('now', '-3 day')
    columns:
      - ArticleId
      - Title
      - Domain
      - State
      - UsefulnessScore
      - UpdatedAt
    page_size: 30
    editable: false
    read_only: true

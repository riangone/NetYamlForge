title: Service Desk 360
description: Case-like operational cockpit for delayed and canceled opportunities.

sections:
  - id: case_backlog
    title: Case Backlog
    sourceType: custom
    source: |
      SELECT
        o.OrderId AS CaseId,
        c.CompanyName AS Account,
        c.ContactName AS Contact,
        o.OrderDate,
        o.RequiredDate,
        o.Status AS CaseStatus,
        CASE
          WHEN o.Status = 'Delayed' THEN 'High'
          WHEN o.Status = 'Cancelled' THEN 'Critical'
          ELSE 'Medium'
        END AS Severity
      FROM Orders o
      JOIN Customers c ON c.CustomerId = o.CustomerId
      WHERE o.Status IN ('Delayed', 'Cancelled', 'Open')
      ORDER BY CASE o.Status WHEN 'Cancelled' THEN 1 WHEN 'Delayed' THEN 2 ELSE 3 END, o.RequiredDate ASC
    columns:
      - CaseId
      - Account
      - Contact
      - OrderDate
      - RequiredDate
      - CaseStatus
      - Severity
    pageSize: 40
    editable: false
    readOnly: true
    filters:
      Account:
        label: Account
        type: like
      CaseStatus:
        label: Status
        type: eq
      Severity:
        label: Severity
        type: eq

  - id: service_health
    title: Service Health by Region
    sourceType: custom
    source: |
      SELECT
        c.Country,
        COUNT(*) AS TotalCases,
        SUM(CASE WHEN o.Status = 'Cancelled' THEN 1 ELSE 0 END) AS CriticalCases,
        SUM(CASE WHEN o.Status = 'Delayed' THEN 1 ELSE 0 END) AS HighCases
      FROM Orders o
      JOIN Customers c ON c.CustomerId = o.CustomerId
      GROUP BY c.Country
      ORDER BY CriticalCases DESC, HighCases DESC
    columns:
      - Country
      - TotalCases
      - CriticalCases
      - HighCases
    pageSize: 25
    editable: false
    readOnly: true

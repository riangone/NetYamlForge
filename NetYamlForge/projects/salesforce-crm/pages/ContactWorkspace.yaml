title: Contact Workspace
description: Contact intelligence workspace with engagement, account links, and pipeline touchpoints.

sections:
  - id: contacts
    title: Contacts
    source_type: custom
    source: |
      SELECT
        c.CustomerId AS ContactId,
        c.ContactName,
        c.CompanyName AS Account,
        c.Country,
        c.City,
        c.Phone,
        COUNT(DISTINCT o.OrderId) AS Touchpoints,
        MAX(o.OrderDate) AS LastTouchDate
      FROM Customers c
      LEFT JOIN Orders o ON o.CustomerId = c.CustomerId
      GROUP BY c.CustomerId, c.ContactName, c.CompanyName, c.Country, c.City, c.Phone
      ORDER BY LastTouchDate DESC
    columns:
      - ContactId
      - ContactName
      - Account
      - Country
      - City
      - Phone
      - Touchpoints
      - LastTouchDate
    page_size: 60
    editable: false
    read_only: true

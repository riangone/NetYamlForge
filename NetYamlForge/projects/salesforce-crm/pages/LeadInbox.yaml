title: Lead Inbox
description: Operational lead queue for triage, qualification, and next-touch prioritization.

sections:
  - id: lead_queue
    title: Lead Queue
    sourceType: custom
    source: |
      SELECT
        l.LeadId AS LeadId,
        c.CompanyName AS LeadName,
        c.ContactName AS Contact,
        c.Country,
        c.City,
        l.LeadStage AS LeadStage,
        COUNT(DISTINCT o.OrderId) AS OpportunityTouches,
        COALESCE(l.LastTouchAt, MAX(o.OrderDate)) AS LastActivityDate,
        l.Score AS LeadScore
      FROM CrmLead l
      JOIN Customers c ON c.CustomerId = l.CustomerId
      LEFT JOIN Orders o ON o.CustomerId = c.CustomerId
      GROUP BY l.LeadId, c.CompanyName, c.ContactName, c.Country, c.City, l.LeadStage, l.LastTouchAt, l.Score
      ORDER BY LeadScore DESC, LastActivityDate DESC
    columns:
      - LeadId
      - LeadName
      - Contact
      - Country
      - City
      - LeadStage
      - OpportunityTouches
      - LastActivityDate
      - LeadScore
    pageSize: 40
    editable: false
    readOnly: true
    filters:
      LeadName:
        label: Lead Name
        type: like
      Country:
        label: Country
        type: eq
      LeadStage:
        label: Lead Stage
        type: eq

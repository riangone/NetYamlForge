title: Pipeline Board
description: Board-ready stage distribution and top deals similar to Salesforce pipeline views.

sections:
  - id: stage_board
    title: Stage Board
    sourceType: custom
    source: |
      SELECT
        o.Status AS Stage,
        COUNT(*) AS DealCount,
        ROUND(COALESCE(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)), 0), 2) AS TotalValue,
        ROUND(COALESCE(AVG(od.UnitPrice * od.Quantity * (1 - od.Discount)), 0), 2) AS AvgDealValue
      FROM Orders o
      LEFT JOIN OrderDetails od ON od.OrderId = o.OrderId
      GROUP BY o.Status
      ORDER BY DealCount DESC
    columns:
      - Stage
      - DealCount
      - TotalValue
      - AvgDealValue
    pageSize: 20
    editable: false
    readOnly: true

  - id: top_deals
    title: Top Deals
    sourceType: custom
    source: |
      SELECT
        o.OrderId AS OpportunityId,
        c.CompanyName AS Account,
        o.Status AS Stage,
        ROUND(COALESCE(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)), 0), 2) AS Amount,
        o.RequiredDate AS TargetCloseDate
      FROM Orders o
      JOIN Customers c ON c.CustomerId = o.CustomerId
      LEFT JOIN OrderDetails od ON od.OrderId = o.OrderId
      GROUP BY o.OrderId, c.CompanyName, o.Status, o.RequiredDate
      ORDER BY Amount DESC
    columns:
      - OpportunityId
      - Account
      - Stage
      - Amount
      - TargetCloseDate
    pageSize: 25
    editable: false
    readOnly: true
    filters:
      Stage:
        label: Stage
        type: eq
      Account:
        label: Account
        type: like

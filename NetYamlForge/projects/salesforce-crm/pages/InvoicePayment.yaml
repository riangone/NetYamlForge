title: Invoice & Payment
description: Billing and collection visibility for invoiced amounts, outstanding balances, and risk bands.

sections:
  - id: invoices
    title: Invoices
    source_type: custom
    source: |
      SELECT
        o.OrderId AS InvoiceId,
        c.CompanyName AS Account,
        o.OrderDate AS InvoiceDate,
        o.RequiredDate AS DueDate,
        o.Status,
        ROUND(COALESCE(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)), 0), 2) AS InvoiceAmount,
        ROUND(COALESCE(SUM(CASE WHEN o.Status = 'Shipped' THEN od.UnitPrice * od.Quantity * (1 - od.Discount) ELSE 0 END), 0), 2) AS PaidAmount,
        ROUND(COALESCE(SUM(CASE WHEN o.Status != 'Shipped' THEN od.UnitPrice * od.Quantity * (1 - od.Discount) ELSE 0 END), 0), 2) AS OutstandingAmount
      FROM Orders o
      JOIN Customers c ON c.CustomerId = o.CustomerId
      LEFT JOIN OrderDetails od ON od.OrderId = o.OrderId
      GROUP BY o.OrderId, c.CompanyName, o.OrderDate, o.RequiredDate, o.Status
      ORDER BY o.OrderDate DESC
    columns:
      - InvoiceId
      - Account
      - InvoiceDate
      - DueDate
      - Status
      - InvoiceAmount
      - PaidAmount
      - OutstandingAmount
    page_size: 60
    editable: false
    read_only: true

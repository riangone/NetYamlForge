title: Assignment Rules
description: Rule recommendations for routing leads and cases to owners based on region, load, and risk.

sections:
  - id: owner_capacity
    title: Owner Capacity
    source_type: custom
    source: |
      SELECT
        e.EmployeeId AS OwnerId,
        (e.LastName || ', ' || e.FirstName) AS OwnerName,
        COUNT(DISTINCT o.OrderId) AS ActiveWorkload,
        SUM(CASE WHEN o.Status = 'Delayed' THEN 1 ELSE 0 END) AS HighRiskLoad,
        CASE
          WHEN COUNT(DISTINCT o.OrderId) >= 6 THEN 'Constrained'
          WHEN COUNT(DISTINCT o.OrderId) >= 3 THEN 'Balanced'
          ELSE 'Available'
        END AS CapacityState
      FROM Employees e
      LEFT JOIN Orders o ON o.EmployeeId = e.EmployeeId
      GROUP BY e.EmployeeId, e.LastName, e.FirstName
      ORDER BY ActiveWorkload DESC
    columns:
      - OwnerId
      - OwnerName
      - ActiveWorkload
      - HighRiskLoad
      - CapacityState
    page_size: 20
    editable: false
    read_only: true

  - id: assignment_candidates
    title: Assignment Candidates
    source_type: custom
    source: |
      SELECT
        o.OrderId AS QueueId,
        c.CompanyName AS Account,
        c.Country AS Region,
        o.Status,
        o.EmployeeId AS CurrentOwnerId,
        CASE
          WHEN c.Country IN ('USA', 'Canada') THEN 1
          WHEN c.Country IN ('UK', 'Germany', 'France', 'Sweden') THEN 2
          ELSE 3
        END AS SuggestedTier,
        CASE
          WHEN o.Status = 'Delayed' THEN 'Immediate reassignment'
          WHEN o.Status = 'Open' THEN 'Load balancing candidate'
          ELSE 'Keep current owner'
        END AS RuleHint
      FROM Orders o
      JOIN Customers c ON c.CustomerId = o.CustomerId
      WHERE o.Status IN ('Open', 'Delayed', 'Cancelled')
      ORDER BY SuggestedTier ASC, o.OrderId DESC
    columns:
      - QueueId
      - Account
      - Region
      - Status
      - CurrentOwnerId
      - SuggestedTier
      - RuleHint
    page_size: 60
    editable: false
    read_only: true

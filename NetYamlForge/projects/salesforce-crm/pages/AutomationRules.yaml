title: Automation Rules
description: Flow-style automation registry for event triggers, conditions, and downstream actions.

sections:
  - id: rules
    title: Automation Rules
    source_type: custom
    source: |
      SELECT
        RuleId,
        RuleName,
        TriggerCondition,
        Action,
        CASE WHEN IsActive = 1 THEN 'Active' ELSE 'Review' END AS State,
        COALESCE(LastRunAt, UpdatedAt) AS UpdatedAt
      FROM CrmAutomationRule
      ORDER BY RuleId ASC
    columns:
      - RuleId
      - RuleName
      - TriggerCondition
      - Action
      - State
      - UpdatedAt
    page_size: 40
    editable: false
    read_only: true

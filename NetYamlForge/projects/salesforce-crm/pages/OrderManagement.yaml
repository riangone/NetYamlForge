title: Order Management
description: End-to-end order execution board with shipment state, ownership, and fulfillment signals.

sections:
  - id: order_board
    title: Order Board
    sourceType: custom
    source: |
      SELECT
        o.OrderId,
        c.CompanyName AS Account,
        (e.LastName || ', ' || e.FirstName) AS Owner,
        o.OrderDate,
        o.RequiredDate,
        o.ShippedDate,
        o.Status,
        o.Freight,
        ROUND(COALESCE(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)), 0), 2) AS Amount
      FROM Orders o
      JOIN Customers c ON c.CustomerId = o.CustomerId
      LEFT JOIN Employees e ON e.EmployeeId = o.EmployeeId
      LEFT JOIN OrderDetails od ON od.OrderId = o.OrderId
      GROUP BY o.OrderId, c.CompanyName, e.LastName, e.FirstName, o.OrderDate, o.RequiredDate, o.ShippedDate, o.Status, o.Freight
      ORDER BY o.OrderDate DESC
    columns:
      - OrderId
      - Account
      - Owner
      - OrderDate
      - RequiredDate
      - ShippedDate
      - Status
      - Freight
      - Amount
    pageSize: 60
    editable: false
    readOnly: true

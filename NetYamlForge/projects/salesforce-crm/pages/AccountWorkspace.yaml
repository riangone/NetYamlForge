title: Account Workspace
description: Unified account workspace with pipeline, service risk, and recent commercial activity.

sections:
  - id: account_profile
    title: Account Profile
    source_type: custom
    source: |
      SELECT
        c.CustomerId AS AccountId,
        c.CompanyName AS AccountName,
        c.ContactName AS PrimaryContact,
        c.Country,
        c.City,
        c.Phone,
        c.Active,
        COUNT(DISTINCT o.OrderId) AS OpportunityCount,
        ROUND(COALESCE(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)), 0), 2) AS LifetimeRevenue
      FROM Customers c
      LEFT JOIN Orders o ON o.CustomerId = c.CustomerId
      LEFT JOIN OrderDetails od ON od.OrderId = o.OrderId
      GROUP BY c.CustomerId, c.CompanyName, c.ContactName, c.Country, c.City, c.Phone, c.Active
      ORDER BY LifetimeRevenue DESC
    columns:
      - AccountId
      - AccountName
      - PrimaryContact
      - Country
      - City
      - Phone
      - Active
      - OpportunityCount
      - LifetimeRevenue
    page_size: 40
    editable: false
    read_only: true

  - id: account_opportunities
    title: Account Opportunities
    source_type: custom
    source: |
      SELECT
        o.OrderId AS OpportunityId,
        c.CompanyName AS Account,
        o.OrderDate,
        o.RequiredDate,
        o.Status,
        ROUND(COALESCE(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)), 0), 2) AS Amount
      FROM Orders o
      JOIN Customers c ON c.CustomerId = o.CustomerId
      LEFT JOIN OrderDetails od ON od.OrderId = o.OrderId
      GROUP BY o.OrderId, c.CompanyName, o.OrderDate, o.RequiredDate, o.Status
      ORDER BY o.OrderDate DESC
    columns:
      - OpportunityId
      - Account
      - OrderDate
      - RequiredDate
      - Status
      - Amount
    page_size: 50
    editable: false
    read_only: true

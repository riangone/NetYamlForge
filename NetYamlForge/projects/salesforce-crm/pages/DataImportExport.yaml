title: Data Import / Export
description: Operational tracker for bulk data import/export jobs and validation outcomes.

sections:
  - id: data_jobs
    title: Data Jobs
    source_type: custom
    source: |
      SELECT 5001 AS JobId, 'Import' AS JobType, 'Customer Master' AS Dataset, 'Completed' AS Status, 120 AS ProcessedRows, 2 AS ErrorRows, datetime('now', '-3 hour') AS ExecutedAt
      UNION ALL
      SELECT 5002, 'Export', 'Opportunity Snapshot', 'Completed', 86, 0, datetime('now', '-1 hour')
      UNION ALL
      SELECT 5003, 'Import', 'Case Updates', 'Running', 34, 1, datetime('now', '-20 minute')
      UNION ALL
      SELECT 5004, 'Export', 'Forecast Pack', 'Queued', 0, 0, datetime('now', '-5 minute')
    columns:
      - JobId
      - JobType
      - Dataset
      - Status
      - ProcessedRows
      - ErrorRows
      - ExecutedAt
    page_size: 30
    editable: false
    read_only: true

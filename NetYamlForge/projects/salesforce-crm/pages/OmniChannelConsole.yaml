title: Omni-Channel Console
description: Unified queue combining lead, case, and order signals for frontline response orchestration.

sections:
  - id: omni_queue
    title: Omni Queue
    source_type: custom
    source: |
      SELECT
        'Case' AS QueueType,
        o.OrderId AS QueueId,
        c.CompanyName AS Account,
        o.Status AS QueueState,
        o.RequiredDate AS DueRef,
        CASE
          WHEN o.Status = 'Delayed' THEN 'High'
          WHEN o.Status = 'Open' THEN 'Medium'
          ELSE 'Low'
        END AS Priority
      FROM Orders o
      JOIN Customers c ON c.CustomerId = o.CustomerId
      UNION ALL
      SELECT
        'Lead' AS QueueType,
        c.CustomerId AS QueueId,
        c.CompanyName AS Account,
        CASE WHEN EXISTS (SELECT 1 FROM Orders o WHERE o.CustomerId = c.CustomerId) THEN 'Qualified' ELSE 'New' END AS QueueState,
        date('now', '+' || ((c.CustomerId % 5) + 1) || ' day') AS DueRef,
        'Medium' AS Priority
      FROM Customers c
      ORDER BY Priority DESC, DueRef ASC
    columns:
      - QueueType
      - QueueId
      - Account
      - QueueState
      - DueRef
      - Priority
    page_size: 80
    editable: false
    read_only: true

title: Opportunity Detail
description: Full lifecycle view for a selected opportunity with financial lines and execution signals.

sections:
  - id: opportunity_detail
    title: Opportunity Detail
    source_type: custom
    source: |
      SELECT
        o.OrderId AS OpportunityId,
        c.CompanyName AS Account,
        c.ContactName AS Contact,
        o.OrderDate AS CreatedDate,
        o.RequiredDate AS TargetCloseDate,
        o.Status AS Stage,
        ROUND(COALESCE(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)), 0), 2) AS Amount,
        CASE
          WHEN o.Status = 'Shipped' THEN 100
          WHEN o.Status = 'Open' THEN 60
          WHEN o.Status = 'Delayed' THEN 35
          WHEN o.Status = 'Cancelled' THEN 0
          ELSE 50
        END AS Probability,
        CASE
          WHEN o.Status = 'Open' THEN 'Schedule discovery call'
          WHEN o.Status = 'Delayed' THEN 'Mitigation plan with customer'
          WHEN o.Status = 'Shipped' THEN 'Upsell follow-up'
          ELSE 'Re-qualify'
        END AS NextAction
      FROM Orders o
      JOIN Customers c ON c.CustomerId = o.CustomerId
      LEFT JOIN OrderDetails od ON od.OrderId = o.OrderId
      GROUP BY o.OrderId, c.CompanyName, c.ContactName, o.OrderDate, o.RequiredDate, o.Status
      ORDER BY o.OrderDate DESC, o.OrderId DESC
    columns:
      - OpportunityId
      - Account
      - Contact
      - CreatedDate
      - TargetCloseDate
      - Stage
      - Amount
      - Probability
      - NextAction
    page_size: 30
    editable: false
    read_only: true
    filters:
      OpportunityId:
        label: Opportunity ID
        type: eq
      Account:
        label: Account
        type: like
      Stage:
        label: Stage
        type: eq

  - id: opportunity_lines
    title: Opportunity Lines
    source_type: custom
    source: |
      SELECT
        od.OrderDetailId AS LineId,
        od.OrderId AS OpportunityId,
        p.ProductName,
        od.UnitPrice,
        od.Quantity,
        od.Discount,
        ROUND((od.UnitPrice * od.Quantity) * (1 - od.Discount), 2) AS NetValue
      FROM OrderDetails od
      JOIN Products p ON p.ProductId = od.ProductId
      ORDER BY od.OrderId DESC, od.OrderDetailId DESC
    columns:
      - LineId
      - OpportunityId
      - ProductName
      - UnitPrice
      - Quantity
      - Discount
      - NetValue
    page_size: 50
    editable: false
    read_only: true
    filters:
      OpportunityId:
        label: Opportunity ID
        type: eq

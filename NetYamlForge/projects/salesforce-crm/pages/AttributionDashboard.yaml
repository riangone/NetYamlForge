title: Attribution Dashboard
description: Source-to-revenue attribution view for marketing contribution across won, open, and at-risk opportunities.

template: AttributionDashboard

sections:
  - id: attribution_summary
    title: Attribution Summary
    source_type: custom
    source: |
      SELECT
        CASE
          WHEN c.Country IN ('USA', 'Canada') THEN 'North America'
          WHEN c.Country IN ('UK', 'Germany', 'France', 'Sweden') THEN 'Europe'
          ELSE 'Global Other'
        END AS Channel,
        COUNT(DISTINCT o.OrderId) AS DealCount,
        ROUND(COALESCE(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)), 0), 2) AS Revenue,
        ROUND(COALESCE(SUM(CASE WHEN o.Status = 'Shipped' THEN od.UnitPrice * od.Quantity * (1 - od.Discount) ELSE 0 END), 0), 2) AS AttributedWon,
        ROUND(COALESCE(SUM(CASE WHEN o.Status = 'Open' THEN od.UnitPrice * od.Quantity * (1 - od.Discount) ELSE 0 END), 0), 2) AS AttributedPipeline,
        ROUND(COALESCE(SUM(CASE WHEN o.Status IN ('Delayed', 'Cancelled') THEN od.UnitPrice * od.Quantity * (1 - od.Discount) ELSE 0 END), 0), 2) AS AttributedRisk
      FROM Orders o
      JOIN Customers c ON c.CustomerId = o.CustomerId
      LEFT JOIN OrderDetails od ON od.OrderId = o.OrderId
      GROUP BY Channel
      ORDER BY Revenue DESC
    columns:
      - Channel
      - DealCount
      - Revenue
      - AttributedWon
      - AttributedPipeline
      - AttributedRisk
    page_size: 20
    editable: false
    read_only: true

  - id: attribution_deals
    title: Attributed Deals
    source_type: custom
    source: |
      SELECT
        o.OrderId AS OpportunityId,
        c.CompanyName AS Account,
        c.Country AS Region,
        o.Status AS Stage,
        o.OrderDate AS CreatedDate,
        ROUND(COALESCE(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)), 0), 2) AS Amount,
        CASE
          WHEN c.Country IN ('USA', 'Canada') THEN 'Paid Search'
          WHEN c.Country IN ('UK', 'Germany', 'France', 'Sweden') THEN 'Partner'
          ELSE 'Inbound Content'
        END AS AttributedSource
      FROM Orders o
      JOIN Customers c ON c.CustomerId = o.CustomerId
      LEFT JOIN OrderDetails od ON od.OrderId = o.OrderId
      GROUP BY o.OrderId, c.CompanyName, c.Country, o.Status, o.OrderDate
      ORDER BY Amount DESC, o.OrderDate DESC
    columns:
      - OpportunityId
      - Account
      - Region
      - Stage
      - CreatedDate
      - Amount
      - AttributedSource
    page_size: 50
    editable: false
    read_only: true
    filters:
      Account:
        label: Account
        type: like
      Stage:
        label: Stage
        type: eq
      AttributedSource:
        label: Source
        type: eq

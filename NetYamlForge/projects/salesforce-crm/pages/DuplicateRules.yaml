title: Duplicate Rules
description: Potential duplicate detection for account and contact records with merge confidence signals.

sections:
  - id: duplicate_candidates
    title: Duplicate Candidates
    sourceType: custom
    source: |
      SELECT
        a.CustomerId AS SourceId,
        b.CustomerId AS CandidateId,
        a.CompanyName AS SourceAccount,
        b.CompanyName AS CandidateAccount,
        a.ContactName AS SourceContact,
        b.ContactName AS CandidateContact,
        a.Phone AS SourcePhone,
        b.Phone AS CandidatePhone,
        CASE
          WHEN lower(a.ContactName) = lower(b.ContactName) AND a.Phone = b.Phone THEN 'High'
          WHEN lower(a.ContactName) = lower(b.ContactName) THEN 'Medium'
          ELSE 'Low'
        END AS DuplicateConfidence
      FROM Customers a
      JOIN Customers b ON a.CustomerId < b.CustomerId
      WHERE
        lower(a.ContactName) = lower(b.ContactName)
        OR (a.Phone IS NOT NULL AND a.Phone = b.Phone)
      ORDER BY
        CASE DuplicateConfidence WHEN 'High' THEN 1 WHEN 'Medium' THEN 2 ELSE 3 END,
        a.CustomerId, b.CustomerId
    columns:
      - SourceId
      - CandidateId
      - SourceAccount
      - CandidateAccount
      - SourceContact
      - CandidateContact
      - SourcePhone
      - CandidatePhone
      - DuplicateConfidence
    pageSize: 80
    editable: false
    readOnly: true

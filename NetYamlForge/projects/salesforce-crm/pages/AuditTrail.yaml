title: Audit Trail
description: Operational audit timeline for user actions, entity changes, and security-sensitive events.

template: AuditTrail

sections:
  - id: recent_events
    title: Recent Events
    sourceType: custom
    source: |
      SELECT
        Id,
        COALESCE(NULLIF(UserName, ''), 'system') AS UserName,
        Action,
        COALESCE(NULLIF(Entity, ''), 'system') AS Entity,
        COALESCE(Detail, '-') AS Detail,
        CreatedAt
      FROM AuditLog
      ORDER BY Id DESC
    columns:
      - Id
      - UserName
      - Action
      - Entity
      - Detail
      - CreatedAt
    pageSize: 80
    editable: false
    readOnly: true
    filters:
      UserName:
        label: User
        type: like
      Action:
        label: Action
        type: eq
      Entity:
        label: Entity
        type: eq
      CreatedAt:
        label: Created At
        type: gte

  - id: activity_by_user
    title: Activity by User
    sourceType: custom
    source: |
      SELECT
        COALESCE(NULLIF(UserName, ''), 'system') AS UserName,
        COUNT(*) AS EventCount,
        MAX(CreatedAt) AS LastEventAt
      FROM AuditLog
      GROUP BY COALESCE(NULLIF(UserName, ''), 'system')
      ORDER BY EventCount DESC, LastEventAt DESC
    columns:
      - UserName
      - EventCount
      - LastEventAt
    pageSize: 30
    editable: false
    readOnly: true

  - id: activity_by_entity
    title: Activity by Entity
    sourceType: custom
    source: |
      SELECT
        COALESCE(NULLIF(Entity, ''), 'system') AS Entity,
        COUNT(*) AS EventCount,
        MAX(CreatedAt) AS LastEventAt
      FROM AuditLog
      GROUP BY COALESCE(NULLIF(Entity, ''), 'system')
      ORDER BY EventCount DESC, LastEventAt DESC
    columns:
      - Entity
      - EventCount
      - LastEventAt
    pageSize: 30
    editable: false
    readOnly: true

  - id: hook_rejected_events
    title: Hook Rejected Events
    sourceType: custom
    source: |
      SELECT
        Id,
        COALESCE(NULLIF(UserName, ''), 'system') AS UserName,
        COALESCE(NULLIF(Entity, ''), 'system') AS Entity,
        CASE
          WHEN json_valid(Detail) THEN COALESCE(json_extract(Detail, '$.operation'), '-')
          ELSE '-'
        END AS Operation,
        CASE
          WHEN json_valid(Detail) THEN COALESCE(json_extract(Detail, '$.key'), '-')
          ELSE '-'
        END AS RecordKey,
        CASE
          WHEN json_valid(Detail) THEN COALESCE(json_extract(Detail, '$.hooksCsv'), '-')
          ELSE '-'
        END AS HookNames,
        CASE
          WHEN json_valid(Detail) THEN COALESCE(json_extract(Detail, '$.reason'), '-')
          ELSE '-'
        END AS Reason,
        CASE
          WHEN json_valid(Detail) THEN COALESCE(json_extract(Detail, '$.reasonCode'), '-')
          ELSE '-'
        END AS ReasonCode,
        COALESCE(Detail, '-') AS RawDetail,
        CreatedAt
      FROM AuditLog
      WHERE Action = 'hook_rejected'
      ORDER BY Id DESC
    columns:
      - Id
      - UserName
      - Entity
      - Operation
      - RecordKey
      - HookNames
      - Reason
      - ReasonCode
      - RawDetail
      - CreatedAt
    pageSize: 50
    editable: false
    readOnly: true

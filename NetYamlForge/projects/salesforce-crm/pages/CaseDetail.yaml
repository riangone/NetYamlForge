title: Case Detail
description: Unified case detail with SLA risk, ownership, and latest operational events.

template: CaseDetail

sections:
  - id: case_detail
    title: Case Detail
    source_type: custom
    source: |
      SELECT
        o.OrderId AS CaseId,
        c.CompanyName AS Account,
        c.ContactName AS Contact,
        o.OrderDate,
        o.RequiredDate,
        o.ShippedDate,
        o.Status AS CaseStatus,
        o.EmployeeId AS OwnerId,
        (e.LastName || ', ' || e.FirstName) AS OwnerName,
        o.ShipCountry,
        o.Freight,
        CASE
          WHEN o.Status = 'Cancelled' THEN 'Critical'
          WHEN o.Status = 'Delayed' THEN 'High'
          WHEN o.Status = 'Open' THEN 'Medium'
          ELSE 'Low'
        END AS Severity,
        CAST(julianday('now') - julianday(o.OrderDate) AS INTEGER) AS OpenDays
      FROM Orders o
      JOIN Customers c ON c.CustomerId = o.CustomerId
      LEFT JOIN Employees e ON e.EmployeeId = o.EmployeeId
      WHERE o.Status IN ('Open', 'Delayed', 'Cancelled', 'Resolved')
      ORDER BY
        CASE o.Status WHEN 'Cancelled' THEN 1 WHEN 'Delayed' THEN 2 WHEN 'Open' THEN 3 ELSE 4 END,
        o.RequiredDate ASC,
        o.OrderId DESC
    columns:
      - CaseId
      - Account
      - Contact
      - OrderDate
      - RequiredDate
      - ShippedDate
      - CaseStatus
      - OwnerId
      - OwnerName
      - ShipCountry
      - Freight
      - Severity
      - OpenDays
    page_size: 40
    editable: true
    read_only: false
    target_table: Orders
    target_primary_key: OrderId
    updatable_fields:
      - Status
      - EmployeeId
      - RequiredDate
      - ShippedDate
    filters:
      Account:
        label: Account
        type: like
      CaseStatus:
        label: Status
        type: eq
      Severity:
        label: Severity
        type: eq
      OwnerName:
        label: Owner
        type: like

  - id: case_activity
    title: Case Activity
    source_type: custom
    source: |
      SELECT
        Id,
        COALESCE(NULLIF(UserName, ''), 'system') AS UserName,
        Action,
        COALESCE(Detail, '-') AS Detail,
        CreatedAt
      FROM AuditLog
      WHERE lower(COALESCE(Entity, '')) IN ('order', 'orders')
      ORDER BY Id DESC
    columns:
      - Id
      - UserName
      - Action
      - Detail
      - CreatedAt
    page_size: 30
    editable: false
    read_only: true

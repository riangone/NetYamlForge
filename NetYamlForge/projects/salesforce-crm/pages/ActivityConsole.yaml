title: Activity Console
description: Unified timeline for calls, follow-ups, and execution tasks across leads, opportunities, and cases.

sections:
  - id: activity_feed
    title: Activity Feed
    source_type: custom
    source: |
      SELECT
        'Opportunity' AS ActivityType,
        o.OrderId AS ActivityId,
        c.CompanyName AS Account,
        c.ContactName AS Contact,
        o.OrderDate AS ActivityDate,
        CASE
          WHEN o.Status = 'Open' THEN 'Follow-up call'
          WHEN o.Status = 'Delayed' THEN 'Escalation review'
          WHEN o.Status = 'Shipped' THEN 'Post-close check-in'
          ELSE 'Status review'
        END AS Subject,
        o.Status AS Stage,
        CASE
          WHEN o.Status = 'Delayed' THEN 'High'
          WHEN o.Status = 'Open' THEN 'Medium'
          ELSE 'Low'
        END AS Priority
      FROM Orders o
      JOIN Customers c ON c.CustomerId = o.CustomerId
      UNION ALL
      SELECT
        'Lead' AS ActivityType,
        c.CustomerId AS ActivityId,
        c.CompanyName AS Account,
        c.ContactName AS Contact,
        COALESCE(MAX(o.OrderDate), date('now', '-120 day')) AS ActivityDate,
        CASE
          WHEN COUNT(o.OrderId) = 0 THEN 'Qualification needed'
          ELSE 'Nurture sequence'
        END AS Subject,
        CASE
          WHEN COUNT(o.OrderId) = 0 THEN 'New'
          ELSE 'Qualified'
        END AS Stage,
        CASE
          WHEN COUNT(o.OrderId) = 0 THEN 'Medium'
          ELSE 'Low'
        END AS Priority
      FROM Customers c
      LEFT JOIN Orders o ON o.CustomerId = c.CustomerId
      GROUP BY c.CustomerId, c.CompanyName, c.ContactName
      ORDER BY ActivityDate DESC, ActivityType ASC
    columns:
      - ActivityType
      - ActivityId
      - Account
      - Contact
      - ActivityDate
      - Subject
      - Stage
      - Priority
    page_size: 60
    editable: false
    read_only: true
    filters:
      ActivityType:
        label: Activity Type
        type: eq
      Account:
        label: Account
        type: like
      Priority:
        label: Priority
        type: eq

  - id: overdue_actions
    title: Overdue Actions
    source_type: custom
    source: |
      SELECT
        o.OrderId AS ActionId,
        c.CompanyName AS Account,
        o.RequiredDate AS DueDate,
        o.Status,
        ROUND(COALESCE(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)), 0), 2) AS Amount,
        CASE
          WHEN o.Status = 'Delayed' THEN 'Critical follow-up'
          WHEN o.Status = 'Open' THEN 'Deadline watch'
          ELSE 'Monitor'
        END AS ActionHint
      FROM Orders o
      JOIN Customers c ON c.CustomerId = o.CustomerId
      LEFT JOIN OrderDetails od ON od.OrderId = o.OrderId
      WHERE o.Status IN ('Open', 'Delayed')
      GROUP BY o.OrderId, c.CompanyName, o.RequiredDate, o.Status
      ORDER BY o.RequiredDate ASC, Amount DESC
    columns:
      - ActionId
      - Account
      - DueDate
      - Status
      - Amount
      - ActionHint
    page_size: 40
    editable: false
    read_only: true
    filters:
      Account:
        label: Account
        type: like
      Status:
        label: Status
        type: eq

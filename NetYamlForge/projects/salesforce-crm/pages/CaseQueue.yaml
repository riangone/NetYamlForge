title: Case Queue
description: Service case queue with agent assignment and status transitions for frontline operations.

template: CaseQueue

sections:
  - id: case_queue
    title: Case Queue
    source_type: custom
    source: |
      SELECT
        cse.OrderId AS CaseId,
        c.CompanyName AS Account,
        c.ContactName AS Contact,
        o.OrderDate,
        o.RequiredDate,
        cse.CaseStatus AS CaseStatus,
        o.EmployeeId AS OwnerId,
        (e.LastName || ', ' || e.FirstName) AS OwnerName,
        cse.Severity AS Severity
      FROM CrmCase cse
      JOIN Orders o ON o.OrderId = cse.OrderId
      JOIN Customers c ON c.CustomerId = o.CustomerId
      LEFT JOIN Employees e ON e.EmployeeId = o.EmployeeId
      ORDER BY
        CASE cse.Severity WHEN 'Critical' THEN 1 WHEN 'High' THEN 2 ELSE 3 END,
        o.RequiredDate ASC,
        o.OrderId DESC
    columns:
      - CaseId
      - Account
      - Contact
      - OrderDate
      - RequiredDate
      - CaseStatus
      - OwnerId
      - OwnerName
      - Severity
    page_size: 50
    editable: true
    read_only: false
    target_table: Orders
    target_primary_key: OrderId
    updatable_fields:
      - Status
      - EmployeeId
    filters:
      Account:
        label: Account
        type: like
      CaseStatus:
        label: Status
        type: eq
      Severity:
        label: Severity
        type: eq

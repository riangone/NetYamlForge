entities:
  product:
    table: Products
    key: ProductId
    displayName: Product
    softDelete: false
    paging:
      pageSize: 15
      mode: numbered
    layout:
      forms:
        columns: 2
        order:
        - ProductName
        - SupplierId
        - CategoryId
        - UnitPrice
        - UnitsInStock
        - ReorderLevel
        - Discontinued
      filters:
        columns: 4
        order:
        - SupplierId
        - CategoryId
        - UnitPrice
        - Discontinued
    joins:
    - type: left
      table: Suppliers
      alias: s
      true: Products.SupplierId = s.SupplierId
    - type: left
      table: Categories
      alias: c
      true: Products.CategoryId = c.CategoryId
    columns:
      ProductId:
        type: int
        identity: true
        label: ID
        sortable: true
        labelKey: projects.b2b-order-ops.entities.product.entities.product.columns.ProductId.label
      ProductName:
        type: string
        required: true
        label: Product
        searchable: true
        sortable: true
        labelKey: projects.b2b-order-ops.entities.product.entities.product.columns.ProductName.label
      SupplierId:
        type: int
        required: true
        label: Supplier
        hidden: true
        sortable: true
      SupplierName:
        type: string
        identity: true
        label: Supplier
        expression: s.CompanyName
        searchable: true
        sortable: true
      CategoryId:
        type: int
        required: true
        label: Category
        hidden: true
        sortable: true
      CategoryName:
        type: string
        identity: true
        label: Category
        expression: c.CategoryName
        searchable: true
        sortable: true
      UnitPrice:
        type: decimal
        required: true
        label: Unit Price
        sortable: true
        labelKey: projects.b2b-order-ops.entities.product.entities.product.columns.UnitPrice.label
      UnitsInStock:
        type: int
        label: Stock
        sortable: true
        labelKey: projects.b2b-order-ops.entities.product.entities.product.columns.UnitsInStock.label
      ReorderLevel:
        type: int
        label: Reorder Level
        sortable: true
        labelKey: projects.b2b-order-ops.entities.product.entities.product.columns.ReorderLevel.label
      Discontinued:
        type: bool
        label: Discontinued
        sortable: true
        labelKey: projects.b2b-order-ops.entities.product.entities.product.columns.Discontinued.label
    forms:
      ProductName:
        type: string
        required: true
        label: Product
        editable: true
      SupplierId:
        type: int
        required: true
        label: Supplier
        editable: true
        foreignKey:
          entity: supplier
          picker: true
          displayColumns:
          - CompanyName
          - ContactName
          - Country
          query: 'SELECT SupplierId AS Id, CompanyName, ContactName, Country

            FROM Suppliers

            WHERE Active = 1

            '
      CategoryId:
        type: int
        required: true
        label: Category
        editable: true
        foreignKey:
          entity: category
          displayColumns:
          - CategoryName
          query: 'SELECT CategoryId AS Id, CategoryName

            FROM Categories

            '
      UnitPrice:
        type: decimal
        required: true
        label: Unit Price
        editable: true
      UnitsInStock:
        type: int
        label: Stock
        editable: true
      ReorderLevel:
        type: int
        label: Reorder Level
        editable: true
      Discontinued:
        type: bool
        label: Discontinued
        editable: true
    filters:
      SupplierId:
        type: entity-picker
        label: Supplier
        expression: Products.SupplierId
        foreignKey:
          entity: supplier
          displayColumns:
          - CompanyName
          - ContactName
          - Country
          query: 'SELECT SupplierId AS Id, CompanyName, ContactName, Country

            FROM Suppliers

            WHERE Active = 1

            '
      CategoryId:
        type: dropdown
        label: Category
        expression: Products.CategoryId
        foreignKey:
          entity: category
          displayColumns:
          - CategoryName
      UnitPrice:
        type: range
        label: Unit Price
        expression: Products.UnitPrice
      Discontinued:
        type: dropdown
        label: Discontinued
        options:
        - 0
        - 1
    links:
      orderdetails:
        label: Order Details
        targetEntity: orderdetail
        filter:
          ProductId: ProductId
    hooks:
      beforeCreate:
      - crm_product_inventory_guard
      beforeUpdate:
      - crm_product_inventory_guard
      beforeDelete:
      - crm_product_delete_guard
      afterCreate:
      - crm_product_audit_trail
      afterUpdate:
      - crm_product_audit_trail
      afterDelete:
      - crm_product_audit_trail
    displayNameKey: projects.b2b-order-ops.entities.product.entities.product.displayName

imports: []
entities:
  order:
    table: Orders
    key: OrderId
    keys: []
    displayName: Order
    joins:
    - type: left
      table: Customers
      alias: c
      true: Orders.CustomerId = c.CustomerId
    - type: left
      table: Employees
      alias: e
      true: Orders.EmployeeId = e.EmployeeId
    - type: left
      table: Shippers
      alias: s
      true: Orders.ShipperId = s.ShipperId
    forms:
      CustomerId:
        type: int
        identity: false
        required: true
        label: Customer
        searchable: false
        sortable: false
        editable: true
        foreignKey:
          entity: customer
          displayColumn: Id
          displayColumns:
          - CompanyName
          - ContactName
          - Country
          query: 'SELECT CustomerId AS Id, CompanyName, ContactName, Country

            FROM Customers

            WHERE Active = 1

            '
          picker: true
          multiPicker: false
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.forms.CustomerId.label
      EmployeeId:
        type: int
        identity: false
        required: true
        label: Employee
        searchable: false
        sortable: false
        editable: true
        foreignKey:
          entity: employee
          displayColumn: Id
          displayColumns:
          - LastName
          - FirstName
          - Title
          query: 'SELECT EmployeeId AS Id, LastName, FirstName, Title

            FROM Employees

            '
          picker: false
          multiPicker: false
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.forms.EmployeeId.label
      OrderDate:
        type: date
        identity: false
        required: true
        label: Order Date
        searchable: false
        sortable: false
        editable: true
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.forms.OrderDate.label
      RequiredDate:
        type: date
        identity: false
        required: false
        label: Required Date
        searchable: false
        sortable: false
        editable: true
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.forms.RequiredDate.label
      ShippedDate:
        type: date
        identity: false
        required: false
        label: Shipped Date
        searchable: false
        sortable: false
        editable: true
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.forms.ShippedDate.label
      ShipperId:
        type: int
        identity: false
        required: false
        label: Shipper
        searchable: false
        sortable: false
        editable: true
        foreignKey:
          entity: shipper
          displayColumn: Id
          displayColumns:
          - CompanyName
          picker: false
          multiPicker: false
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.forms.ShipperId.label
      Freight:
        type: decimal
        identity: false
        required: false
        label: Freight
        searchable: false
        sortable: false
        editable: true
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.forms.Freight.label
      ShipCountry:
        type: string
        identity: false
        required: false
        label: Ship Country
        searchable: false
        sortable: false
        editable: true
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.forms.ShipCountry.label
      Status:
        type: string
        identity: false
        required: false
        label: Status
        searchable: false
        sortable: false
        editable: true
        options:
        - Open
        - Shipped
        - Delayed
        - Cancelled
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.forms.Status.label
      RelatedProductIds:
        type: string
        identity: false
        required: false
        label: Related Products
        searchable: false
        sortable: false
        editable: true
        foreignKey:
          entity: product
          displayColumn: Id
          displayColumns:
          - ProductName
          - UnitPrice
          - UnitsInStock
          query: 'SELECT ProductId AS Id, ProductName, UnitPrice, UnitsInStock

            FROM Products

            WHERE Discontinued = 0

            '
          picker: false
          multiPicker: true
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.forms.RelatedProductIds.label
    columns:
      OrderId:
        type: int
        identity: true
        required: false
        label: ID
        searchable: false
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.columns.OrderId.label
      CustomerId:
        type: int
        identity: false
        required: true
        label: Customer
        searchable: false
        sortable: true
        editable: true
        hidden: true
        labelKey: projects.b2b-order-ops.entities.order.entities.order.columns.CustomerId.label
      CustomerName:
        type: string
        identity: true
        required: false
        label: Customer
        searchable: true
        sortable: true
        editable: true
        expression: c.CompanyName || ' / ' || c.ContactName
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.columns.CustomerName.label
      EmployeeId:
        type: int
        identity: false
        required: true
        label: Employee
        searchable: false
        sortable: true
        editable: true
        hidden: true
        labelKey: projects.b2b-order-ops.entities.order.entities.order.columns.EmployeeId.label
      EmployeeName:
        type: string
        identity: true
        required: false
        label: Employee
        searchable: true
        sortable: true
        editable: true
        expression: e.LastName || ', ' || e.FirstName
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.columns.EmployeeName.label
      OrderDate:
        type: date
        identity: false
        required: true
        label: Order Date
        searchable: false
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.columns.OrderDate.label
      RequiredDate:
        type: date
        identity: false
        required: false
        label: Required Date
        searchable: false
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.columns.RequiredDate.label
      ShippedDate:
        type: date
        identity: false
        required: false
        label: Shipped Date
        searchable: false
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.columns.ShippedDate.label
      ShipperId:
        type: int
        identity: false
        required: false
        label: Shipper
        searchable: false
        sortable: true
        editable: true
        hidden: true
        labelKey: projects.b2b-order-ops.entities.order.entities.order.columns.ShipperId.label
      ShipperName:
        type: string
        identity: true
        required: false
        label: Shipper
        searchable: true
        sortable: true
        editable: true
        expression: s.CompanyName
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.columns.ShipperName.label
      Freight:
        type: decimal
        identity: false
        required: false
        label: Freight
        searchable: false
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.columns.Freight.label
      ShipCountry:
        type: string
        identity: false
        required: false
        label: Ship Country
        searchable: true
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.columns.ShipCountry.label
      Status:
        type: string
        identity: false
        required: false
        label: Status
        searchable: true
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.columns.Status.label
      RelatedProductIds:
        type: string
        identity: false
        required: false
        label: Related Products
        searchable: false
        sortable: false
        editable: true
        hidden: true
        labelKey: projects.b2b-order-ops.entities.order.entities.order.columns.RelatedProductIds.label
    paging:
      pageSize: 12
      mode: numbered
      enableCount: false
    layout:
      forms:
        columns: 2
        order:
        - CustomerId
        - EmployeeId
        - OrderDate
        - RequiredDate
        - ShippedDate
        - ShipperId
        - Freight
        - ShipCountry
        - Status
        - RelatedProductIds
      filters:
        columns: 4
        order:
        - CustomerId
        - EmployeeId
        - ShipCountry
        - Status
        - OrderDate
    softDelete: false
    isPublic: true
    filters:
      CustomerId:
        type: entity-picker
        label: Customer
        expression: Orders.CustomerId
        foreignKey:
          entity: customer
          displayColumn: Id
          displayColumns:
          - CompanyName
          - ContactName
          - Country
          query: 'SELECT CustomerId AS Id, CompanyName, ContactName, Country

            FROM Customers

            WHERE Active = 1

            '
          picker: false
          multiPicker: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.filters.CustomerId.label
      EmployeeId:
        type: dropdown
        label: Employee
        expression: Orders.EmployeeId
        foreignKey:
          entity: employee
          displayColumn: Id
          displayColumns:
          - LastName
          - FirstName
          - Title
          picker: false
          multiPicker: false
        labelKey: projects.b2b-order-ops.entities.order.entities.order.filters.EmployeeId.label
      ShipCountry:
        type: multi-select
        label: Ship Country
        options:
        - Germany
        - UK
        - USA
        - Brazil
        - Canada
        - France
        - Italy
        labelKey: projects.b2b-order-ops.entities.order.entities.order.filters.ShipCountry.label
      Status:
        type: dropdown
        label: Status
        options:
        - Open
        - Shipped
        - Delayed
        - Cancelled
        labelKey: projects.b2b-order-ops.entities.order.entities.order.filters.Status.label
      OrderDate:
        type: date-range
        label: Order Date
        expression: Orders.OrderDate
        labelKey: projects.b2b-order-ops.entities.order.entities.order.filters.OrderDate.label
    links:
      customer:
        label: Customer
        targetEntity: customer
        filter:
          CustomerId: CustomerId
        labelKey: projects.b2b-order-ops.entities.order.entities.order.links.customer.label
      employee:
        label: Employee
        targetEntity: employee
        filter:
          EmployeeId: EmployeeId
        labelKey: projects.b2b-order-ops.entities.order.entities.order.links.employee.label
      details:
        label: Order Details
        targetEntity: orderdetail
        filter:
          OrderId: OrderId
        labelKey: projects.b2b-order-ops.entities.order.entities.order.links.details.label
    confirmation:
      create: 受注を登録します。よろしいですか？
      update: 受注内容を更新します。よろしいですか？
    hooks:
      presets:
        crmOrderBefore:
        - trim:ShipCountry
        - crm_order_data_guard
        - crm_order_status_transition
      beforeCreate:
      - '@crmOrderBefore'
      beforeUpdate:
      - '@crmOrderBefore'
      beforeDelete:
      - crm_order_delete_guard
      afterCreate:
      - crm_order_audit_trail
      afterUpdate:
      - crm_order_audit_trail
      afterDelete:
      - crm_order_audit_trail
    isCompositeKey: false
    displayNameKey: projects.b2b-order-ops.entities.order.entities.order.displayName

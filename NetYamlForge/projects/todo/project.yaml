name: todo
displayName: TODO Project Manager
version: "1.0.0"

# AI向けヒント: このプロジェクトに変更を加える前に必ず参照すること
aiHints:
  primaryLanguage: ja-JP
  authRequired: true
  customHooks: []
  notes:
    - "シンプルなTODOアプリ。新しい機能はまず docs/COMMON_HOOKS.md の既存フックで対応を検討する"
    - "task.status の値: pending / in_progress / done / cancelled"

database:
  type: sqlite
  path: database/todo.db
features:
  multiLanguage: true
  userAuthentication: true
layout:
  dashboardTheme: minimal
  header:
    title: TODO Project Manager
  navigation:
    showDashboard: true
    entities:
      - task
      - project
    items:
      - label: Dashboard
        controller: Dashboard
        action: Index
        icon: 📊
      - label: My Tasks
        url: /todo/DynamicEntity/Index?entity=task
        icon: ✅
      - label: Projects
        url: /todo/DynamicEntity/Index?entity=project
        icon: 📁

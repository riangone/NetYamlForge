name: memo
displayName: Memo Notebook
version: "1.0.0"
database:
  type: sqlite
  path: database/memo.db
features:
  multiLanguage: true
  userAuthentication: true
layout:
  dashboardTheme: minimal
  header:
    title: Memo Notebook
  navigation:
    showDashboard: true
    entities:
      - memo
      - notebook
    items:
      - label: Home
        url: /memo
        icon: 🏠
      - label: Dashboard
        controller: Dashboard
        action: Index
        icon: 📊
      - label: All Memos
        url: /memo/DynamicEntity/Index?entity=memo
        icon: 📝
      - label: Notebooks
        url: /memo/DynamicEntity/Index?entity=notebook
        icon: 📒

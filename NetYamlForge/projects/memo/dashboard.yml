stats:
  - label: Total Memos
    entity: memo
    aggregate: count
    icon: 📝
    color: badge-info
  - label: Active Memos
    entity: memo
    aggregate: count
    filter: Memo.Status = 'active'
    icon: ✅
    color: badge-success
  - label: Pinned Memos
    entity: memo
    aggregate: count
    filter: Memo.IsPinned = 1
    icon: 📌
    color: badge-warning
  - label: Notebooks
    entity: notebook
    aggregate: count
    icon: 📚
    color: badge-secondary

charts:
  - title: Memos by Status
    type: doughnut
    entity: memo
    valueAggregate: count
    groupExpression: Status
    orderBy: value
    orderDir: desc
    limit: 10
  - title: Memos by Notebook
    type: bar
    entity: memo
    valueAggregate: count
    labelJoinEntity: notebook
    labelJoinKey: NotebookId
    labelJoinDisplay: Name
    orderBy: value
    orderDir: desc
    limit: 10

title: 🔍 语义搜索
description: "基于 Gemini text-embedding-004 的多语言向量语义检索 — 支持中、英、日等 100+ 语言"

sections:
  # ─── 向量语义搜索主界面 ───
  - id: vector_search_main
    title: 🧠 向量语义搜索
    component: vector_search
    sourceType: custom
    source: "SELECT 1"   # 占位，实际数据由前端 JS 调用 API 获取
    columns: []
    editable: false
    readOnly: true

  # ─── 场景统计 ───
  - id: scene_stats
    title: 场景分布
    component: pie_chart
    sourceType: custom
    source: |
      SELECT COALESCE(scene_type, '未分类') AS label,
             COUNT(*) AS value
      FROM photos
      WHERE deleted_at IS NULL AND annotation_status = 'done'
      GROUP BY scene_type
      ORDER BY value DESC
    columns: [label, value]
    xField: label
    yField: value
    pageSize: 12
    editable: false
    readOnly: true

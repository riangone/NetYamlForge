---
stats:
  - label: 照片总数
    entity: photos
    aggregate: count
    filter: "deleted_at IS NULL"
    icon: 📷
    color: badge-primary

  - label: AI 已标注
    entity: photos
    aggregate: count
    filter: "annotation_status='done' AND deleted_at IS NULL"
    icon: ✅
    color: badge-success

  - label: 待处理
    entity: photos
    aggregate: count
    filter: "annotation_status='pending' AND deleted_at IS NULL"
    icon: ⏳
    color: badge-warning

  - label: 处理失败
    entity: processing_queue
    aggregate: count
    filter: "status='failed'"
    icon: ❌
    color: badge-danger

  - label: 相册数量
    entity: albums
    aggregate: count
    icon: 📂
    color: badge-info

  - label: 语义标签数
    entity: tags
    aggregate: count
    icon: 🏷️
    color: badge-secondary

charts:
  - title: 标注状态分布
    type: pie
    entity: photos
    valueAggregate: count
    groupExpression: annotation_status
    orderBy: value
    orderDir: desc
    limit: 6
    colors:
      - rgba(16, 185, 129, 0.85)
      - rgba(245, 158, 11, 0.85)
      - rgba(59, 130, 246, 0.85)
      - rgba(239, 68, 68, 0.85)
      - rgba(107, 114, 128, 0.85)

  - title: 场景类别分布
    type: doughnut
    entity: photos
    valueAggregate: count
    groupExpression: "COALESCE(scene_type,'未分类')"
    orderBy: value
    orderDir: desc
    limit: 10
    colors:
      - rgba(59, 130, 246, 0.85)
      - rgba(16, 185, 129, 0.85)
      - rgba(245, 158, 11, 0.85)
      - rgba(139, 92, 246, 0.85)
      - rgba(239, 68, 68, 0.85)
      - rgba(236, 72, 153, 0.85)
      - rgba(20, 184, 166, 0.85)
      - rgba(251, 146, 60, 0.85)
      - rgba(99, 102, 241, 0.85)
      - rgba(34, 197, 94, 0.85)

  - title: 每月新增照片
    type: bar
    entity: photos
    valueAggregate: count
    groupExpression: "strftime('%Y-%m', COALESCE(taken_at, created_at))"
    orderBy: label
    orderDir: desc
    limit: 12
    colorBg: rgba(59, 130, 246, 0.7)
    colorBorder: rgba(59, 130, 246, 1)

  - title: 文件格式分布
    type: bar
    entity: photos
    valueAggregate: count
    groupExpression: "COALESCE(file_format,'未知')"
    orderBy: value
    orderDir: desc
    limit: 8
    colorBg: rgba(16, 185, 129, 0.7)
    colorBorder: rgba(16, 185, 129, 1)

  - title: 处理队列趋势（7天）
    type: line
    entity: processing_queue
    valueAggregate: count
    groupExpression: "date(completed_at)"
    orderBy: label
    orderDir: asc
    limit: 7
    colorBg: rgba(245, 158, 11, 0.7)
    colorBorder: rgba(245, 158, 11, 1)

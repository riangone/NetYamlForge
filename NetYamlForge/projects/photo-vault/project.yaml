      #   url: /photo-vault/Page/AiSearch
      #   icon: 🔍
      - label: 照片导入
        url: /photo-vault/Page/PhotoImport
        icon: 📥
        roles: [editor, admin]
      # - label: 相册管理
      #   url: /photo-vault/Page/Albums
      #   icon: 📂
      # - label: 标签浏览
      #   url: /photo-vault/Page/TagBrowser
      #   icon: 🏷️
      # - label: AI 助手
      #   url: /photo-vault/Page/AiAssistant
      #   icon: 🤖
      # - label: AI 提供商
      #   url: /photo-vault/Page/AiProvider
      #   icon: 🔌
      # - label: AI 配置
      #   url: /photo-vault/Page/Settings

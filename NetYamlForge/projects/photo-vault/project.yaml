      # - label: 照片管理
      #   url: /photo-vault/Page/PhotoManage
      #   icon: 📋
      # - label: 照片列表（实体）
      #   url: /photo-vault/DynamicEntity/Index?entity=photos
      #   icon: 🗂️

settings:
  locale: zh-CN
  timezone: Asia/Shanghai

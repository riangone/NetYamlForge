name: photo-vault
displayName: "📷 Photo Vault"
version: "1.0.0"
description: "智能相册资产管理系统 — 基于本地 LLM 的照片语义标注、检索与管理平台"

database:
  type: sqlite
  path: database/photo-vault.db

features:
  multiLanguage: true
  userAuthentication: true
  dashboard: true
  pages: true
  api: true

layout:
  theme: dim
  dashboardTheme: workspace

  landingPageByRole:
    viewer:  /photo-vault/Page/Home
    editor:  /photo-vault/Page/Home
    admin:   /photo-vault/Page/Home

  navigation:
    showDashboard: false
    showPages: false
    showEntities: false
    entities: []
    items:
      - label: 首页
        url: /photo-vault/Page/Home
        icon: 🏠
        roles: [viewer, editor, admin]
      - label: 处理队列
        url: /photo-vault/Page/ProcessingQueue
        icon: ⚙️
        roles: [editor, admin]
      # ─── 隐藏项（保留备用）───
      # - label: 照片画廊
      #   url: /photo-vault/Page/Gallery
      #   icon: 🖼️

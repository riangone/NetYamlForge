jobs:
  # ─── 本地 LLM 视觉标注工作器（Ollama）───
  # 调用 Ollama (llava 模型) 对队列中 provider=ollama 的照片进行批量标注
  annotation_worker:
    displayName: 本地 LLM 视觉标注
    description: "从 processing_queue 取出待处理照片，调用 Ollama llava 模型生成标注，写回 photos 表"
    enabled: true

    schedule:
      cron: "*/5 * * * *"     # 每 5 分钟运行一次
      timezone: "Asia/Shanghai"

    type: sql_to_csv
    settings:
      sqlFile: jobs/sql/pending_photos.sql
      outputFile: "jobs/output/annotation_worker_{date:yyyyMMddHHmm}.csv"
      includeHeader: true
      delimiter: ","

    onFailure:
      retryCount: 3
      retryInterval: 60
      logError: true

  # ─── Gemini API 视觉标注工作器 ───
  # 调用 Google Gemini API 对队列中 provider=gemini 的照片进行标注
  gemini_annotation_worker:
    displayName: Gemini API 视觉标注
    description: "从 processing_queue 取出 provider=gemini 的待处理照片，调用 Gemini Vision API 生成标注，写回 photos 表"
    enabled: true

    schedule:
      cron: "*/10 * * * *"    # 每 10 分钟运行（尊重 API 速率限制）
      timezone: "Asia/Shanghai"

    type: sql_to_csv
    settings:
      sqlFile: jobs/sql/gemini_pending_photos.sql
      outputFile: "jobs/output/gemini_worker_{date:yyyyMMddHHmm}.csv"
      includeHeader: true
      delimiter: ","

    # Gemini API 调用配置（从 ai/scenarios.yaml providers.gemini 继承）
    ai_provider: gemini
    batch_size: 5             # 每批处理 5 张（控制 API 配额消耗）

    onFailure:
      retryCount: 2
      retryInterval: 120
      logError: true

  # ─── Antigravity CLI 标注工作器 ───
  # 调用本地 antigravity CLI 对队列中 provider=antigravity 的照片进行处理
  antigravity_cli_worker:
    displayName: Antigravity CLI 标注
    description: "从 processing_queue 取出 provider=antigravity 的待处理照片，通过 antigravity CLI 进行本地处理"
    enabled: true

    schedule:
      cron: "*/3 * * * *"     # 每 3 分钟运行（本地 CLI 无速率限制）
      timezone: "Asia/Shanghai"

    type: sql_to_csv
    settings:
      sqlFile: jobs/sql/antigravity_pending_photos.sql
      outputFile: "jobs/output/antigravity_worker_{date:yyyyMMddHHmm}.csv"
      includeHeader: true
      delimiter: ","

    # antigravity CLI 调用配置（从 ai/scenarios.yaml providers.antigravity 继承）
    ai_provider: antigravity
    batch_size: 10            # 每批处理 10 张

    onFailure:
      retryCount: 3
      retryInterval: 60
      logError: true

  # ─── 相册统计刷新 ───
  # 每小时刷新各相册的 photo_count / annotated_count
  album_stats_refresh:
    displayName: 相册统计刷新
    description: "更新 albums 表中 photo_count 和 annotated_count 字段"
    enabled: true

    schedule:
      cron: "0 * * * *"       # 每整点运行
      timezone: "Asia/Shanghai"

    type: sql_to_csv
    settings:
      sqlFile: jobs/sql/album_stats_refresh.sql
      outputFile: "jobs/output/album_stats_{date:yyyyMMddHH}.csv"
      includeHeader: true
      delimiter: ","

    onFailure:
      retryCount: 2
      retryInterval: 300
      logError: true

  # ─── 失败任务重试 ───
  # 每 30 分钟将失败次数 <= 3 的任务重新入队
  failed_retry:
    displayName: 失败任务重试
    description: "将重试次数 <= 3 的失败队列任务状态重置为 queued"
    enabled: true

    schedule:
      cron: "*/30 * * * *"    # 每 30 分钟
      timezone: "Asia/Shanghai"

    type: sql_to_csv
    settings:
      sqlFile: jobs/sql/failed_retry.sql
      outputFile: "jobs/output/failed_retry_{date:yyyyMMddHHmm}.csv"
      includeHeader: false
      delimiter: ","

    onFailure:
      retryCount: 1
      retryInterval: 120
      logError: true

  # ─── 标签统计刷新 ───
  # 每天凌晨刷新 tags.usage_count
  tag_usage_refresh:
    displayName: 标签使用统计刷新
    description: "统计 photo_tags 中各标签的使用次数并更新 tags 表"
    enabled: true

    schedule:
      cron: "0 2 * * *"       # 每天凌晨 2:00
      timezone: "Asia/Shanghai"

    type: sql_to_csv
    settings:
      sqlFile: jobs/sql/tag_usage_refresh.sql
      outputFile: "jobs/output/tag_usage_{date:yyyyMMdd}.csv"
      includeHeader: true
      delimiter: ","

    onFailure:
      retryCount: 2
      retryInterval: 300
      logError: true

  # ─── 每日标注报告 ───
  # 每天早上生成标注进度 CSV 报告
  daily_annotation_report:
    displayName: 每日标注进度报告
    description: "生成前一天的标注统计报告 CSV"
    enabled: true

    schedule:
      cron: "0 8 * * *"       # 每天早上 8:00
      timezone: "Asia/Shanghai"

    type: sql_to_csv
    settings:
      sqlFile: jobs/sql/daily_report.sql
      outputFile: "jobs/output/daily_report_{date:yyyyMMdd}.csv"
      includeHeader: true
      delimiter: ","

    onFailure:
      retryCount: 1
      retryInterval: 600
      logError: true

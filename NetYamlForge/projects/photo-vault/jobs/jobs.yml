jobs:
  # ─── 照片导入工作器 ───
  # 处理目录扫描类型的 import_jobs，扫描文件系统、提取 EXIF、写入 photos + processing_queue
  photo_import_worker:
    displayName: 照片导入工作器
    description: "从 import_jobs 取出 status=queued 的目录扫描任务，扫描目录写入 photos 表并加入 AI 标注队列"
    enabled: true

    schedule:
      cron: "* * * * *"       # 每分钟检查一次
      timezone: "Asia/Shanghai"

    type: directory_import
    settings:
      sqlFile: jobs/sql/pending_import_jobs.sql
      outputFile: "jobs/output/import_worker_{date:yyyyMMddHHmm}.csv"
      includeHeader: true
      delimiter: ","

    behavior:
      updateStatusOnStart: scanning      # 取出任务后立即将 status 置为 scanning
      updateStatusOnDone: done           # 处理完成后置为 done
      updateStatusOnError: failed        # 失败后置为 failed
      writeExif: true                    # 自动提取 JPEG/HEIC EXIF 元数据
      deduplicateByPath: true            # file_path 已存在则跳过（INSERT OR IGNORE）
      autoEnqueueAnnotation: true        # 导入后自动写入 processing_queue

    onFailure:
      retryCount: 2
      retryInterval: 60
      logError: true

  # ─── 本地 LLM 视觉标注工作器（Ollama）───
  annotation_worker:
    displayName: 本地 LLM 视觉标注（Ollama）
    description: "从 processing_queue 取出 provider=ollama 的待处理照片，调用 Ollama llava 模型生成标注"
    enabled: true

    schedule:
      cron: "*/5 * * * *"
      timezone: "Asia/Shanghai"

    type: photo_annotator
    aiProvider: ollama
    batchSize: 5

    onFailure:
      retryCount: 3
      retryInterval: 60
      logError: true

  # ─── Gemini API 视觉标注工作器 ───
  gemini_annotation_worker:
    displayName: Gemini API 视觉标注
    description: "从 processing_queue 取出 provider=gemini 的待处理照片，调用 Gemini Vision API 生成标注"
    enabled: true

    schedule:
      cron: "*/10 * * * *"
      timezone: "Asia/Shanghai"

    type: photo_annotator
    aiProvider: gemini
    batchSize: 5

    onFailure:
      retryCount: 2
      retryInterval: 120
      logError: true

  # ─── Antigravity (Anthropic Claude) 标注工作器 ───
  antigravity_cli_worker:
    displayName: Antigravity 视觉标注（Claude API）
    description: "从 processing_queue 取出 provider=antigravity 的待处理照片，通过 Anthropic Claude API 进行视觉标注"
    enabled: true

    schedule:
      cron: "0 * * * *"      # 每 60 分钟
      timezone: "Asia/Shanghai"

    type: photo_annotator
    aiProvider: antigravity
    batchSize: 5

    onFailure:
      retryCount: 3
      retryInterval: 60
      logError: true

  # ─── 向量嵌入生成 ───
  # 对已完成标注但尚未生成向量的照片批量调用 Gemini text-embedding-004
  embedding_generator:
    displayName: 向量嵌入生成（Gemini）
    description: "为 annotation_status=done 且尚无嵌入向量的照片调用 Gemini text-embedding-004，结果存入 photo_embeddings 表"
    enabled: true

    schedule:
      cron: "0 * * * *"      # 每 60 分钟扫描一次
      timezone: "Asia/Shanghai"

    type: photo_embedding_generator
    batchSize: 10

    onFailure:
      retryCount: 2
      retryInterval: 120
      logError: true

  # ─── 相册统计刷新 ───
  # 每小时刷新各相册的 photo_count / annotated_count
  album_stats_refresh:
    displayName: 相册统计刷新
    description: "更新 albums 表中 photo_count 和 annotated_count 字段"
    enabled: true

    schedule:
      cron: "0 * * * *"       # 每整点运行
      timezone: "Asia/Shanghai"

    type: sql_to_csv
    settings:
      sqlFile: jobs/sql/album_stats_refresh.sql
      outputFile: "jobs/output/album_stats_{date:yyyyMMddHH}.csv"
      includeHeader: true
      delimiter: ","

    onFailure:
      retryCount: 2
      retryInterval: 300
      logError: true

  # ─── 失败任务重试 ───
  # 每 30 分钟将失败次数 <= 3 的任务重新入队
  failed_retry:
    displayName: 失败任务重试
    description: "将重试次数 <= 3 的失败队列任务状态重置为 queued"
    enabled: true

    schedule:
      cron: "*/30 * * * *"    # 每 30 分钟
      timezone: "Asia/Shanghai"

    type: sql_to_csv
    settings:
      sqlFile: jobs/sql/failed_retry.sql
      outputFile: "jobs/output/failed_retry_{date:yyyyMMddHHmm}.csv"
      includeHeader: false
      delimiter: ","

    onFailure:
      retryCount: 1
      retryInterval: 120
      logError: true

  # ─── 标签统计刷新 ───
  # 每天凌晨刷新 tags.usage_count
  tag_usage_refresh:
    displayName: 标签使用统计刷新
    description: "统计 photo_tags 中各标签的使用次数并更新 tags 表"
    enabled: true

    schedule:
      cron: "0 2 * * *"       # 每天凌晨 2:00
      timezone: "Asia/Shanghai"

    type: sql_to_csv
    settings:
      sqlFile: jobs/sql/tag_usage_refresh.sql
      outputFile: "jobs/output/tag_usage_{date:yyyyMMdd}.csv"
      includeHeader: true
      delimiter: ","

    onFailure:
      retryCount: 2
      retryInterval: 300
      logError: true

  # ─── 每日标注报告 ───
  # 每天早上生成标注进度 CSV 报告
  daily_annotation_report:
    displayName: 每日标注进度报告
    description: "生成前一天的标注统计报告 CSV"
    enabled: true

    schedule:
      cron: "0 8 * * *"       # 每天早上 8:00
      timezone: "Asia/Shanghai"

    type: sql_to_csv
    settings:
      sqlFile: jobs/sql/daily_report.sql
      outputFile: "jobs/output/daily_report_{date:yyyyMMdd}.csv"
      includeHeader: true
      delimiter: ","

    onFailure:
      retryCount: 1
      retryInterval: 600
      logError: true

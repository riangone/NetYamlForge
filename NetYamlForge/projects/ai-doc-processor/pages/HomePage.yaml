title: AI 文档处理中心
isPublic: true

ui:
  page:
    layout: single
    density: comfortable

sections:
  - id: task_stats
    title: 任务统计
    sourceType: custom
    source: >
      SELECT
        COUNT(*) AS total,
        COALESCE(SUM(CASE WHEN Status = 'completed'  THEN 1 ELSE 0 END), 0) AS completed,
        COALESCE(SUM(CASE WHEN Status = 'processing' THEN 1 ELSE 0 END), 0) AS processing,
        COALESCE(SUM(CASE WHEN Status = 'pending'    THEN 1 ELSE 0 END), 0) AS pending,
        COALESCE(SUM(CASE WHEN Status = 'failed'     THEN 1 ELSE 0 END), 0) AS failed
      FROM DocumentTask
    columns: [total, completed, processing, pending, failed]
    pageSize: 1
    editable: false
    readOnly: true
    ui:
      component: DataTable

  - id: recent_tasks
    title: 最近任务
    sourceType: custom
    source: >
      SELECT Id, FileName, DocumentType, Status, CreatedAt
      FROM DocumentTask
      ORDER BY CreatedAt DESC
      LIMIT 8
    columns: [Id, FileName, DocumentType, Status, CreatedAt]
    pageSize: 8
    editable: false
    readOnly: true
    ui:
      component: DataTable

  - id: doc_type_stats
    title: 文档类型分布
    sourceType: custom
    source: >
      SELECT DocumentType, COUNT(*) AS count
      FROM DocumentTask
      WHERE Status = 'completed'
        AND DocumentType IS NOT NULL
        AND DocumentType != ''
      GROUP BY DocumentType
      ORDER BY count DESC
      LIMIT 6
    columns: [DocumentType, count]
    pageSize: 6
    editable: false
    readOnly: true
    ui:
      component: DataTable

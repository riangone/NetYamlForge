name: ai-doc-processor
displayName: AI Document Processor
version: "1.0.0"

database:
  type: sqlite
  path: database/ai-doc-processor.db

features:
  multiLanguage: true
  userAuthentication: true
  dashboard: true
  pages: true

layout:
  dashboardTheme: workspace
  header:
    title: "AI Document Processor"
  navigation:
    showDashboard: true
    entities:
      - document_task
    items:
      - label: 首页
        url: /ai-doc-processor
        icon: 🏠
      - label: 数据看板
        controller: Dashboard
        action: Index
        icon: 📊
      - label: 上传文档
        url: /ai-doc-processor/Page/UploadPage
        icon: 📤
      - label: 查看提取数据
        url: /ai-doc-processor/Page/DataViewer
        icon: 🔍
      - label: 任务列表
        url: /ai-doc-processor/DynamicEntity/Index?entity=document_task
        icon: 🗂️

home_page:
  icon: "🤖"
  tagline: "AI Document Processor"
  tags: []

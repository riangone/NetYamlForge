  projects.ai-doc-processor.pages.HomePage.heroTitle:
    zh-CN: 上传文档，AI 自动提取<br/>结构化数据
    en-US: Upload Documents, AI Automatically Extracts<br/>Structured Data
    ja-JP: ドキュメントをアップロード、AIが自動抽出<br/>構造化データ
    ko-KR: 문서 업로드, AI가 자동으로 추출<br/>구조화된 데이터
  projects.ai-doc-processor.pages.HomePage.heroDesc:
    zh-CN: 支持 PDF、图片（JPG/PNG/WebP）和 ZIP 批量包。Gemini AI 自动识别文档类型，提取全部字段含表格明细，动态建表存储。
    en-US: Supports PDF, images (JPG/PNG/WebP), and ZIP batch packages. Gemini AI automatically recognizes document types, extracts all fields including table details, and dynamically creates tables for storage.
    ja-JP: PDF、画像（JPG/PNG/WebP）、ZIP一括パッケージに対応。Gemini AIがドキュメントタイプを自動識別し、テーブル明細を含むすべてのフィールドを抽出して、テーブルを動的に作成して保存します。
    ko-KR: PDF, 이미지(JPG/PNG/WebP) 및 ZIP 배치 패키지를 지원합니다. Gemini AI가 문서 유형을 자동으로 인식하고 테이블 상세 정보를 포함한 모든 필드를 추출하며 저장용 테이블을 동적으로 생성합니다。

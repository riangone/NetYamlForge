  projects.ai-doc-processor.pages.HomePage.workflow.step2Desc:
    zh-CN: Gemini AI 识别文档类型（发票、收据、合同等），提取全部字段及表格明细行，绝不省略。
    en-US: Gemini AI identifies document types (invoices, receipts, contracts, etc.), extracts all fields and table details, without omissions.
    ja-JP: Gemini AIがドキュメントタイプ（請求書、領収書、契約書など）を識別し、すべてのフィールドと表の明细行を漏れなく抽出します。
    ko-KR: Gemini AI가 문서 유형(송장, 영수증, 계약서 등)을 인식하여 누락 없이 모든 필드와 표 세부 항목을 추출합니다.

  projects.ai-doc-processor.pages.HomePage.workflow.step3Desc:
    zh-CN: 系统自动建表存储，可在"查看提取数据"页面按文档类型浏览和下载 JSON 结果。
    en-US: Automatically stored in database. Browse and download JSON results by document type on the "View Extracted Data" page.
    ja-JP: データベースに自動保存。 「抽出データの表示」ページでドキュメントタイプ別にJSON結果を閲覧・ダウンロードできます。
    ko-KR: 시스템이 자동으로 테이블을 생성하여 저장합니다. "추출된 데이터 보기" 페이지에서 문서 유형별로 JSON 결과를 탐색하고 다운로드할 수 있습니다.


  projects.ai-doc-processor.pages.HomePage.workflow.step1Desc:
    zh-CN: 选择 PDF、图片或 ZIP 压缩包，单次支持多文件上传，单文件最大 20MB。
    en-US: Select PDF, image, or ZIP archive. Supports multi-file uploading, max 20MB per file.
    ja-JP: PDF、画像、またはZIPファイルを選択。複数ファイルの同時アップロードに対応、1ファイル最大20MB。
    ko-KR: PDF, 이미지 또는 ZIP 압축 파일을 선택하십시오. 한 번에 여러 파일 업로드를 지원하며 파일당 최대 20MB입니다.

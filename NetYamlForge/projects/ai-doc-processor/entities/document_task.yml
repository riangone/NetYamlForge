imports: []
entities:
  document_task:
    table: DocumentTask
    key: Id
    displayName: "AI文档处理任务"
    softDelete: false
    isPublic: true

    actions:
      batch_upload:
        label: "📤 上传文档 / ZIP"
        scope: header
        handler: batch_upload_zip_handler
        confirm: "请选择要上传的文档文件或 ZIP 压缩包，AI 将自动分析并提取全部内容。"
        inputs:
          - name: ZipFile
            type: file
            label: "📦 选择 ZIP 压缩包（可包含多个文档）"
            required: false
            allowedExtensions: ".zip"
            maxSizeBytes: 20971520
          - name: DocFiles
            type: file
            label: "📄 或选择单个/多个文档文件（PDF/图片）"
            required: false
            multiple: true
            allowedExtensions: ".pdf,.jpg,.jpeg,.png,.webp,.bmp"
            maxSizeBytes: 20971520

    columns:
      Id:
        type: int
        label: "ID"
        identity: true
        hidden: true
      FileName:
        type: string
        label: "文件名"
        searchable: true
        sortable: true
      DocumentType:
        type: string
        label: "文档类型"
        sortable: true
      Status:
        type: string
        label: "处理状态"
        sortable: true
      FilePath:
        type: string
        label: "原始文件"
        hidden: true
      JsonPath:
        type: string
        label: "提取结果"
        hidden: true
      ExtractedTable:
        type: string
        label: "数据表"
        hidden: true
      ExtractedId:
        type: int
        label: "数据ID"
        hidden: true
      CreatedAt:
        type: datetime
        label: "上传时间"
        sortable: true

    forms:
      FileName:
        type: string
        label: "文件名"
        editable: false
      Status:
        type: string
        label: "处理状态"
        editable: false
      DocumentType:
        type: string
        label: "文档类型"
        editable: false
      CreatedAt:
        type: datetime
        label: "上传时间"
        editable: false

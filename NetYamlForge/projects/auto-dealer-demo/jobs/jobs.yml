jobs:
  # 翌日予約リマインド
  appointment_reminder:
    displayName: 予約リマインド送信
    description: "翌日の予約顧客にリマインド通知を送信します"
    enabled: true

    schedule:
      cron: "0 10 * * *"            # 毎日 10:00
      timezone: "Asia/Tokyo"

    type: sql_to_csv
    settings:
      sqlFile: jobs/sql/tomorrow_appointments.sql
      outputFile: "jobs/output/appointment_reminder_{date:yyyyMMdd}.csv"
      includeHeader: true
      delimiter: ","

    onFailure:
      retryCount: 2
      retryInterval: 300
      logError: true

  # 停滞リードアラート（7 日以上未対応のリードを平日朝に通知）
  stale_lead_alert:
    displayName: 停滞リードアラート
    description: "7 日以上フォローアップが行われていないリードを担当者向けにレポート出力します"
    enabled: true

    schedule:
      cron: "0 9 * * 1-5"           # 平日毎朝 9:00
      timezone: "Asia/Tokyo"

    type: sql_to_csv
    settings:
      sqlFile: jobs/sql/stale_lead_alert.sql
      outputFile: "jobs/output/stale_lead_alert_{date:yyyyMMdd}.csv"
      includeHeader: true
      delimiter: ","

    onFailure:
      retryCount: 2
      retryInterval: 300
      logError: true

  # VIP 顧客フォローアップ
  vip_customer_followup:
    displayName: VIP 顧客フォローアップ
    description: "フォローアップが必要な VIP 顧客を抽出します"
    enabled: true

    schedule:
      cron: "0 9 * * 1"             # 毎週月曜 9:00
      timezone: "Asia/Tokyo"

    type: sql_to_csv
    settings:
      sqlFile: jobs/sql/vip_followup.sql
      outputFile: "jobs/output/vip_followup_{date:yyyyMMdd}.csv"
      includeHeader: true
      delimiter: ","

    onFailure:
      retryCount: 2
      retryInterval: 300
      logError: true

  # ─────────────────────────────────────────────────────────────
  # AI リード再スコアリング（Antigravity CLI 実行）
  # ─────────────────────────────────────────────────────────────
  ai_lead_scorer:
    displayName: 🤖 AI リード再スコアリング
    description: "7 日以上未更新のリードを Antigravity CLI でスコアリングし、ai_decisions テーブルに書き込みます"
    enabled: true

    schedule:
      cron: "30 */2 * * *"          # 2時間毎の30分
      timezone: "Asia/Tokyo"

    type: ai_dealer_engine
    settings:
      params:
        mode: lead_scoring
        maxItems: "5"
        autoExecuteThreshold: "85"

    onFailure:
      retryCount: 2
      retryInterval: 300
      logError: true

  # ─────────────────────────────────────────────────────────────
  # AI 育成タスク自動生成（Antigravity CLI 実行）
  # ─────────────────────────────────────────────────────────────
  ai_nurturing_generator:
    displayName: 🌱 AI 育成タスク自動生成
    description: "スコア 30-79 のリードに対して Antigravity CLI が育成タスクを生成・登録します"
    enabled: true

    schedule:
      cron: "0 8 * * 1-5"           # 平日毎朝 8:00
      timezone: "Asia/Tokyo"

    type: ai_dealer_engine
    settings:
      params:
        mode: nurturing
        maxItems: "10"
        autoExecuteThreshold: "80"

    onFailure:
      retryCount: 2
      retryInterval: 300
      logError: true

  # ─────────────────────────────────────────────────────────────
  # AI 見積自動生成（Antigravity CLI 実行）
  # ─────────────────────────────────────────────────────────────
  ai_quote_generator:
    displayName: 💰 AI 見積自動生成
    description: "スコア 80 以上のリードに対して Antigravity CLI が最適見積を生成し、ai_quotes に登録します"
    enabled: true

    schedule:
      cron: "0 9 * * 1-5"           # 平日毎朝 9:00
      timezone: "Asia/Tokyo"

    type: ai_dealer_engine
    settings:
      params:
        mode: quote_generation
        maxItems: "5"
        autoExecuteThreshold: "90"

    onFailure:
      retryCount: 2
      retryInterval: 300
      logError: true

  # ─────────────────────────────────────────────────────────────
  # Phase 3: AI 育成メール自動送信（Antigravity CLI 実行）
  # ─────────────────────────────────────────────────────────────
  ai_nurturing_email_sender:
    displayName: 📧 AI 育成メール自動送信
    description: "pending の育成タスク（email/appointment/test_drive）を処理し、AI生成メールを顧客に自動送信します"
    enabled: true

    schedule:
      cron: "30 10 * * 1-5"         # 平日毎朝 10:30
      timezone: "Asia/Tokyo"

    type: ai_communication_sender
    settings:
      params:
        mode: nurturing_email
        maxItems: "15"
        autoSendThreshold: "80"

    onFailure:
      retryCount: 2
      retryInterval: 300
      logError: true

  # ─────────────────────────────────────────────────────────────
  # Phase 3: AI 見積メール自動送信（Antigravity CLI 実行）
  # ─────────────────────────────────────────────────────────────
  ai_quote_email_sender:
    displayName: 💌 AI 見積メール自動送信
    description: "承認済みの AI 見積を顧客にメール送信します。AI が件名・本文をパーソナライズします"
    enabled: true

    schedule:
      cron: "0 11 * * 1-5"          # 平日毎朝 11:00
      timezone: "Asia/Tokyo"

    type: ai_communication_sender
    settings:
      params:
        mode: quote_email
        maxItems: "5"
        autoSendThreshold: "85"

    onFailure:
      retryCount: 2
      retryInterval: 300
      logError: true

  # ─────────────────────────────────────────────────────────────
  # Phase 3: 無返信フォローアップ自動生成（Antigravity CLI 実行）
  # ─────────────────────────────────────────────────────────────
  ai_response_check:
    displayName: 🔍 AI 無返信フォローアップ
    description: "3日間返信がないメールを検出し、AI が最適なフォローアップアクションを育成タスクに追加します"
    enabled: true

    schedule:
      cron: "0 14 * * 1-5"          # 平日毎日 14:00
      timezone: "Asia/Tokyo"

    type: ai_communication_sender
    settings:
      params:
        mode: response_check
        maxItems: "20"

    onFailure:
      retryCount: 2
      retryInterval: 300
      logError: true

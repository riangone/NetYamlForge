---
# 自動車ディーラー管理システム Dashboard 設定
stats:
  - label: 本日の予約
    entity: service_appointments
    aggregate: count
    filter: "date(preferred_date)=date('now')"
    icon: 📅
    color: badge-primary

  - label: 確認待ち予約
    entity: service_appointments
    aggregate: count
    filter: "status='pending'"
    icon: ⏰
    color: badge-warning

  - label: オープン依頼
    entity: service_requests
    aggregate: count
    filter: "status='open'"
    icon: 📥
    color: badge-info

  - label: 緊急の依頼
    entity: service_requests
    aggregate: count
    filter: "priority='urgent'"
    icon: 🔥
    color: badge-danger

  - label: 在庫車両
    entity: vehicles
    aggregate: count
    filter: "status='available'"
    icon: 🚗
    color: badge-success

  - label: アクティブリード
    entity: sales_leads
    aggregate: count
    filter: "status NOT IN ('won','lost')"
    icon: 🔥
    color: badge-primary

charts:
  - title: 予約ステータス内訳
    type: pie
    entity: service_appointments
    valueAggregate: count
    groupExpression: status
    orderBy: value
    orderDir: desc
    limit: 10
    colors:
      - rgba(59, 130, 246, 0.85)
      - rgba(245, 158, 11, 0.85)
      - rgba(16, 185, 129, 0.85)
      - rgba(107, 114, 128, 0.85)
      - rgba(239, 68, 68, 0.85)

  - title: サービス依頼種別
    type: bar
    entity: service_requests
    valueAggregate: count
    groupExpression: request_type
    orderBy: value
    orderDir: desc
    limit: 10
    colorBg: rgba(16, 185, 129, 0.7)
    colorBorder: rgba(16, 185, 129, 1)

  - title: リードスコア分布
    type: bar
    entity: sales_leads
    valueAggregate: count
    groupExpression: "CASE WHEN lead_score >= 80 THEN '高' WHEN lead_score >= 50 THEN '中' ELSE '低' END"
    orderBy: value
    orderDir: desc
    limit: 5
    colorBg: rgba(59, 130, 246, 0.7)
    colorBorder: rgba(59, 130, 246, 1)

  - title: 週間予約推移
    type: line
    entity: service_appointments
    valueAggregate: count
    groupExpression: date(preferred_date)
    orderBy: label
    orderDir: asc
    limit: 7
    colorBg: rgba(16, 185, 129, 0.7)
    colorBorder: rgba(16, 185, 129, 1)

  - title: リードステータス内訳
    type: doughnut
    entity: sales_leads
    valueAggregate: count
    groupExpression: status
    orderBy: value
    orderDir: desc
    limit: 10
    colors:
      - rgba(59, 130, 246, 0.85)
      - rgba(245, 158, 11, 0.85)
      - rgba(16, 185, 129, 0.85)
      - rgba(139, 92, 246, 0.85)
      - rgba(239, 68, 68, 0.85)
      - rgba(236, 72, 153, 0.85)

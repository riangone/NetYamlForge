# 汽车销售 AI 配置指南

> **版本**: 1.0
> **最后更新**: 2026 年 4 月 1 日

---

## 📋 配置说明

### appsettings.json 配置

```json
{
  "AiWindow": {
    // 基本設定
    "DealerName": "AI 自動車販売",
    "BusinessHours": "月〜土 9:00-18:00",
    
    // AI プロバイダー設定
    "ProviderPriority": ["claude", "qwen", "gemini", "ollama"],
    
    // Claude 設定
    "Claude": {
      "ApiKey": "${ANTHROPIC_API_KEY}",
      "Model": "claude-haiku-4-5-20251001",
      "MaxTokens": 1024
    },
    
    // CLI 優先モード（開発用）
    "CliFirst": true,
    "CliTimeoutSeconds": 3600,

    // 機能フラグ
    "EnableProactiveSuggestions": true,
    "EnableSentimentAnalysis": true,
    "EnableCompetitorAnalysis": true,
    
    // 分析しきい値
    "MaxRecommendations": 5,
    "ChurnRiskThreshold": 0.7,
    "LeadFollowupDays": 3,
    "InventoryAgingDays": 90
  }
}
```

---

## 🎯 機能フラグ説明

| フラグ | 説明 | デフォルト |
|-------|------|----------|
| `EnableProactiveSuggestions` | 積極的な提案機能を有効化 | `true` |
| `EnableSentimentAnalysis` | 感情分析を有効化 | `true` |
| `EnableCompetitorAnalysis` | 競合分析を有効化 | `true` |

---

## 📊 しきい値設定

| 設定 | 説明 | デフォルト |
|-----|------|----------|
| `MaxRecommendations` | 推奨アクションの最大表示数 | `5` |
| `ChurnRiskThreshold` | 流失リスクしきい値（0-1） | `0.7` |
| `LeadFollowupDays` | リードフォローアップ日数 | `3` |
| `InventoryAgingDays` | 長期在庫日数しきい値 | `90` |


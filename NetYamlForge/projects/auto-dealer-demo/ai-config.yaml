```
NetYamlForge/
└── skills/
    ├── _system-prompt.md              # フレームワーク共通
    └── auto-dealer/                   # 自動車販売専用（独立）
        ├── _system-prompt-staff.md    # 従業員向けシステムプロンプト
        ├── _system-prompt-customer.md # 顧客向けシステムプロンプト
        ├── _tools-definition.md       # ツール定義（独立）

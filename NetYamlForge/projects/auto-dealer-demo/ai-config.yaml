## 📈 効果測定指標

| 指標 | 説明 | 目標値 |
|-----|------|--------|
| 采纳率 | 推奨アクションの採用率 | >60% |
| 转化率 | リード→成約の转化率 | >25% |
| 响应时间 | AI 平均応答時間 | <3 秒 |
| 満足度 | ユーザー評価（1-5） | >4.5 |
| 試乗予約率 | 相談→試乗の转化率 | >20% |
| フォローアップ率 | 24 時間以内フォローアップ率 | >95% |


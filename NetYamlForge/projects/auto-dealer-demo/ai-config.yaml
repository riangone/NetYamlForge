## 🔄 运作原理

### フレームワーク AI との統合

1. **システムプロンプトの読み込み**
   - `AutoDealerChatService` が `skills/auto-dealer/` からプロンプトを読み込む
   - 従業員/顧客モードに応じて適切なファイルを選択

2. **ツール呼び出し**
   - `query_data` ツールで DB からデータを取得
   - 取得したデータを基に分析・分類レポートを生成

3. **応答生成**
   - 独立ドキュメントのテンプレートに従って回答を構築
   - 詳細ページへのリンクを自動追加

### 設定の優先順位

```
環境変数 > appsettings.Production.json > appsettings.json
```


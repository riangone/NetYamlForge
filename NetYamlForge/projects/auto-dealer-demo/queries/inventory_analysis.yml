name: inventory_analysis
description: 库存分析报表 - 按品牌和车型统计库存数量、平均价格、总金额
entity: vehicles
action: aggregate
groupBy:
  - brand
  - model
aggregations:
  - function: count
    field: vehicle_id
    alias: vehicle_count
  - function: avg
    field: price
    alias: avg_price
  - function: sum
    field: price
    alias: total_value
filters:
  - field: status
    op: eq
    value: "{status}"
orderBy:
  field: vehicle_count
  dir: desc
top: 50
parameters:
  - name: status
    type: string
    required: false
    default: available
    description: 车辆状态（available, reserved, sold）

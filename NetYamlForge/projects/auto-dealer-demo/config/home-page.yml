capabilitiesSectionTitle: 核心功能
capabilities:
  - icon: 🚗
    title: 车辆资产管理
    description: 详尽记录车辆参数、外观、状态及库龄信息，支持多店库存动态实时同步。
    badge: 资产
  - icon: 🔍
    title: 线索转化跟踪
    description: 深度分析潜在客户行为轨迹，实现从线索捕获、跟进到成交的全生命周期管理。
    badge: 销售
  - icon: 📅
    title: 智能预约服务
    description: 自动化管理试驾与维修保养预约，平衡资源分配，显著提升客户服务效率。
    badge: 服务
  - icon: 👥
    title: 360° 客户洞察
    description: 整合销售、服务与活动记录，为每一位车主构建精准的数字化画像。
    badge: 数据


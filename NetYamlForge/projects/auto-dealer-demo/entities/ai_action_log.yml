name: ai_action_log
title: AI アクションログ
tableName: ai_action_log
primaryKey: log_id

fields:
  log_id:
    label: ログID
    type: text
    readOnly: true
  action_type:
    label: アクション種別
    type: text
  entity_type:
    label: 対象種別
    type: text
  entity_id:
    label: 対象ID
    type: text
  ai_model:
    label: 使用モデル
    type: text
  prompt_summary:
    label: プロンプト概要
    type: textarea
  result_summary:
    label: 結果概要
    type: textarea
  execution_ms:
    label: 実行時間(ms)
    type: number
  created_at:
    label: 実行日時
    type: datetime

imports: []
entities:
  ai_knowledge:
    table: ai_knowledge
    key: knowledge_id
    displayName: AI ナレッジベース
    softDelete: false
    isPublic: true

    columns:
      knowledge_id:
        type: string
        length: 64
        required: true
        label: ナレッジ ID
        searchable: true
        sortable: true
      category:
        type: string
        length: 50
        required: true
        label: カテゴリ
        options:
          - faq
          - response_template
          - business_hours
          - service_menu
          - vehicle_info
          - campaign
          - other
        searchable: true
        sortable: true
      intent:
        type: string
        length: 50
        required: true
        label: 関連インテント
        searchable: true
        sortable: true
      question:
        type: string
        length: 500
        required: true
        label: 想定質問
        searchable: true
        sortable: true
      answer:
        type: text
        required: true
        label: 回答内容
      answer_html:
        type: text
        required: false
        label: 回答内容（HTML）
      keywords:
        type: text
        required: false
        label: 関連キーワード
      channel:
        type: string
        length: 50
        required: false
        label: 対象チャネル
        default: all
        searchable: true
        sortable: true
      language:
        type: string
        length: 10
        required: true
        label: 言語
        default: ja
        options:
          - ja
          - en
          - zh
        searchable: true
        sortable: true
      priority:
        type: int
        required: false
        label: 優先度
        default: 0
        sortable: true
      is_active:
        type: bool
        required: true
        label: 有効
        default: true
        sortable: true
      usage_count:
        type: int
        required: false
        label: 使用回数
        default: 0
        sortable: true
      helpful_count:
        type: int
        required: false
        label: 役に立った数
        default: 0
        sortable: true
      not_helpful_count:
        type: int
        required: false
        label: 役に立たなかった数
        default: 0
        sortable: true
      last_used_at:
        type: datetime
        required: false
        label: 最終使用日時
        sortable: true
      created_by:
        type: string
        length: 50
        required: false
        label: 作成者
        searchable: true
        sortable: true
      updated_by:
        type: string
        length: 50
        required: false
        label: 更新者
        searchable: true
        sortable: true
      created_at:
        type: datetime
        required: true
        label: 作成日時
        sortable: true
      updated_at:
        type: datetime
        required: true
        label: 更新日時
        sortable: true

    forms:
      knowledge_id:
        type: string
        required: true
        label: ナレッジ ID
        editable: false
      category:
        type: select
        required: true
        label: カテゴリ
        editable: true
      intent:
        type: string
        required: true
        label: 関連インテント
        editable: true
      question:
        type: string
        required: true
        label: 想定質問
        editable: true
      answer:
        type: textarea
        required: true
        label: 回答内容
        editable: true
        rows: 5
      keywords:
        type: string
        required: false
        label: 関連キーワード
        editable: true
      language:
        type: select
        required: true
        label: 言語
        editable: true
      is_active:
        type: bool
        required: true
        label: 有効
        editable: true
      priority:
        type: number
        required: false
        label: 優先度
        editable: true

    paging:
      pageSize: 20
      mode: numbered
      enableCount: true

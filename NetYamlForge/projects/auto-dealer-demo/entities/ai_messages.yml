imports: []
entities:
  ai_messages:
    table: ai_messages
    key: message_id
    displayName: AI メッセージ
    softDelete: false
    isPublic: true

    columns:
      message_id:
        type: string
        length: 64
        required: true
        label: メッセージ ID
        searchable: true
        sortable: true
      conversation_id:
        type: string
        length: 64
        required: true
        label: 対話 ID
        searchable: true
        sortable: true
      sender:
        type: string
        length: 20
        required: true
        label: 発話者
        options:
          - customer
          - ai
          - agent
        searchable: true
        sortable: true
      message_type:
        type: string
        length: 20
        required: true
        label: メッセージ種別
        default: text
        options:
          - text
          - voice_transcript
          - image
          - quick_reply
          - button
          - carousel
        searchable: true
        sortable: true
      content:
        type: text
        required: true
        label: メッセージ内容
      intent:
        type: string
        length: 100
        required: false
        label: 判定されたインテント
        searchable: true
        sortable: true
      entities_json:
        type: text
        required: false
        label: 検出されたエンティティ
      confidence_score:
        type: decimal
        precision: 10
        scale: 4
        required: false
        label: 置信度スコア
        sortable: true
      sentiment_score:
        type: decimal
        precision: 10
        scale: 4
        required: false
        label: 感情スコア
        sortable: true
      metadata_json:
        type: text
        required: false
        label: メタデータ
      timestamp:
        type: datetime
        required: true
        label: 発話日時
        sortable: true

    forms:
      message_id:
        type: string
        required: true
        label: メッセージ ID
        editable: false
      conversation_id:
        type: string
        required: true
        label: 対話 ID
        editable: true
      sender:
        type: select
        required: true
        label: 発話者
        editable: true
      message_type:
        type: select
        required: true
        label: メッセージ種別
        editable: true
      content:
        type: textarea
        required: true
        label: メッセージ内容
        editable: true
      intent:
        type: string
        required: false
        label: インテント
        editable: true
      timestamp:
        type: datetime
        required: true
        label: 発話日時
        editable: true

    paging:
      pageSize: 20
      mode: numbered
      enableCount: true

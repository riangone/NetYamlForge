imports: []
entities:
  ai_conversations:
    table: ai_conversations
    key: conversation_id
    displayName: AI 対話セッション
    softDelete: false
    isPublic: true

    columns:
      conversation_id:
        type: string
        length: 64
        required: true
        label: 対話 ID
        searchable: true
        sortable: true
      customer_id:
        type: string
        length: 50
        required: false
        label: 顧客 ID
        searchable: true
        sortable: true
      channel:
        type: string
        length: 20
        required: true
        label: チャネル
        options:
          - web
          - voice
          - line
          - email
          - sms
          - tablet
        searchable: true
        sortable: true
      status:
        type: string
        length: 30
        required: true
        label: ステータス
        default: active
        options:
          - active
          - completed
          - escalated
          - abandoned
        searchable: true
        sortable: true
      last_intent:
        type: string
        length: 100
        required: false
        label: 最終インテント
        searchable: true
        sortable: true
      last_confidence:
        type: decimal
        precision: 10
        scale: 4
        required: false
        label: 最終置信度
        sortable: true
      sentiment_score:
        type: decimal
        precision: 10
        scale: 4
        required: false
        label: 感情スコア
        sortable: true
      context_data:
        type: text
        required: false
        label: コンテキスト情報
      assigned_to_user_id:
        type: string
        length: 50
        required: false
        label: 割り当てオペレーター
        searchable: true
        sortable: true
      started_at:
        type: datetime
        required: true
        label: 開始日時
        sortable: true
      ended_at:
        type: datetime
        required: false
        label: 終了日時
        sortable: true
      created_at:
        type: datetime
        required: true
        label: 作成日時
        sortable: true
      updated_at:
        type: datetime
        required: true
        label: 更新日時
        sortable: true

    forms:
      conversation_id:
        type: string
        required: true
        label: 対話 ID
        editable: false
      customer_id:
        type: string
        required: false
        label: 顧客 ID
        editable: true
      channel:
        type: select
        required: true
        label: チャネル
        editable: true
      status:
        type: select
        required: true
        label: ステータス
        editable: true
      last_intent:
        type: string
        required: false
        label: 最終インテント
        editable: true
      assigned_to_user_id:
        type: string
        required: false
        label: 割り当てオペレーター
        editable: true
      started_at:
        type: datetime
        required: true
        label: 開始日時
        editable: true
      ended_at:
        type: datetime
        required: false
        label: 終了日時
        editable: true

    hooks:
      beforeCreate:
        - validate_ai_conversation       # チャネル・ステータス・置信度を検証
        - set_conversation_timestamps    # 開始日時・作成日時を自動設定
      beforeUpdate:
        - validate_ai_conversation
        - update_conversation_updated_at # 更新日時を自動更新

    paging:
      pageSize: 20
      mode: numbered
      enableCount: true

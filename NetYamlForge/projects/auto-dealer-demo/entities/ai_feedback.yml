imports: []
entities:
  ai_feedback:
    table: ai_feedback
    key: feedback_id
    displayName: AI フィードバック
    softDelete: false
    isPublic: true

    columns:
      feedback_id:
        type: string
        length: 64
        required: true
        label: フィードバック ID
        searchable: true
        sortable: true
      conversation_id:
        type: string
        length: 64
        required: true
        label: 対話 ID
        searchable: true
        sortable: true
      message_id:
        type: string
        length: 64
        required: false
        label: メッセージ ID
        searchable: true
        sortable: true
      rating:
        type: int
        required: true
        label: 評価
        min: 1
        max: 5
        sortable: true
      feedback_text:
        type: text
        required: false
        label: フィードバック内容
      category:
        type: string
        length: 50
        required: false
        label: カテゴリ
        options:
          - helpful
          - not_helpful
          - incorrect
          - rude
          - slow
          - other
        searchable: true
        sortable: true
      created_at:
        type: datetime
        required: true
        label: 作成日時
        sortable: true

    forms:
      conversation_id:
        type: string
        required: true
        label: 対話 ID
        editable: true
      message_id:
        type: string
        required: false
        label: メッセージ ID
        editable: true
      rating:
        type: number
        required: true
        label: 評価
        editable: true
        min: 1
        max: 5
      feedback_text:
        type: textarea
        required: false
        label: フィードバック内容
        editable: true
        rows: 5
      category:
        type: select
        required: false
        label: カテゴリ
        editable: true

    paging:
      pageSize: 20
      mode: numbered
      enableCount: true

imports: []
entities:
  ai_handovers:
    table: ai_handovers
    key: handover_id
    displayName: AI エスカレーション
    softDelete: false
    isPublic: true

    columns:
      handover_id:
        type: string
        length: 64
        required: true
        label: エスカレーション ID
        searchable: true
        sortable: true
      conversation_id:
        type: string
        length: 64
        required: true
        label: 対話 ID
        searchable: true
        sortable: true
      ticket_id:
        type: string
        length: 64
        required: false
        label: サポートチケット ID
        searchable: true
        sortable: true
      reason:
        type: string
        length: 50
        required: true
        label: エスカレーション理由
        options:
          - ai_unable
          - customer_request
          - high_value_deal
          - complaint
          - complex_inquiry
          - negative_sentiment
          - vip_customer
        searchable: true
        sortable: true
      priority:
        type: string
        length: 20
        required: true
        label: 優先度
        default: medium
        options:
          - low
          - medium
          - high
          - urgent
        searchable: true
        sortable: true
      target_department:
        type: string
        length: 50
        required: false
        label: 対象部門
        options:
          - sales
          - service
          - quality
          - finance
          - general
        searchable: true
        sortable: true
      assigned_to_user_id:
        type: string
        length: 50
        required: false
        label: 割り当てオペレーター
        searchable: true
        sortable: true
      status:
        type: string
        length: 30
        required: true
        label: ステータス
        default: pending
        options:
          - pending
          - assigned
          - in_progress
          - resolved
          - closed
        searchable: true
        sortable: true
      handover_notes:
        type: text
        required: false
        label: 引き継ぎメモ
      resolution_notes:
        type: text
        required: false
        label: 解決メモ
      escalated_at:
        type: datetime
        required: true
        label: エスカレーション日時
        sortable: true
      assigned_at:
        type: datetime
        required: false
        label: 割り当て日時
        sortable: true
      resolved_at:
        type: datetime
        required: false
        label: 解決日時
        sortable: true
      created_at:
        type: datetime
        required: true
        label: 作成日時
        sortable: true

    forms:
      handover_id:
        type: string
        required: true
        label: エスカレーション ID
        editable: false
      conversation_id:
        type: string
        required: true
        label: 対話 ID
        editable: true
      ticket_id:
        type: string
        required: false
        label: サポートチケット ID
        editable: true
      reason:
        type: select
        required: true
        label: エスカレーション理由
        editable: true
      priority:
        type: select
        required: true
        label: 優先度
        editable: true
      target_department:
        type: select
        required: false
        label: 対象部門
        editable: true
      assigned_to_user_id:
        type: string
        required: false
        label: 割り当てオペレーター
        editable: true
      status:
        type: select
        required: true
        label: ステータス
        editable: true
      escalated_at:
        type: datetime
        required: true
        label: エスカレーション日時
        editable: true

    paging:
      pageSize: 20
      mode: numbered
      enableCount: true

name: auto-dealer-demo
displayName: "自動車ディーラー AI 窓口システム"
version: "1.0.0"
description: "AI 技術を活用した 24 時間 365 日対応可能な智能客服システム"

database:
  type: sqlite
  path: database/auto-dealer-demo.db

features:
  multiLanguage: true
  userAuthentication: true
  dashboard: true
  pages: true
  api: true

layout:
  dashboardTheme: workspace
  navigation:
    showDashboard: true
    entities:
      - ai_conversations
      - ai_messages
      - ai_handovers
      - ai_feedback
      - ai_knowledge
      - sales_leads
      - customers
      - vehicles
      - service_appointments
      - service_requests
    items:
      - label: AI 窓口ダッシュボード
        url: /auto-dealer-demo/Page/AIDashboard
        icon: 💬
        section: AI 窗口
      - label: オペレーター・コンソール
        url: /auto-dealer-demo/Page/OperatorConsole
        icon: 🎧
        section: AI 窗口
      - label: AI 分析レポート
        url: /auto-dealer-demo/Page/AIAnalytics
        icon: 📈
        section: AI 窗口
      - label: 销售线索管理
        url: /auto-dealer-demo/Page/SalesLeads
        icon: 🔥
        section: 销售管理
      - label: 顧客一覧
        url: /auto-dealer-demo/Page/Customers
        icon: 👥
        section: 客户管理
      - label: サービス予約
        url: /auto-dealer-demo/Page/Appointments
        icon: 📅
        section: 预约管理

settings:
  locale: ja-JP
  timezone: Asia/Tokyo

name: auto-dealer-demo
displayName: "自動車ディーラー AI 窓口システム"
version: "1.1.0"
description: "AI 技術を活用した 24 時間 365 日対応可能な智能客服システム"

database:
  type: sqlite
  path: database/auto-dealer-demo.db

features:
  multiLanguage: true
  userAuthentication: true
  dashboard: true
  pages: true
  api: true

layout:
  dashboardTheme: workspace

  # ─── ロール別ランディングページ ───
  # ログイン後、ユーザーのロールに応じて最適なページへ自動リダイレクトします
  landingPageByRole:
    customer:      /auto-dealer-demo/Page/CustomerDashboard
    operator:      /auto-dealer-demo/Page/OperatorConsole
    sales_rep:     /auto-dealer-demo/Page/SalesRepDashboard
    sales_manager: /auto-dealer-demo/Page/LeadKanban
    service_staff: /auto-dealer-demo/Page/Appointments
    ai_admin:      /auto-dealer-demo/Page/AIDashboard
    executive:     /auto-dealer-demo/Page/ExecDashboard

  navigation:
    showDashboard: false
    entities: []
    items:
      # ─── 顧客向けメニュー ───
      - label: マイページ
        url: /auto-dealer-demo/Page/CustomerDashboard
        icon: 👤
        section: ""
        roles: [customer]
      - label: 予約・サービス確認
        url: /auto-dealer-demo/Page/CustomerAppointments
        icon: 📅
        section: マイページ
        roles: [customer]
      - label: 在庫車両を見る
        url: /auto-dealer-demo/Page/CustomerVehicles
        icon: 🚗
        section: マイページ
        roles: [customer]

      # ─── スタートガイド（スタッフ共通） ───
      - label: スタートガイド
        url: /auto-dealer-demo/Page/Welcome
        icon: 🏠
        section: ""
        roles: [operator, sales_rep, sales_manager, service_staff, ai_admin, executive]

      # ─── AI 窓口（operator / ai_admin 向け） ───
      - label: AI 窓口ダッシュボード
        url: /auto-dealer-demo/Page/AIDashboard
        icon: 💬
        section: AI 窓口
        roles: [operator, ai_admin, sales_manager, executive]
      - label: オペレーター・コンソール
        url: /auto-dealer-demo/Page/OperatorConsole
        icon: 🎧
        section: AI 窓口
        roles: [operator, ai_admin]
      - label: AI 分析レポート
        url: /auto-dealer-demo/Page/AIAnalytics
        icon: 📈
        section: AI 窓口
        roles: [ai_admin]
      - label: ナレッジベース管理
        url: /auto-dealer-demo/Page/KnowledgeBase
        icon: 📚
        section: AI 窓口
        roles: [ai_admin]

      # ─── 販売管理（sales_rep / sales_manager 向け） ───
      - label: リードパイプライン
        url: /auto-dealer-demo/Page/LeadKanban
        icon: 🔥
        section: 販売管理
        roles: [sales_rep, sales_manager, executive]
      - label: セールスリード管理
        url: /auto-dealer-demo/Page/SalesLeads
        icon: 📋
        section: 販売管理
        roles: [sales_rep, sales_manager]
      - label: 担当者パフォーマンス
        url: /auto-dealer-demo/Page/SalesRepDashboard
        icon: 🎯
        section: 販売管理
        roles: [sales_rep, sales_manager]
      - label: 車両在庫管理
        url: /auto-dealer-demo/Page/VehicleInventory
        icon: 🚗
        section: 販売管理
        roles: [sales_rep, sales_manager, service_staff]

      # ─── 顧客管理（営業・サービス共通） ───
      - label: 顧客管理
        url: /auto-dealer-demo/Page/Customers
        icon: 👥
        section: 顧客管理
        roles: [sales_rep, sales_manager, service_staff]

      # ─── 従業員管理（ai_admin / executive 向け） ───
      - label: 従業員マスタ
        url: /auto-dealer-demo/Page/Employees
        icon: 👨‍💼
        section: 従業員管理
        roles: [ai_admin, executive]

      # ─── 予約管理（service_staff 向け） ───
      - label: サービス予約
        url: /auto-dealer-demo/Page/Appointments
        icon: 📅
        section: 予約管理
        roles: [service_staff, sales_manager]
      - label: サービス依頼管理
        url: /auto-dealer-demo/Page/ServiceRequests
        icon: 🔧
        section: 予約管理
        roles: [service_staff]

      # ─── 経営レポート（executive / sales_manager 向け） ───
      - label: 経営ダッシュボード（ROI）
        url: /auto-dealer-demo/Page/ExecDashboard
        icon: 📊
        section: 経営レポート
        roles: [executive, sales_manager]

      # ─── データ管理（ai_admin / 管理職向け） ───
      - label: 会話データ
        url: /auto-dealer-demo/DynamicEntity/Index?entity=ai_conversations
        icon: 🗂️
        section: システム管理
        roles: [ai_admin, operator]
      - label: 車両マスタ
        url: /auto-dealer-demo/DynamicEntity/Index?entity=vehicles
        icon: 🏎️
        section: システム管理
        roles: [ai_admin, sales_manager]
      - label: サービス履歴データ
        url: /auto-dealer-demo/DynamicEntity/Index?entity=service_appointments
        icon: 🛠️
        section: システム管理
        roles: [ai_admin, service_staff]

settings:
  locale: ja-JP
  timezone: Asia/Tokyo

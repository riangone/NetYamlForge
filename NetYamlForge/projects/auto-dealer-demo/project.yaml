name: auto-dealer-demo
displayName: "自動車ディーラー管理システム"
version: "1.1.0"
description: "自動車ディーラーの顧客管理・車両在庫・サービス予約を統合した管理システム"

database:
  type: sqlite
  path: database/auto-dealer-demo.db

apiWriteRoles:
  - sales_manager
  - sales_rep
  - operator
  - executive
  - ai_admin

features:
  multiLanguage: true
  userAuthentication: true
  dashboard: true
  pages: true
  api: true

layout:
  dashboardTheme: workspace

  # ─── ロール別ランディングページ ───
  # ログイン後、ユーザーのロールに応じて最適なページへ自動リダイレクトします
  landingPageByRole:
    customer:      /auto-dealer-demo/Page/CustomerDashboard
    operator:      /auto-dealer-demo/Page/OperatorConsole
    sales_rep:     /auto-dealer-demo/Page/SalesRepDashboard
    sales_manager: /auto-dealer-demo/Page/ManagerDashboard
    service_staff: /auto-dealer-demo/Page/Appointments
    executive:     /auto-dealer-demo/Page/ExecDashboard

  navigation:
    showDashboard: false
    showPages: false
    showEntities: false
    entities: []
    items:
      # ─── 核心业务 (Core Business) ───
      - label: 部長ダッシュボード
        url: /auto-dealer-demo/Page/ManagerDashboard
        icon: 🏠
        section: 核心业务
        roles: [sales_manager]
      - label: リードパイプライン
        url: /auto-dealer-demo/Page/LeadKanban
        icon: 🔥
        section: 核心业务
        roles: [sales_rep, sales_manager, executive]
      - label: 顧客管理
        url: /auto-dealer-demo/Page/Customers
        icon: 👥
        section: 核心业务
        roles: [sales_rep, sales_manager, service_staff]

      # ─── AI 智能中心 (AI Intelligence) ───
      - label: AI 決定承認
        url: /auto-dealer-demo/Page/AiDecisionApproval
        icon: ✅
        section: AI 智能中心
        roles: [executive, sales_manager]
      - label: AI アシスタント
        url: /auto-dealer-demo/Page/AiAssistant
        icon: 🤖
        section: AI 智能中心
        roles: [sales_rep, sales_manager, operator, executive]
      - label: AI 統計分析
        url: /auto-dealer-demo/Page/AiDashboard
        icon: 📊
        section: AI 智能中心
        roles: [executive, sales_manager]

      # ─── 运营与服务 (Operations) ───
      - label: 担当者パフォーマンス
        url: /auto-dealer-demo/Page/SalesRepDashboard
        icon: 🎯
        section: 运营与服务
        roles: [sales_rep, sales_manager]
      - label: 車両在庫管理
        url: /auto-dealer-demo/Page/VehicleInventory
        icon: 🚗
        section: 运营与服务
        roles: [sales_rep, sales_manager, service_staff]
      - label: サービス予約
        url: /auto-dealer-demo/Page/Appointments
        icon: 📅
        section: 运营与服务
        roles: [service_staff, sales_manager]
      - label: 販売リード一覧
        url: /auto-dealer-demo/Page/SalesLeads
        icon: 📋
        section: 运营与服务
        roles: [sales_rep, sales_manager]
      - label: サービスリクエスト
        url: /auto-dealer-demo/Page/ServiceRequests
        icon: 🔧
        section: 运营与服务
        roles: [service_staff, sales_manager]
      - label: 従業員管理
        url: /auto-dealer-demo/Page/Employees
        icon: 👔
        section: 运营与服务
        roles: [ai_admin, executive]
      - label: データインポート
        url: /auto-dealer-demo/Page/DataImport
        icon: 📥
        section: 运营与服务
        roles: [ai_admin, executive, sales_manager]
      - label: 拠点管理
        url: /auto-dealer-demo/Page/Branches
        icon: 🏢
        section: 运营与服务
        roles: [ai_admin, executive]
      - label: 車両画像管理
        url: /auto-dealer-demo/Page/VehicleImages
        icon: 📷
        section: 运营与服务
        roles: [sales_rep, sales_manager, ai_admin]
      - label: 試乗管理
        url: /auto-dealer-demo/Page/TestDrives
        icon: 🚘
        section: 运营与服务
        roles: [sales_rep, sales_manager, service_staff]
      - label: 売上目標管理
        url: /auto-dealer-demo/Page/SalesQuota
        icon: 🎯
        section: 运营与服务
        roles: [sales_manager, executive]
      - label: 通知設定
        url: /auto-dealer-demo/Page/NotificationSettings
        icon: 🔔
        section: 运营与服务
        roles: [ai_admin, executive]
      - label: ローン・支払管理
        url: /auto-dealer-demo/Page/PaymentPlans
        icon: 💳
        section: 运营与服务
        roles: [sales_rep, sales_manager, executive]

      # ─── 沟通中心 (Communication) ───
      - label: オペレーターチャット
        url: /auto-dealer-demo/Page/OperatorChat
        icon: 💬
        section: 沟通中心
        roles: [operator, sales_manager, executive]
      - label: AI コミュニケーション
        url: /auto-dealer-demo/Page/AiCommunications
        icon: 📧
        section: 沟通中心
        roles: [executive, sales_manager, operator]

      # ─── 顾客入口 (Customer Portal) ───
      - label: マイページ
        url: /auto-dealer-demo/Page/CustomerDashboard
        icon: 👤
        section: 顾客入口
        roles: [customer]
      - label: AIチャット・メッセージ
        url: /auto-dealer-demo/Page/CustomerAiChat
        icon: 💬
        section: 顾客入口
        roles: [customer]
      - label: 在庫車両を見る
        url: /auto-dealer-demo/Page/CustomerVehicles
        icon: 🚗
        section: 顾客入口
        roles: [customer]
      - label: 予約・サービス確認
        url: /auto-dealer-demo/Page/CustomerAppointments
        icon: 📆
        section: 顾客入口
        roles: [customer]



settings:
  locale: ja-JP
  timezone: Asia/Tokyo

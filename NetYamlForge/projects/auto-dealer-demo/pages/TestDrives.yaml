title: 試乗管理
description: 試乗予約・実施記録・フォローアップ管理。リード転換の最重要タッチポイント
permissions:
  view:
    roles:
    - sales_rep
    - sales_manager
    - service_staff
    - ai_admin
    - executive
  create:
    roles:
    - sales_rep
    - sales_manager
    - ai_admin
  edit:
    roles:
    - sales_rep
    - sales_manager
    - ai_admin
  delete:
    roles:
    - sales_manager
    - ai_admin
sections:
- id: test_drive_kpi
  title: 試乗サマリー（今月）
  component: stat_cards
  sourceType: custom
  source: "SELECT '今月の試乗件数' AS metric_name,\n       CAST(COUNT(*) AS TEXT) AS metric_value,\n       '\U0001F698' AS metric_icon,\n       NULL AS metric_delta\nFROM test_drives\nWHERE strftime('%Y-%m', scheduled_at) = strftime('%Y-%m', 'now')\nUNION ALL\nSELECT '完了',\n       CAST(SUM(CASE WHEN status = 'completed' THEN 1 ELSE 0 END) AS TEXT),\n       '✅', NULL\nFROM test_drives\nWHERE strftime('%Y-%m', scheduled_at) = strftime('%Y-%m', 'now')\nUNION ALL\nSELECT 'キャンセル・無断不在',\n       CAST(SUM(CASE WHEN status IN ('cancelled','no_show') THEN 1 ELSE 0 END) AS TEXT),\n       '❌', NULL\nFROM test_drives\nWHERE strftime('%Y-%m', scheduled_at) = strftime('%Y-%m', 'now')\nUNION ALL\nSELECT '予定（今後7日）',\n       CAST(COUNT(*) AS TEXT),\n       '\U0001F4C5', NULL\nFROM test_drives\nWHERE status = 'scheduled'\n  AND scheduled_at >= datetime('now')\n  AND scheduled_at <= datetime('now', '+7 days')\nUNION ALL\nSELECT '平均満足度（5点満点）',\n       CAST(ROUND(AVG(feedback_score), 1) AS TEXT),\n       '⭐', NULL\n\
    FROM test_drives\nWHERE status = 'completed' AND feedback_score IS NOT NULL\n  AND strftime('%Y-%m', scheduled_at) = strftime('%Y-%m', 'now')\nUNION ALL\nSELECT '見積転換率',\n       CAST(ROUND(100.0 * SUM(CASE WHEN next_action = 'quote' THEN 1 ELSE 0 END) / MAX(COUNT(*), 1), 0) AS TEXT) || '%',\n       '\U0001F4C8', NULL\nFROM test_drives\nWHERE status = 'completed'\n  AND strftime('%Y-%m', scheduled_at) = strftime('%Y-%m', 'now')\n"
  columns:
  - metric_name
  - metric_value
  - metric_icon
  - metric_delta
  labelField: metric_name
  valueField: metric_value
  iconField: metric_icon
  deltaField: metric_delta
  pageSize: 10
  editable: false
  readOnly: true
- id: next_action_chart
  title: 試乗後アクション分布（今月）
  component: bar_chart
  sourceType: custom
  source: "SELECT CASE next_action\n         WHEN 'quote'    THEN '\U0001F4B0 見積提案'\n         WHEN 'revisit'  THEN '\U0001F504 再来店'\n         WHEN 'contract' THEN '✍️ 契約'\n         WHEN 'lost'     THEN '❌ ロスト'\n         ELSE '\U0001F4DD その他'\n       END AS label,\n       COUNT(*) AS value\nFROM test_drives\nWHERE status = 'completed'\n  AND strftime('%Y-%m', scheduled_at) = strftime('%Y-%m', 'now')\nGROUP BY next_action\nORDER BY value DESC\n"
  columns:
  - label
  - value
  xField: label
  yField: value
  color: rgba(16, 185, 129, 0.75)
  pageSize: 10
  editable: false
  readOnly: true
- id: upcoming_test_drives
  title: 📅 直近の試乗スケジュール（7日以内）
  component: table
  sourceType: custom
  source: "SELECT td.test_drive_id AS 試乗ID,\n       c.name AS 顧客名,\n       v.maker || ' ' || v.model AS 試乗車両,\n       e.name AS 担当スタッフ,\n       strftime('%m/%d %H:%M', td.scheduled_at) AS 予定日時,\n       CASE td.status\n         WHEN 'scheduled'  THEN '\U0001F4C5 予定'\n         WHEN 'completed'  THEN '✅ 完了'\n         WHEN 'cancelled'  THEN '\U0001F6AB キャンセル'\n         WHEN 'no_show'    THEN '⚠️ 無断不在'\n       END AS ステータス,\n       COALESCE(td.feedback_score || '点', '−') AS 満足度\nFROM test_drives td\nINNER JOIN customers c ON c.customer_id = td.customer_id\nINNER JOIN vehicles  v ON v.vehicle_id  = td.vehicle_id\nLEFT JOIN  employees e ON e.employee_id = td.assigned_staff_id\nWHERE td.scheduled_at >= datetime('now', '-1 day')\n  AND td.scheduled_at <= datetime('now', '+7 days')\nORDER BY td.scheduled_at ASC\n"
  columns:
  - 試乗ID
  - 顧客名
  - 試乗車両
  - 担当スタッフ
  - 予定日時
  - ステータス
  - 満足度
  pageSize: 10
  editable: false
  readOnly: true
- id: test_drive_list
  title: 試乗記録一覧
  component: data_table
  entity: test_drives
  sourceType: table
  columns:
    test_drive_id:
      label: 試乗 ID
      sortable: true
      searchable: true
    customer_id:
      label: 顧客 ID
      sortable: true
      searchable: true
    vehicle_id:
      label: 車両 ID
      sortable: true
      searchable: true
    assigned_staff_id:
      label: 担当スタッフ
      sortable: true
    scheduled_at:
      label: 予定日時
      sortable: true
    status:
      label: ステータス
      sortable: true
      renderAs: badge
      colorMap:
        scheduled: blue
        completed: green
        cancelled: gray
        no_show: red
    feedback_score:
      label: 満足度
      sortable: true
    next_action:
      label: 次アクション
      sortable: true
      renderAs: badge
      colorMap:
        quote: purple
        revisit: blue
        contract: green
        lost: red
        other: gray
  defaultSort: scheduled_at
  pageSize: 20
  searchable: true
  editable: true
  allowCreate: true
  allowEdit: true
  allowDelete: true
  permissions:
    create:
      roles:
      - sales_rep
      - sales_manager
      - ai_admin
    edit:
      roles:
      - sales_rep
      - sales_manager
      - ai_admin
    delete:
      roles:
      - sales_manager
      - ai_admin
  defaultSortDir: desc
- id: test_drive_form
  title: 試乗予約・記録入力
  component: form
  entity: test_drives
  mode: create_edit
  fields:
  - field: customer_id
    label: 顧客 ID
    type: text
    required: true
    editable: true
    placeholder: '例: C-001'
  - field: vehicle_id
    label: 車両 ID
    type: text
    required: true
    editable: true
    placeholder: '例: V-001'
  - field: lead_id
    label: リード ID（任意）
    type: text
    required: false
    editable: true
    placeholder: '例: L-001'
  - field: assigned_staff_id
    label: 担当スタッフ ID
    type: text
    required: false
    editable: true
    placeholder: '例: EMP-002'
  - field: branch_id
    label: 拠点 ID
    type: text
    required: false
    editable: true
    default: BR-001
  - field: scheduled_at
    label: 予定日時
    type: datetime
    required: true
    editable: true
  - field: status
    label: ステータス
    type: select
    options:
    - value: scheduled
      label: 予定
    - value: completed
      label: 完了
    - value: cancelled
      label: キャンセル
    - value: no_show
      label: 無断不在
    required: true
    editable: true
    default: scheduled
  - field: feedback_score
    label: 顧客満足度（1-5）
    type: number
    required: false
    editable: true
  - field: feedback_notes
    label: 顧客フィードバック
    type: textarea
    required: false
    editable: true
  - field: staff_notes
    label: スタッフメモ
    type: textarea
    required: false
    editable: true
  - field: next_action
    label: 次アクション
    type: select
    options:
    - value: quote
      label: 見積提案
    - value: revisit
      label: 再来店促進
    - value: contract
      label: 契約手続き
    - value: lost
      label: ロスト
    - value: other
      label: その他
    required: false
    editable: true
    default: revisit
  permissions:
    create:
      roles:
      - sales_rep
      - sales_manager
      - ai_admin
    edit:
      roles:
      - sales_rep
      - sales_manager
      - ai_admin
  sourceType: none

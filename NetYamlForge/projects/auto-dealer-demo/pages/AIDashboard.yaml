title: AI 窓口ダッシュボード
description: "自動車ディーラー AI 窓口システムの概要ページ - 対話状況・予約・顧客統計を表示"

sections:
  # ─────────────────────────────────────────
  # 受付状況 KPI カード
  # ─────────────────────────────────────────
  - id: kpi_summary
    title: 受付状況 KPI
    component: stat_cards
    sourceType: custom
    source: |
      SELECT 'アクティブセッション' AS metric_name,
             CAST(COUNT(*) AS TEXT) AS metric_value,
             '💬' AS metric_icon,
             NULL AS metric_delta
      FROM ai_conversations WHERE status = 'active'
      UNION ALL
      SELECT 'ホットリード', CAST(COUNT(*) AS TEXT), '🔥', NULL
      FROM sales_leads WHERE lead_score >= 80 AND status = 'new'
      UNION ALL
      SELECT 'エスカレーション（保留）', CAST(COUNT(*) AS TEXT), '⚠️', NULL
      FROM ai_handovers WHERE status = 'pending'
      UNION ALL
      SELECT '本日の予約', CAST(COUNT(*) AS TEXT), '📅', NULL
      FROM service_appointments
      WHERE date(preferred_date) = date('now')
      UNION ALL
      SELECT '顧客総数', CAST(COUNT(*) AS TEXT), '👥', NULL
      FROM customers
      UNION ALL
      SELECT '成約率',
             CAST(ROUND(
               SUM(CASE WHEN status = 'won' THEN 1.0 ELSE 0.0 END) * 100.0 /
               NULLIF(COUNT(*), 0), 1
             ) AS TEXT) || '%',
             '💰', NULL
      FROM sales_leads
    columns: [metric_name, metric_value, metric_icon, metric_delta]
    labelField: metric_name
    valueField: metric_value
    iconField: metric_icon
    deltaField: metric_delta
    pageSize: 10
    editable: false
    readOnly: true

  # ─────────────────────────────────────────
  # リード転換ファネル（棒グラフ）
  # ─────────────────────────────────────────
  - id: lead_funnel
    title: リード転換ファネル
    component: bar_chart
    sourceType: custom
    source: |
      SELECT CASE status
               WHEN 'new'       THEN '① 新規'
               WHEN 'contacted' THEN '② 接触済'
               WHEN 'qualified' THEN '③ 商談中'
               WHEN 'proposal'  THEN '④ 提案中'
               WHEN 'won'       THEN '⑤ 成約'
               WHEN 'lost'      THEN '⑥ 失注'
               ELSE status
             END AS label,
             COUNT(*) AS value
      FROM sales_leads
      GROUP BY status
      ORDER BY CASE status
        WHEN 'new'       THEN 1
        WHEN 'contacted' THEN 2
        WHEN 'qualified' THEN 3
        WHEN 'proposal'  THEN 4
        WHEN 'won'       THEN 5
        ELSE 6 END
    columns: [label, value]
    xField: label
    yField: value
    color: "rgba(16, 185, 129, 0.75)"
    pageSize: 10
    editable: false
    readOnly: true

  # ─────────────────────────────────────────
  # ホットリード TOP 5
  # ─────────────────────────────────────────
  - id: hot_leads
    title: ホットリード TOP 5
    component: table
    sourceType: custom
    source: |
      SELECT l.lead_id AS リードID,
             c.name AS 顧客名,
             l.vehicle_interest AS 興味車種,
             l.lead_score AS スコア,
             CASE l.status
               WHEN 'new'       THEN '🆕 新規'
               WHEN 'contacted' THEN '📞 接触済'
               WHEN 'qualified' THEN '💼 商談中'
               ELSE l.status
             END AS ステータス
      FROM sales_leads l
      INNER JOIN customers c ON l.customer_id = c.customer_id
      WHERE l.status = 'new'
      ORDER BY l.lead_score DESC
      LIMIT 5
    columns: [リードID, 顧客名, 興味車種, スコア, ステータス]
    pageSize: 5
    editable: false
    readOnly: true

  # ─────────────────────────────────────────
  # チャネル別対話数（直近 7 日）
  # ─────────────────────────────────────────
  - id: channel_chart
    title: チャネル別対話数（直近 7 日）
    component: doughnut_chart
    sourceType: custom
    source: |
      SELECT channel AS label, COUNT(*) AS value
      FROM ai_conversations
      WHERE date(started_at) >= date('now', '-7 days')
      GROUP BY channel
      ORDER BY value DESC
    columns: [label, value]
    xField: label
    yField: value
    pageSize: 10
    editable: false
    readOnly: true

  # ─────────────────────────────────────────
  # 予約ステータス内訳
  # ─────────────────────────────────────────
  - id: appointment_status
    title: 予約ステータス内訳
    component: bar_chart
    sourceType: custom
    source: |
      SELECT CASE status
               WHEN 'pending'     THEN '⏰ 確認待ち'
               WHEN 'confirmed'   THEN '✅ 確定'
               WHEN 'in_progress' THEN '🔧 作業中'
               WHEN 'completed'   THEN '✔ 完了'
               WHEN 'cancelled'   THEN '❌ キャンセル'
               WHEN 'no_show'     THEN '🚫 無断キャンセル'
               ELSE status
             END AS label,
             COUNT(*) AS value
      FROM service_appointments
      GROUP BY status
      ORDER BY CASE status
        WHEN 'pending'     THEN 1
        WHEN 'confirmed'   THEN 2
        WHEN 'in_progress' THEN 3
        WHEN 'completed'   THEN 4
        ELSE 5 END
    columns: [label, value]
    xField: label
    yField: value
    color: "rgba(59, 130, 246, 0.75)"
    pageSize: 10
    editable: false
    readOnly: true

  # ─────────────────────────────────────────
  # 最近の AI 対話
  # ─────────────────────────────────────────
  - id: recent_conversations
    title: 最近の AI 対話（直近 10 件）
    component: table
    sourceType: custom
    source: |
      SELECT c.conversation_id AS 対話ID,
             c.customer_id AS 顧客ID,
             c.channel AS チャネル,
             CASE c.status
               WHEN 'active'     THEN '💬 対話中'
               WHEN 'completed'  THEN '✅ 完了'
               WHEN 'escalated'  THEN '⚠️ エスカレーション'
               WHEN 'abandoned'  THEN '❌ 放棄'
               ELSE c.status
             END AS ステータス,
             c.last_intent AS 最終インテント,
             CAST(ROUND(c.last_confidence * 100, 0) AS TEXT) || '%' AS 置信度,
             c.started_at AS 開始日時
      FROM ai_conversations c
      ORDER BY c.started_at DESC
      LIMIT 10
    columns: [対話ID, 顧客ID, チャネル, ステータス, 最終インテント, 置信度, 開始日時]
    pageSize: 10
    editable: false
    readOnly: true

  # ─────────────────────────────────────────
  # 本日の予約一覧
  # ─────────────────────────────────────────
  - id: today_appointments
    title: 本日の予約
    component: table
    sourceType: custom
    source: |
      SELECT a.appointment_id AS 予約ID,
             CASE a.appointment_type
               WHEN 'oil_change'   THEN '🔧 オイル交換'
               WHEN 'inspection'   THEN '🔍 車検・点検'
               WHEN 'repair'       THEN '🛠️ 修理'
               WHEN 'test_drive'   THEN '🚗 試乗'
               WHEN 'delivery'     THEN '🎉 納車'
               WHEN 'consultation' THEN '💬 相談'
               ELSE a.appointment_type
             END AS 種別,
             substr(a.preferred_date, 12, 5) AS 時間,
             CASE a.status
               WHEN 'pending'     THEN '⏰ 確認待ち'
               WHEN 'confirmed'   THEN '✅ 確定'
               WHEN 'in_progress' THEN '🔧 作業中'
               WHEN 'completed'   THEN '✔ 完了'
               ELSE a.status
             END AS ステータス,
             a.service_menu AS メニュー,
             c.name AS 顧客名
      FROM service_appointments a
      INNER JOIN customers c ON a.customer_id = c.customer_id
      WHERE date(a.preferred_date) = date('now')
      ORDER BY a.preferred_date ASC
    columns: [予約ID, 種別, 時間, ステータス, メニュー, 顧客名]
    pageSize: 10
    editable: false
    readOnly: true

  # ─────────────────────────────────────────
  # 顧客ランク内訳
  # ─────────────────────────────────────────
  - id: customer_tier
    title: 顧客ランク別人数
    component: pie_chart
    sourceType: custom
    source: |
      SELECT CASE tier_level
               WHEN 'platinum' THEN '💎 Platinum'
               WHEN 'vip'      THEN '⭐ VIP'
               WHEN 'gold'     THEN '🥇 Gold'
               WHEN 'silver'   THEN '🥈 Silver'
               ELSE                 '🔵 Regular'
             END AS label,
             COUNT(*) AS value
      FROM customers
      GROUP BY tier_level
      ORDER BY CASE tier_level
        WHEN 'platinum' THEN 1
        WHEN 'vip'      THEN 2
        WHEN 'gold'     THEN 3
        WHEN 'silver'   THEN 4
        ELSE 5 END
    columns: [label, value]
    xField: label
    yField: value
    pageSize: 10
    editable: false
    readOnly: true

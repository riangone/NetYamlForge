title: ナレッジベース管理
description: "AI 回答品質の向上・FAQ 管理・未解決質問の分析を行う管理ページ"

sections:
  # ─────────────────────────────────────────
  # ナレッジベース KPI
  # ─────────────────────────────────────────
  - id: kb_kpi
    title: ナレッジベース概要
    component: stat_cards
    sourceType: custom
    source: |
      SELECT 'FAQ 総件数' AS metric_name,
             CAST(COUNT(*) AS TEXT) AS metric_value,
             '📚' AS metric_icon,
             NULL AS metric_delta
      FROM ai_knowledge
      UNION ALL
      SELECT 'アクティブ FAQ', CAST(COUNT(*) AS TEXT), '✅', NULL
      FROM ai_knowledge WHERE is_active = 1
      UNION ALL
      SELECT '本日の利用回数',
             CAST(COALESCE(SUM(usage_count), 0) AS TEXT),
             '🔍', NULL
      FROM ai_knowledge WHERE date(last_used_at) = date('now')
      UNION ALL
      SELECT '平均満足評価',
             CAST(ROUND(
               CAST(SUM(helpful_count) AS REAL) * 100.0 /
               NULLIF(SUM(helpful_count) + SUM(not_helpful_count), 0), 1
             ) AS TEXT) || '%',
             '👍', NULL
      FROM ai_knowledge WHERE is_active = 1
      UNION ALL
      SELECT '未解決質問（低置信度）',
             CAST(COUNT(*) AS TEXT),
             '❓', NULL
      FROM ai_conversations
      WHERE last_confidence < 0.5
        AND date(started_at) >= date('now', '-7 days')
        AND status != 'active'
      UNION ALL
      SELECT 'カテゴリ数',
             CAST(COUNT(DISTINCT category) AS TEXT),
             '🏷️', NULL
      FROM ai_knowledge WHERE is_active = 1
    columns: [metric_name, metric_value, metric_icon, metric_delta]
    labelField: metric_name
    valueField: metric_value
    iconField: metric_icon
    deltaField: metric_delta
    pageSize: 10
    editable: false
    readOnly: true

  # ─────────────────────────────────────────
  # カテゴリ別命中率（棒グラフ）
  # ─────────────────────────────────────────
  - id: category_performance
    title: カテゴリ別利用回数（直近 30 日）
    component: bar_chart
    sourceType: custom
    source: |
      SELECT CASE category
               WHEN 'faq'            THEN 'よくある質問'
               WHEN 'vehicle_info'   THEN '車両情報'
               WHEN 'service_menu'   THEN 'サービスメニュー'
               WHEN 'campaign'       THEN 'キャンペーン'
               WHEN 'business_hours' THEN '営業時間'
               ELSE category
             END AS label,
             SUM(usage_count) AS value
      FROM ai_knowledge
      WHERE is_active = 1
      GROUP BY category
      ORDER BY value DESC
    columns: [label, value]
    xField: label
    yField: value
    color: "rgba(99, 102, 241, 0.75)"
    pageSize: 10
    editable: false
    readOnly: true

  # ─────────────────────────────────────────
  # 未解決質問キュー（FAQ 追加候補）
  # ─────────────────────────────────────────
  - id: unresolved_questions
    title: 未解決質問キュー（低置信度会話 — FAQ 追加候補）
    component: table
    sourceType: custom
    source: |
      SELECT c.conversation_id AS 対話ID,
             c.customer_id AS 顧客ID,
             c.channel AS チャネル,
             c.last_intent AS 最終インテント,
             ROUND(c.last_confidence * 100, 0) || '%' AS 置信度,
             c.started_at AS 発生日時
      FROM ai_conversations c
      WHERE c.last_confidence < 0.5
        AND c.status != 'active'
        AND date(c.started_at) >= date('now', '-14 days')
      ORDER BY c.last_confidence ASC
      LIMIT 20
    columns: [対話ID, 顧客ID, チャネル, 最終インテント, 置信度, 発生日時]
    pageSize: 10
    editable: false
    readOnly: true

  # ─────────────────────────────────────────
  # FAQ 一覧（管理用テーブル）
  # ─────────────────────────────────────────
  - id: knowledge_list
    title: FAQ 一覧（全件）
    component: table
    sourceType: custom
    source: |
      SELECT knowledge_id AS ID,
             CASE category
               WHEN 'faq'            THEN '❓ FAQ'
               WHEN 'vehicle_info'   THEN '🚗 車両情報'
               WHEN 'service_menu'   THEN '🔧 サービス'
               WHEN 'campaign'       THEN '🎉 キャンペーン'
               WHEN 'business_hours' THEN '🕐 営業案内'
               ELSE category
             END AS カテゴリ,
             intent AS インテント,
             question AS 質問,
             CASE WHEN LENGTH(answer) > 50 THEN SUBSTR(answer, 1, 50) || '...' ELSE answer END AS 回答（抜粋）,
             CASE WHEN is_active = 1 THEN '✅ 有効' ELSE '⏸️ 無効' END AS 状態,
             usage_count AS 利用回数,
             CASE
               WHEN helpful_count + not_helpful_count = 0 THEN '−'
               ELSE CAST(ROUND(CAST(helpful_count AS REAL) * 100.0 / (helpful_count + not_helpful_count), 0) AS TEXT) || '%'
             END AS 満足率,
             created_by AS 作成者
      FROM ai_knowledge
      ORDER BY is_active DESC, usage_count DESC
    columns: [ID, カテゴリ, インテント, 質問, 回答（抜粋）, 状態, 利用回数, 満足率, 作成者]
    pageSize: 15
    actions:
      - label: 編集
        url: "/auto-dealer-demo/DynamicEntity/Edit?entity=ai_knowledge&id={ID}"
        class: "btn-outline-primary"

  # ─────────────────────────────────────────
  # 低品質 FAQ ランキング（改善優先度高）
  # ─────────────────────────────────────────
  - id: low_quality_faq
    title: 改善優先度の高い FAQ（満足率が低い上位 10 件）
    component: table
    sourceType: custom
    source: |
      SELECT knowledge_id AS ID,
             question AS 質問,
             usage_count AS 利用回数,
             helpful_count AS 役立ち,
             not_helpful_count AS 役立たない,
             CAST(ROUND(CAST(not_helpful_count AS REAL) * 100.0 /
               NULLIF(helpful_count + not_helpful_count, 0), 0) AS TEXT) || '%' AS 不満率
      FROM ai_knowledge
      WHERE is_active = 1
        AND (helpful_count + not_helpful_count) >= 3
      ORDER BY
        CAST(not_helpful_count AS REAL) / NULLIF(helpful_count + not_helpful_count, 0) DESC
      LIMIT 10
    columns: [ID, 質問, 利用回数, 役立ち, 役立たない, 不満率]
    pageSize: 10
    actions:
      - label: 改善
        url: "/auto-dealer-demo/DynamicEntity/Edit?entity=ai_knowledge&id={ID}"
        class: "btn-warning"

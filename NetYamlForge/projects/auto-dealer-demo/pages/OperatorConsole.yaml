title: オペレーター・コンソール
description: "有人対応が必要な対話の管理・リアルタイム対応・チーム稼働状況を一元管理するワークスペース"

sections:
  # ─────────────────────────────────────────
  # オペレーター KPI サマリー
  # ─────────────────────────────────────────
  - id: operator_kpi
    title: 本日のオペレーター状況
    component: stat_cards
    sourceType: custom
    source: |
      SELECT '待機中エスカレーション' AS metric_name,
             CAST(COUNT(*) AS TEXT) AS metric_value,
             '⏳' AS metric_icon,
             NULL AS metric_delta
      FROM ai_handovers WHERE status = 'pending'
      UNION ALL
      SELECT '対応中チャット', CAST(COUNT(*) AS TEXT), '💬', NULL
      FROM ai_handovers WHERE status IN ('assigned', 'in_progress')
      UNION ALL
      SELECT '本日解決件数', CAST(COUNT(*) AS TEXT), '✅', NULL
      FROM ai_handovers WHERE status = 'resolved' AND date(resolved_at) = date('now')
      UNION ALL
      SELECT 'SLA 超過（10分超）', CAST(COUNT(*) AS TEXT), '🔴', NULL
      FROM ai_handovers
      WHERE status = 'pending'
        AND CAST((JULIANDAY('now') - JULIANDAY(escalated_at)) * 24 * 60 AS INTEGER) >= 10
    columns: [metric_name, metric_value, metric_icon, metric_delta]
    labelField: metric_name
    valueField: metric_value
    iconField: metric_icon
    deltaField: metric_delta
    pageSize: 4
    editable: false
    readOnly: true

  # ─────────────────────────────────────────
  # 待機中キュー（優先度・SLA 超過表示付き）
  # ─────────────────────────────────────────
  - id: pending_handovers
    title: 🚨 待機中のエスカレーション（優先度順）
    component: table
    sourceType: custom
    source: |
      SELECT h.handover_id AS ID,
             h.conversation_id AS 会話ID,
             c.name AS 顧客名,
             CASE h.reason
               WHEN 'ai_unable'          THEN 'AI 解決不可'
               WHEN 'customer_request'   THEN 'お客様希望'
               WHEN 'high_value_deal'    THEN '高額商談'
               WHEN 'complaint'          THEN '苦情'
               WHEN 'negative_sentiment' THEN '感情悪化'
               WHEN 'complex_inquiry'    THEN '複雑な問い合わせ'
               WHEN 'vip_customer'       THEN 'VIP 対応'
               ELSE h.reason
             END AS 理由,
             CASE h.priority
               WHEN 'urgent' THEN '🔴 緊急'
               WHEN 'high'   THEN '🟠 高'
               WHEN 'medium' THEN '🟡 中'
               ELSE               '🟢 低'
             END AS 優先度,
             CAST(ROUND(CAST((JULIANDAY('now') - JULIANDAY(h.escalated_at)) * 24 * 60 AS INTEGER), 0) AS TEXT) || '分' AS 待機時間
      FROM ai_handovers h
      INNER JOIN ai_conversations conv ON h.conversation_id = conv.conversation_id
      INNER JOIN customers c ON conv.customer_id = c.customer_id
      WHERE h.status = 'pending'
      ORDER BY
        CASE h.priority WHEN 'urgent' THEN 1 WHEN 'high' THEN 2 WHEN 'medium' THEN 3 ELSE 4 END,
        CAST((JULIANDAY('now') - JULIANDAY(h.escalated_at)) * 24 * 60 AS INTEGER) DESC
      LIMIT 10
    columns: [ID, 顧客名, 理由, 優先度, 待機時間]
    pageSize: 10
    actions:
      - label: 対応開始
        url: "/auto-dealer-demo/DynamicEntity/DetailPage?entity=ai_handovers&id={ID}"
        class: "btn-primary btn-sm"

  # ─────────────────────────────────────────
  # 担当中の対話
  # ─────────────────────────────────────────
  - id: active_chats
    title: 💬 あなたが担当中の対話
    component: table
    sourceType: custom
    source: |
      SELECT h.handover_id AS ID,
             h.conversation_id AS 会話ID,
             c.name AS 顧客名,
             CASE h.status WHEN 'assigned' THEN '📋 担当アサイン' ELSE '💬 対応中' END AS ステータス,
             CAST(ROUND(CAST((JULIANDAY('now') - JULIANDAY(h.assigned_at)) * 24 * 60 AS INTEGER), 0) AS TEXT) || '分経過' AS 経過時間
      FROM ai_handovers h
      INNER JOIN ai_conversations conv ON h.conversation_id = conv.conversation_id
      INNER JOIN customers c ON conv.customer_id = c.customer_id
      WHERE h.status IN ('assigned', 'in_progress')
        AND h.assigned_to_user_id = @currentUser
      ORDER BY h.assigned_at DESC
      LIMIT 5
    columns: [ID, 顧客名, ステータス, 経過時間]
    pageSize: 5
    actions:
      - label: 詳細確認
        url: "/auto-dealer-demo/DynamicEntity/DetailPage?entity=ai_handovers&id={ID}"
        class: "btn-secondary btn-sm"

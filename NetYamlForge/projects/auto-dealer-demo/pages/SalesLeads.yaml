title: セールスリード管理
description: "AI が自動認識・スコアリングした高価値セールスリードの一元管理"

sections:
  # ─────────────────────────────────────────
  # リード統計 KPI カード
  # ─────────────────────────────────────────
  - id: leads_summary
    title: リード統計サマリー
    component: stat_cards
    sourceType: custom
    source: |
      SELECT '総リード数' AS metric_name,
             CAST(COUNT(*) AS TEXT) AS metric_value,
             '📊' AS metric_icon,
             NULL AS metric_delta
      FROM sales_leads
      UNION ALL
      SELECT '新規（未対応）', CAST(COUNT(*) AS TEXT), '🆕', NULL
      FROM sales_leads WHERE status = 'new'
      UNION ALL
      SELECT '今月成約', CAST(COUNT(*) AS TEXT), '🏆', NULL
      FROM sales_leads
      WHERE status = 'won'
        AND strftime('%Y-%m', updated_at) = strftime('%Y-%m', 'now')
      UNION ALL
      SELECT '平均スコア',
             CAST(ROUND(AVG(lead_score), 1) AS TEXT),
             '🎯', NULL
      FROM sales_leads
      UNION ALL
      SELECT 'ホットリード（80+）', CAST(COUNT(*) AS TEXT), '🔥', NULL
      FROM sales_leads WHERE lead_score >= 80 AND status NOT IN ('won','lost')
      UNION ALL
      SELECT '今月新規', CAST(COUNT(*) AS TEXT), '📥', NULL
      FROM sales_leads
      WHERE strftime('%Y-%m', created_at) = strftime('%Y-%m', 'now')
    columns: [metric_name, metric_value, metric_icon, metric_delta]
    labelField: metric_name
    valueField: metric_value
    iconField: metric_icon
    deltaField: metric_delta
    pageSize: 10
    editable: false
    readOnly: true

  # ─────────────────────────────────────────
  # ステージ別ファネル（棒グラフ）
  # ─────────────────────────────────────────
  - id: stage_funnel
    title: ステージ別リード件数
    component: bar_chart
    sourceType: custom
    source: |
      SELECT CASE status
               WHEN 'new'       THEN '① 新規'
               WHEN 'contacted' THEN '② 接触済'
               WHEN 'qualified' THEN '③ 商談中'
               WHEN 'proposal'  THEN '④ 提案中'
               WHEN 'won'       THEN '⑤ 成約'
               WHEN 'lost'      THEN '⑥ 失注'
               ELSE status
             END AS label,
             COUNT(*) AS value
      FROM sales_leads
      GROUP BY status
      ORDER BY CASE status
        WHEN 'new'       THEN 1
        WHEN 'contacted' THEN 2
        WHEN 'qualified' THEN 3
        WHEN 'proposal'  THEN 4
        WHEN 'won'       THEN 5
        ELSE 6 END
    columns: [label, value]
    xField: label
    yField: value
    color: "rgba(99, 102, 241, 0.75)"
    pageSize: 10
    editable: false
    readOnly: true

  # ─────────────────────────────────────────
  # ホットリード一覧（スコア 80+）
  # ─────────────────────────────────────────
  - id: hot_leads
    title: 🔥 ホットリード一覧（スコア 80 以上）
    component: table
    sourceType: custom
    source: |
      SELECT l.lead_id AS リードID,
             c.name AS 顧客名,
             CASE c.tier_level
               WHEN 'platinum' THEN '💎 Platinum'
               WHEN 'vip'      THEN '⭐ VIP'
               WHEN 'gold'     THEN '🥇 Gold'
               ELSE                 '🔵 Regular'
             END AS ランク,
             l.vehicle_interest AS 興味車種,
             CASE WHEN l.budget IS NOT NULL
                  THEN '¥' || printf('%,.0f', l.budget)
                  ELSE '−'
             END AS 予算,
             l.lead_score AS スコア,
             CASE l.status
               WHEN 'new'       THEN '🆕 新規'
               WHEN 'contacted' THEN '📞 接触済'
               WHEN 'qualified' THEN '💼 商談中'
               WHEN 'proposal'  THEN '📋 提案中'
               ELSE l.status
             END AS ステータス,
             COALESCE(l.assigned_to_user_id, '未担当') AS 担当者,
             CASE WHEN l.last_contact_at IS NOT NULL
                  THEN CAST(CAST((JULIANDAY('now') - JULIANDAY(l.last_contact_at)) AS INTEGER) AS TEXT) || '日前'
                  ELSE '未接触'
             END AS 最終接触
      FROM sales_leads l
      INNER JOIN customers c ON l.customer_id = c.customer_id
      WHERE l.lead_score >= 80 AND l.status NOT IN ('won', 'lost')
      ORDER BY l.lead_score DESC
    columns: [リードID, 顧客名, ランク, 興味車種, 予算, スコア, ステータス, 担当者, 最終接触]
    pageSize: 10
    actions:
      - label: 対応
        url: "/auto-dealer-demo/DynamicEntity/DetailPage?entity=sales_leads&id={リードID}"
        class: "btn-primary"

  # ─────────────────────────────────────────
  # セールスリード全件一覧
  # ─────────────────────────────────────────
  - id: leads_table
    title: セールスリード一覧（全件）
    component: table
    sourceType: custom
    source: |
      SELECT l.lead_id AS リードID,
             c.name AS 顧客名,
             l.vehicle_interest AS 興味車種,
             CASE WHEN l.budget IS NOT NULL
                  THEN '¥' || printf('%,.0f', l.budget)
                  ELSE '−'
             END AS 予算,
             l.lead_score AS スコア,
             CASE l.status
               WHEN 'new'       THEN '🆕 新規'
               WHEN 'contacted' THEN '📞 接触済'
               WHEN 'qualified' THEN '💼 商談中'
               WHEN 'proposal'  THEN '📋 提案中'
               WHEN 'won'       THEN '🏆 成約'
               WHEN 'lost'      THEN '❌ 失注'
               ELSE l.status
             END AS ステータス,
             COALESCE(l.assigned_to_user_id, '未担当') AS 担当者,
             l.created_at AS 登録日
      FROM sales_leads l
      INNER JOIN customers c ON l.customer_id = c.customer_id
      ORDER BY l.lead_score DESC, l.created_at DESC
    columns: [リードID, 顧客名, 興味車種, 予算, スコア, ステータス, 担当者, 登録日]
    pageSize: 15
    actions:
      - label: 編集
        url: "/auto-dealer-demo/DynamicEntity/DetailPage?entity=sales_leads&id={リードID}"
        class: "btn-outline-secondary"

  - id: ai_recommendations
    title: '🤖 AI推奨アクション（承認待ち・実行待ち）'
    visibleToRoles: [sales_rep, sales_manager, executive]
    component: table
    sourceType: custom
    source: |
      SELECT
        d.decision_id AS 決定ID,
        CASE d.decision_type
          WHEN 'lead_scoring'      THEN '🎯 スコアリング'
          WHEN 'nurturing_task'    THEN '🌱 育成タスク'
          WHEN 'quote_generation'  THEN '💰 見積生成'
          WHEN 'discount_approval' THEN '🏷️ 値引承認'
          ELSE d.decision_type
        END AS 決定種別,
        d.entity_id AS 対象ID,
        CAST(d.confidence_score AS TEXT) || '%' AS 確信度,
        CASE WHEN d.requires_human = 1 THEN '🔴 人間確認必要' ELSE '🟢 自動実行可能' END AS 実行種別,
        COALESCE(SUBSTR(d.ai_reasoning, 1, 80), '') AS AI判断理由,
        d.created_at AS 生成日時
      FROM ai_decisions d
      WHERE d.status = 'pending'
      ORDER BY d.requires_human DESC, d.confidence_score DESC
      LIMIT 15
    columns: [決定ID, 決定種別, 対象ID, 確信度, 実行種別, AI判断理由, 生成日時]
    pageSize: 15
    actions:
      - label: 承認画面へ
        url: '/auto-dealer-demo/Page/AiDecisionApproval'
        class: 'btn-warning'

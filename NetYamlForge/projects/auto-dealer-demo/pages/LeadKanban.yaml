title: リードパイプライン管理
description: "セールスリードの全ステージを可視化。停滞リードの早期発見とアクション管理"

sections:
  # ─────────────────────────────────────────
  # パイプライン KPI カード
  # ─────────────────────────────────────────
  - id: pipeline_kpi
    title: パイプライン概要
    component: stat_cards
    sourceType: custom
    source: |
      SELECT '新規リード 🆕' AS metric_name,
             CAST(COUNT(*) AS TEXT) AS metric_value,
             '📥' AS metric_icon,
             NULL AS metric_delta
      FROM sales_leads WHERE status = 'new'
      UNION ALL
      SELECT '接触済 📞', CAST(COUNT(*) AS TEXT), '📞', NULL
      FROM sales_leads WHERE status = 'contacted'
      UNION ALL
      SELECT '商談中 💼', CAST(COUNT(*) AS TEXT), '💼', NULL
      FROM sales_leads WHERE status = 'qualified'
      UNION ALL
      SELECT '提案中 📋', CAST(COUNT(*) AS TEXT), '📋', NULL
      FROM sales_leads WHERE status = 'proposal'
      UNION ALL
      SELECT '今月成約 🏆',
             CAST(COUNT(*) AS TEXT),
             '🏆', NULL
      FROM sales_leads
      WHERE status = 'won'
        AND updated_at >= date('now', '-30 days')
      UNION ALL
      SELECT '停滞リード ⚠️',
             CAST(COUNT(*) AS TEXT),
             '⚠️', NULL
      FROM sales_leads
      WHERE status NOT IN ('won', 'lost')
        AND (last_contact_at IS NULL
          OR CAST((JULIANDAY('now') - JULIANDAY(last_contact_at)) AS INTEGER) >= 7)
    columns: [metric_name, metric_value, metric_icon, metric_delta]
    labelField: metric_name
    valueField: metric_value
    iconField: metric_icon
    deltaField: metric_delta
    pageSize: 10
    editable: false
    readOnly: true

  # ─────────────────────────────────────────
  # リードファネル（ステージ別件数）
  # ─────────────────────────────────────────
  - id: pipeline_funnel
    title: リードファネル（ステージ別件数）
    component: bar_chart
    sourceType: custom
    source: |
      SELECT CASE status
               WHEN 'new'       THEN '① 新規'
               WHEN 'contacted' THEN '② 接触済'
               WHEN 'qualified' THEN '③ 商談中'
               WHEN 'proposal'  THEN '④ 提案中'
               WHEN 'won'       THEN '⑤ 成約'
               WHEN 'lost'      THEN '⑥ 失注'
               ELSE status
             END AS label,
             COUNT(*) AS value
      FROM sales_leads
      GROUP BY status
      ORDER BY CASE status
        WHEN 'new'       THEN 1
        WHEN 'contacted' THEN 2
        WHEN 'qualified' THEN 3
        WHEN 'proposal'  THEN 4
        WHEN 'won'       THEN 5
        ELSE 6 END
    columns: [label, value]
    xField: label
    yField: value
    color: "rgba(16, 185, 129, 0.75)"
    pageSize: 10
    editable: false
    readOnly: true

  # ─────────────────────────────────────────
  # AI 育成タスク（実行待ち）
  # ─────────────────────────────────────────
  - id: ai_nurturing_queue
    title: '🤖 AI 育成タスク（実行待ち TOP 5）'
    visibleToRoles: [sales_rep, sales_manager, executive]
    component: table
    sourceType: custom
    source: |
      SELECT
        c.name AS 顧客名,
        CASE t.task_type
          WHEN 'email'       THEN '✉️ メール'
          WHEN 'call'        THEN '📞 電話'
          WHEN 'appointment' THEN '📅 アポ'
          WHEN 'test_drive'  THEN '🚗 試乗'
          ELSE t.task_type
        END AS タイプ,
        COALESCE(SUBSTR(t.ai_recommendation, 1, 50), '-') AS AI提案,
        t.priority_score AS 優先度
      FROM lead_nurturing_tasks t
      LEFT JOIN customers c ON t.customer_id = c.customer_id
      WHERE t.status IN ('pending', 'in_progress')
      ORDER BY t.priority_score DESC
      LIMIT 5
    columns: [顧客名, タイプ, AI提案, 優先度]
    pageSize: 5
    editable: false
    readOnly: true

  # ─────────────────────────────────────────
  # 外部リンク
  # ─────────────────────────────────────────
  - id: navigation_links
    title: 詳細データへのアクセス
    sourceType: none
    component: markdown
    content: |
      このページではパイプラインの全体像と AI の活動を管理します。個別のリード詳細やリスト表示が必要な場合は、以下の詳細ページをご利用ください。
      

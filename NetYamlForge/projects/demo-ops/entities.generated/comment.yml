entities:
  comment:
    table: 'comments'
    key: 'comment_id'
    displayName: 'Comment'
    displayNameKey: 'entities.comment.displayName'
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order: ['post_id', 'author_name', 'author_email', 'content', 'status', 'created_at']
      filters:
        columns: 4
        order: []
    columns:
      comment_id: { type: int, identity: true, label: 'Comment Id', labelKey: 'entities.comment.columns.comment_id.label', sortable: true }
      post_id: { type: int, required: true, label: 'Post Id', labelKey: 'entities.comment.columns.post_id.label', sortable: true }
      author_name: { type: string, required: true, label: 'Author Name', labelKey: 'entities.comment.columns.author_name.label', searchable: true, sortable: true }
      author_email: { type: string, required: true, label: 'Author Email', labelKey: 'entities.comment.columns.author_email.label', searchable: true, sortable: true }
      content: { type: string, required: true, label: 'Content', labelKey: 'entities.comment.columns.content.label', searchable: true, sortable: true }
      status: { type: string, label: 'Status', labelKey: 'entities.comment.columns.status.label', searchable: true, sortable: true }
      created_at: { type: string, label: 'Created At', labelKey: 'entities.comment.columns.created_at.label', searchable: true, sortable: true }
    forms:
      post_id:
        type: int
        required: true
        label: 'Post Id'
        labelKey: 'entities.comment.forms.post_id.label'
        editable: true
        foreignKey:
          entity: post
          displayColumn: 'title'
      author_name: { type: string, required: true, label: 'Author Name', labelKey: 'entities.comment.forms.author_name.label', editable: true }
      author_email: { type: string, required: true, label: 'Author Email', labelKey: 'entities.comment.forms.author_email.label', editable: true }
      content: { type: string, required: true, label: 'Content', labelKey: 'entities.comment.forms.content.label', editable: true }
      status: { type: string, label: 'Status', labelKey: 'entities.comment.forms.status.label', editable: true }
      created_at: { type: string, label: 'Created At', labelKey: 'entities.comment.forms.created_at.label', editable: true }
    filters: {}
    links: {}

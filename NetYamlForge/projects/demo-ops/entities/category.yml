entities:
  category:
    table: 'categories'
    key: 'category_id'
    displayName: 'Category'
    displayNameKey: 'entities.category.displayName'
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order: ['name', 'slug', 'description', 'color', 'created_at']
      filters:
        columns: 4
        order: []
    columns:
      category_id: { type: int, identity: true, label: 'Category Id', labelKey: 'entities.category.columns.category_id.label', sortable: true }
      name: { type: string, required: true, label: 'Name', labelKey: 'entities.category.columns.name.label', searchable: true, sortable: true }
      slug: { type: string, required: true, label: 'Slug', labelKey: 'entities.category.columns.slug.label', searchable: true, sortable: true }
      description: { type: string, label: 'Description', labelKey: 'entities.category.columns.description.label', searchable: true, sortable: true }
      color: { type: string, label: 'Color', labelKey: 'entities.category.columns.color.label', searchable: true, sortable: true }
      created_at: { type: string, label: 'Created At', labelKey: 'entities.category.columns.created_at.label', searchable: true, sortable: true }
    forms:
      name: { type: string, required: true, label: 'Name', labelKey: 'entities.category.forms.name.label', editable: true }
      slug: { type: string, required: true, label: 'Slug', labelKey: 'entities.category.forms.slug.label', editable: true }
      description: { type: string, label: 'Description', labelKey: 'entities.category.forms.description.label', editable: true }
      color: { type: string, label: 'Color', labelKey: 'entities.category.forms.color.label', editable: true }
      created_at: { type: string, label: 'Created At', labelKey: 'entities.category.forms.created_at.label', editable: true }
    filters: {}
    links: {}

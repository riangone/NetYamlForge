entities:
  tag:
    table: 'tags'
    key: 'tag_id'
    displayName: 'Tag'
    displayNameKey: 'entities.tag.displayName'
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order: ['name', 'slug', 'color']
      filters:
        columns: 4
        order: []
    columns:
      tag_id: { type: int, identity: true, label: 'Tag Id', labelKey: 'entities.tag.columns.tag_id.label', sortable: true }
      name: { type: string, required: true, label: 'Name', labelKey: 'entities.tag.columns.name.label', searchable: true, sortable: true }
      slug: { type: string, required: true, label: 'Slug', labelKey: 'entities.tag.columns.slug.label', searchable: true, sortable: true }
      color: { type: string, label: 'Color', labelKey: 'entities.tag.columns.color.label', searchable: true, sortable: true }
    forms:
      name: { type: string, required: true, label: 'Name', labelKey: 'entities.tag.forms.name.label', editable: true }
      slug: { type: string, required: true, label: 'Slug', labelKey: 'entities.tag.forms.slug.label', editable: true }
      color: { type: string, label: 'Color', labelKey: 'entities.tag.forms.color.label', editable: true }
    filters: {}
    links: {}

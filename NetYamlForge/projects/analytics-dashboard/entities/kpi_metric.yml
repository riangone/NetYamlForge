entities:
  kpi_metric:
    table: kpi_metric
    key: id
    displayName: "核心指标"
    columns:
      id:            { type: int, identity: true, label: 编号, sortable: true }
      metric_name:   { type: string, required: true, label: 指标名称, searchable: true }
      current_value: { type: string, required: true, label: 当前值 }
      target_value:  { type: string, label: 目标值 }
      growth_rate:   { type: string, label: 同比环比增长 }
      status:        { type: string, label: 健康状态 }
      icon:          { type: string, label: 图标 }
      updated_at:    { type: datetime, required: true, label: 更新时间, sortable: true }

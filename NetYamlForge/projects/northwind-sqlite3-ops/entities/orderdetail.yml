imports: []
entities:
  orderdetail:
    table: OrderDetails
    key: OrderDetailId
    keys: []
    displayName: Order Detail
    joins:
    - type: left
      table: Orders
      alias: o
      true: OrderDetails.OrderId = o.OrderId
    - type: left
      table: Products
      alias: p
      true: OrderDetails.ProductId = p.ProductId
    forms:
      OrderId:
        type: int
        identity: false
        required: true
        label: Order
        searchable: false
        sortable: false
        editable: true
        foreignKey:
          entity: order
          displayColumn: Id
          displayColumns:
          - OrderId
          - OrderDate
          - Status
          query: 'SELECT OrderId AS Id, OrderId, OrderDate, Status

            FROM Orders

            '
          picker: false
          multiPicker: false
        hidden: false
        labelKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.forms.OrderId.label
      ProductId:
        type: int
        identity: false
        required: true
        label: Product
        searchable: false
        sortable: false
        editable: true
        foreignKey:
          entity: product
          displayColumn: Id
          displayColumns:
          - ProductName
          - UnitPrice
          - UnitsInStock
          query: 'SELECT ProductId AS Id, ProductName, UnitPrice, UnitsInStock

            FROM Products

            WHERE Discontinued = 0

            '
          picker: true
          multiPicker: false
        hidden: false
        labelKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.forms.ProductId.label
      UnitPrice:
        type: decimal
        identity: false
        required: true
        label: Unit Price
        searchable: false
        sortable: false
        editable: true
        hidden: false
        labelKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.forms.UnitPrice.label
      Quantity:
        type: int
        identity: false
        required: true
        label: Quantity
        searchable: false
        sortable: false
        editable: true
        hidden: false
        labelKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.forms.Quantity.label
      Discount:
        type: decimal
        identity: false
        required: false
        label: Discount
        searchable: false
        sortable: false
        editable: true
        hidden: false
        labelKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.forms.Discount.label
    columns:
      OrderDetailId:
        type: int
        identity: true
        required: false
        label: ID
        searchable: false
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.columns.OrderDetailId.label
      OrderId:
        type: int
        identity: false
        required: true
        label: Order
        searchable: false
        sortable: true
        editable: true
        hidden: true
        labelKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.columns.OrderId.label
      OrderSummary:
        type: string
        identity: true
        required: false
        label: Order
        searchable: true
        sortable: true
        editable: true
        expression: o.OrderId || ' / ' || o.OrderDate || ' / ' || o.Status
        hidden: false
        labelKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.columns.OrderSummary.label
      ProductId:
        type: int
        identity: false
        required: true
        label: Product
        searchable: false
        sortable: true
        editable: true
        hidden: true
        labelKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.columns.ProductId.label
      ProductName:
        type: string
        identity: true
        required: false
        label: Product
        searchable: true
        sortable: true
        editable: true
        expression: p.ProductName
        hidden: false
        labelKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.columns.ProductName.label
      UnitPrice:
        type: decimal
        identity: false
        required: true
        label: Unit Price
        searchable: false
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.columns.UnitPrice.label
      Quantity:
        type: int
        identity: false
        required: true
        label: Quantity
        searchable: false
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.columns.Quantity.label
      Discount:
        type: decimal
        identity: false
        required: false
        label: Discount
        searchable: false
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.columns.Discount.label
      LineTotal:
        type: decimal
        identity: true
        required: false
        label: Line Total
        searchable: false
        sortable: true
        editable: true
        expression: (OrderDetails.UnitPrice * OrderDetails.Quantity) * (1 - OrderDetails.Discount)
        hidden: false
        labelKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.columns.LineTotal.label
    paging:
      pageSize: 15
      mode: numbered
      enableCount: true
    layout:
      forms:
        columns: 2
        order:
        - OrderId
        - ProductId
        - UnitPrice
        - Quantity
        - Discount
      filters:
        columns: 4
        order:
        - OrderId
        - ProductId
        - Quantity
    softDelete: false
    isPublic: true
    filters:
      OrderId:
        type: entity-picker
        label: Order
        expression: OrderDetails.OrderId
        foreignKey:
          entity: order
          displayColumn: Id
          displayColumns:
          - OrderId
          - OrderDate
          - Status
          picker: false
          multiPicker: false
        labelKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.filters.OrderId.label
      ProductId:
        type: dropdown
        label: Product
        expression: OrderDetails.ProductId
        foreignKey:
          entity: product
          displayColumn: Id
          displayColumns:
          - ProductName
          - UnitPrice
          picker: false
          multiPicker: false
        labelKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.filters.ProductId.label
      Quantity:
        type: range
        label: Quantity
        expression: OrderDetails.Quantity
        labelKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.filters.Quantity.label
    links:
      order:
        label: Order
        targetEntity: order
        filter:
          OrderId: OrderId
        labelKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.links.order.label
      product:
        label: Product
        targetEntity: product
        filter:
          ProductId: ProductId
        labelKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.links.product.label
    confirmation:
      create: 受注明細を追加します。よろしいですか？
      update: 受注明細を更新します。よろしいですか？
    hooks:
      beforeCreate:
      - nw_orderdetail_stock_guard
      afterCreate:
      - audit_log
      beforeUpdate:
      - nw_orderdetail_stock_guard
      afterUpdate:
      - audit_log
    isCompositeKey: false
    displayNameKey: projects.northwind-sqlite3-ops.entities.orderdetail.entities.orderdetail.displayName

# 契約書 帳票テンプレート
# すべてのレイアウトは YAML で定義します。C# には 5 つの汎用プリミティブのみ。
name: contract
filenameTemplate: "契約書_{date:yyyyMMdd}.pdf"
pageSize: A4
orientation: portrait
margins: [36, 42, 36, 42]

theme:
  primaryColor: "1c3658"
  labelColor: "78b4cc"
  labelTextColor: "ffffff"
  subtleBackground: "f0f0f0"
  oddRowColor: "f8fcfe"
  borderColor: "b4b4b4"

dataSources:
  customer:
    query: "SELECT Id, Name, Address, Phone, Email FROM Customer WHERE Id = @CustomerId"

sections:
  # ── ドキュメントヘッダー（タイトル | 番号ボックス） ──────────────────────
  - type: row
    columnWidths: [55, 45]
    marginBottom: 2
    cells:
      - vAlign: middle
        elements:
          - type: paragraph
            text: "契　約　書"
            fontSize: 20
            color: primary
            align: center
      - vAlign: bottom
        paddingLeft: 16
        elements:
          - type: labelTable
            columnWidths: [38, 62]
            labelBackground: subtle
            labelTextColor: null
            borderWeight: 0.5
            cellPadding: 3
            fontSize: 8
            rows:
              - label: "契約番号"
                field: ContractNo
              - label: "締結日"
                field: SignedDate

  # ── 太い区切り線 ─────────────────────────────────────────────────────────
  - type: line
    lineWeight: 2
    color: primary
    marginTop: 4
    marginBottom: 6

  # ── 当事者ブロック（甲・乙） ─────────────────────────────────────────────
  - type: row
    columnWidths: [50, 50]
    marginTop: 8
    cells:
      - padding: 4
        elements:
          - type: paragraph
            field: "customer.Name"
            suffix: "　（甲）"
            fontSize: 13
            suffixFontSize: 9
      - padding: 4
        elements:
          - type: paragraph
            field: OurSignatory
            suffix: "　（乙）"
            fontSize: 13
            suffixFontSize: 9

  - type: paragraph
    template: "「{Title}」について、甲乙は以下のとおり合意し、本契約を締結する。"
    fontSize: 9
    marginTop: 6
    marginBottom: 8

  # ── 契約情報テーブル ─────────────────────────────────────────────────────
  - type: labelTable
    columnWidths: [28, 72]
    labelBackground: label
    labelTextColor: labelText
    borderWeight: 0.5
    cellPadding: 4
    fontSize: 8.5
    marginBottom: 12
    rows:
      - label: "契約種別"
        field: ContractType
      - label: "契約開始日"
        field: StartDate
      - label: "契約終了日"
        field: EndDate
      - label: "自動更新"
        field: AutoRenewLabel
      - label: "契約金額"
        field: ContractAmountLabel
      - label: "支払条件"
        field: PaymentTerms
      - label: "契約形態"
        field: ContractFormLabel
      - label: "合意管轄"
        field: JurisdictionCourt
        omitIfEmpty: true
      - label: "準拠法"
        field: GoverningLaw
        omitIfEmpty: true

  # ── 署名欄（甲・乙 2 列） ─────────────────────────────────────────────────
  - type: row
    columnWidths: [50, 50]
    cells:
      - borderWeight: 0.5
        padding: 4
        minHeight: 60
        elements:
          - type: row
            columnWidths: [35, 65]
            cells:
              - padding: 4
                vAlign: middle
                elements:
                  - type: paragraph
                    text: "甲"
                    fontSize: 8.5
                    align: center
              - padding: 4
                elements:
                  - type: paragraph
                    field: "customer.Name"
                    fontSize: 10
                  - type: paragraph
                    field: TheirSignatory
                    fontSize: 8.5
      - borderWeight: 0.5
        padding: 4
        minHeight: 60
        elements:
          - type: row
            columnWidths: [35, 65]
            cells:
              - padding: 4
                vAlign: middle
                elements:
                  - type: paragraph
                    text: "乙"
                    fontSize: 8.5
                    align: center
              - padding: 4
                elements:
                  - type: paragraph
                    field: OurSignatory
                    fontSize: 10
                  - type: paragraph
                    text: "代表取締役"
                    fontSize: 8.5

  # ── 備考欄 ───────────────────────────────────────────────────────────────
  - type: row
    columnWidths: [15, 85]
    marginTop: 8
    cells:
      - background: label
        padding: 6
        vAlign: middle
        elements:
          - type: paragraph
            text: "備　考"
            fontSize: 9
            color: labelText
            align: center
            bold: true
      - borderWeight: 0.5
        padding: 6
        minHeight: 50
        elements:
          - type: paragraph
            template: "{Remarks}"
            fontSize: 8.5

# 請求書 帳票テンプレート
# レイアウトはすべて YAML で定義します。C# コードにレイアウト値はありません。
name: invoice
filenameTemplate: "請求書_{date:yyyyMMdd}.pdf"
pageSize: A4
orientation: portrait
margins: [36, 42, 36, 42]

theme:
  primaryColor: "1c3658"       # タイトル・区切り線
  labelColor: "78b4cc"         # ラベル背景（Wondershare 水色系）
  labelTextColor: "ffffff"
  subtleBackground: "f0f0f0"   # 番号ボックス背景・集計ラベル
  oddRowColor: "f8fcfe"        # 明細奇数行
  borderColor: "b4b4b4"        # 罫線

dataSources:
  customer:
    query: "SELECT Id, Name, Address, Phone, Email FROM Customer WHERE Id = @CustomerId"
  items:
    query: "SELECT * FROM JpInvoiceItem WHERE InvoiceId = @Id ORDER BY LineNo"

sections:
  - type: documentHeader
    title: "請　求　書"
    titleFontSize: 20
    numberLabel: "請求番号"
    numberField: InvoiceNo
    dateLabel: "請求日"
    dateField: IssueDate
    layout:
      columns: [55, 45]         # タイトル | 番号ボックス
      innerColumns: [38, 62]    # 番号ボックス内: ラベル | 値
      cellPadding: 3
      fontSize: 8
      marginBottom: 2

  - type: separator
    style: thick
    layout:
      marginTop: 4
      marginBottom: 6

  - type: recipientBlock
    nameSource: "customer.Name"
    suffix: "　御中"
    nameFontSize: 13
    introText: "下記のとおり、ご請求申し上げます。"
    layout:
      marginTop: 6
      marginBottom: 6
      fontSize: 9

  - type: infoWithSender
    infoRows:
      - label: "件名"
        field: Title
      - label: "請求日"
        field: IssueDate
      - label: "支払期日"
        field: DueDate
      - label: "登録番号"
        field: RegistrationNo
        omitIfEmpty: true
    senderFields:
      - field: CompanyStamp
        fontSize: 10
      - field: PreparedBy
        prefix: "担当："
    layout:
      columns: [55, 45]         # 情報テーブル | 送付元
      innerColumns: [32, 68]    # 情報テーブル内: ラベル | 値
      cellPadding: 4
      fontSize: 8.5
      marginBottom: 8

  - type: totalBanner
    label: "合　計　金　額"
    field: Total
    bannerSuffix: "（税込）"
    layout:
      columns: [30, 40, 30]     # ラベル | 金額ボックス | 補足
      cellPadding: 4
      fontSize: 10
      accentFontSize: 11        # 金額フォントサイズ
      marginBottom: 4

  - type: separator
    style: double
    layout:
      marginTop: 4
      marginBottom: 4

  - type: itemsTable
    dataSource: items
    minRows: 8
    columns:
      - field: _rowNumber
        label: "No."
        width: 6
        align: center
      - field: ItemName
        label: "摘　要"
        width: 36
        align: left
      - field: Spec
        label: "仕様"
        width: 14
        align: left
      - field: Unit
        label: "単位"
        width: 7
        align: center
      - field: Quantity
        label: "数量"
        width: 8
        align: right
        format: quantity
      - field: UnitPrice
        label: "単価"
        width: 13
        align: right
        format: currency
      - field: Amount
        label: "金額"
        width: 16
        align: right
        format: currency
    layout:
      cellPadding: 3
      fontSize: 8.5

  - type: taxSummary
    taxRows:
      - label: "小計"
        field: Subtotal
      - label: "消費税（10%）"
        field: TaxAmount10
        omitIfZero: true
      - label: "消費税（8%）"
        field: TaxAmount8
        omitIfZero: true
      - label: "合　計　金　額"
        field: Total
        bold: true
    layout:
      columns: [55, 45]         # 空白 | 集計ボックス
      innerColumns: [55, 45]    # 集計ボックス内: ラベル | 値
      cellPadding: 3
      fontSize: 8.5
      accentFontSize: 10        # 合計行フォントサイズ

  - type: remarksBox
    label: "備　考"
    minHeight: 50
    remarksTemplate: |
      【振込先】{BankName} {BranchName} {AccountType}口座 No.{AccountNo} 名義：{AccountHolder}
      {TransferFeeNote}
      {Remarks}
    layout:
      columns: [15, 85]         # ラベル | 内容
      cellPadding: 6
      fontSize: 8.5
      accentFontSize: 9         # ラベルフォントサイズ
      marginTop: 8

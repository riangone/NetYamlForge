imports: []
entities:
  jp_contract:
    table: JpContract
    key: Id
    displayName: 契約書台帳
    softDelete: false
    isPublic: true

    forms:
      ContractNo:
        type: string
        label: ContractNo
        editable: true
        required: true
      CustomerId:
        type: int
        label: 取引先 ID
        editable: true
        required: true
        foreignKey:
          entity: customer
          displayColumn: Name
          picker: false
      Title:
        type: string
        label: Title
        editable: true
        required: true
      StartDate:
        type: date
        label: StartDate
        editable: true
      EndDate:
        type: date
        label: EndDate
        editable: true
      Amount:
        type: decimal
        label: 金額
        editable: true
        precision: 2
      Status:
        type: string
        label: ステータス
        editable: true
        required: true
        options: [draft, sent, accepted, rejected, expired]
      Notes:
        type: string
        label: Notes
        editable: true

    columns:
      Id:
        type: int
        label: ID
        sortable: true
        identity: true
        hidden: true
      ContractNo:
        type: string
        label: ContractNo
      CustomerId:
        type: int
        label: 取引先 ID
      Title:
        type: string
        label: Title
      StartDate:
        type: date
        label: StartDate
      EndDate:
        type: date
        label: EndDate
      Amount:
        type: decimal
        label: 金額
      Status:
        type: string
        label: ステータス
      Notes:
        type: string
        label: Notes
      CreatedAt:
        type: datetime
        label: 作成日
        sortable: true
      UpdatedAt:
        type: datetime
        label: 更新日
        sortable: true

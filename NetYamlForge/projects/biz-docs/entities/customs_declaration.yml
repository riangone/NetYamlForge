imports: []
entities:
  customs_declaration:
    table: CustomsDeclaration
    key: Id
    displayName: 報関単
    softDelete: false
    isPublic: true

    forms:
      DeclarationNo:
        type: string
        label: DeclarationNo
        editable: true
        required: true
      CustomerId:
        type: int
        label: 取引先 ID
        editable: true
        required: true
        foreignKey:
          entity: customer
          displayColumn: Name
          picker: false
      InvoiceId:
        type: int
        label: 請求書 ID
        editable: true
        foreignKey:
          entity: invoice
          displayColumn: InvoiceNo
          picker: false
      IssueDate:
        type: date
        label: 発行日
        editable: true
        required: true
      ExportDate:
        type: date
        label: ExportDate
        editable: true
      Currency:
        type: string
        label: 通貨
        editable: true
        required: true
        options: [USD, EUR, CNY, JPY]
      Incoterms:
        type: string
        label: Incoterms
        editable: true
      CountryOfOrigin:
        type: string
        label: CountryOfOrigin
        editable: true
      PortOfLoading:
        type: string
        label: PortOfLoading
        editable: true
      PortOfDischarge:
        type: string
        label: PortOfDischarge
        editable: true
      TotalValue:
        type: decimal
        label: TotalValue
        editable: true
        required: true
      GrossWeight:
        type: decimal
        label: GrossWeight
        editable: true
      NetWeight:
        type: decimal
        label: NetWeight
        editable: true
      Status:
        type: string
        label: ステータス
        editable: true
        required: true
        options: [draft, sent, accepted, rejected, expired]
      Notes:
        type: string
        label: Notes
        editable: true

    columns:
      Id:
        type: int
        label: ID
        sortable: true
        identity: true
        hidden: true
      DeclarationNo:
        type: string
        label: DeclarationNo
      CustomerId:
        type: int
        label: 取引先 ID
      InvoiceId:
        type: int
        label: 請求書 ID
      IssueDate:
        type: date
        label: 発行日
      ExportDate:
        type: date
        label: ExportDate
      Currency:
        type: string
        label: 通貨
      Incoterms:
        type: string
        label: Incoterms
      CountryOfOrigin:
        type: string
        label: CountryOfOrigin
      PortOfLoading:
        type: string
        label: PortOfLoading
      PortOfDischarge:
        type: string
        label: PortOfDischarge
      TotalValue:
        type: decimal
        label: TotalValue
      GrossWeight:
        type: decimal
        label: GrossWeight
      NetWeight:
        type: decimal
        label: NetWeight
      Status:
        type: string
        label: ステータス
      Notes:
        type: string
        label: Notes
      CreatedAt:
        type: datetime
        label: 作成日
        sortable: true
      UpdatedAt:
        type: datetime
        label: 更新日
        sortable: true

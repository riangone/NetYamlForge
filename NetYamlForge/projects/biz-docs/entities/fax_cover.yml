# ファックス表紙
# FAX 送付状

imports: []
entities:
  fax_cover:
    table: FaxCover
    key: Id
    displayName: ファックス表紙
    softDelete: false
    isPublic: true
    pdfTemplate: others/fax-cover

    forms:
      FaxNo:
        type: string
        label: FAX 番号
        editable: true
        required: true
      SenderName:
        type: string
        label: 送信者名
        editable: true
        required: true
      SenderCompany:
        type: string
        label: 送信者会社
        editable: true
      SenderPhone:
        type: string
        label: 送信者電話
        editable: true
      SenderFax:
        type: string
        label: 送信者 FAX
        editable: true
      RecipientName:
        type: string
        label: 受信者名
        editable: true
        required: true
      RecipientCompany:
        type: string
        label: 受信者会社
        editable: true
      RecipientFax:
        type: string
        label: 受信者 FAX
        editable: true
      SendDate:
        type: datetime
        label: 送信日
        editable: true
        required: true
      TotalPages:
        type: int
        label: 総ページ数
        editable: true
      Subject:
        type: string
        label: 件名
        editable: true
      Message:
        type: string
        label: メッセージ
        editable: true
      Notes:
        type: string
        label: 備考
        editable: true

    columns:
      Id:
        type: int
        label: ID
        identity: true
        hidden: true
      FaxNo:
        type: string
        label: FAX 番号
        sortable: true
        searchable: true
      SenderName:
        type: string
        label: 送信者名
        sortable: true
      SenderCompany:
        type: string
        label: 送信者会社
        sortable: true
      SenderPhone:
        type: string
        label: 送信者電話
        sortable: true
      SenderFax:
        type: string
        label: 送信者 FAX
        sortable: true
      RecipientName:
        type: string
        label: 受信者名
        sortable: true
      RecipientCompany:
        type: string
        label: 受信者会社
        sortable: true
      RecipientFax:
        type: string
        label: 受信者 FAX
        sortable: true
      SendDate:
        type: datetime
        label: 送信日
        sortable: true
      TotalPages:
        type: int
        label: 総ページ数
        sortable: true
      Subject:
        type: string
        label: 件名
        sortable: true
      Message:
        type: string
        label: メッセージ
        sortable: true
      Notes:
        type: string
        label: 備考
        sortable: true
      CreatedAt:
        type: datetime
        label: 作成日
        sortable: true
      UpdatedAt:
        type: datetime
        label: 更新日
        sortable: true

    paging:
      pageSize: 15
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 2

    exports:
      fax_cover_pdf:
        label: "ファックス表紙 PDF"
        format: pdf
        filename: "fax_cover_{date:yyyyMMdd}.pdf"
        columns:
          - FaxNo
          - SenderName
          - SenderCompany
          - SenderPhone
          - SenderFax
          - RecipientName
          - RecipientCompany
          - RecipientFax
        pdf:
          title: "ファックス表紙"
          pageSize: A4
          orientation: portrait
          headerColor: "#1c3658"
          oddRowColor: "#f5f5f5"
          showPageNumbers: true
          showGeneratedAt: true

      fax_cover_csv:
        label: "ファックス表紙 CSV"
        format: csv
        filename: "fax_covers_{date:yyyyMMdd}.csv"
        columns:
          - FaxNo
          - SenderName
          - SenderCompany
          - SenderPhone
          - SenderFax
          - RecipientName
          - RecipientCompany
          - RecipientFax

# 報価単
# 貿易用報価単

imports: []
entities:
  quotation:
    table: Quotation
    key: Id
    displayName: 報価単
    softDelete: false
    isPublic: true
    pdfTemplate: orders/purchase-order4

    hooks:
      beforeCreate:
        - validate_quotation_status
        - validate_tax_rate
        - validate_amount_positive
        - validate_currency
      beforeUpdate:
        - validate_quotation_status
        - validate_tax_rate
        - validate_amount_positive
        - validate_currency

    joins:
      - type: left
        table: Customer
        alias: cu
        on: Quotation.CustomerId = cu.Id

    forms:
      QuoteNo:
        type: string
        label: 見積番号
        editable: true
        required: true
      CustomerId:
        type: int
        label: 取引先 ID
        editable: true
        required: true
        foreignKey:
          entity: customer
          displayColumn: Name
          picker: false
      IssueDate:
        type: date
        label: 発行日
        editable: true
        required: true
      ExpiryDate:
        type: date
        label: 有効期限
        editable: true
      Currency:
        type: string
        label: 通貨
        editable: true
        required: true
        options: [USD, EUR, CNY, JPY]
      Subtotal:
        type: decimal
        label: 小計
        editable: true
        precision: 2
      TaxRate:
        type: decimal
        label: 税率 (%)
        editable: true
        precision: 2
      TaxAmount:
        type: decimal
        label: 税額
        editable: true
        precision: 2
      Total:
        type: decimal
        label: 合計
        editable: true
        required: true
        precision: 2
      Status:
        type: string
        label: ステータス
        editable: true
        required: true
        options: [draft, sent, accepted, rejected, expired, issued, paid, overdue, cancelled, cleared, delivered, received, active, inactive, completed, terminated, submitted, approved]
      PaymentTerms:
        type: string
        label: 支払条件
        editable: true
      DeliveryTerms:
        type: string
        label: 納期条件
        editable: true
      Notes:
        type: string
        label: 備考
        editable: true

    columns:
      Id:
        type: int
        label: ID
        identity: true
        hidden: true
      QuoteNo:
        type: string
        label: 見積番号
        sortable: true
        searchable: true
      CustomerId:
        type: int
        label: 取引先 ID
        sortable: true
      IssueDate:
        type: date
        label: 発行日
        sortable: true
      ExpiryDate:
        type: date
        label: 有効期限
        sortable: true
      Currency:
        type: string
        label: 通貨
        sortable: true
      Subtotal:
        type: decimal
        label: 小計
        sortable: true
      TaxRate:
        type: decimal
        label: 税率 (%)
        sortable: true
      TaxAmount:
        type: decimal
        label: 税額
        sortable: true
      Total:
        type: decimal
        label: 合計
        sortable: true
      Status:
        type: string
        label: ステータス
        sortable: true
      PaymentTerms:
        type: string
        label: 支払条件
        sortable: true
      DeliveryTerms:
        type: string
        label: 納期条件
        sortable: true
      Notes:
        type: string
        label: 備考
        sortable: true
      CreatedAt:
        type: datetime
        label: 作成日
        sortable: true
      UpdatedAt:
        type: datetime
        label: 更新日
        sortable: true

    filters:
      Status:
        type: toggle-group
        label: ステータス
      Currency:
        type: dropdown
        label: 通貨
        options: [USD, EUR, CNY, JPY]
      CustomerId:
        type: dropdown
        label: 取引先
        foreignKey:
          entity: customer
          displayColumn: Name

    paging:
      pageSize: 15
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 2

    exports:
      quotation_pdf:
        label: "報価単 PDF"
        format: pdf
        filename: "quotation_{date:yyyyMMdd}.pdf"
        columns:
          - QuoteNo
          - CustomerId
          - IssueDate
          - ExpiryDate
          - Currency
          - Subtotal
          - TaxRate
          - TaxAmount
        pdf:
          title: "報価単"
          pageSize: A4
          orientation: portrait
          headerColor: "#1c3658"
          oddRowColor: "#f5f5f5"
          showPageNumbers: true
          showGeneratedAt: true

      quotation_csv:
        label: "報価単 CSV"
        format: csv
        filename: "quotations_{date:yyyyMMdd}.csv"
        columns:
          - QuoteNo
          - CustomerId
          - IssueDate
          - ExpiryDate
          - Currency
          - Subtotal
          - TaxRate
          - TaxAmount

imports: []
entities:
  quotation:
    table: Quotation
    key: Id
    displayName: 報価単
    softDelete: false
    isPublic: true

    forms:
      QuoteNo:
        type: string
        label: QuoteNo
        editable: true
        required: true
      CustomerId:
        type: int
        label: 取引先 ID
        editable: true
        required: true
        foreignKey:
          entity: customer
          displayColumn: Name
          picker: false
      IssueDate:
        type: date
        label: 発行日
        editable: true
        required: true
      ExpiryDate:
        type: date
        label: ExpiryDate
        editable: true
      Currency:
        type: string
        label: 通貨
        editable: true
        required: true
        options: [USD, EUR, CNY, JPY]
      Subtotal:
        type: decimal
        label: 小計
        editable: true
        precision: 2
      TaxRate:
        type: decimal
        label: 税率 (%)
        editable: true
        precision: 2
      TaxAmount:
        type: decimal
        label: 税額
        editable: true
        precision: 2
      Total:
        type: decimal
        label: 合計
        editable: true
        required: true
        precision: 2
      Status:
        type: string
        label: ステータス
        editable: true
        required: true
        options: [draft, sent, accepted, rejected, expired]
      PaymentTerms:
        type: string
        label: PaymentTerms
        editable: true
      DeliveryTerms:
        type: string
        label: DeliveryTerms
        editable: true
      Notes:
        type: string
        label: Notes
        editable: true

    columns:
      Id:
        type: int
        label: ID
        sortable: true
        identity: true
        hidden: true
      QuoteNo:
        type: string
        label: QuoteNo
      CustomerId:
        type: int
        label: 取引先 ID
      IssueDate:
        type: date
        label: 発行日
      ExpiryDate:
        type: date
        label: ExpiryDate
      Currency:
        type: string
        label: 通貨
      Subtotal:
        type: decimal
        label: 小計
      TaxRate:
        type: decimal
        label: 税率 (%)
      TaxAmount:
        type: decimal
        label: 税額
      Total:
        type: decimal
        label: 合計
      Status:
        type: string
        label: ステータス
      PaymentTerms:
        type: string
        label: PaymentTerms
      DeliveryTerms:
        type: string
        label: DeliveryTerms
      Notes:
        type: string
        label: Notes
      CreatedAt:
        type: datetime
        label: 作成日
        sortable: true
      UpdatedAt:
        type: datetime
        label: 更新日
        sortable: true

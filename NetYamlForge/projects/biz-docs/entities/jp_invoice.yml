# 請求書
# 日本国内用請求書

imports: []
entities:
  jp_invoice:
    table: JpInvoice
    key: Id
    displayName: 請求書
    softDelete: false
    isPublic: true
    pdfTemplate: invoices/invoice-standard

    hooks:
      beforeCreate:
        - validate_jp_invoice_status
        - validate_tax_rate
        - validate_amount_positive
      beforeUpdate:
        - validate_jp_invoice_status
        - validate_tax_rate
        - validate_amount_positive

    joins:
      - type: left
        table: Customer
        alias: cu
        on: JpInvoice.CustomerId = cu.Id

    forms:
      InvoiceNo:
        type: string
        label: 請求書番号
        editable: true
        required: true
      CustomerId:
        type: int
        label: 取引先 ID
        editable: true
        required: true
        foreignKey:
          entity: customer
          displayColumn: Name
          picker: false
      IssueDate:
        type: date
        label: 発行日
        editable: true
        required: true
      DueDate:
        type: date
        label: 支払期日
        editable: true
        required: true
      Subtotal:
        type: decimal
        label: 小計
        editable: true
        precision: 2
      TaxRate:
        type: decimal
        label: 税率 (%)
        editable: true
        precision: 2
      TaxAmount:
        type: decimal
        label: 税額
        editable: true
        precision: 2
      Total:
        type: decimal
        label: 合計
        editable: true
        required: true
        precision: 2
      PaidAmount:
        type: decimal
        label: 入金済
        editable: true
        precision: 2
      Status:
        type: string
        label: ステータス
        editable: true
        required: true
        options: [draft, sent, accepted, rejected, expired, issued, paid, overdue, cancelled, cleared, delivered, received, active, inactive, completed, terminated, submitted, approved]
      Notes:
        type: string
        label: 備考
        editable: true

    columns:
      Id:
        type: int
        label: ID
        identity: true
        hidden: true
      Title:
        type: string
        label: 件名
        sortable: true
        searchable: true
      InvoiceNo:
        type: string
        label: 請求書番号
        sortable: true
        searchable: true
      CustomerId:
        type: int
        label: 取引先 ID
        sortable: true
      IssueDate:
        type: date
        label: 発行日
        sortable: true
      DueDate:
        type: date
        label: 支払期日
        sortable: true
      Subtotal:
        type: decimal
        label: 小計
        sortable: true
      TaxRate:
        type: decimal
        label: 税率 (%)
        sortable: true
      TaxAmount:
        type: decimal
        label: 税額
        sortable: true
      Total:
        type: decimal
        label: 合計
        sortable: true
      PaidAmount:
        type: decimal
        label: 入金済
        sortable: true
      Status:
        type: string
        label: ステータス
        sortable: true
      Notes:
        type: string
        label: 備考
        sortable: true
      CreatedAt:
        type: datetime
        label: 作成日
        sortable: true
      UpdatedAt:
        type: datetime
        label: 更新日
        sortable: true

    filters:
      Status:
        type: toggle-group
        label: ステータス
      CustomerId:
        type: dropdown
        label: 取引先
        foreignKey:
          entity: customer
          displayColumn: Name

    paging:
      pageSize: 15
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 2

    exports:
      jp_invoice_pdf:
        label: "請求書 PDF"
        format: pdf
        filename: "jp_invoice_{date:yyyyMMdd}.pdf"
        columns:
          - InvoiceNo
          - CustomerId
          - IssueDate
          - DueDate
          - Subtotal
          - TaxRate
          - TaxAmount
          - Total
        pdf:
          title: "請求書"
          pageSize: A4
          orientation: portrait
          headerColor: "#1c3658"
          oddRowColor: "#f5f5f5"
          showPageNumbers: true
          showGeneratedAt: true

      jp_invoice_csv:
        label: "請求書 CSV"
        format: csv
        filename: "jp_invoices_{date:yyyyMMdd}.csv"
        columns:
          - InvoiceNo
          - CustomerId
          - IssueDate
          - DueDate
          - Subtotal
          - TaxRate
          - TaxAmount
          - Total

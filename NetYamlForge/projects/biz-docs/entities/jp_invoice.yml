imports: []
entities:
  jp_invoice:
    table: JpInvoice
    key: Id
    displayName: 請求書
    softDelete: false
    isPublic: true
    jpDocument: invoice

    joins:
      - type: left
        table: Customer
        alias: cu
        on: JpInvoice.CustomerId = cu.Id

    forms:
      InvoiceNo:
        type: string
        required: true
        label: 請求書番号
        editable: true
      CustomerId:
        type: int
        required: true
        label: 取引先
        editable: true
        foreignKey:
          entity: customer
          displayColumn: Name
          picker: false
      Title:
        type: string
        required: true
        label: 件名
        editable: true
      IssueDate:
        type: date
        required: true
        label: 請求日
        editable: true
      DueDate:
        type: date
        required: true
        label: 支払期日
        editable: true
      RegistrationNo:
        type: string
        label: 登録番号（T番号）
        editable: true
        placeholder: "T1234567890123"
      Subtotal10:
        type: decimal
        label: 10%対象小計
        editable: true
        precision: 0
      TaxAmount10:
        type: decimal
        label: 消費税額(10%)
        editable: true
        precision: 0
      Subtotal8:
        type: decimal
        label: 8%対象小計（軽減）
        editable: true
        precision: 0
      TaxAmount8:
        type: decimal
        label: 消費税額(8%)
        editable: true
        precision: 0
      Subtotal:
        type: decimal
        label: 小計（税抜合計）
        editable: true
        precision: 0
      TaxAmount:
        type: decimal
        label: 消費税合計
        editable: true
        precision: 0
      Total:
        type: decimal
        required: true
        label: 請求金額（税込）
        editable: true
        precision: 0
      BankName:
        type: string
        label: 銀行名
        editable: true
      BranchName:
        type: string
        label: 支店名
        editable: true
      AccountType:
        type: string
        label: 口座種別
        editable: true
        options: [普通, 当座]
      AccountNo:
        type: string
        label: 口座番号
        editable: true
      AccountHolder:
        type: string
        label: 口座名義
        editable: true
      TransferFeeNote:
        type: string
        label: 振込手数料注記
        editable: true
      CompanyStamp:
        type: string
        label: 社印（会社名）
        editable: true
      Status:
        type: string
        required: true
        label: ステータス
        editable: true
        options: [draft, issued, paid, overdue, cancelled]
      PreparedBy:
        type: string
        label: 担当者
        editable: true
      Remarks:
        type: textarea
        label: 備考
        editable: true

    columns:
      Id:
        type: int
        identity: true
        label: ID
        sortable: true
      InvoiceNo:
        type: string
        label: 請求書番号
        searchable: true
        sortable: true
      CustomerName:
        type: string
        label: 取引先
        expression: cu.Name
        searchable: true
        sortable: true
      CustomerId:
        type: int
        label: CustomerId
        hidden: true
      Title:
        type: string
        label: 件名
        searchable: true
      IssueDate:
        type: date
        label: 請求日
        sortable: true
      DueDate:
        type: date
        label: 支払期日
        sortable: true
      Total:
        type: decimal
        label: 請求金額
        sortable: true
        precision: 0
      Status:
        type: string
        label: ステータス
        sortable: true
      PreparedBy:
        type: string
        label: 担当者

    filters:
      Status:
        type: toggle-group
        label: ステータス
        optionLabels:
          draft:     "📝 下書き"
          issued:    "📤 発行済"
          paid:      "✅ 入金済"
          overdue:   "⚠️ 期限超過"
          cancelled: "❌ 取消"
      CustomerId:
        type: dropdown
        label: 取引先
        foreignKey:
          entity: customer
          displayColumn: Name

    paging:
      pageSize: 15
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 2
        order:
          - InvoiceNo
          - CustomerId
          - Title
          - IssueDate
          - DueDate
          - Status
          - PreparedBy
          - RegistrationNo
          - Subtotal10
          - TaxAmount10
          - Subtotal8
          - TaxAmount8
          - Subtotal
          - TaxAmount
          - Total
          - BankName
          - BranchName
          - AccountType
          - AccountNo
          - AccountHolder
          - TransferFeeNote
          - CompanyStamp
          - Remarks

    exports:
      # 請求書 PDF（日本標準様式・青緑）
      invoice_pdf:
        label: "請求書 PDF"
        format: pdf
        filename: "請求書_{date:yyyyMMdd}.pdf"
        columns:
          - InvoiceNo
          - CustomerName
          - Title
          - IssueDate
          - DueDate
          - Total
          - Status
          - BankName
          - AccountNo
        pdf:
          title: "請求書"
          pageSize: A4
          orientation: portrait
          headerColor: "#0F4C75"
          oddRowColor: "#E8F4FD"
          showPageNumbers: true
          showGeneratedAt: true
          columns:
            - key: InvoiceNo
              width: 18
            - key: CustomerName
              width: 20
            - key: Title
              width: 18
            - key: RegistrationNo
              width: 18
            - key: IssueDate
              width: 12
              align: center
            - key: DueDate
              width: 12
              align: center
            - key: Total
              width: 14
              align: right
            - key: TaxAmount10
              width: 14
              align: right

      # 未回収請求書 PDF（入金催促用・赤）
      overdue_invoice_pdf:
        label: "未回収請求書 PDF"
        format: pdf
        filename: "未回収請求書_{date:yyyyMMdd}.pdf"
        sqlFile: exports/sql/jp_overdue_invoices.sql
        pdf:
          title: "未回収請求書一覧"
          pageSize: A4
          orientation: landscape
          headerColor: "#9B1C1C"
          oddRowColor: "#FEF2F2"
          showPageNumbers: true
          showGeneratedAt: true
          columns:
            - key: InvoiceNo
              width: 18
            - key: CustomerName
              width: 24
            - key: Title
              width: 20
            - key: DueDate
              width: 13
              align: center
            - key: Total
              width: 14
              align: right
            - key: OverdueDays
              width: 12
              align: right
            - key: BankName
              width: 16
            - key: AccountNo
              width: 13

      invoice_csv:
        label: "請求書 CSV"
        format: csv
        filename: "請求書_{date:yyyyMMdd}.csv"

imports: []
entities:
  jp_invoice:
    table: JpInvoice
    key: Id
    displayName: 請求書
    softDelete: false
    isPublic: true

    forms:
      InvoiceNo:
        type: string
        label: InvoiceNo
        editable: true
        required: true
      CustomerId:
        type: int
        label: 取引先 ID
        editable: true
        required: true
        foreignKey:
          entity: customer
          displayColumn: Name
          picker: false
      IssueDate:
        type: date
        label: 発行日
        editable: true
        required: true
      DueDate:
        type: date
        label: 支払期日
        editable: true
        required: true
      Subtotal:
        type: decimal
        label: 小計
        editable: true
        precision: 2
      TaxRate:
        type: decimal
        label: 税率 (%)
        editable: true
        precision: 2
      TaxAmount:
        type: decimal
        label: 税額
        editable: true
        precision: 2
      Total:
        type: decimal
        label: 合計
        editable: true
        required: true
        precision: 2
      PaidAmount:
        type: decimal
        label: 入金済
        editable: true
        precision: 2
      Status:
        type: string
        label: ステータス
        editable: true
        required: true
        options: [draft, sent, accepted, rejected, expired]
      Notes:
        type: string
        label: Notes
        editable: true

    columns:
      Id:
        type: int
        label: ID
        sortable: true
        identity: true
        hidden: true
      InvoiceNo:
        type: string
        label: InvoiceNo
      CustomerId:
        type: int
        label: 取引先 ID
      IssueDate:
        type: date
        label: 発行日
      DueDate:
        type: date
        label: 支払期日
      Subtotal:
        type: decimal
        label: 小計
      TaxRate:
        type: decimal
        label: 税率 (%)
      TaxAmount:
        type: decimal
        label: 税額
      Total:
        type: decimal
        label: 合計
      PaidAmount:
        type: decimal
        label: 入金済
      Status:
        type: string
        label: ステータス
      Notes:
        type: string
        label: Notes
      CreatedAt:
        type: datetime
        label: 作成日
        sortable: true
      UpdatedAt:
        type: datetime
        label: 更新日
        sortable: true

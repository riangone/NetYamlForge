imports: []
entities:
  meeting:
    table: Meeting
    key: Id
    displayName: 議事録
    softDelete: false
    isPublic: true
    pdfTemplate: others/minutes-03

    forms:
      Title:
        type: string
        required: true
        label: 会議名
        editable: true
      MeetingDate:
        type: datetime
        required: true
        label: 開催日時
        editable: true
      Location:
        type: string
        label: 開催場所
        editable: true
      Chairperson:
        type: string
        label: 議長
        editable: true
      Recorder:
        type: string
        label: 書記
        editable: true
      Decisions:
        type: textarea
        label: 決定事項
        editable: true
      NextMeetingDate:
        type: datetime
        label: 次回会議日時
        editable: true
      NextMeetingLocation:
        type: string
        label: 次回会議場所
        editable: true
      NextMeetingAgenda:
        type: string
        label: 次回議題（予定）
        editable: true
      Status:
        type: string
        required: true
        label: ステータス
        editable: true
        options: [draft, finalized, cancelled]
      Remarks:
        type: textarea
        label: 備考
        editable: true

    columns:
      Id:
        type: int
        identity: true
        label: ID
        sortable: true
      Title:
        type: string
        label: 会議名
        searchable: true
        sortable: true
      MeetingDate:
        type: string
        label: 開催日時
        sortable: true
      Location:
        type: string
        label: 開催場所
      Chairperson:
        type: string
        label: 議長
      Status:
        type: string
        label: ステータス
        sortable: true

    filters:
      Status:
        type: toggle-group
        label: ステータス
        optionLabels:
          draft:     "📝 下書き"
          finalized: "✅ 確定"
          cancelled: "❌ 中止"

    paging:
      pageSize: 15
      mode: numbered
      enableCount: true

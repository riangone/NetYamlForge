imports: []
entities:
  invoice:
    table: Invoice
    key: Id
    displayName: 請款書
    softDelete: false
    isPublic: true

    joins:
      - type: left
        table: Customer
        alias: cu
        on: Invoice.CustomerId = cu.Id
      - type: left
        table: Quotation
        alias: q
        on: Invoice.QuotationId = q.Id

    forms:
      InvoiceNo:
        type: string
        required: true
        label: 請求書番号
        editable: true
      CustomerId:
        type: int
        required: true
        label: 取引先
        editable: true
        foreignKey:
          entity: customer
          displayColumn: Name
          picker: false
      QuotationId:
        type: int
        label: 見積番号
        editable: true
        foreignKey:
          entity: quotation
          displayColumn: QuoteNo
          picker: false
      IssueDate:
        type: date
        required: true
        label: 発行日
        editable: true
      DueDate:
        type: date
        required: true
        label: 支払期日
        editable: true
      Currency:
        type: string
        required: true
        label: 通貨
        editable: true
        options: [USD, EUR, CNY, JPY]
      Subtotal:
        type: decimal
        label: 小計
        editable: true
        precision: 2
      TaxRate:
        type: decimal
        label: 税率(%)
        editable: true
        precision: 2
      TaxAmount:
        type: decimal
        label: 税額
        editable: true
        precision: 2
      Total:
        type: decimal
        required: true
        label: 請求金額
        editable: true
        precision: 2
      PaidAmount:
        type: decimal
        label: 入金済額
        editable: true
        precision: 2
      Status:
        type: string
        required: true
        label: ステータス
        editable: true
        options: [draft, issued, paid, overdue, cancelled]
      BankName:
        type: string
        label: 銀行名
        editable: true
      BankAccount:
        type: string
        label: 口座番号
        editable: true
      SwiftCode:
        type: string
        label: SWIFT コード
        editable: true
      PaymentTerms:
        type: string
        label: 支払条件
        editable: true
      Notes:
        type: textarea
        label: 備考
        editable: true

    columns:
      Id:
        type: int
        identity: true
        label: ID
        sortable: true
      InvoiceNo:
        type: string
        label: 請求書番号
        searchable: true
        sortable: true
      CustomerId:
        type: int
        label: Customer ID
        hidden: true
      CustomerName:
        type: string
        label: 取引先
        expression: cu.Name
        searchable: true
        sortable: true
      QuoteNo:
        type: string
        label: 見積番号
        expression: q.QuoteNo
      IssueDate:
        type: date
        label: 発行日
        sortable: true
      DueDate:
        type: date
        label: 支払期日
        sortable: true
      Currency:
        type: string
        label: 通貨
        sortable: true
      Total:
        type: decimal
        label: 請求金額
        sortable: true
        precision: 2
      PaidAmount:
        type: decimal
        label: 入金済額
        sortable: true
        precision: 2
      Status:
        type: string
        label: ステータス
        sortable: true
      BankName:
        type: string
        label: 銀行名

    filters:
      Status:
        type: toggle-group
        label: ステータス
        optionLabels:
          draft:     "📝 Draft"
          issued:    "📤 Issued"
          paid:      "✅ Paid"
          overdue:   "⚠️ Overdue"
          cancelled: "❌ Cancelled"
      Currency:
        type: dropdown
        label: 通貨
        options: [USD, EUR, CNY, JPY]
      CustomerId:
        type: dropdown
        label: 取引先
        foreignKey:
          entity: customer
          displayColumn: Name

    paging:
      pageSize: 15
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 2
        order:
          - InvoiceNo
          - CustomerId
          - QuotationId
          - IssueDate
          - DueDate
          - Currency
          - Status
          - Subtotal
          - TaxRate
          - TaxAmount
          - Total
          - PaidAmount
          - BankName
          - BankAccount
          - SwiftCode
          - PaymentTerms
          - Notes

    exports:
      # 請款書 PDF（正式インボイス・グリーン系）
      invoice_pdf:
        label: "請款書 PDF"
        format: pdf
        filename: "invoice_{date:yyyyMMdd}.pdf"
        columns:
          - InvoiceNo
          - CustomerName
          - IssueDate
          - DueDate
          - Currency
          - Subtotal
          - TaxAmount
          - Total
          - PaidAmount
          - Status
          - PaymentTerms
        pdf:
          title: "COMMERCIAL INVOICE"
          pageSize: A4
          orientation: portrait
          headerColor: "#065F46"
          oddRowColor: "#ECFDF5"
          showPageNumbers: true
          showGeneratedAt: true
          columns:
            - key: InvoiceNo
              width: 20
            - key: CustomerName
              width: 26
            - key: IssueDate
              width: 14
              align: center
            - key: DueDate
              width: 14
              align: center
            - key: Currency
              width: 10
              align: center
            - key: Total
              width: 14
              align: right
            - key: Status
              width: 12
              align: center

      # 未収金一覧 PDF（overdue/issued のみ、赤系警告カラー）
      unpaid_pdf:
        label: "未収金一覧 PDF"
        format: pdf
        filename: "unpaid_invoices_{date:yyyyMMdd}.pdf"
        sqlFile: exports/sql/unpaid_invoices.sql
        pdf:
          title: "UNPAID INVOICES"
          pageSize: A4
          orientation: landscape
          headerColor: "#B91C1C"
          oddRowColor: "#FEF2F2"
          showPageNumbers: true
          showGeneratedAt: true
          columns:
            - key: InvoiceNo
              width: 18
            - key: CustomerName
              width: 24
            - key: IssueDate
              width: 13
              align: center
            - key: DueDate
              width: 13
              align: center
            - key: Currency
              width: 9
              align: center
            - key: Total
              width: 13
              align: right
            - key: PaidAmount
              width: 13
              align: right
            - key: Balance
              width: 13
              align: right
            - key: OverdueDays
              width: 10
              align: right

      # JSON エクスポート
      invoice_json:
        label: "請款書 JSON"
        format: json
        filename: "invoices_{date:yyyyMMdd}.json"

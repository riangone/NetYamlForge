# 納品書
# 日本国内用納品書

imports: []
entities:
  jp_delivery:
    table: JpDelivery
    key: Id
    displayName: 納品書
    softDelete: false
    isPublic: true
    pdfTemplate: delivery

    hooks:
      beforeCreate:
        - validate_jp_delivery_status
        - validate_amount_positive
      beforeUpdate:
        - validate_jp_delivery_status
        - validate_amount_positive

    joins:
      - type: left
        table: Customer
        alias: cu
        on: JpDelivery.CustomerId = cu.Id

    forms:
      DeliveryNo:
        type: string
        label: 納品書番号
        editable: true
        required: true
      CustomerId:
        type: int
        label: 取引先 ID
        editable: true
        required: true
        foreignKey:
          entity: customer
          displayColumn: Name
          picker: false
      IssueDate:
        type: date
        label: 発行日
        editable: true
        required: true
      DeliveryDate:
        type: date
        label: 納品日
        editable: true
        required: true
      Total:
        type: decimal
        label: 合計
        editable: true
        required: true
        precision: 2
      Status:
        type: string
        label: ステータス
        editable: true
        required: true
        options: [draft, sent, accepted, rejected, expired, issued, paid, overdue, cancelled, cleared, delivered, received, active, inactive, completed, terminated, submitted, approved]
      Notes:
        type: string
        label: 備考
        editable: true

    columns:
      Id:
        type: int
        label: ID
        identity: true
        hidden: true
      Title:
        type: string
        label: 件名
        sortable: true
        searchable: true
      DeliveryNo:
        type: string
        label: 納品書番号
        sortable: true
        searchable: true
      CustomerId:
        type: int
        label: 取引先 ID
        sortable: true
      IssueDate:
        type: date
        label: 発行日
        sortable: true
      DeliveryDate:
        type: date
        label: 納品日
        sortable: true
      Total:
        type: decimal
        label: 合計
        sortable: true
      Status:
        type: string
        label: ステータス
        sortable: true
      Notes:
        type: string
        label: 備考
        sortable: true
      CreatedAt:
        type: datetime
        label: 作成日
        sortable: true
      UpdatedAt:
        type: datetime
        label: 更新日
        sortable: true

    filters:
      Status:
        type: toggle-group
        label: ステータス
      CustomerId:
        type: dropdown
        label: 取引先
        foreignKey:
          entity: customer
          displayColumn: Name

    paging:
      pageSize: 15
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 2

    exports:
      jp_delivery_pdf:
        label: "納品書 PDF"
        format: pdf
        filename: "jp_delivery_{date:yyyyMMdd}.pdf"
        columns:
          - DeliveryNo
          - CustomerId
          - IssueDate
          - DeliveryDate
          - Total
          - Status
          - Notes
        pdf:
          title: "納品書"
          pageSize: A4
          orientation: portrait
          headerColor: "#1c3658"
          oddRowColor: "#f5f5f5"
          showPageNumbers: true
          showGeneratedAt: true

      jp_delivery_csv:
        label: "納品書 CSV"
        format: csv
        filename: "jp_deliverys_{date:yyyyMMdd}.csv"
        columns:
          - DeliveryNo
          - CustomerId
          - IssueDate
          - DeliveryDate
          - Total
          - Status
          - Notes

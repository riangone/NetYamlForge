imports: []
entities:
  jp_delivery:
    table: JpDelivery
    key: Id
    displayName: 納品書
    softDelete: false
    isPublic: true

    forms:
      DeliveryNo:
        type: string
        label: DeliveryNo
        editable: true
        required: true
      CustomerId:
        type: int
        label: 取引先 ID
        editable: true
        required: true
        foreignKey:
          entity: customer
          displayColumn: Name
          picker: false
      IssueDate:
        type: date
        label: 発行日
        editable: true
        required: true
      DeliveryDate:
        type: date
        label: DeliveryDate
        editable: true
      Total:
        type: decimal
        label: 合計
        editable: true
        required: true
        precision: 2
      Status:
        type: string
        label: ステータス
        editable: true
        required: true
        options: [draft, sent, accepted, rejected, expired]
      Notes:
        type: string
        label: Notes
        editable: true

    columns:
      Id:
        type: int
        label: ID
        sortable: true
        identity: true
        hidden: true
      DeliveryNo:
        type: string
        label: DeliveryNo
      CustomerId:
        type: int
        label: 取引先 ID
      IssueDate:
        type: date
        label: 発行日
      DeliveryDate:
        type: date
        label: DeliveryDate
      Total:
        type: decimal
        label: 合計
      Status:
        type: string
        label: ステータス
      Notes:
        type: string
        label: Notes
      CreatedAt:
        type: datetime
        label: 作成日
        sortable: true
      UpdatedAt:
        type: datetime
        label: 更新日
        sortable: true

# 請求書（銀行用）
# 銀行振込用請求書

imports: []
entities:
  jp_invoice_bank:
    table: JpInvoiceBank
    key: Id
    displayName: 請求書（銀行用）
    softDelete: false
    isPublic: true
    pdfTemplate: invoices/invoice-bank

    hooks:
      beforeCreate:
        - validate_tax_rate
        - validate_amount_positive
      beforeUpdate:
        - validate_tax_rate
        - validate_amount_positive

    joins:
      - type: left
        table: Customer
        alias: cu
        on: JpInvoiceBank.CustomerId = cu.Id

    forms:
      InvoiceNo:
        type: string
        label: 請求書番号
        editable: true
        required: true
      CustomerId:
        type: int
        label: 取引先 ID
        editable: true
        required: true
        foreignKey:
          entity: customer
          displayColumn: Name
          picker: false
      IssueDate:
        type: date
        label: 発行日
        editable: true
        required: true
      DueDate:
        type: date
        label: 支払期日
        editable: true
        required: true
      Subtotal:
        type: decimal
        label: 小計
        editable: true
        precision: 2
      TaxRate:
        type: decimal
        label: 税率 (%)
        editable: true
        precision: 2
      TaxAmount:
        type: decimal
        label: 税額
        editable: true
        precision: 2
      Total:
        type: decimal
        label: 合計
        editable: true
        required: true
        precision: 2
      BankName:
        type: string
        label: 銀行名
        editable: true
      BranchName:
        type: string
        label: 支店名
        editable: true
      AccountType:
        type: string
        label: 口座種別
        editable: true
        options: [普通, 当座, 貯蓄]
      AccountNumber:
        type: string
        label: 口座番号
        editable: true
      AccountHolder:
        type: string
        label: 口座名義人
        editable: true
      Notes:
        type: string
        label: 備考
        editable: true

    columns:
      Id:
        type: int
        label: ID
        identity: true
        hidden: true
      InvoiceNo:
        type: string
        label: 請求書番号
        sortable: true
        searchable: true
      CustomerId:
        type: int
        label: 取引先 ID
        sortable: true
      IssueDate:
        type: date
        label: 発行日
        sortable: true
      DueDate:
        type: date
        label: 支払期日
        sortable: true
      Subtotal:
        type: decimal
        label: 小計
        sortable: true
      TaxRate:
        type: decimal
        label: 税率 (%)
        sortable: true
      TaxAmount:
        type: decimal
        label: 税額
        sortable: true
      Total:
        type: decimal
        label: 合計
        sortable: true
      BankName:
        type: string
        label: 銀行名
        sortable: true
      BranchName:
        type: string
        label: 支店名
        sortable: true
      AccountType:
        type: string
        label: 口座種別
        sortable: true
      AccountNumber:
        type: string
        label: 口座番号
        sortable: true
      AccountHolder:
        type: string
        label: 口座名義人
        sortable: true
      Notes:
        type: string
        label: 備考
        sortable: true
      CreatedAt:
        type: datetime
        label: 作成日
        sortable: true
      UpdatedAt:
        type: datetime
        label: 更新日
        sortable: true

    filters:
      CustomerId:
        type: dropdown
        label: 取引先
        foreignKey:
          entity: customer
          displayColumn: Name

    paging:
      pageSize: 15
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 2

    exports:
      jp_invoice_bank_pdf:
        label: "請求書（銀行用） PDF"
        format: pdf
        filename: "jp_invoice_bank_{date:yyyyMMdd}.pdf"
        columns:
          - InvoiceNo
          - CustomerId
          - IssueDate
          - DueDate
          - Subtotal
          - TaxRate
          - TaxAmount
          - Total
        pdf:
          title: "請求書（銀行用）"
          pageSize: A4
          orientation: portrait
          headerColor: "#1c3658"
          oddRowColor: "#f5f5f5"
          showPageNumbers: true
          showGeneratedAt: true

      jp_invoice_bank_csv:
        label: "請求書（銀行用） CSV"
        format: csv
        filename: "jp_invoice_banks_{date:yyyyMMdd}.csv"
        columns:
          - InvoiceNo
          - CustomerId
          - IssueDate
          - DueDate
          - Subtotal
          - TaxRate
          - TaxAmount
          - Total

imports: []
entities:
  task:
    table: Task
    key: Id
    displayName: Task
    softDelete: false
    isPublic: true

    joins:
      - type: left
        table: Project
        alias: p
        on: Task.ProjectId = p.Id
      - type: left
        table: Category
        alias: c
        on: Task.CategoryId = c.Id

    forms:
      Title:
        type: string
        required: true
        label: タイトル
        editable: true
      Status:
        type: string
        required: true
        label: ステータス
        editable: true
        options:
          - pending
          - in_progress
          - review
          - done
          - cancelled
      Priority:
        type: string
        required: true
        label: 優先度
        editable: true
        options:
          - low
          - medium
          - high
          - urgent
      ProjectId:
        type: int
        label: プロジェクト
        editable: true
        foreignKey:
          entity: project
          displayColumn: Name
          picker: false
          multiPicker: false
      CategoryId:
        type: int
        label: カテゴリ
        editable: true
        foreignKey:
          entity: category
          displayColumn: Name
          picker: false
          multiPicker: false
      DueDate:
        type: date
        label: 期限日
        editable: true
      Description:
        type: textarea
        label: 説明
        editable: true
      AssignedTo:
        type: string
        label: 担当者
        editable: true
      Tags:
        type: string
        label: タグ
        editable: true
      EstimatedHours:
        type: decimal
        label: 見積時間
        editable: true
      ActualHours:
        type: decimal
        label: 実際時間
        editable: true
      CompletedAt:
        type: date
        label: 完了日
        editable: true

    columns:
      Id:
        type: int
        identity: true
        label: ID
        sortable: true
      Title:
        type: string
        required: true
        label: タイトル
        searchable: true
        sortable: true
      Status:
        type: string
        required: true
        label: ステータス
        sortable: true
      Priority:
        type: string
        required: true
        label: 優先度
        sortable: true
      ProjectId:
        type: int
        label: Project ID
        hidden: true
      ProjectName:
        type: string
        label: プロジェクト
        expression: p.Name
        searchable: true
        sortable: true
      CategoryId:
        type: int
        label: Category ID
        hidden: true
      CategoryName:
        type: string
        label: カテゴリ
        expression: c.Name
        searchable: true
        sortable: true
      AssignedTo:
        type: string
        label: 担当者
        searchable: true
        sortable: true
      DueDate:
        type: date
        label: 期限日
        sortable: true
      EstimatedHours:
        type: decimal
        label: 見積時間
        sortable: true
      ActualHours:
        type: decimal
        label: 実際時間
        sortable: true
      Tags:
        type: string
        label: タグ
        searchable: true
        sortable: false
      CompletedAt:
        type: date
        label: 完了日
        sortable: true
      Description:
        type: string
        label: 説明
        searchable: true
        sortable: false

    paging:
      pageSize: 15
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 2
        order:
          - Title
          - Status
          - Priority
          - ProjectId
          - CategoryId
          - AssignedTo
          - DueDate
          - EstimatedHours
          - ActualHours
          - Tags
          - Description
          - CompletedAt
      filters:
        columns: 4
        order:
          - Status
          - Priority
          - ProjectId
          - CategoryId
          - AssignedTo
          - DueDate

    filters:
      Status:
        type: toggle-group
        label: ステータス
        options:
          pending: "📋 Pending"
          in_progress: "🔄 In Progress"
          review: "👀 Review"
          done: "✅ Done"
          cancelled: "❌ Cancelled"
      Priority:
        type: dropdown
        label: 優先度
        options:
          - low
          - medium
          - high
          - urgent
      ProjectId:
        type: dropdown
        label: プロジェクト
        expression: Task.ProjectId
        foreignKey:
          entity: project
          displayColumn: Name
      CategoryId:
        type: dropdown
        label: カテゴリ
        expression: Task.CategoryId
        foreignKey:
          entity: category
          displayColumn: Name
      AssignedTo:
        type: like
        label: 担当者
      DueDate:
        type: date-range
        label: 期限日
        expression: Task.DueDate

    links:
      project:
        label: プロジェクト
        targetEntity: project
        filter:
          Id: ProjectId
      category:
        label: カテゴリ
        targetEntity: category
        filter:
          Id: CategoryId
      comments:
        label: コメント
        targetEntity: comment
        filter:
          EntityId: Id

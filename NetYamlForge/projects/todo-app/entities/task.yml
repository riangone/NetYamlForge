imports: []
entities:
  task:
    table: Task
    key: Id
    displayName: Task
    softDelete: false
    isPublic: true

    joins:
      - type: left
        table: Project
        alias: p
        on: Task.ProjectId = p.Id
      - type: left
        table: Category
        alias: c
        on: Task.CategoryId = c.Id

    forms:
      Title:
        type: string
        required: true
        label: タイトル
        editable: true
      Status:
        type: string
        required: true
        label: ステータス
        editable: true
        options:
          - pending
          - in_progress
          - review
          - done
          - cancelled
      Priority:
        type: string
        required: true
        label: 優先度
        editable: true
        options:
          - low
          - medium
          - high
          - urgent
      ProjectId:
        type: int
        label: プロジェクト
        editable: true
        foreignKey:
          entity: project
          displayColumn: Name
          picker: false
          multiPicker: false
      CategoryId:
        type: int
        label: カテゴリ
        editable: true
        foreignKey:
          entity: category
          displayColumn: Name
          picker: false
          multiPicker: false
      DueDate:
        type: date
        label: 期限日
        editable: true
      Description:
        type: textarea
        label: 説明
        editable: true
      AssignedTo:
        type: string
        label: 担当者
        editable: true
      Tags:
        type: string
        label: タグ
        editable: true
      EstimatedHours:
        type: decimal
        label: 見積時間
        editable: true
      ActualHours:
        type: decimal
        label: 実際時間
        editable: true
      CompletedAt:
        type: date
        label: 完了日
        editable: true

    columns:
      Id:
        type: int
        identity: true
        label: ID
        sortable: true
      Title:
        type: string
        required: true
        label: タイトル
        searchable: true
        sortable: true
      Status:
        type: string
        required: true
        label: ステータス
        sortable: true
      Priority:
        type: string
        required: true
        label: 優先度
        sortable: true
      ProjectId:
        type: int
        label: Project ID
        hidden: true
      ProjectName:
        type: string
        label: プロジェクト
        expression: p.Name
        searchable: true
        sortable: true
      CategoryId:
        type: int
        label: Category ID
        hidden: true
      CategoryName:
        type: string
        label: カテゴリ
        expression: c.Name
        searchable: true
        sortable: true
      AssignedTo:
        type: string
        label: 担当者
        searchable: true
        sortable: true
      DueDate:
        type: date
        label: 期限日
        sortable: true
      EstimatedHours:
        type: decimal
        label: 見積時間
        sortable: true
      ActualHours:
        type: decimal
        label: 実際時間
        sortable: true
      Tags:
        type: string
        label: タグ
        searchable: true
        sortable: false
      CompletedAt:
        type: date
        label: 完了日
        sortable: true
      Description:
        type: string
        label: 説明
        searchable: true
        sortable: false

    hooks:
      beforeCreate:
        - normalize_title       # タイトル前後の空白を除去
        - validate_due_date     # 期限日が過去でないことを検証
      afterCreate:
        - audit_log             # 作成操作を監査ログに記録
      beforeUpdate:
        - normalize_title
        - validate_due_date
        - set_completed_at      # Status=done のとき CompletedAt を自動設定
      afterUpdate:
        - audit_log

    paging:
      pageSize: 15
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 2
        order:
          - Title
          - Status
          - Priority
          - ProjectId
          - CategoryId
          - AssignedTo
          - DueDate
          - EstimatedHours
          - ActualHours
          - Tags
          - Description
          - CompletedAt
      filters:
        columns: 4
        order:
          - Status
          - Priority
          - ProjectId
          - CategoryId
          - AssignedTo
          - DueDate

    filters:
      Status:
        type: toggle-group
        label: ステータス
        optionLabels:
          pending: "📋 Pending"
          in_progress: "🔄 In Progress"
          review: "👀 Review"
          done: "✅ Done"
          cancelled: "❌ Cancelled"
      Priority:
        type: dropdown
        label: 優先度
        options:
          - low
          - medium
          - high
          - urgent
      ProjectId:
        type: dropdown
        label: プロジェクト
        expression: Task.ProjectId
        foreignKey:
          entity: project
          displayColumn: Name
      CategoryId:
        type: dropdown
        label: カテゴリ
        expression: Task.CategoryId
        foreignKey:
          entity: category
          displayColumn: Name
      AssignedTo:
        type: like
        label: 担当者
      DueDate:
        type: date-range
        label: 期限日
        expression: Task.DueDate

    actions:
      mark_done:
        label: "完了にする"
        scope: row
        confirm: "このタスクを完了にしますか？"
        handler: mark_done
      reopen:
        label: "再オープン"
        scope: row
        handler: reopen_task
        inputs:
          - name: Reason
            type: string
            label: 再オープン理由
            required: true
      bulk_close_overdue:
        label: "期限切れを一括クローズ"
        scope: header
        confirm: "期限切れのタスクをすべてキャンセルにしますか？"
        handler: bulk_close_overdue

      # ファイルアップロード + カスタム処理の例
      import_csv:
        label: "CSV インポート"
        scope: header
        handler: import_tasks_csv
        inputs:
          - name: CsvFile
            type: file
            label: タスク CSV ファイル
            required: true
            allowedExtensions: ".csv"
            maxSizeBytes: 5242880   # 5 MB
          - name: DefaultStatus
            type: dropdown
            label: インポート時のステータス
            required: true
            options:
              - todo
              - in_progress

    exports:
      # エクスポート例1: 現在のフィルタを引き継いで特定列のみ CSV 出力
      filtered_csv:
        label: "フィルタ結果 CSV"
        format: csv
        filename: "tasks_{date:yyyyMMdd}.csv"
        columns:
          - Title
          - Status
          - Priority
          - DueDate
          - AssignedTo
          - ProjectName

      # エクスポート例2: カスタム SQL で期限切れタスクのみを JSON 出力
      overdue_json:
        label: "期限切れ JSON"
        format: json
        filename: "overdue_tasks_{date:yyyyMMdd}.json"
        sqlFile: exports/sql/overdue_tasks.sql

      # エクスポート例3: PDF レポート（ランドスケープ、ヘッダー色・交互行色付き）
      task_pdf:
        label: "PDF レポート"
        format: pdf
        filename: "tasks_{date:yyyyMMdd}.pdf"
        columns:
          - Title
          - Status
          - Priority
          - DueDate
          - AssignedTo
          - ProjectName
        pdf:
          title: "タスク一覧レポート"
          pageSize: A4
          orientation: landscape
          headerColor: "#1E3A5F"
          oddRowColor: "#F0F4F8"
          showPageNumbers: true
          showGeneratedAt: true
          # fontFile: fonts/NotoSansJP-Regular.ttf  # CJK フォント指定例
          columns:
            - key: Title
              width: 30
            - key: Status
              width: 13
              align: center
            - key: Priority
              width: 11
              align: center
            - key: DueDate
              width: 14
              align: center
            - key: AssignedTo
              width: 16
            - key: ProjectName
              width: 16

      # エクスポート例4: 期限切れタスク PDF（カスタム SQL + 警告カラー）
      overdue_pdf:
        label: "期限切れ PDF"
        format: pdf
        filename: "overdue_tasks_{date:yyyyMMdd}.pdf"
        sqlFile: exports/sql/overdue_tasks.sql
        pdf:
          title: "期限切れタスク一覧"
          pageSize: A4
          orientation: portrait
          headerColor: "#B91C1C"
          oddRowColor: "#FEF2F2"
          showPageNumbers: true
          showGeneratedAt: true
          columns:
            - key: Title
              width: 35
            - key: Priority
              width: 13
              align: center
            - key: DueDate
              width: 16
              align: center
            - key: OverdueDays
              width: 14
              align: right
            - key: AssignedTo
              width: 22

      # エクスポート例5: 進行中タスク PDF（優先度順、グリーン系）
      active_pdf:
        label: "進行中タスク PDF"
        format: pdf
        filename: "active_tasks_{date:yyyyMMdd}.pdf"
        sqlFile: exports/sql/active_tasks_by_priority.sql
        pdf:
          title: "進行中・レビュー中タスク"
          pageSize: A4
          orientation: landscape
          headerColor: "#065F46"
          oddRowColor: "#ECFDF5"
          showPageNumbers: true
          showGeneratedAt: true
          columns:
            - key: Title
              width: 28
            - key: Priority
              width: 11
              align: center
            - key: Status
              width: 13
              align: center
            - key: AssignedTo
              width: 14
            - key: DueDate
              width: 13
              align: center
            - key: EstimatedHours
              width: 10
              align: right
            - key: ProjectName
              width: 16

      # エクスポート例6: チーム負荷サマリ PDF（担当者集計、縦向き・コンパクト）
      team_workload_pdf:
        label: "チーム負荷 PDF"
        format: pdf
        filename: "team_workload_{date:yyyyMMdd}.pdf"
        sqlFile: exports/sql/team_workload.sql
        pdf:
          title: "担当者別作業負荷サマリ"
          pageSize: A4
          orientation: portrait
          headerColor: "#4338CA"
          oddRowColor: "#EEF2FF"
          showPageNumbers: true
          showGeneratedAt: true
          columns:
            - key: AssignedTo
              width: 22
            - key: TotalTasks
              width: 14
              align: right
            - key: DoneTasks
              width: 14
              align: right
            - key: ActiveTasks
              width: 14
              align: right
            - key: OverdueTasks
              width: 14
              align: right
            - key: TotalEstimatedHours
              width: 16
              align: right
            - key: TotalActualHours
              width: 16
              align: right

    links:
      project:
        label: プロジェクト
        targetEntity: project
        filter:
          Id: ProjectId
      category:
        label: カテゴリ
        targetEntity: category
        filter:
          Id: CategoryId
      comments:
        label: コメント
        targetEntity: comment
        filter:
          EntityId: Id

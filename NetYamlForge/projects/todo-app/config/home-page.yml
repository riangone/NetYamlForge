hero:
  eyebrow: ✅ Todo App — 极简待办清单
  title: 个人高效办公待办清单
  description: 极简主义设计，助您专注于最重要的工作。轻松管理每日任务、灵感备注，量化您的每一天。
  primaryActionLabel: 待办清单
  primaryActionUrl: /todo-app/DynamicEntity/List/task
  secondaryActionLabel: 任务分类
  secondaryActionUrl: /todo-app/DynamicEntity/List/category
  highlights:
    - 极速创建
    - 灵活分类
    - 状态流转
    - 历史回顾

metrics:
  - label: 待办项
    value: "Active"
    trend: "专注当下"
    tone: text-primary
  - label: 完成率
    value: "Quantified"
    trend: "成就可见"
    tone: text-success
  - label: 简洁度
    value: "100%"
    trend: "零干扰"
    tone: text-secondary

capabilitiesSectionTitle: 核心功能
capabilities:
  - icon: ✍️
    title: 极速记录
    description: 随时随地记录灵感与待办事项，支持一键保存与分类标记。
    badge: 效率
  - icon: 🔄
    title: 状态流转
    description: 清晰的任务完成状态管理，通过可视化的状态切换量化每日成就感。
    badge: 核心
  - icon: 🏷️
    title: 灵活标签
    description: 自定义任务类别，助您在工作、生活与学习之间快速切换焦点。
    badge: 组织

quickActionsSectionTitle: 快捷入口
quickActions:
  - label: 我的待办
    url: /todo-app/DynamicEntity/List/task
    style: btn-primary
    icon: ✅
  - label: 类别管理
    url: /todo-app/DynamicEntity/List/category
    style: btn-outline
    icon: 🏷️
  - label: 交流备注
    url: /todo-app/DynamicEntity/List/comment
    style: btn-ghost
    icon: 💬

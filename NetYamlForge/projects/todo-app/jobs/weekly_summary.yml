jobs:
  weekly_summary:
    displayName: 週次タスクサマリー
    description: "プロジェクト・ステータス別のタスク集計を CSV に出力します。毎週月曜 09:00 (JST) に実行。"
    enabled: true

    schedule:
      cron: "0 9 * * 1"        # 毎週月曜日 09:00
      timezone: "Asia/Tokyo"

    type: sql_to_csv
    settings:
      sqlFile: jobs/sql/weekly_summary.sql
      outputFile: "jobs/output/weekly_{date:yyyyMMdd}.csv"
      includeHeader: true
      delimiter: ","

    onFailure:
      retryCount: 0
      logError: true

capabilitiesSectionTitle: 核心功能
capabilities:
  - icon: 📜
    title: 契約全生命周期
    description: 從契約估價、內容定義到簽署執行，完整追蹤每一份契約的狀態與變更歷史。
    badge: 核心
  - icon: 🛒
    title: 銷售與訂單管理
    description: 整合訂單處理、發票開立、付款追蹤與收入確認，確保銷售流程閉環。
    badge: 業務
  - icon: 🤝
    title: 業務夥伴管理
    description: 統一管理客戶、供應商等業務夥伴資訊，支援多層級分類與關聯分析。
    badge: 夥伴
  - icon: 📊
    title: 業務分析與儀表板
    description: 提供客戶分析、業務趨勢等可視化儀表板，協助管理層快速掌握營運狀況。
    badge: 分析


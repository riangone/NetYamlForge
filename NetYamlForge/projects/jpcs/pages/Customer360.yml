title: 业务伙伴360
sections:
  - id: partner_kpi
    component: stat_cards
    sourceType: custom
    source: |
      SELECT '总业务伙伴' AS metric_name,
             CAST(COUNT(*) AS TEXT) AS metric_value,
             'users' AS metric_icon, NULL
      FROM c_bpartner WHERE isactive='Y'
      UNION ALL
      SELECT '取引先(顾客)',
             CAST(COUNT(*) AS TEXT),
             'user-check',
             NULL
      FROM c_bpartner WHERE iscustomer='Y' AND isactive='Y'
      UNION ALL
      SELECT '仕入先',
             CAST(COUNT(*) AS TEXT),
             'truck',
             NULL
      FROM c_bpartner WHERE isvendor='Y' AND isactive='Y'
      UNION ALL
      SELECT '关联契约数',
             CAST(COUNT(*) AS TEXT),
             'file-contract',
             NULL
      FROM jp_contract WHERE isactive='Y'
    columns: [metric_name, metric_value, metric_icon, metric_delta]

  - id: partners_by_group
    component: pie_chart
    sourceType: custom
    source: |
      SELECT COALESCE(bg.name, '未分组') AS label,
             COUNT(*) AS value
      FROM c_bpartner bp
      LEFT JOIN c_bp_group bg ON bp.c_bp_group_id = bg.c_bp_group_id
      WHERE bp.isactive='Y'
      GROUP BY bp.c_bp_group_id
      ORDER BY value DESC
    columns: [label, value]
    xField: label
    yField: value

  - id: partner_list
    component: table
    sourceType: custom
    source: |
      SELECT bp.name AS 名称,
             bp.value AS 编码,
             bp.taxid AS 纳税号,
             COALESCE(bg.name, '-') AS 分组,
             CASE WHEN bp.iscustomer='Y' THEN '✅' ELSE '-' END AS 顾客,
             CASE WHEN bp.isvendor='Y' THEN '✅' ELSE '-' END AS 仕入先,
             bp.rating AS 評価,
             bp.salesvolume AS 销售额,
             bp.firstsale AS 初回取引日,
             bp.potentiallifetimevalue AS 生涯价值,
             bp.created AS 登録日
      FROM c_bpartner bp
      LEFT JOIN c_bp_group bg ON bp.c_bp_group_id = bg.c_bp_group_id
      WHERE bp.isactive='Y'
      ORDER BY bp.name
      LIMIT 50
    columns: [名称, 编码, 纳税号, 分组, 顾客, 仕入先, 評価, 销售额, 初回取引日, 生涯价值, 登録日]

  - id: partner_contracts
    component: table
    sourceType: custom
    source: |
      SELECT bp.name AS 业务伙伴,
             c.documentno AS 契约编号,
             c.name AS 契约名称,
             c.jp_subject AS 件名,
             c.jp_contractdocamt AS 契约金额,
             CASE c.docstatus
               WHEN 'DR' THEN '下書き'
               WHEN 'CO' THEN '完了'
               WHEN 'IP' THEN '処理中'
               WHEN 'CL' THEN 'クローズ'
               ELSE c.docstatus
             END AS 状态,
             c.dateacct AS 会计日期,
             c.jp_contractperioddate_from AS 开始日,
             c.jp_contractperioddate_to AS 终了日
      FROM c_bpartner bp
      INNER JOIN jp_contract c ON bp.c_bpartner_id = c.c_bpartner_id
      WHERE bp.isactive='Y' AND c.isactive='Y'
      ORDER BY c.created DESC
      LIMIT 30
    columns: [业务伙伴, 契约编号, 契约名称, 件名, 契约金额, 状态, 会计日期, 开始日, 终了日]

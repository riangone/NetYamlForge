title: 契约生命周期管理
sections:
  - id: contract_kpi
    component: stat_cards
    sourceType: custom
    source: |
      SELECT '总契约数' AS metric_name,
             CAST(COUNT(*) AS TEXT) AS metric_value,
             'file-contract' AS metric_icon, NULL
      FROM jp_contract
      UNION ALL
      SELECT '有效契约',
             CAST(COUNT(*) AS TEXT),
             'check-circle',
             NULL
      FROM jp_contract WHERE docstatus IN ('CO','IP')
      UNION ALL
      SELECT '待承认契约',
             CAST(COUNT(*) AS TEXT),
             'clock',
             NULL
      FROM jp_contract WHERE docstatus='DR'
      UNION ALL
      SELECT '本月新规契约',
             CAST(COUNT(*) AS TEXT),
             'plus-circle',
             NULL
      FROM jp_contract WHERE strftime('%Y-%m', created)=strftime('%Y-%m','now')
    columns: [metric_name, metric_value, metric_icon, metric_delta]

  - id: contract_status_pie
    component: pie_chart
    sourceType: custom
    source: |
      SELECT CASE docstatus
               WHEN 'DR' THEN '下書き'
               WHEN 'IP' THEN '処理中'
               WHEN 'CO' THEN '完了'
               WHEN 'CL' THEN 'クローズ'
               WHEN 'VO' THEN '無効'
               ELSE docstatus
             END AS label,
             COUNT(*) AS value
      FROM jp_contract
      GROUP BY docstatus
      ORDER BY value DESC
    columns: [label, value]
    xField: label
    yField: value

  - id: contract_monthly_trend
    component: bar_chart
    sourceType: custom
    source: |
      SELECT strftime('%Y-%m', dateacct) AS label,
             COUNT(*) AS value,
             ROUND(SUM(COALESCE(jp_contractdocamt, 0)), 2) AS amount
      FROM jp_contract
      WHERE dateacct IS NOT NULL
      GROUP BY strftime('%Y-%m', dateacct)
      ORDER BY label
      LIMIT 12
    columns: [label, value, amount]
    xField: label
    yField: value

  - id: contract_list
    component: table
    sourceType: custom
    source: |
      SELECT c.documentno AS 契约编号,
             COALESCE(bp.name, '-') AS 业务伙伴,
             c.name AS 契约名称,
             c.jp_subject AS 件名,
             c.jp_contractno AS 契约番号,
             CASE c.docstatus
               WHEN 'DR' THEN '下書き'
               WHEN 'IP' THEN '処理中'
               WHEN 'CO' THEN '完了'
               WHEN 'CL' THEN 'クローズ'
               ELSE c.docstatus
             END AS 状态,
             c.dateacct AS 会计日期,
             c.jp_contractperioddate_from AS 契约开始日,
             c.jp_contractperioddate_to AS 契约终了日,
             c.jp_contractdocamt AS 契约金额,
             c.created AS 作成日
      FROM jp_contract c
      LEFT JOIN c_bpartner bp ON c.c_bpartner_id = bp.c_bpartner_id
      WHERE c.isactive='Y'
      ORDER BY c.created DESC
      LIMIT 50
    columns: [契约编号, 业务伙伴, 契约名称, 件名, 契约番号, 状态, 会计日期, 契约开始日, 契约终了日, 契约金额, 作成日]

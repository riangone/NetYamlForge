title: 购买管理Dashboard
sections:
  - id: purchasing_kpi
    component: stat_cards
    sourceType: custom
    source: |
      SELECT '仕入先数' AS metric_name,
             CAST(COUNT(*) AS TEXT) AS metric_value,
             'truck' AS metric_icon, NULL
      FROM c_bpartner WHERE isvendor='Y' AND isactive='Y'
      UNION ALL
      SELECT '购买発注数',
             CAST(COUNT(*) AS TEXT),
             'file-text',
             NULL
      FROM c_order WHERE issotrx='N' AND isactive='Y'
      UNION ALL
      SELECT '未处理発注',
             CAST(COUNT(*) AS TEXT),
             'clock',
             NULL
      FROM c_order WHERE issotrx='N' AND docstatus='DR'
      UNION ALL
      SELECT '购买总金额',
             '$' || CAST(ROUND(COALESCE(SUM(grandtotal), 0), 2) AS TEXT),
             'dollar-sign',
             NULL
      FROM c_order WHERE issotrx='N' AND isactive='Y'
    columns: [metric_name, metric_value, metric_icon, metric_delta]

  - id: purchase_order_status
    component: pie_chart
    sourceType: custom
    source: |
      SELECT CASE docstatus
               WHEN 'DR' THEN '下書き'
               WHEN 'IP' THEN '処理中'
               WHEN 'CO' THEN '完了'
               WHEN 'CL' THEN 'クローズ'
               ELSE docstatus
             END AS label,
             COUNT(*) AS value
      FROM c_order WHERE issotrx='N' AND isactive='Y'
      GROUP BY docstatus
      ORDER BY value DESC
    columns: [label, value]
    xField: label
    yField: value

  - id: pending_purchase
    component: table
    sourceType: custom
    source: |
      SELECT o.documentno AS 発注番号,
             COALESCE(bp.name, '-') AS 仕入先,
             o.dateordered AS 発注日,
             o.datepromised AS 納期,
             o.grandtotal AS 金额,
             CASE o.docstatus
               WHEN 'DR' THEN '📝 下書き'
               WHEN 'IP' THEN '🔄 处理中'
               WHEN 'CO' THEN '✅ 完了'
               WHEN 'CL' THEN '🔒 クローズ'
               ELSE '📋 '||o.docstatus
             END AS 状态
      FROM c_order o
      LEFT JOIN c_bpartner bp ON o.c_bpartner_id = bp.c_bpartner_id
      WHERE o.issotrx='N' AND o.isactive='Y'
      ORDER BY o.dateordered DESC
      LIMIT 30
    columns: [発注番号, 仕入先, 発注日, 納期, 金额, 状态]

  - id: requisition_list
    component: table
    sourceType: custom
    source: |
      SELECT r.documentno AS 请求编号,
             r.description AS 说明,
             r.daterequired AS 必要日,
             r.totallines AS 合计金额,
             r.priorityrule AS 优先度,
             CASE r.docstatus
               WHEN 'DR' THEN '📝 下書き'
               WHEN 'IP' THEN '🔄 処理中'
               WHEN 'CO' THEN '✅ 完了'
               ELSE r.docstatus
             END AS 状态
      FROM m_requisition r
      WHERE r.isactive='Y'
      ORDER BY r.created DESC
      LIMIT 20
    columns: [请求编号, 说明, 必要日, 合计金额, 优先度, 状态]

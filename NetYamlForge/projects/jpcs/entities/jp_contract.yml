entities:
  jp_contract:
    table: jp_contract
    key: jp_contract_id
    displayName: 契约
    columns:
      jp_contract_id: {type: decimal, identity: true, label: 'ID'}
      documentno: {type: string, label: '契约编号', searchable: true, sortable: true}
      name: {type: string, label: '名称', searchable: true, sortable: true}
      docstatus: {type: string, label: '文档状态', searchable: true, sortable: true}
      jp_contractstatus: {type: string, label: '契约状态', searchable: true, sortable: true}
      dateacct: {type: string, label: '记账日期', sortable: true}
      c_bpartner_id:
        type: decimal
        label: '业务伙伴'
        foreignKey:
          entity: c_bpartner
          displayColumn: 'name'
      jp_contractperioddate_from: {type: string, label: '有效期从', sortable: true}
      jp_contractperioddate_to: {type: string, label: '有效期至', sortable: true}
      jp_contractmonthlyrevenueamt: {type: decimal, label: '月营收额'}
      jp_contractdocamt: {type: decimal, label: '合同总额'}
      salesrep_id:
        type: decimal
        label: '销售代表'
        foreignKey:
          entity: ad_user
          displayColumn: 'name'
      isactive: {type: string, label: '启用'}
      description: {type: string, label: '描述'}

name: jpcs
displayName: JPiere Contract Service (Native)
description: 基于 iDempiere/JPiere 原始架构的契约管理系统
version: "1.0.0"

database:
  type: sqlite
  path: database/jpcs.db

features:
  multiLanguage: true
  userAuthentication: true
  dashboard: true
  pages: true
  crud: true
  api: true
  export: true
  batchJobs: true
  aiAssistant: true

theme:
  primaryColor: "#2c3e50"
  accentColor: "#e67e22"
  logo: jpiere-logo.png

layout:
  dashboardTheme: workspace

# AI 配置
aiConfig:
  enabled: true
  defaultProvider: qwen
  businessHours: "月〜金 9:00-18:00"

# 导航菜单（基于 iDempiere/JPiere 业务流设计）
navigation:
  groups:
    - name: 主要功能
      items:
        - label: 仪表盘
          url: /Page/Dashboard
          icon: dashboard
        - label: 个人工作台
          url: /Page/MyPage
          icon: user
        - label: 业务分析
          url: /Page/CustomerAnalytics
          icon: chart-line

    - name: 契约管理
      items:
        - label: 契约
          url: /Entity/jp_contract
          icon: file-contract
        - label: 契约内容
          url: /Entity/jp_contractcontent
          icon: file-invoice
        - label: 契约行
          url: /Entity/jp_contractline
          icon: list
        - label: 契约估价
          url: /Entity/jp_estimation
          icon: calculator

    - name: 销售与财务
      items:
        - label: 订单
          url: /Entity/c_order
          icon: shopping-cart
        - label: 发票
          url: /Entity/c_invoice
          icon: file-invoice-dollar
        - label: 付款
          url: /Entity/c_payment
          icon: credit-card
        - label: 账单 (JP)
          url: /Entity/jp_bill
          icon: file-invoice-dollar
        - label: 收入确认
          url: /Entity/jp_recognition
          icon: check-double

    - name: 基础数据
      items:
        - label: 业务伙伴
          url: /Entity/c_bpartner
          icon: users
        - label: 产品
          url: /Entity/m_product
          icon: box
        - label: 会计科目
          url: /Entity/c_elementvalue
          icon: book
        - label: 任务清单
          url: /Entity/jp_todo
          icon: check-square

    - name: 系统管理
      items:
        - label: 用户
          url: /Entity/ad_user
          icon: user
        - label: 角色
          url: /Entity/ad_role
          icon: shield

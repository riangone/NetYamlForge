name: jpcs
displayName: JPiere Contract Service (Native)
description: 基于 iDempiere/JPiere 原始架构的契约管理系统
version: "1.0.0"

database:
  type: sqlite
  path: database/jpcs.db

features:
  multiLanguage: true
  userAuthentication: true
  dashboard: true
  pages: true
  crud: true
  api: true
  export: true
  batchJobs: true
  aiAssistant: true

theme:
  primaryColor: "#2c3e50"
  accentColor: "#e67e22"
  logo: jpiere-logo.png

layout:
  dashboardTheme: workspace

# AI 配置
aiConfig:
  enabled: true
  defaultProvider: qwen
  businessHours: "月〜金 9:00-18:00"

# 导航菜单（基于 iDempiere/JPiere 业务流设计）
navigation:
  groups:
    - name: 控制面板
      items:
        - label: 仪表盘
          url: /Page/Dashboard
          icon: dashboard

    - name: 契约管理
      items:
        - label: 契约生命周期
          url: /Page/ContractLifecycle
          icon: file-contract
        - label: 契约承认流程
          url: /Page/ContractApproval
          icon: check-circle
        - label: 契约
          url: /Entity/jp_contract
          icon: file-contract
        - label: 契约内容
          url: /Entity/jp_contractcontent
          icon: file-invoice
        - label: 契约行
          url: /Entity/jp_contractline
          icon: list
        - label: 契约类别
          url: /Entity/jp_contractcategory
          icon: tag
        - label: 契约日志
          url: /Entity/jp_contractlog
          icon: history
        - label: 契约处理进度
          url: /Entity/jp_contractprocess
          icon: tasks

    - name: 销售与订单
      items:
        - label: 受注处理
          url: /Page/OrderFulfillment
          icon: shopping-cart
        - label: 商谈Pipeline
          url: /Page/SalesPipeline
          icon: chart-line
        - label: 订单
          url: /Entity/c_order
          icon: shopping-cart
        - label: 订单行
          url: /Entity/c_orderline
          icon: list
        - label: 报价请求
          url: /Entity/c_rfq
          icon: file-text
        - label: 商机
          url: /Entity/c_opportunity
          icon: chart-line

    - name: 财务
      items:
        - label: 资金管理
          url: /Page/CashFlowDashboard
          icon: dollar-sign
        - label: 发票
          url: /Entity/c_invoice
          icon: file-invoice-dollar
        - label: 发票行
          url: /Entity/c_invoiceline
          icon: list
        - label: 付款
          url: /Entity/c_payment
          icon: credit-card
        - label: 账单 (JP)
          url: /Entity/jp_bill
          icon: file-invoice-dollar
        - label: 账单行
          url: /Entity/jp_billline
          icon: list
        - label: 会计凭证
          url: /Entity/fact_acct
          icon: book
        - label: 日记账
          url: /Entity/gl_journal
          icon: journal

    - name: 购买与出货
      items:
        - label: 购买管理
          url: /Page/PurchaseRequisition
          icon: truck
        - label: 出荷管理
          url: /Page/ShippingDashboard
          icon: package
        - label: 仕入先管理
          url: /Page/SupplierManagement
          icon: building
        - label: 商品分类
          url: /Page/ProductCatalog
          icon: box
        - label: 购买请求
          url: /Entity/m_requisition
          icon: file-text
        - label: 出荷/入荷
          url: /Entity/m_inout
          icon: truck

    - name: 基础数据
      items:
        - label: 业务伙伴
          url: /Entity/c_bpartner
          icon: users
        - label: 伙伴地点
          url: /Entity/c_bpartner_location

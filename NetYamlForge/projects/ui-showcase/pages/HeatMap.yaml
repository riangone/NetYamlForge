title: Heat Map
description: heat_map コンポーネントのデモ — GitHubスタイルのカレンダーヒートマップ

sections:
  - id: commit_heatmap
    title: 日次コミット活動（heat_map）
    component: heat_map
    sourceType: custom
    source: |
      SELECT activity_date, commit_count, description
      FROM daily_activity
      ORDER BY activity_date
    columns: [activity_date, commit_count, description]
    dateField: activity_date
    valueField: commit_count
    descField: description
    pageSize: 200
    editable: false
    readOnly: true

  - id: activity_trend
    title: 週次アクティビティ推移（bar_chart）
    component: bar_chart
    sourceType: custom
    source: |
      SELECT
        strftime('%Y-W%W', activity_date) AS week,
        SUM(commit_count) AS total_commits
      FROM daily_activity
      GROUP BY week
      ORDER BY week
    columns: [week, total_commits]
    xField: week
    yField: total_commits
    color: "rgba(34,197,94,0.75)"
    pageSize: 20
    editable: false
    readOnly: true

  - id: activity_stats
    title: 活動サマリー（stat_cards）
    component: stat_cards
    sourceType: custom
    source: |
      SELECT
        '総コミット数'   AS metric_name, CAST(SUM(commit_count) AS TEXT)  AS metric_value, '📝' AS metric_icon, NULL AS metric_delta
        FROM daily_activity
      UNION ALL
      SELECT
        'アクティブ日数' AS metric_name, CAST(COUNT(*) FILTER (WHERE commit_count > 0) AS TEXT) AS metric_value, '📅' AS metric_icon, NULL
        FROM daily_activity
      UNION ALL
      SELECT
        '最大コミット/日' AS metric_name, CAST(MAX(commit_count) AS TEXT) AS metric_value, '🚀' AS metric_icon, NULL
        FROM daily_activity
      UNION ALL
      SELECT
        '平均コミット/日' AS metric_name, CAST(ROUND(AVG(commit_count),1) AS TEXT) AS metric_value, '📊' AS metric_icon, NULL
        FROM daily_activity WHERE commit_count > 0
    columns: [metric_name, metric_value, metric_icon, metric_delta]
    labelField: metric_name
    valueField: metric_value
    iconField: metric_icon
    deltaField: metric_delta
    pageSize: 10
    editable: false
    readOnly: true

title: Badge Gallery
description: badge_list コンポーネントのデモ — レベル別色分けバッジ

sections:
  - id: skill_badges
    title: スキルタグ一覧（badge_list）
    component: badge_list
    sourceType: custom
    source: |
      SELECT skill_name, level, category, years
      FROM skill_tags
      ORDER BY
        CASE level WHEN 'high' THEN 1 WHEN 'medium' THEN 2 ELSE 3 END,
        skill_name
    columns: [skill_name, level, category, years]
    labelField: skill_name
    valueField: level
    pageSize: 50
    editable: false
    readOnly: true

  - id: by_category
    title: カテゴリ別スキル数（bar_chart）
    component: bar_chart
    sourceType: custom
    source: |
      SELECT category, COUNT(*) AS count FROM skill_tags GROUP BY category ORDER BY count DESC
    columns: [category, count]
    xField: category
    yField: count
    color: "rgba(14,165,233,0.75)"
    pageSize: 20
    editable: false
    readOnly: true

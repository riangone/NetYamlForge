title: Team Status
description: progress_bars コンポーネントのデモ — タスク達成率・ポイント

sections:
  - id: task_progress
    title: タスク達成率（progress_bars）
    component: progress_bars
    sourceType: custom
    source: |
      SELECT member_name, completed_tasks, total_tasks,
             ROUND(completed_tasks * 100.0 / total_tasks, 1) AS achievement_rate,
             department
      FROM team_performance
      ORDER BY achievement_rate DESC
    columns: [member_name, completed_tasks, total_tasks, achievement_rate, department]
    labelField: member_name
    progressField: achievement_rate
    subValueField: department
    pageSize: 20
    editable: false
    readOnly: true

  - id: pts_bar
    title: 今月獲得ポイント（bar_chart）
    component: bar_chart
    sourceType: custom
    source: |
      SELECT member_name, this_month_pts
      FROM team_performance
      ORDER BY this_month_pts DESC
    columns: [member_name, this_month_pts]
    xField: member_name
    yField: this_month_pts
    color: "rgba(168,85,247,0.75)"
    pageSize: 20
    editable: false
    readOnly: true

  - id: team_table
    title: チーム詳細（table）
    component: table
    sourceType: custom
    source: |
      SELECT member_name AS メンバー, department AS 部署,
             completed_tasks AS 完了, total_tasks AS 合計,
             achievement_rate || '%' AS 達成率,
             this_month_pts AS 今月Pt
      FROM team_performance
      ORDER BY achievement_rate DESC
    columns: [メンバー, 部署, 完了, 合計, 達成率, 今月Pt]
    pageSize: 20
    editable: false
    readOnly: true

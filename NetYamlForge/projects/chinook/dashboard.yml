charts:
- title: Monthly Revenue
  type: line
  entity: invoice
  valueAggregate: sum
  valueColumn: Total
  groupExpression: strftime('%Y-%m', InvoiceDate)
  orderBy: label
  orderDir: asc
  limit: 24
  colorBg: rgba(99, 102, 241, 0.15)
  colorBorder: rgba(99, 102, 241, 1)
  titleKey: projects.chinook.dashboard.charts.0.title
- title: Tracks by Genre
  type: doughnut
  entity: track
  valueAggregate: count
  labelJoinEntity: genre
  labelJoinKey: GenreId
  labelJoinDisplay: Name
  orderBy: value
  orderDir: desc
  limit: 10
  colors:
  - rgba(99, 102, 241, 0.85)
  - rgba(16, 185, 129, 0.85)
  - rgba(245, 158, 11, 0.85)
  - rgba(239, 68, 68, 0.85)
  - rgba(59, 130, 246, 0.85)
  - rgba(236, 72, 153, 0.85)
  - rgba(168, 85, 247, 0.85)
  - rgba(14, 165, 233, 0.85)
  - rgba(251, 146, 60, 0.85)
  - rgba(52, 211, 153, 0.85)
  titleKey: projects.chinook.dashboard.charts.1.title
- title: Top 10 Countries by Invoices
  type: bar
  entity: invoice
  valueAggregate: count
  groupExpression: BillingCountry
  orderBy: value
  orderDir: desc
  limit: 10
  colorBg: rgba(16, 185, 129, 0.7)
  colorBorder: rgba(16, 185, 129, 1)
  titleKey: projects.chinook.dashboard.charts.2.title
- title: Top 10 Artists by Albums
  type: bar
  entity: album
  valueAggregate: count
  labelJoinEntity: artist
  labelJoinKey: ArtistId
  labelJoinDisplay: Name
  orderBy: value
  orderDir: desc
  limit: 10
  colorBg: rgba(245, 158, 11, 0.7)
  colorBorder: rgba(245, 158, 11, 1)
  titleKey: projects.chinook.dashboard.charts.3.title

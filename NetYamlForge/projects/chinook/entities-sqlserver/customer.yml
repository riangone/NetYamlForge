entities:
  customer:
    table: Customer
    key: CustomerId
    displayName: Customer
    softDelete: false
    paging:
      pageSize: 10
      mode: numbered
    layout:
      forms:
        columns: 2
        order:
        - FirstName
        - LastName
        - Email
        - Country
        - SupportRepId
      filters:
        columns: 3
        order:
        - Country
        - SupportRepId
    joins:
    - type: left
      table: Employee
      alias: e
      true: Customer.SupportRepId = e.EmployeeId
    columns:
      CustomerId:
        type: int
        identity: true
        label: ID
        searchable: false
        sortable: true
        labelKey: projects.chinook.entities-sqlserver.customer.entities.customer.columns.CustomerId.label
      FirstName:
        type: string
        required: true
        label: First Name
        searchable: true
        sortable: true
        labelKey: projects.chinook.entities-sqlserver.customer.entities.customer.columns.FirstName.label
      LastName:
        type: string
        required: true
        label: Last Name
        searchable: true
        sortable: true
        labelKey: projects.chinook.entities-sqlserver.customer.entities.customer.columns.LastName.label
      Email:
        type: email
        required: true
        label: Email
        searchable: true
        sortable: true
        labelKey: projects.chinook.entities-sqlserver.customer.entities.customer.columns.Email.label
      Country:
        type: string
        label: Country
        searchable: true
        sortable: true
        labelKey: projects.chinook.entities-sqlserver.customer.entities.customer.columns.Country.label
      SupportRepId:
        type: int
        label: Support Rep
        sortable: true
        labelKey: projects.chinook.entities-sqlserver.customer.entities.customer.columns.SupportRepId.label
      SupportRepName:
        type: string
        identity: true
        label: Support Rep
        expression: e.LastName + ', ' + e.FirstName
        searchable: true
        sortable: true
        labelKey: projects.chinook.entities-sqlserver.customer.entities.customer.columns.SupportRepName.label
    forms:
      FirstName:
        type: string
        required: true
        label: First Name
        editable: true
        labelKey: projects.chinook.entities-sqlserver.customer.entities.customer.forms.FirstName.label
      LastName:
        type: string
        required: true
        label: Last Name
        editable: true
        labelKey: projects.chinook.entities-sqlserver.customer.entities.customer.forms.LastName.label
      Email:
        type: email
        required: true
        label: Email
        editable: true
        labelKey: projects.chinook.entities-sqlserver.customer.entities.customer.forms.Email.label
      Country:
        type: string
        label: Country
        editable: true
        labelKey: projects.chinook.entities-sqlserver.customer.entities.customer.forms.Country.label
      SupportRepId:
        type: int
        label: Support Rep
        editable: true
        foreignKey:
          entity: employee
          displayColumn: LastName
        labelKey: projects.chinook.entities-sqlserver.customer.entities.customer.forms.SupportRepId.label
    filters:
      Country:
        type: multi-select
        label: Country
        options:
        - USA
        - Canada
        - Brazil
        - France
        - Germany
        labelKey: projects.chinook.entities-sqlserver.customer.entities.customer.filters.Country.label
      SupportRepId:
        type: dropdown
        label: Support Rep
        expression: Customer.SupportRepId
        foreignKey:
          entity: employee
          displayColumn: LastName
        labelKey: projects.chinook.entities-sqlserver.customer.entities.customer.filters.SupportRepId.label
    links:
      employees:
        label: Support Reps
        targetEntity: employee
      invoices:
        label: Invoices
        targetEntity: invoice
        filter:
          CustomerId: CustomerId
    displayNameKey: projects.chinook.entities-sqlserver.customer.entities.customer.displayName

imports: []
entities:
  invoice:
    table: Invoice
    key: InvoiceId
    keys: []
    displayName: Invoice
    joins:
    - type: left
      table: Customer
      alias: c
      true: Invoice.CustomerId = c.CustomerId
    forms:
      CustomerId:
        type: int
        identity: false
        required: true
        label: Customer
        searchable: false
        sortable: false
        editable: true
        foreignKey:
          entity: customer
          displayColumn: Id
          displayColumns:
          - LastName
          - FirstName
          - Email
          query: 'SELECT CustomerId AS Id, LastName, FirstName, Email

            FROM Customer

            '
          picker: false
          multiPicker: false
        hidden: false
        labelKey: projects.chinook.entities.invoice.entities.invoice.forms.CustomerId.label
      InvoiceDate:
        type: date
        identity: false
        required: true
        label: Invoice Date
        searchable: false
        sortable: false
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.invoice.entities.invoice.forms.InvoiceDate.label
      BillingAddress:
        type: textarea
        identity: false
        required: false
        label: Billing Address
        searchable: false
        sortable: false
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.invoice.entities.invoice.forms.BillingAddress.label
      BillingCity:
        type: string
        identity: false
        required: false
        label: Billing City
        searchable: false
        sortable: false
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.invoice.entities.invoice.forms.BillingCity.label
      BillingCountry:
        type: string
        identity: false
        required: false
        label: Billing Country
        searchable: false
        sortable: false
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.invoice.entities.invoice.forms.BillingCountry.label
      Total:
        type: decimal
        identity: false
        required: true
        label: Total
        searchable: false
        sortable: false
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.invoice.entities.invoice.forms.Total.label
      BillingState:
        type: string
        identity: false
        required: false
        label: Billing State
        searchable: false
        sortable: false
        editable: true
        hidden: false
      BillingPostalCode:
        type: string
        identity: false
        required: false
        label: Billing Postal Code
        searchable: false
        sortable: false
        editable: true
        hidden: false
    columns:
      InvoiceId:
        type: int
        identity: true
        required: false
        label: ID
        searchable: false
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.invoice.entities.invoice.columns.InvoiceId.label
      CustomerId:
        type: int
        identity: false
        required: true
        label: Customer
        searchable: false
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.invoice.entities.invoice.columns.CustomerId.label
      CustomerName:
        type: string
        identity: true
        required: false
        label: Customer
        searchable: true
        sortable: true
        editable: true
        expression: c.LastName || ', ' || c.FirstName
        hidden: false
        labelKey: projects.chinook.entities.invoice.entities.invoice.columns.CustomerName.label
      InvoiceDate:
        type: date
        identity: false
        required: true
        label: Invoice Date
        searchable: false
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.invoice.entities.invoice.columns.InvoiceDate.label
      BillingCountry:
        type: string
        identity: false
        required: false
        label: Billing Country
        searchable: true
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.invoice.entities.invoice.columns.BillingCountry.label
      Total:
        type: decimal
        identity: false
        required: true
        label: Total
        searchable: false
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.invoice.entities.invoice.columns.Total.label
      BillingAddress:
        type: textarea
        identity: false
        required: false
        label: Billing Address
        searchable: false
        sortable: false
        editable: true
        hidden: true
        labelKey: projects.chinook.entities.invoice.entities.invoice.columns.BillingAddress.label
      BillingCity:
        type: string
        identity: false
        required: false
        label: Billing City
        searchable: false
        sortable: false
        editable: true
        hidden: true
        labelKey: projects.chinook.entities.invoice.entities.invoice.columns.BillingCity.label
      BillingState:
        type: string
        identity: false
        required: false
        label: Billing State
        searchable: false
        sortable: false
        editable: true
        hidden: true
        labelKey: projects.chinook.entities.invoice.entities.invoice.columns.BillingState.label
      BillingPostalCode:
        type: string
        identity: false
        required: false
        label: Billing Postal Code
        searchable: false
        sortable: false
        editable: true
        hidden: true
        labelKey: projects.chinook.entities.invoice.entities.invoice.columns.BillingPostalCode.label
    paging:
      pageSize: 10
      mode: numbered
      enableCount: false
    layout:
      forms:
        columns: 2
        order:
        - CustomerId
        - InvoiceDate
        - BillingAddress
        - BillingCity
        - BillingCountry
        - Total
      filters:
        columns: 3
        order:
        - CustomerId
        - BillingCountry
        - InvoiceDate
        - Total
    softDelete: false
    isPublic: true
    filters:
      CustomerId:
        type: dropdown
        label: Customer
        expression: Invoice.CustomerId
        foreignKey:
          entity: customer
          displayColumn: Id
          displayColumns:
          - LastName
          - FirstName
          - Email
          query: 'SELECT CustomerId AS Id, LastName, FirstName, Email

            FROM Customer

            '
          picker: false
          multiPicker: false
        labelKey: projects.chinook.entities.invoice.entities.invoice.filters.CustomerId.label
      BillingCountry:
        type: multi-select
        label: Billing Country
        options:
        - USA
        - Canada
        - Brazil
        - France
        - Germany
        labelKey: projects.chinook.entities.invoice.entities.invoice.filters.BillingCountry.label
      InvoiceDate:
        type: date-range
        label: Invoice Date
        expression: Invoice.InvoiceDate
        labelKey: projects.chinook.entities.invoice.entities.invoice.filters.InvoiceDate.label
      Total:
        type: range
        label: Total Range
        expression: Invoice.Total
        labelKey: projects.chinook.entities.invoice.entities.invoice.filters.Total.label
    links:
      customer:
        label: Customer
        targetEntity: customer
        filter:
          CustomerId: CustomerId
      invoicelines:
        label: Invoice Lines
        targetEntity: invoiceline
        filter:
          InvoiceId: InvoiceId
    confirmation:
      create: 新しい請求書を作成してよろしいですか？
      update: 請求書を更新してよろしいですか？
    hooks:
      beforeCreate: chinook_invoice_validation
      afterCreate: audit_log
      beforeUpdate: chinook_invoice_validation
      afterUpdate: audit_log
    isCompositeKey: false
    displayNameKey: projects.chinook.entities.invoice.entities.invoice.displayName

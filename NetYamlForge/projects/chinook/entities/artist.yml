entities:
  artist:
    table: Artist
    key: ArtistId
    displayName: Artist
    softDelete: false
    paging:
      pageSize: 10
      mode: numbered
    layout:
      forms:
        columns: 1
        order:
        - Name
      filters:
        columns: 2
        order:
        - Name
    columns:
      ArtistId:
        type: int
        identity: true
        label: ID
        searchable: false
        sortable: true
      Name:
        type: string
        label: Name
        searchable: true
        sortable: true
        labelKey: projects.chinook.entities.artist.entities.artist.columns.Name.label
    forms:
      Name:
        type: string
        label: Name
        editable: true
        required: true
        labelKey: projects.chinook.entities.artist.entities.artist.forms.Name.label
    filters:
      Name:
        type: text
        label: Name
        expression: Artist.Name
        labelKey: projects.chinook.entities.artist.entities.artist.filters.Name.label
    links:
      albums:
        label: Albums
        targetEntity: album
        filter:
          ArtistId: ArtistId
    hooks:
      beforeDelete: chinook_artist_delete_check
      afterDelete: audit_log
    confirmation:
      create: 新しいアーティストを登録してよろしいですか？
      update: アーティスト情報を更新してよろしいですか？
      delete: このアーティストを削除してもよろしいですか？関連するアルバムも影響を受ける可能性があります。
    displayNameKey: projects.chinook.entities.artist.entities.artist.displayName

imports: []
entities:
  invoiceline:
    table: InvoiceLine
    key: InvoiceLineId
    keys: []
    displayName: Invoice Line
    joins:
    - type: left
      table: Invoice
      alias: inv
      true: InvoiceLine.InvoiceId = inv.InvoiceId
    - type: left
      table: Track
      alias: t
      true: InvoiceLine.TrackId = t.TrackId
    forms:
      InvoiceId:
        type: int
        identity: false
        required: true
        label: Invoice
        searchable: false
        sortable: false
        editable: true
        foreignKey:
          entity: invoice
          displayColumn: Id
          displayColumns:
          - InvoiceId
          - InvoiceDate
          - Total
          query: 'SELECT InvoiceId AS Id, InvoiceId, InvoiceDate, Total

            FROM Invoice

            '
          picker: false
          multiPicker: false
        hidden: false
        labelKey: projects.chinook.entities.invoiceline.entities.invoiceline.forms.InvoiceId.label
      TrackId:
        type: int
        identity: false
        required: true
        label: Track
        searchable: false
        sortable: false
        editable: true
        foreignKey:
          entity: track
          displayColumn: Id
          displayColumns:
          - Name
          - Composer
          query: 'SELECT TrackId AS Id, Name, Composer

            FROM Track

            '
          picker: false
          multiPicker: false
        hidden: false
        labelKey: projects.chinook.entities.invoiceline.entities.invoiceline.forms.TrackId.label
      UnitPrice:
        type: decimal
        identity: false
        required: true
        label: Unit Price
        searchable: false
        sortable: false
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.invoiceline.entities.invoiceline.forms.UnitPrice.label
      Quantity:
        type: int
        identity: false
        required: true
        label: Quantity
        searchable: false
        sortable: false
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.invoiceline.entities.invoiceline.forms.Quantity.label
    columns:
      InvoiceLineId:
        type: int
        identity: true
        required: false
        label: ID
        searchable: false
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.invoiceline.entities.invoiceline.columns.InvoiceLineId.label
      InvoiceId:
        type: int
        identity: false
        required: true
        label: Invoice
        searchable: false
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.invoiceline.entities.invoiceline.columns.InvoiceId.label
      TrackId:
        type: int
        identity: false
        required: true
        label: Track
        searchable: false
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.invoiceline.entities.invoiceline.columns.TrackId.label
      TrackName:
        type: string
        identity: true
        required: false
        label: Track
        searchable: true
        sortable: true
        editable: true
        expression: t.Name
        hidden: false
        labelKey: projects.chinook.entities.invoiceline.entities.invoiceline.columns.TrackName.label
      UnitPrice:
        type: decimal
        identity: false
        required: true
        label: Unit Price
        searchable: false
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.invoiceline.entities.invoiceline.columns.UnitPrice.label
      Quantity:
        type: int
        identity: false
        required: true
        label: Quantity
        searchable: false
        sortable: true
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.invoiceline.entities.invoiceline.columns.Quantity.label
    paging:
      pageSize: 15
      mode: numbered
      enableCount: true
    layout:
      forms:
        columns: 2
        order:
        - InvoiceId
        - TrackId
        - UnitPrice
        - Quantity
      filters:
        columns: 2
        order:
        - InvoiceId
    softDelete: false
    isPublic: true
    filters:
      InvoiceId:
        type: dropdown
        label: Invoice
        expression: InvoiceLine.InvoiceId
        foreignKey:
          entity: invoice
          displayColumn: Id
          displayColumns:
          - InvoiceId
          - InvoiceDate
          - Total
          query: 'SELECT InvoiceId AS Id, InvoiceId, InvoiceDate, Total

            FROM Invoice

            '
          picker: false
          multiPicker: false
        labelKey: projects.chinook.entities.invoiceline.entities.invoiceline.filters.InvoiceId.label
      UnitPrice:
        type: range
        label: Unit Price Range
        expression: InvoiceLine.UnitPrice
        labelKey: projects.chinook.entities.invoiceline.entities.invoiceline.filters.UnitPrice.label
    links: {}
    isCompositeKey: false
    displayNameKey: projects.chinook.entities.invoiceline.entities.invoiceline.displayName

imports: []
entities:
  track:
    table: Track
    key: TrackId
    keys: []
    displayName: Track
    joins:
    - type: left
      table: Album
      alias: a
      true: Track.AlbumId = a.AlbumId
    - type: left
      table: Genre
      alias: g
      true: Track.GenreId = g.GenreId
    - type: left
      table: MediaType
      alias: m
      true: Track.MediaTypeId = m.MediaTypeId
    forms:
      Name:
        type: string
        identity: false
        required: true
        label: Name
        searchable: false
        sortable: false
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.track.entities.track.forms.Name.label
      AlbumId:
        type: int
        identity: false
        required: false
        label: Album
        searchable: false
        sortable: false
        editable: true
        foreignKey:
          entity: album
          displayColumn: Id
          displayColumns:
          - Title
          picker: false
          multiPicker: false
        hidden: false
        labelKey: projects.chinook.entities.track.entities.track.forms.AlbumId.label
      GenreId:
        type: int
        identity: false
        required: false
        label: Genre
        searchable: false
        sortable: false
        editable: true
        foreignKey:
          entity: genre
          displayColumn: Id
          displayColumns:
          - Name
          picker: false
          multiPicker: false
        hidden: false
        labelKey: projects.chinook.entities.track.entities.track.forms.GenreId.label
      MediaTypeId:
        type: int
        identity: false
        required: true
        label: Media Type
        searchable: false
        sortable: false
        editable: true
        foreignKey:
          entity: mediatype
          displayColumn: Id
          displayColumns:
          - Name
          picker: false
          multiPicker: false
        hidden: false
        labelKey: projects.chinook.entities.track.entities.track.forms.MediaTypeId.label
      Milliseconds:
        type: int
        identity: false
        required: true
        label: Milliseconds
        searchable: false
        sortable: false
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.track.entities.track.forms.Milliseconds.label
      Bytes:
        type: long
        identity: false
        required: false
        label: Bytes
        searchable: false
        sortable: false
        editable: true
        hidden: false
      UnitPrice:
        type: decimal
        identity: false
        required: true
        label: Unit Price
        searchable: false
        sortable: false
        editable: true
        hidden: false
        labelKey: projects.chinook.entities.track.entities.track.forms.UnitPrice.label
      Composer:

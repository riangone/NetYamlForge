        searchable: false
        sortable: true
        editable: true
        hidden: false
    paging:
      pageSize: 15
      mode: numbered
      enableCount: true
    layout:
      forms:
        columns: 2
        order:
        - Name
        - AlbumId
        - GenreId
        - MediaTypeId
        - Composer
        - Milliseconds
        - Bytes
        - UnitPrice
      filters:
        columns: 3
        order:
        - GenreId
        - MediaTypeId
        - AlbumId
    softDelete: false
    isPublic: true
    filters:
      GenreId:
        type: dropdown
        label: Genre
        expression: Track.GenreId
        foreignKey:
          entity: genre
          displayColumn: Id
          displayColumns:
          - Name
          picker: false
          multiPicker: false
        labelKey: projects.chinook.entities.track.entities.track.filters.GenreId.label
      MediaTypeId:
        type: dropdown
        label: Media Type
        expression: Track.MediaTypeId
        foreignKey:
          entity: mediatype
          displayColumn: Id
          displayColumns:
          - Name
          picker: false
          multiPicker: false
        labelKey: projects.chinook.entities.track.entities.track.filters.MediaTypeId.label
      AlbumId:
        type: dropdown
        label: Album
        expression: Track.AlbumId
        foreignKey:
          entity: album
          displayColumn: Id
          displayColumns:
          - Title
          picker: false
          multiPicker: false
        labelKey: projects.chinook.entities.track.entities.track.filters.AlbumId.label
    links:
      album:
        label: Album
        targetEntity: album
        filter:
          AlbumId: TrackId
    confirmation:
      create: 新しいトラックを追加してよろしいですか？
      update: トラック情報を更新してよろしいですか？
    hooks:
      beforeCreate: validate_required
      afterCreate: audit_log
      beforeUpdate: chinook_track_duration
      afterUpdate: audit_log
    isCompositeKey: false
    displayNameKey: projects.chinook.entities.track.entities.track.displayName

# Chinook プロジェクト定義
# URL: /{project}/Dashboard, /{project}/DynamicEntity?entity=customer
name: chinook
displayName: Chinook Music Store
version: "1.0.0"

# AI向けヒント: このプロジェクトに変更を加える前に必ず参照すること
aiHints:
  primaryLanguage: en-US
  authRequired: true
  customHooks:
    - chinook_customer_welcome      # 顧客登録時にウェルカムメール送信
    - chinook_invoice_validation    # 請求書の合計金額整合性チェック
    - chinook_track_duration        # トラック再生時間のフォーマット変換
    - chinook_artist_delete_check   # アーティスト削除時のアルバム参照チェック
    - track_convert_duration        # ミリ秒→mm:ss 変換
    - invoice_send_welcome_email    # 請求書作成時のメール送信
  protectedEntities:
    - invoice      # 請求書は一度作成したら削除不可（chinook_artist_delete_check）
    - invoiceline  # 請求明細は invoice と整合性を保つ必要がある
  notes:
    - "track.Milliseconds は chinook_track_duration によって自動変換される"
    - "artist 削除前に album の参照チェックが走る（chinook_artist_delete_check）"

database:
  type: sqlite
  # project.yaml からの相対パス
  path: database/chinook.db

features:
  multiLanguage: true
  userAuthentication: true

layout:
  dashboardTheme: analytics
  header:
    title: Chinook Music Store
  navigation:
    showDashboard: true
    entities:
      - artist
      - album
      - track
      - customer
      - invoice
      - employee
    items:
      - label: Dashboard
        controller: Dashboard
        action: Index
        icon: 📊
      - label: Artists
        url: /chinook/DynamicEntity/Index?entity=artist
        icon: 🎵
      - label: Albums
        url: /chinook/DynamicEntity/Index?entity=album
        icon: 💿
      - label: Tracks
        url: /chinook/DynamicEntity/Index?entity=track
        icon: 🎸
      - label: Customers
        url: /chinook/DynamicEntity/Index?entity=customer
        icon: 👥
      - label: Invoices
        url: /chinook/DynamicEntity/Index?entity=invoice
        icon: 💰

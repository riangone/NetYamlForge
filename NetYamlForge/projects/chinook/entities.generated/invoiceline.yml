    displayName: 'Invoiceline'
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order: ['InvoiceId', 'TrackId', 'UnitPrice', 'Quantity']
      filters:
        columns: 4
        order: []
    columns:
      InvoiceLineId: { type: int, identity: true, label: 'Invoice Line Id', sortable: true }
      InvoiceId: { type: int, required: true, label: 'Invoice Id', sortable: true }
      TrackId: { type: int, required: true, label: 'Track Id', sortable: true }
      UnitPrice: { type: decimal, required: true, label: 'Unit Price', sortable: true }
      Quantity: { type: int, required: true, label: 'Quantity', sortable: true }
    forms:
      InvoiceId:
        type: int
        required: true
        label: 'Invoice Id'
        editable: true
        foreignKey:
          entity: invoice
          displayColumn: 'BillingAddress'
      TrackId:
        type: int
        required: true
        label: 'Track Id'
        editable: true
        foreignKey:
          entity: track
          displayColumn: 'Name'
      UnitPrice: { type: decimal, required: true, label: 'Unit Price', editable: true }
      Quantity: { type: int, required: true, label: 'Quantity', editable: true }
    filters: {}
    links: {}

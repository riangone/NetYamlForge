entities:
  Reservation:
    table: reservation
    key: id

    displayName: "予約"
    displayNameI18n:
      ja-JP: "予約"
      zh-CN: "预订"

    columns:
      id:
        type: int
        identity: true
        sortable: true
      book_id:
        type: int
        displayName: "蔵書"
        displayNameI18n:
          ja-JP: "蔵書"
          zh-CN: "藏书"
        required: true
      book_title:
        type: string
        expression: "book.title"
        displayName: "蔵書タイトル"
        displayNameI18n:
          ja-JP: "蔵書タイトル"
          zh-CN: "藏书标题"
        searchable: true
      patron_id:
        type: int
        displayName: "利用者"
        displayNameI18n:
          ja-JP: "利用者"
          zh-CN: "用户"
        required: true
      patron_name:
        type: string
        expression: "patron.name"
        displayName: "利用者名"
        displayNameI18n:
          ja-JP: "利用者名"
          zh-CN: "用户名"
        searchable: true
      reservation_date:
        type: date
        displayName: "予約日"
        displayNameI18n:
          ja-JP: "予約日"
          zh-CN: "预订日期"
        sortable: true
        required: true
      status:
        type: string
        displayName: "ステータス"
        displayNameI18n:
          ja-JP: "ステータス"
          zh-CN: "状态"
        sortable: true
      priority:
        type: int
        displayName: "優先順位"
        displayNameI18n:
          ja-JP: "優先順位"
          zh-CN: "优先顺序"
        sortable: true

    forms:
      create:
        fields: [book_id, patron_id, reservation_date, priority]
      edit:
        fields: [status, priority]

    filters:
      status:
        column: status
        type: enum
        values: [pending, fulfilled, cancelled]

    joins:
      - table: book
        alias: b
        on: "reservation.book_id = b.id"
        type: left
      - table: patron
        alias: p
        on: "reservation.patron_id = p.id"
        type: left

    hooks:
      beforeCreate: [validate_required, audit_log]

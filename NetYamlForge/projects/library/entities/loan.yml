entities:
  Loan:
    table: loan
    key: id

    displayName: "貸出記録"
    displayNameI18n:
      ja-JP: "貸出記録"
      zh-CN: "借阅记录"

    columns:
      id:
        type: int
        identity: true
        sortable: true
      book_id:
        type: int
        displayName: "蔵書"
        displayNameI18n:
          ja-JP: "蔵書"
          zh-CN: "藏书"
        required: true
      book_title:
        type: string
        expression: "book.title"
        displayName: "蔵書タイトル"
        displayNameI18n:
          ja-JP: "蔵書タイトル"
          zh-CN: "藏书标题"
        searchable: true
      patron_id:
        type: int
        displayName: "利用者"
        displayNameI18n:
          ja-JP: "利用者"
          zh-CN: "用户"
        required: true
      patron_name:
        type: string
        expression: "patron.name"
        displayName: "利用者名"
        displayNameI18n:
          ja-JP: "利用者名"
          zh-CN: "用户名"
        searchable: true
      loan_date:
        type: date
        displayName: "貸出日"
        displayNameI18n:
          ja-JP: "貸出日"
          zh-CN: "借阅日期"
        sortable: true
        required: true
      due_date:
        type: date
        displayName: "返却期限"
        displayNameI18n:
          ja-JP: "返却期限"
          zh-CN: "归还期限"
        sortable: true
      return_date:
        type: date
        displayName: "返却日"
        displayNameI18n:
          ja-JP: "返却日"
          zh-CN: "归还日期"
        sortable: true
      status:
        type: string
        displayName: "ステータス"
        displayNameI18n:
          ja-JP: "ステータス"
          zh-CN: "状态"
        sortable: true

    forms:
      create:
        fields: [book_id, patron_id, loan_date, due_date]
      edit:
        fields: [status, return_date]
        # 返却時のみ status/return_date を更新可能

    filters:
      status:
        column: status
        type: enum
        values: [active, returned, overdue]

    joins:
      - table: book
        alias: b
        on: "loan.book_id = b.id"
        type: left
      - table: patron
        alias: p
        on: "loan.patron_id = p.id"
        type: left

    hooks:
      beforeCreate: [validate_available_book, set_due_date, decrease_available_count]
      afterCreate: [audit_log]
      beforeUpdate: [validate_loan_status_transition]
      afterUpdate: [increase_available_count_on_return, notify_patron]

entities:
  Patron:
    table: patron
    key: id

    displayName: "利用者"
    displayNameI18n:
      ja-JP: "利用者"
      zh-CN: "用户"

    columns:
      id:
        type: int
        identity: true
        sortable: true
      name:
        type: string
        displayName: "名前"
        displayNameI18n:
          ja-JP: "名前"
          zh-CN: "名字"
        searchable: true
        sortable: true
        required: true
      email:
        type: string
        displayName: "メール"
        displayNameI18n:
          ja-JP: "メール"
          zh-CN: "电邮"
        searchable: true
        required: true
      phone:
        type: string
        displayName: "電話"
        displayNameI18n:
          ja-JP: "電話"
          zh-CN: "电话"
      member_since:
        type: date
        displayName: "入会日"
        displayNameI18n:
          ja-JP: "入会日"
          zh-CN: "入会日期"
        sortable: true
      status:
        type: string
        displayName: "ステータス"
        displayNameI18n:
          ja-JP: "ステータス"
          zh-CN: "状态"
        sortable: true

    forms:
      create:
        fields: [name, email, phone, member_since, status]
      edit:
        fields: [name, email, phone, member_since, status]

    filters:
      status:
        column: status
        type: enum
        values: [active, suspended, inactive]

    hooks:
      beforeCreate: [trim, validate_required, validate_email]
      beforeUpdate: [trim, validate_email]

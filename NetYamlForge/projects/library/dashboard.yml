stats:
- label: "蔵書総数"
  labelKey: "projects.library.dashboard.stats.0.label"
  entity: book
  aggregate: count
  icon: "📚"
  color: "badge-primary"

- label: "貸出中冊数"
  labelKey: "projects.library.dashboard.stats.1.label"
  entity: loan
  aggregate: count
  column: id
  filter: "status = 'active'"
  icon: "🔄"
  color: "badge-warning"

- label: "返却期限切れ"
  labelKey: "projects.library.dashboard.stats.2.label"
  entity: loan
  aggregate: count
  column: id
  filter: "status = 'overdue'"
  icon: "⏰"
  color: "badge-error"

- label: "活動利用者数"
  labelKey: "projects.library.dashboard.stats.3.label"
  entity: patron
  aggregate: count
  column: id
  filter: "status = 'active'"
  icon: "👥"
  color: "badge-success"

- label: "待機予約件数"
  labelKey: "projects.library.dashboard.stats.4.label"
  entity: reservation
  aggregate: count
  column: id
  filter: "status = 'pending'"
  icon: "🔖"
  color: "badge-info"

charts:
- title: "カテゴリ別蔵書数"
  titleKey: "projects.library.dashboard.charts.0.title"
  type: bar
  entity: book
  groupExpression: "category_id"
  valueAggregate: count
  valueColumn: id
  colorBg: "rgba(54, 162, 235, 0.7)"
  colorBorder: "rgb(54, 162, 235)"

- title: "貸出多い蔵書（トップ5）"
  titleKey: "projects.library.dashboard.charts.1.title"
  type: bar
  entity: loan
  groupExpression: "book_id"
  valueAggregate: count
  valueColumn: id
  filter: "status = 'active'"
  orderBy: value
  orderDir: desc
  limit: 5
  colorBg: "rgba(75, 192, 192, 0.7)"
  colorBorder: "rgb(75, 192, 192)"

- title: "返却状況"
  titleKey: "projects.library.dashboard.charts.2.title"
  type: doughnut
  entity: loan
  groupExpression: "status"
  valueAggregate: count
  valueColumn: id
  colorsJson: |
    ["rgba(76, 175, 80, 0.8)", "rgba(33, 150, 243, 0.8)", "rgba(244, 67, 54, 0.8)"]

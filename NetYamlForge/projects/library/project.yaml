name: library
displayName: Library Management System
version: "1.0.0"

# AI向けヒント: このプロジェクトに変更を加える前に必ず参照すること
aiHints:
  primaryLanguage: ja-JP
  authRequired: true
  customHooks:
    - validate_available_book         # 貸出時に在庫確認
    - set_due_date                    # 返却期限を自動計算（14日後）
    - validate_loan_status_transition # 返却状態遷移ルール
    - increase_available_count_on_return # 返却時に在庫を自動インクリメント
    - notify_patron                   # 返却通知（ログ出力）
  protectedEntities:
    - loan           # 貸出記録は直接SQL編集禁止（hooks経由のみ）
    - reservation    # 予約記録は直接SQL編集禁止
  notes:
    - "book.available_count は decrease_available_count/increase_available_count_on_return で自動管理される"
    - "loan.due_date は set_due_date で loan_date + 14日を自動セット"
    - "patron.status は UI上でのみ変更可能（overdue件数3以上は自動suspended）"
    - "displayNameI18n で ja-JP と zh-CN の両言語に対応"

database:
  type: sqlite
  path: database/library.db

features:
  multiLanguage: true
  userAuthentication: true

layout:
  dashboardTheme: ops
  header:
    title: Library Management System

  navigation:
    showDashboard: true
    entities:
      - book
      - author
      - category
      - patron
      - loan
      - reservation

    items:
      - label: ダッシュボード
        url: /library/Dashboard/Index
        icon: 📊
        labelKey: library.nav.dashboard

      - label: 蔵書管理
        url: /library/DynamicEntity/Index?entity=book
        icon: 📚
        labelKey: library.nav.books

      - label: 著者管理
        url: /library/DynamicEntity/Index?entity=author
        icon: ✍️
        labelKey: library.nav.authors

      - label: カテゴリ管理
        url: /library/DynamicEntity/Index?entity=category
        icon: 🏷️
        labelKey: library.nav.categories

      - label: 利用者管理
        url: /library/DynamicEntity/Index?entity=patron
        icon: 👤
        labelKey: library.nav.patrons

      - label: 貸出管理
        url: /library/DynamicEntity/Index?entity=loan
        icon: 🔄
        labelKey: library.nav.loans

      - label: 予約管理
        url: /library/DynamicEntity/Index?entity=reservation
        icon: 🔖
        labelKey: library.nav.reservations

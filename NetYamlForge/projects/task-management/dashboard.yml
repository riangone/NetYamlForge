stats:
  - label: 全タスク数
    entity: task
    aggregate: count
    icon: 📋
    color: badge-info

  - label: 進行中
    entity: task
    aggregate: count
    filter: "Status = 'in_progress'"
    icon: 🔄
    color: badge-primary

  - label: 未着手
    entity: task
    aggregate: count
    filter: "Status = 'not_started'"
    icon: 📂
    color: badge-warning

  - label: 完了
    entity: task
    aggregate: count
    filter: "Status = 'completed'"
    icon: ✅
    color: badge-success

  - label: 期限間近（3日以内）
    entity: task
    aggregate: count
    filter: "Status != 'completed' AND date(DueDate) <= date('now', '+3 days') AND date(DueDate) >= date('now')"
    icon: ⚠️
    color: badge-danger

charts:
  - title: ステータス別タスク数
    type: bar
    entity: task
    valueAggregate: count
    groupExpression: Status
    orderBy: value
    orderDir: desc

  - title: 優先度別タスク数
    type: doughnut
    entity: task
    valueAggregate: count
    groupExpression: Priority
    orderBy: value
    orderDir: desc

  - title: 担当者別タスク数（未完了）
    type: bar
    entity: task
    valueAggregate: count
    groupExpression: AssignedTo
    filter: "Status != 'completed'"
    orderBy: value
    orderDir: desc
    limit: 10

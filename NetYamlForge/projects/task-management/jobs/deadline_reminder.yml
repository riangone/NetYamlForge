jobs:
  deadline_reminder:
    displayName: 期限翌日リマインド
    description: "翌日が期限のタスクを CSV に出力します。毎日 9:00 (JST) に実行。メール通知はカスタム実装が必要です。"
    enabled: true

    schedule:
      cron: "0 9 * * *"
      timezone: "Asia/Tokyo"

    type: sql_to_csv
    settings:
      sqlFile: jobs/sql/deadline_reminder.sql
      outputFile: "jobs/output/deadline_reminder_{date:yyyyMMdd}.csv"
      includeHeader: true
      delimiter: ","

    onFailure:
      retryCount: 1
      retryInterval: 300
      logError: true

imports: []
entities:
  task:
    table: Task
    key: Id
    displayName: タスク
    softDelete: false
    isPublic: true
    # AI User Simulation 実験用に REST を開放（docs/experiments/ai-user-simulation.md）。
    # ApiEntityAccessGuard は entity 級のみ判定＝役割/所有者フィルタは無い点に留意。
    api: readwrite

    forms:
      Title:
        type: string
        required: true
        label: タスク名
        editable: true
      AssignedTo:
        type: string
        required: true
        label: 担当者
        editable: true
      DueDate:
        type: date
        required: true
        label: 期限日
        editable: true
      Priority:
        type: string
        label: 優先度
        editable: true
        options:
          - high
          - medium
          - low
        optionLabels:
          high: "🔴 高"
          medium: "🟡 中"
          low: "🟢 低"
      Status:
        type: string
        label: ステータス
        editable: true
        options:
          - not_started
          - in_progress
          - completed
          - on_hold
        optionLabels:
          not_started: "📋 未着手"
          in_progress: "🔄 進行中"
          completed: "✅ 完了"
          on_hold: "⏸ 保留"
      Notes:
        type: textarea
        label: 備考
        editable: true
      CreatedBy:
        type: string
        label: 登録者
        editable: false

    columns:
      Id:
        type: int
        identity: true
        label: ID
        sortable: true
      Title:
        type: string
        required: true
        label: タスク名
        searchable: true
        sortable: true
      AssignedTo:
        type: string
        required: true
        label: 担当者
        searchable: true
        sortable: true
      DueDate:
        type: date
        required: true
        label: 期限日
        sortable: true
      Priority:
        type: string
        label: 優先度
        sortable: true
        options:
          - high
          - medium
          - low
        optionLabels:
          high: "🔴 高"
          medium: "🟡 中"
          low: "🟢 低"
      Status:
        type: string
        label: ステータス
        sortable: true
        options:
          - not_started
          - in_progress
          - completed
          - on_hold
        optionLabels:
          not_started: "📋 未着手"
          in_progress: "🔄 進行中"
          completed: "✅ 完了"
          on_hold: "⏸ 保留"
      Notes:
        type: string
        label: 備考
        searchable: true
        sortable: false
      CreatedBy:
        type: string
        label: 登録者
        sortable: false
      CreatedAt:
        type: datetime
        label: 登録日時
        sortable: true
      UpdatedAt:
        type: datetime
        label: 更新日時
        sortable: true

    hooks:
      beforeCreate:
        - now:CreatedAt
        - validate_due_date
        - current_user:CreatedBy
      beforeUpdate:
        - now:UpdatedAt
        - validate_due_date
      afterCreate:
        - audit_log
      afterUpdate:
        - audit_log

    paging:
      pageSize: 20
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 2
        order:
          - Title
          - AssignedTo
          - DueDate
          - Priority
          - Status
          - Notes
          - CreatedBy
      filters:
        columns: 4
        order:
          - Status
          - Priority
          - AssignedTo
          - DueDate

    filters:
      Status:
        type: toggle-group
        label: ステータス
        optionLabels:
          not_started: "📋 未着手"
          in_progress: "🔄 進行中"
          completed: "✅ 完了"
          on_hold: "⏸ 保留"
      Priority:
        type: dropdown
        label: 優先度
        options:
          - high
          - medium
          - low
      AssignedTo:
        type: like
        label: 担当者
      DueDate:
        type: date-range
        label: 期限日
        expression: Task.DueDate

    actions:
      mark_completed:
        label: "完了にする"
        scope: row
        confirm: "このタスクを完了にしますか？"
        handler: mark_done
      reopen:
        label: "再オープン"
        scope: row
        handler: reopen_task
        inputs:
          - name: Reason
            type: string
            label: 再オープン理由
            required: true

    exports:
      filtered_csv:
        label: "フィルタ結果 CSV"
        format: csv
        filename: "tasks_{date:yyyyMMdd}.csv"
        columns:
          - Title
          - AssignedTo
          - DueDate
          - Priority
          - Status
          - Notes

    links:
      comments:
        label: コメント
        targetEntity: comment
        filter:
          TaskId: Id

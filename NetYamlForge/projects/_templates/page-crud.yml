# 汎用CRUDページテンプレート（YAML）
# このファイルをコピーして pages/<YourPage>.yaml を作成する

title: 画面タイトル
description: 画面の目的を1行で記述
main_table: YourMainTable

ui:
  page:
    layout: two-pane
    density: comfortable

sections:
  - id: main_list
    title: 一覧
    source_type: table
    source: YourMainTable
    columns:
      - Id
      - Name
      - Status
      - UpdatedAt
    page_size: 20
    editable: false
    read_only: true
    filters:
      Name:
        label: 名称
        type: like
      Status:
        label: ステータス
        type: eq
    ui:
      component: DataTable
      selectable: single

  - id: detail_list
    title: 明細
    source_type: custom
    source: |
      SELECT *
      FROM YourDetailTable
      ORDER BY Id DESC
    columns:
      - Id
      - ParentId
      - Quantity
      - Amount
    page_size: 15
    editable: false
    read_only: true
    ui:
      component: DataTable
      selectable: none

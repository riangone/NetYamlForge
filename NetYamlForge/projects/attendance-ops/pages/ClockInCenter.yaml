title: 打卡页面
description: 查看今日打卡状态、异常出勤与未签退人员。

ui:
  page:
    layout: stack
    density: comfortable

sections:
  - id: today_clockin
    title: 今日打卡总览
    sourceType: custom
    source: |
      SELECT
        ar.Id AS RecordId,
        e.EmployeeNo,
        e.FullName AS EmployeeName,
        d.Name AS DepartmentName,
        IFNULL(s.ShiftName, '-') AS ShiftName,
        IFNULL(ar.CheckInTime, '-') AS CheckInTime,
        IFNULL(ar.CheckOutTime, '-') AS CheckOutTime,
        ar.AttendanceStatus,
        ar.Source
      FROM AttendanceRecord ar
      JOIN Employee e ON e.Id = ar.EmployeeId
      LEFT JOIN Department d ON d.Id = e.DepartmentId
      LEFT JOIN Shift s ON s.Id = ar.ShiftId
      WHERE ar.WorkDate = date('now','localtime')
      ORDER BY ar.Id DESC
    columns:
      - RecordId
      - EmployeeNo
      - EmployeeName
      - DepartmentName
      - ShiftName
      - CheckInTime
      - CheckOutTime
      - AttendanceStatus
      - Source
    pageSize: 100
    editable: false
    readOnly: true
    filters:
      EmployeeNo:
        label: 工号
        type: like
      EmployeeName:
        label: 姓名
        type: like
      AttendanceStatus:
        label: 状态
        type: eq

  - id: pending_checkout
    title: 未签退人员
    sourceType: custom
    source: |
      SELECT
        ar.Id AS RecordId,
        e.EmployeeNo,
        e.FullName AS EmployeeName,
        d.Name AS DepartmentName,
        IFNULL(ar.CheckInTime, '-') AS CheckInTime,
        ar.AttendanceStatus
      FROM AttendanceRecord ar
      JOIN Employee e ON e.Id = ar.EmployeeId
      LEFT JOIN Department d ON d.Id = e.DepartmentId
      WHERE ar.WorkDate = date('now','localtime')
        AND ar.CheckInTime IS NOT NULL
        AND (ar.CheckOutTime IS NULL OR ar.CheckOutTime = '')
      ORDER BY ar.Id DESC
    columns:
      - RecordId
      - EmployeeNo
      - EmployeeName
      - DepartmentName
      - CheckInTime
      - AttendanceStatus
    pageSize: 50
    editable: false
    readOnly: true

  - id: attendance_exceptions
    title: 异常打卡
    sourceType: custom
    source: |
      SELECT
        ar.Id AS RecordId,
        e.EmployeeNo,
        e.FullName AS EmployeeName,
        d.Name AS DepartmentName,
        ar.WorkDate,
        ar.AttendanceStatus,
        IFNULL(ar.Remark, '-') AS Remark
      FROM AttendanceRecord ar
      JOIN Employee e ON e.Id = ar.EmployeeId
      LEFT JOIN Department d ON d.Id = e.DepartmentId
      WHERE ar.WorkDate = date('now','localtime')
        AND ar.AttendanceStatus IN ('late', 'early_leave', 'absent', 'on_leave')
      ORDER BY ar.Id DESC
    columns:
      - RecordId
      - EmployeeNo
      - EmployeeName
      - DepartmentName
      - WorkDate
      - AttendanceStatus
      - Remark
    pageSize: 50
    editable: false
    readOnly: true

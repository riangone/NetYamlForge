title: 考勤主入口
description: 考勤业务主入口，汇总今日出勤、待审批与关键提醒。

ui:
  page:
    layout: stack
    density: comfortable

sections:
  - id: kpi_snapshot
    title: 今日概览
    source_type: custom
    source: |
      SELECT '今日打卡人数' AS Metric, CAST((SELECT COUNT(*) FROM AttendanceRecord WHERE WorkDate = date('now','localtime')) AS TEXT) AS Value
      UNION ALL
      SELECT '在职员工数' AS Metric, CAST((SELECT COUNT(*) FROM Employee WHERE Status = 'active') AS TEXT) AS Value
      UNION ALL
      SELECT '待审批请假' AS Metric, CAST((SELECT COUNT(*) FROM LeaveRequest WHERE Status = 'pending') AS TEXT) AS Value
      UNION ALL
      SELECT '待审批加班' AS Metric, CAST((SELECT COUNT(*) FROM OvertimeRequest WHERE Status = 'pending') AS TEXT) AS Value
    columns:
      - Metric
      - Value
    page_size: 20
    editable: false
    read_only: true

  - id: pending_todos
    title: 待办事项
    source_type: custom
    source: |
      SELECT
        lr.Id AS RequestId,
        'leave' AS RequestType,
        e.EmployeeNo,
        e.FullName AS EmployeeName,
        lr.StartDate AS StartOrWorkDate,
        lr.EndDate AS EndDateOrHours,
        lr.Status
      FROM LeaveRequest lr
      JOIN Employee e ON e.Id = lr.EmployeeId
      WHERE lr.Status = 'pending'
      UNION ALL
      SELECT
        ot.Id AS RequestId,
        'overtime' AS RequestType,
        e.EmployeeNo,
        e.FullName AS EmployeeName,
        ot.WorkDate AS StartOrWorkDate,
        CAST(ot.Hours AS TEXT) AS EndDateOrHours,
        ot.Status
      FROM OvertimeRequest ot
      JOIN Employee e ON e.Id = ot.EmployeeId
      WHERE ot.Status = 'pending'
    columns:
      - RequestId
      - RequestType
      - EmployeeNo
      - EmployeeName
      - StartOrWorkDate
      - EndDateOrHours
      - Status
    page_size: 30
    editable: false
    read_only: true

  - id: today_attendance
    title: 今日打卡记录
    source_type: custom
    source: |
      SELECT
        ar.Id AS RecordId,
        e.EmployeeNo,
        e.FullName AS EmployeeName,
        d.Name AS DepartmentName,
        IFNULL(s.ShiftName, '-') AS ShiftName,
        IFNULL(ar.CheckInTime, '-') AS CheckInTime,
        IFNULL(ar.CheckOutTime, '-') AS CheckOutTime,
        ar.AttendanceStatus
      FROM AttendanceRecord ar
      JOIN Employee e ON e.Id = ar.EmployeeId
      LEFT JOIN Department d ON d.Id = e.DepartmentId
      LEFT JOIN Shift s ON s.Id = ar.ShiftId
      WHERE ar.WorkDate = date('now','localtime')
      ORDER BY ar.Id DESC
    columns:
      - RecordId
      - EmployeeNo
      - EmployeeName
      - DepartmentName
      - ShiftName
      - CheckInTime
      - CheckOutTime
      - AttendanceStatus
    page_size: 50
    editable: false
    read_only: true

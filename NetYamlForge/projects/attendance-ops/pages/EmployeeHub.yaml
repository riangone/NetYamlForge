title: 员工页面
description: 员工主数据、出勤状态与部门分布视图。

ui:
  page:
    layout: stack
    density: comfortable

sections:
  - id: employee_overview
    title: 员工总览
    sourceType: custom
    source: |
      SELECT
        e.Id AS EmployeeId,
        e.EmployeeNo,
        e.FullName,
        d.Name AS DepartmentName,
        e.EmploymentType,
        e.HireDate,
        e.Status,
        IFNULL(lastWork.LastWorkDate, '-') AS LastWorkDate,
        IFNULL(lastStatus.LastAttendanceStatus, '-') AS LastAttendanceStatus
      FROM Employee e
      LEFT JOIN Department d ON d.Id = e.DepartmentId
      LEFT JOIN (
        SELECT EmployeeId, MAX(WorkDate) AS LastWorkDate
        FROM AttendanceRecord
        GROUP BY EmployeeId
      ) lastWork ON lastWork.EmployeeId = e.Id
      LEFT JOIN (
        SELECT ar1.EmployeeId, ar1.AttendanceStatus AS LastAttendanceStatus
        FROM AttendanceRecord ar1
        JOIN (
          SELECT EmployeeId, MAX(WorkDate) AS WorkDate
          FROM AttendanceRecord
          GROUP BY EmployeeId
        ) ar2 ON ar1.EmployeeId = ar2.EmployeeId AND ar1.WorkDate = ar2.WorkDate
      ) lastStatus ON lastStatus.EmployeeId = e.Id
      ORDER BY e.EmployeeNo ASC
    columns:
      - EmployeeId
      - EmployeeNo
      - FullName
      - DepartmentName
      - EmploymentType
      - HireDate
      - Status
      - LastWorkDate
      - LastAttendanceStatus
    pageSize: 100
    editable: false
    readOnly: true
    filters:
      EmployeeNo:
        label: 工号
        type: like
      FullName:
        label: 姓名
        type: like
      DepartmentName:
        label: 部门
        type: like
      Status:
        label: 状态
        type: eq

  - id: employee_distribution
    title: 部门与状态分布
    sourceType: custom
    source: |
      SELECT
        d.Name AS DepartmentName,
        e.Status,
        COUNT(*) AS EmployeeCount
      FROM Employee e
      LEFT JOIN Department d ON d.Id = e.DepartmentId
      GROUP BY d.Name, e.Status
      ORDER BY d.Name ASC, e.Status ASC
    columns:
      - DepartmentName
      - Status
      - EmployeeCount
    pageSize: 50
    editable: false
    readOnly: true

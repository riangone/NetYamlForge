imports: []
entities:
  leave_request:
    table: LeaveRequest
    key: Id
    keys: []
    displayName: Leave Request
    joins:
      - type: left
        table: Employee
        alias: e
        true: LeaveRequest.EmployeeId = e.Id
      - type: left
        table: Department
        alias: d
        true: e.DepartmentId = d.Id
    forms:
      EmployeeId:
        type: int
        required: true
        label: Employee
        editable: true
        foreignKey:
          entity: employee
          displayColumn: FullName
          displayColumns: [EmployeeNo, FullName]
          picker: true
          multiPicker: false
      LeaveType:
        type: string
        required: true
        label: Leave Type
        editable: true
        options: [annual, sick, personal, maternity, paternity, bereavement, other]
      StartDate: { type: date, required: true, label: Start Date, editable: true }
      EndDate: { type: date, required: true, label: End Date, editable: true }
      Days: { type: decimal, required: true, label: Days, editable: true }
      Reason: { type: textarea, label: Reason, editable: true }
      Status:
        type: string
        required: true
        label: Status
        editable: true
        options: [pending, approved, rejected, cancelled]
      Approver: { type: string, label: Approver, editable: true }
      AppliedAt: { type: datetime, label: Applied At, editable: true }
    columns:
      Id: { type: int, identity: true, label: ID, sortable: true }
      EmployeeId: { type: int, required: true, label: Employee ID, hidden: true }
      EmployeeNo: { type: string, label: Employee No, expression: e.EmployeeNo, searchable: true, sortable: true }
      EmployeeName: { type: string, label: Employee, expression: e.FullName, searchable: true, sortable: true }
      DepartmentName: { type: string, label: Department, expression: d.Name, searchable: true, sortable: true }
      LeaveType: { type: string, required: true, label: Leave Type, sortable: true }
      StartDate: { type: date, required: true, label: Start Date, sortable: true }
      EndDate: { type: date, required: true, label: End Date, sortable: true }
      Days: { type: decimal, required: true, label: Days, sortable: true }
      Status: { type: string, label: Status, sortable: true }
      Approver: { type: string, label: Approver, searchable: true, sortable: true }
      AppliedAt: { type: datetime, label: Applied At, sortable: true }
      Reason: { type: string, label: Reason, searchable: true, sortable: false }
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order: [EmployeeId, LeaveType, StartDate, EndDate, Days, Status, Approver, AppliedAt, Reason]
      filters:
        columns: 4
        order: [EmployeeId, LeaveType, Status, StartDate]
    softDelete: false
    filters:
      EmployeeId:
        type: dropdown
        label: Employee
        expression: LeaveRequest.EmployeeId
        foreignKey:
          entity: employee
          displayColumn: FullName
      LeaveType:
        type: dropdown
        label: Leave Type
        options: [annual, sick, personal, maternity, paternity, bereavement, other]
      Status:
        type: dropdown
        label: Status
        options: [pending, approved, rejected, cancelled]
      StartDate:
        type: date-range
        label: Start Date
        expression: LeaveRequest.StartDate
    links:
      employee:
        label: Employee
        targetEntity: employee
        filter:
          Id: EmployeeId
    isCompositeKey: false

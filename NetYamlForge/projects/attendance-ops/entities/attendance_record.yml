imports: []
entities:
  attendance_record:
    table: AttendanceRecord
    key: Id
    keys: []
    displayName: Attendance Record
    joins:
      - type: left
        table: Employee
        alias: e
        true: AttendanceRecord.EmployeeId = e.Id
      - type: left
        table: Department
        alias: d
        true: e.DepartmentId = d.Id
      - type: left
        table: Shift
        alias: s
        true: AttendanceRecord.ShiftId = s.Id
    forms:
      EmployeeId:
        type: int
        required: true
        label: Employee
        editable: true
        foreignKey:
          entity: employee
          displayColumn: FullName
          displayColumns: [EmployeeNo, FullName]
          picker: true
          multiPicker: false
      WorkDate: { type: date, required: true, label: Work Date, editable: true }
      ShiftId:
        type: int
        label: Shift
        editable: true
        foreignKey:
          entity: shift
          displayColumn: ShiftName
          displayColumns: [ShiftCode, ShiftName]
          picker: false
          multiPicker: false
      CheckInTime: { type: datetime, label: Check In Time, editable: true }
      CheckOutTime: { type: datetime, label: Check Out Time, editable: true }
      AttendanceStatus:
        type: string
        required: true
        label: Attendance Status
        editable: true
        options: [present, late, early_leave, absent, on_leave, on_business_trip]
      OvertimeHours: { type: decimal, label: Overtime Hours, editable: true }
      Source:
        type: string
        label: Source
        editable: true
        options: [mobile, web, terminal, import]
      Remark: { type: textarea, label: Remark, editable: true }
    columns:
      Id: { type: int, identity: true, label: ID, sortable: true }
      EmployeeId: { type: int, required: true, label: Employee ID, hidden: true }
      EmployeeNo: { type: string, label: Employee No, expression: e.EmployeeNo, searchable: true, sortable: true }
      EmployeeName: { type: string, label: Employee, expression: e.FullName, searchable: true, sortable: true }
      DepartmentName: { type: string, label: Department, expression: d.Name, searchable: true, sortable: true }
      WorkDate: { type: date, required: true, label: Work Date, sortable: true }
      ShiftId: { type: int, label: Shift ID, hidden: true }
      ShiftName: { type: string, label: Shift, expression: s.ShiftName, sortable: true }
      CheckInTime: { type: datetime, label: Check In Time, sortable: true }
      CheckOutTime: { type: datetime, label: Check Out Time, sortable: true }
      AttendanceStatus: { type: string, label: Attendance Status, sortable: true }
      OvertimeHours: { type: decimal, label: Overtime Hours, sortable: true }
      Source: { type: string, label: Source, sortable: true }
      Remark: { type: string, label: Remark, searchable: true, sortable: false }
    paging:
      pageSize: 30
      mode: numbered
    layout:
      forms:
        columns: 2
        order: [EmployeeId, WorkDate, ShiftId, AttendanceStatus, CheckInTime, CheckOutTime, OvertimeHours, Source, Remark]
      filters:
        columns: 4
        order: [EmployeeId, WorkDate, AttendanceStatus, ShiftId, Source]
    softDelete: false
    filters:
      EmployeeId:
        type: dropdown
        label: Employee
        expression: AttendanceRecord.EmployeeId
        foreignKey:
          entity: employee
          displayColumn: FullName
      WorkDate:
        type: date-range
        label: Work Date
        expression: AttendanceRecord.WorkDate
      AttendanceStatus:
        type: dropdown
        label: Attendance Status
        options: [present, late, early_leave, absent, on_leave, on_business_trip]
      ShiftId:
        type: dropdown
        label: Shift
        expression: AttendanceRecord.ShiftId
        foreignKey:
          entity: shift
          displayColumn: ShiftName
      Source:
        type: dropdown
        label: Source
        options: [mobile, web, terminal, import]
    links:
      employee:
        label: Employee
        targetEntity: employee
        filter:
          Id: EmployeeId
      shift:
        label: Shift
        targetEntity: shift
        filter:
          Id: ShiftId
    isCompositeKey: false

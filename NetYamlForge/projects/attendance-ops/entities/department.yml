imports: []
entities:
  department:
    table: Department
    key: Id
    keys: []
    displayName: Department
    joins: []
    forms:
      Name: { type: string, required: true, label: Department Name, editable: true }
      Code: { type: string, required: true, label: Department Code, editable: true }
      Status:
        type: string
        required: true
        label: Status
        editable: true
        options: [active, archived]
      Description: { type: textarea, label: Description, editable: true }
    columns:
      Id: { type: int, identity: true, label: ID, sortable: true }
      Name: { type: string, required: true, label: Department Name, searchable: true, sortable: true }
      Code: { type: string, required: true, label: Department Code, searchable: true, sortable: true }
      Status: { type: string, label: Status, sortable: true }
      Description: { type: string, label: Description, searchable: true, sortable: false }
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order: [Name, Code, Status, Description]
      filters:
        columns: 2
        order: [Status]
    softDelete: false
    filters:
      Status:
        type: dropdown
        label: Status
        options: [active, archived]
    links:
      employees:
        label: Employees
        targetEntity: employee
        filter:
          DepartmentId: Id
    isCompositeKey: false

imports: []
entities:
  employee:
    table: Employee
    key: Id
    keys: []
    displayName: Employee
    joins:
      - type: left
        table: Department
        alias: d
        true: Employee.DepartmentId = d.Id
    forms:
      EmployeeNo: { type: string, required: true, label: Employee No, editable: true }
      FullName: { type: string, required: true, label: Full Name, editable: true }
      DepartmentId:
        type: int
        required: true
        label: Department
        editable: true
        foreignKey:
          entity: department
          displayColumn: Name
          picker: false
          multiPicker: false
      EmploymentType:
        type: string
        required: true
        label: Employment Type
        editable: true
        options: [full_time, part_time, contractor, intern]
      HireDate: { type: date, required: true, label: Hire Date, editable: true }
      Phone: { type: string, label: Phone, editable: true }
      Email: { type: string, label: Email, editable: true }
      Status:
        type: string
        required: true
        label: Status
        editable: true
        options: [active, probation, leave, resigned]
    columns:
      Id: { type: int, identity: true, label: ID, sortable: true }
      EmployeeNo: { type: string, required: true, label: Employee No, searchable: true, sortable: true }
      FullName: { type: string, required: true, label: Full Name, searchable: true, sortable: true }
      DepartmentId: { type: int, required: true, label: Department ID, hidden: true }
      DepartmentName: { type: string, label: Department, expression: d.Name, searchable: true, sortable: true }
      EmploymentType: { type: string, required: true, label: Employment Type, sortable: true }
      HireDate: { type: date, required: true, label: Hire Date, sortable: true }
      Phone: { type: string, label: Phone, searchable: true, sortable: false }
      Email: { type: string, label: Email, searchable: true, sortable: false }
      Status: { type: string, label: Status, sortable: true }
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order: [EmployeeNo, FullName, DepartmentId, EmploymentType, HireDate, Status, Phone, Email]
      filters:
        columns: 3
        order: [DepartmentId, EmploymentType, Status]
    softDelete: false
    filters:
      DepartmentId:
        type: dropdown
        label: Department
        expression: Employee.DepartmentId
        foreignKey:
          entity: department
          displayColumn: Name
      EmploymentType:
        type: dropdown
        label: Employment Type
        options: [full_time, part_time, contractor, intern]
      Status:
        type: dropdown
        label: Status
        options: [active, probation, leave, resigned]
    links:
      attendance:
        label: Attendance
        targetEntity: attendance_record
        filter:
          EmployeeId: Id
      leaveRequests:
        label: Leave Requests
        targetEntity: leave_request
        filter:
          EmployeeId: Id
      overtimeRequests:
        label: Overtime Requests
        targetEntity: overtime_request
        filter:
          EmployeeId: Id
    isCompositeKey: false

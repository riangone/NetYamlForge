imports: []
entities:
  shift:
    table: Shift
    key: Id
    keys: []
    displayName: Shift
    joins: []
    forms:
      ShiftCode: { type: string, required: true, label: Shift Code, editable: true }
      ShiftName: { type: string, required: true, label: Shift Name, editable: true }
      StartTime: { type: string, required: true, label: Start Time, editable: true }
      EndTime: { type: string, required: true, label: End Time, editable: true }
      BreakMinutes: { type: int, label: Break Minutes, editable: true }
      Status:
        type: string
        required: true
        label: Status
        editable: true
        options: [active, archived]
    columns:
      Id: { type: int, identity: true, label: ID, sortable: true }
      ShiftCode: { type: string, required: true, label: Shift Code, searchable: true, sortable: true }
      ShiftName: { type: string, required: true, label: Shift Name, searchable: true, sortable: true }
      StartTime: { type: string, required: true, label: Start Time, sortable: true }
      EndTime: { type: string, required: true, label: End Time, sortable: true }
      BreakMinutes: { type: int, label: Break Minutes, sortable: true }
      Status: { type: string, label: Status, sortable: true }
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order: [ShiftCode, ShiftName, StartTime, EndTime, BreakMinutes, Status]
      filters:
        columns: 2
        order: [Status]
    softDelete: false
    filters:
      Status:
        type: dropdown
        label: Status
        options: [active, archived]
    links:
      attendance:
        label: Attendance
        targetEntity: attendance_record
        filter:
          ShiftId: Id
    isCompositeKey: false

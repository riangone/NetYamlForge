name: attendance-ops
displayName: Attendance Operations
version: "1.0.0"

# AI向けヒント: このプロジェクトに変更を加える前に必ず参照すること
aiHints:
  primaryLanguage: zh-CN
  authRequired: true
  customHooks: []
  approvalWorkflow:
    leave_request:
      statusField: status
      transitions:
        pending: [approved, rejected]
        approved: []
        rejected: []
    overtime_request:
      statusField: status
      transitions:
        pending: [approved, rejected]
        approved: []
        rejected: []
  notes:
    - "leave_request / overtime_request は承認ワークフロー付き（status 直接変更は PageRowMutationService 経由）"
    - "勤怠レコードの clock_in / clock_out は時系列順でなければならない"
    - "UIは中国語（zh-CN）メイン。新しいラベルは displayNameI18n に zh-CN キーを含めること"

database:
  type: sqlite
  path: database/attendance.db
features:
  multiLanguage: true
  userAuthentication: true
layout:
  dashboardTheme: workspace
  header:
    title: Attendance Operations
  navigation:
    showDashboard: true
    entities:
      - attendance_record
      - employee
      - leave_request
      - overtime_request
      - department
      - shift
    items:
      - label: 考勤首页
        url: /attendance-ops/Page/AttendancePortal
        icon: 🏠
      - label: 打卡页面
        url: /attendance-ops/Page/ClockInCenter
        icon: 🕒
      - label: 员工页面
        url: /attendance-ops/Page/EmployeeHub
        icon: 👥
      - label: 管理页面
        url: /attendance-ops/Page/ManagementConsole
        icon: 📊
      - label: 审批页面
        url: /attendance-ops/Page/ApprovalCenter
        icon: ✅
      - label: 数据看板
        controller: Dashboard
        action: Index
        icon: 📈

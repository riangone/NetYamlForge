hero:
  eyebrow: AI Card
  title: QR を見せる
  description: まず相手に QR コードを読み取ってもらいます。必要な管理機能はあとから開けます。
  primaryActionLabel: QR を見せる
  primaryActionUrl: /ai-card/Page/StarterOverview
  secondaryActionLabel: 新しい QR を発行
  secondaryActionUrl: /ai-card/Page/QrGenerator
  highlights:
    - QR を表示
    - 読み取り履歴
    - AI ID 管理

metrics:

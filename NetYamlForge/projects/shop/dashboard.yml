stats:
- label: 商品総数
  entity: product
  aggregate: count
  icon: 🛍️
  color: badge-primary
  labelKey: projects.shop.dashboard.stats.0.label

- label: 公開商品数
  entity: product
  aggregate: count
  filter: "is_active = 1"
  icon: ✅
  color: badge-success
  labelKey: projects.shop.dashboard.stats.1.label

- label: カテゴリ数
  entity: category
  aggregate: count
  icon: 📂
  color: badge-secondary
  labelKey: projects.shop.dashboard.stats.2.label

- label: 在庫10個未満
  entity: product
  aggregate: count
  filter: "stock < 10 AND is_active = 1"
  icon: ⚠️
  color: badge-warning
  labelKey: projects.shop.dashboard.stats.3.label

charts:
- title: カテゴリ別商品数
  type: bar
  entity: product
  valueAggregate: count
  groupExpression: "cat.name"
  joinClause: "LEFT JOIN category cat ON product.category_id = cat.id"
  titleKey: projects.shop.dashboard.charts.0.title

- title: カテゴリ別在庫合計
  type: doughnut
  entity: product
  valueAggregate: sum
  valueColumn: stock
  groupExpression: "cat.name"
  joinClause: "LEFT JOIN category cat ON product.category_id = cat.id"
  filter: "is_active = 1"
  titleKey: projects.shop.dashboard.charts.1.title

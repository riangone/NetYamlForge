entities:
  category:
    table: category
    key: id
    displayName: 'カテゴリ'
    softDelete: true

    paging:
      pageSize: 20
      mode: numbered

    layout:
      forms:
        columns: 1
        order: [name, description]
      filters:
        columns: 4
        order: []

    columns:
      id: { type: int, identity: true, label: 'ID', sortable: true }
      name: { type: string, required: true, label: 'カテゴリ名', searchable: true, sortable: true }
      description: { type: string, label: '説明', searchable: true }

    forms:
      name: { type: string, required: true, label: 'カテゴリ名', editable: true }
      description: { type: string, label: '説明', editable: true }

    filters: {}
    links:
      products:
        label: '商品一覧'
        entity: product
        filter:
          category_id: "{id}"

pages:
  component_gallery:
    path: ComponentGallery
    title: "UI 部品ギャラリー"
    icon: "🎨"
    sections:
      - title: "テキスト入力部品"
        type: content
        content: |
          ## テキスト入力部品
      
          基本的なテキスト入力から、特殊なフォーマットまで、様々なテキスト入力部品をサポートしています。

      - title: "テキストフィールド一覧"
        type: grid
        columns: 3
        cards:
          - title: "Text Field"
            component: text
            props:
              type: string
              placeholder: "テキストを入力"
          - title: "Email Field"
            component: text
            props:
              type: email
              placeholder: "email@example.com"
          - title: "URL Field"
            component: text
            props:
              type: url
              placeholder: "https://example.com"
          - title: "Tel Field"
            component: text
            props:
              type: tel
              placeholder: "03-1234-5678"
          - title: "Password Field"
            component: text
            props:
              type: password
              placeholder: "パスワード"
          - title: "Text Area"
            component: textarea
            props:
              rows: 3
              placeholder: "複数行テキスト"

      - title: "数値入力部品"
        type: grid
        columns: 3
        cards:
          - title: "Number Input"
            component: number
            props:
              min: 0
              max: 100
          - title: "Decimal Input"
            component: number
            props:
              step: 0.01
              precision: 2
          - title: "Range Slider"
            component: range
            props:
              min: 0
              max: 100
          - title: "Rating"
            component: rating
            props:
              max: 5
          - title: "Money Input"
            component: money
            props:
              currency: JPY
          - title: "Percent Input"
            component: percent
            props:
              min: 0
              max: 100

      - title: "選択部品"
        type: grid
        columns: 3
        cards:
          - title: "Select Box"
            component: select
            props:
              options: ["Option 1", "Option 2", "Option 3"]
          - title: "Radio Group"
            component: radio
            props:
              options: ["A", "B", "C"]
          - title: "Toggle Group"
            component: toggle-group
            props:
              options:
                - label: "📝 下書き"
                  value: draft
                - label: "📤 公開"
                  value: published
          - title: "Multi Select"
            component: multi-select
            props:
              options: ["HTML", "CSS", "JavaScript"]
          - title: "Checkbox Group"
            component: checkbox-group
            props:
              options: ["Feature 1", "Feature 2", "Feature 3"]
          - title: "Switch Group"
            component: switch-group
            props:
              options:
                - label: "メール"
                  value: email
                - label: "プッシュ"
                  value: push

      - title: "日付・時間部品"
        type: grid
        columns: 3
        cards:
          - title: "Date Picker"
            component: date
          - title: "DateTime Picker"
            component: datetime
          - title: "Date Range"
            component: date-range

      - title: "ファイル部品"
        type: grid
        columns: 2
        cards:
          - title: "File Upload"
            component: file
            props:
              accept: ".pdf,.doc,.docx"
              maxSize: "10MB"
          - title: "Image Upload"
            component: image
            props:
              accept: "image/*"
              maxSize: "5MB"

      - title: "その他部品"
        type: grid
        columns: 3
        cards:
          - title: "Color Picker"
            component: color
          - title: "Tags Input"
            component: tags
          - title: "Autocomplete"
            component: autocomplete
          - title: "JSON Editor"
            component: json
          - title: "Signature Pad"
            component: signature
          - title: "Map Selector"
            component: map

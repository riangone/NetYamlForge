pages:
  overview:
    path: Overview
    title: "Framework Showcase - 概要"
    icon: "🏠"
    sections:
      - title: "NetYamlForge フレームワーク機能一覧"
        type: content
        content: |
          # NetYamlForge フレームワークへようこそ
      
          このプロジェクトでは、NetYamlForge フレームワークが提供する**全ての機能**を実際に操作しながら学ぶことができます。
      
          ## 主な機能カテゴリ
      
          ### 📝 フォーム部品
          30 種類以上のフォームフィールドタイプをサポート：
          - テキスト系：string, email, url, tel, password, textarea, richtext, markdown, code
          - 数値系：int, decimal, money, percent, range, rating
          - 日付系：date, datetime, datetime-range
          - 選択系：select, radio, toggle-group, multi-select, checkbox-group, switch-group
          - ファイル系：file, image
          - その他：color, tags, autocomplete, json, signature, map, sortable-list
      
          ### 🔍 フィルター機能
          10 種類のフィルタータイプ：
          - like, eq, dropdown, toggle-group, multi-select, bool-toggle, date-range, gte, lte, entity-picker
      
          ### 📐 レイアウト機能
          - グリッドレイアウト（1-4 カラム）
          - タブ表示
          - アコーディオン
          - ウィザード形式
      
          ### ⚙️ バッチ処理
          - Cron スケジューリング
          - SQL→CSV エクスポート
          - SQL コマンド実行
          -  stored procedure 実行
      
          ### 🎣 フックシステム
          - before_create / after_create
          - before_update / after_update
          - before_delete / after_delete
      
          ### 📤 エクスポート機能
          - CSV / JSON / PDF フォーマット
          - カスタム SQL ベースのエクスポート
          - PDF レイアウトカスタマイズ


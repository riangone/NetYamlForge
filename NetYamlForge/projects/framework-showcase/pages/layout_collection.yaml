pages:
  layout_collection:
    path: LayoutCollection
    title: "レイアウト集"
    icon: "🖼️"
    sections:
      - title: "グリッドレイアウト"
        type: content
        content: |
          ## グリッドレイアウト
      
          1 カラムから 4 カラムまでのグリッドレイアウトをサポートしています。
      
          ### レイアウトパターン
      
          **1 カラム**: 縦長のフォーム、詳細入力に適しています
      
          **2 カラム**: 標準的なフォーム、バランスの良いレイアウトです
      
          **3 カラム**: 密度の高い情報表示、ダッシュボードに適しています
      
          **4 カラム**:  компак トな表示、フィルターエリアなどに最適です

      - title: "2 カラムレイアウト例"
        type: grid
        columns: 2
        cards:
          - title: "カード 1"
            content: "左側のカードです。2 カラムレイアウトでは、このように左右に要素を配置できます。"
          - title: "カード 2"
            content: "右側のカードです。バランスの良いレイアウトで、視認性が向上します。"

      - title: "3 カラムレイアウト例"
        type: grid
        columns: 3
        cards:
          - title: "カード A"
            content: "左"
          - title: "カード B"
            content: "中央"
          - title: "カード C"
            content: "右"

      - title: "タブレイアウト"
        type: tabs
        tabs:
          - label: "タブ 1"
            content: |
              ### タブ 1 の内容
      
              これはタブ 1 のコンテンツです。タブを切り替えて、異なるコンテンツを表示できます。
          - label: "タブ 2"
            content: |
              ### タブ 2 の内容
      
              これはタブ 2 のコンテンツです。長いフォームを複数のタブに分割して、整理できます。
          - label: "タブ 3"
            content: |
              ### タブ 3 の内容
      
              これはタブ 3 のコンテンツです。関連する情報ごとにタブを分けることで、使いやすくなります。

      - title: "アコーディオンレイアウト"
        type: accordion
        items:
          - label: "セクション 1: 基本情報"
            content: |
              ### 基本情報
      
              - 項目 A: 値 A
              - 項目 B: 値 B
              - 項目 C: 値 C
      
              アコーディオンを使うと、情報を階層的に整理できます。
          - label: "セクション 2: 詳細設定"
            content: |
              ### 詳細設定
      
              - 設定 X: 有効
              - 設定 Y: 無効
              - 設定 Z: カスタム
      
              通常は隠しておき、必要な時だけ展開して表示します。
          - label: "セクション 3: 高度な設定"
            content: |
              ### 高度な設定
      
              - 上級者向けオプション
              - 実験的な機能
              - カスタム設定
      
              頻繁に変更しない設定は、アコーディオンで隠すのがおすすめです。

      - title: "統計カード"
        type: stats
        stats:
          - label: "総ユーザー数"
            value: "12,345"
            trend: "+12%"
          - label: "アクティブセッション"
            value: "1,234"
            trend: "+5%"
          - label: "平均処理時間"
            value: "0.23 秒"
            trend: "-8%"
          - label: "エラーレート"
            value: "0.01%"
            trend: "-15%"

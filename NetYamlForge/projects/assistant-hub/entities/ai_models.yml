imports: []
entities:
  ai_models:
    table: ai_models
    key: Id
    displayName: AIモデル
    description: 利用可能なAIモデルを管理します
    softDelete: false
    isPublic: false

    # ── フォーム ────────────────────────────────────────────
    forms:
      Name:
        type: string
        required: true
        label: モデル名（内部用）
        editable: true
      DisplayName:
        type: string
        required: true
        label: 表示名
        editable: true
      Provider:
        type: string
        required: true
        label: プロバイダー
        editable: true
        options:
          - OpenAI
          - Anthropic
          - Google
          - Ollama
          - Custom
      ModelIdentifier:
        type: string
        required: true
        label: モデルID（API用）
        editable: true
      ApiKey:
        type: string
        label: API キー
        editable: true
      BaseUrl:
        type: string
        label: ベース URL
        editable: true
      Description:
        type: textarea
        label: 説明
        editable: true
      MaxTokens:
        type: int
        label: 最大トークン数
        editable: true
      Temperature:
        type: decimal
        label: 温度（0.0-2.0）
        editable: true
        precision: 2
      TopP:
        type: decimal
        label: Top P（0.0-1.0）
        editable: true
        precision: 2
      IsActive:
        type: bool
        label: アクティブ
        editable: true
      IsDefault:
        type: bool
        label: デフォルトモデル
        editable: true
      SortOrder:
        type: int
        label: 表示順
        editable: true
      CostPerMillionTokens:
        type: decimal
        label: 100万トークンあたりのコスト（$）
        editable: true
        precision: 4

    # ── 一覧表示列 ────────────────────────────────────────────
    columns:
      Id:
        type: int
        identity: true
        label: ID
        sortable: true
      Name:
        type: string
        required: true
        label: モデル名
        searchable: true
        sortable: true
      DisplayName:
        type: string
        required: true
        label: 表示名
        searchable: true
        sortable: true
      Provider:
        type: string
        required: true
        label: プロバイダー
        sortable: true
        optionLabels:
          OpenAI: "🟢 OpenAI"
          Anthropic: "🔴 Anthropic"
          Google: "🔵 Google"
          Ollama: "🟣 Ollama"
          Custom: "⚪ カスタム"
      ModelIdentifier:
        type: string
        label: モデルID
        searchable: true
        sortable: true
      Description:
        type: string
        label: 説明
        searchable: true
      MaxTokens:
        type: int
        label: 最大トークン
        sortable: true
      Temperature:
        type: decimal
        label: 温度
        sortable: true
        precision: 2
      TopP:
        type: decimal
        label: Top P
        sortable: true
        precision: 2
      IsActive:
        type: bool
        label: アクティブ
        sortable: true
      IsDefault:
        type: bool
        label: デフォルト
        sortable: true
      SortOrder:
        type: int
        label: 表示順
        sortable: true
      CostPerMillionTokens:
        type: decimal
        label: コスト（$）
        sortable: true
        precision: 4
      CreatedAt:
        type: datetime
        label: 作成日
        sortable: true
      UpdatedAt:
        type: datetime
        label: 更新日
        sortable: true

    # ── フィルター ──────────────────────────────────────────
    filters:
      Provider:
        type: dropdown
        label: プロバイダー
        options:
          - OpenAI
          - Anthropic
          - Google
          - Ollama
          - Custom
      IsActive:
        type: bool
        label: アクティブのみ
      IsDefault:
        type: bool
        label: デフォルトのみ
      Name:
        type: like
        label: モデル名検索
      DisplayName:
        type: like
        label: 表示名検索
      MaxTokens:
        type: number-range
        label: 最大トークン範囲
        expression: ai_models.MaxTokens
      Temperature:
        type: number-range
        label: 温度範囲
        expression: ai_models.Temperature
      CostPerMillionTokens:
        type: number-range
        label: コスト範囲
        expression: ai_models.CostPerMillionTokens
      CreatedAt:
        type: date-range
        label: 作成日範囲
        expression: ai_models.CreatedAt

    # ── 組み込みフック ────────────────────────────────────────
    hooks:
      beforeCreate:
        - normalize_title
      afterCreate:
        - audit_log
      beforeUpdate:
        - normalize_title
      afterUpdate:
        - audit_log

    # ── カスタムアクション ──────────────────────────────────
    actions:
      test_connection:
        label: "接続テスト"
        scope: row
        confirm: "このモデルへの接続をテストしますか？"
        handler: assistant_hub_test_model_connection
      set_default:
        label: "デフォルトに設定"
        scope: row
        handler: assistant_hub_set_default_model
      clone:
        label: "複製"
        scope: row
        handler: assistant_hub_clone_model
      disable_all_others:
        label: "他をすべて無効化"
        scope: header
        confirm: "このモデル以外をすべて無効にしますか？"
        handler: assistant_hub_disable_all_others

    # ── エクスポート ────────────────────────────────────────
    exports:
      models_csv:
        label: "モデル一覧 CSV"
        format: csv
        filename: "ai_models_{date:yyyyMMdd}.csv"
        columns:
          - Name
          - DisplayName
          - Provider
          - MaxTokens
          - Temperature
          - IsActive
          - IsDefault

      models_json:
        label: "モデル一覧 JSON"
        format: json
        filename: "ai_models_{date:yyyyMMdd}.json"

      models_pdf:
        label: "モデル設定書 PDF"
        format: pdf
        filename: "models_catalog_{date:yyyyMMdd}.pdf"
        columns:
          - DisplayName
          - Provider
          - MaxTokens
          - Temperature
          - IsActive
          - CostPerMillionTokens
        pdf:
          title: "AI Model Catalog"
          pageSize: A4
          orientation: landscape
          headerColor: "#374151"
          oddRowColor: "#F3F4F6"
          showPageNumbers: true
          showGeneratedAt: true
          columns:
            - key: DisplayName
              width: 25
            - key: Provider
              width: 15
              align: center
            - key: MaxTokens
              width: 12
              align: right
            - key: Temperature
              width: 10
              align: right
            - key: IsActive
              width: 10
              align: center
            - key: CostPerMillionTokens
              width: 12
              align: right

    # ── フォーム・フィルターレイアウト ────────────────────────
    layout:
      forms:
        columns: 2
        order:
          - Name
          - DisplayName
          - Provider
          - ModelIdentifier
          - ApiKey
          - BaseUrl
          - Description
          - MaxTokens
          - Temperature
          - TopP
          - IsActive
          - IsDefault
          - SortOrder
          - CostPerMillionTokens
      filters:
        columns: 4
        order:
          - Provider
          - IsActive
          - IsDefault
          - Name
          - DisplayName
          - MaxTokens
          - Temperature
          - CostPerMillionTokens
          - CreatedAt

    # ── ページング ────────────────────────────────────────────
    paging:
      pageSize: 20
      mode: numbered
      enableCount: true

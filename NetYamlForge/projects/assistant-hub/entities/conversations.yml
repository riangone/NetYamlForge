imports: []
entities:
  conversations:
    table: conversations
    key: Id
    displayName: 会話
    description: AIとの会話セッションを管理します
    softDelete: false
    isPublic: false

    # ── テーブル結合：AIモデル情報を取得 ────────────────────
    joins:
      - type: left
        table: ai_models
        alias: models
        on: conversations.ModelId = models.Id

    # ── フォーム（全フィールドタイプのデモ） ──────────────────
    forms:
      Title:
        type: string
        required: true
        label: 会話タイトル
        editable: true
      ModelId:
        type: int
        required: true
        label: AIモデル
        editable: true
        foreignKey:
          entity: ai_models
          displayColumn: DisplayName
          picker: false
          multiPicker: false
      Status:
        type: string
        required: true
        label: ステータス
        editable: true
        options:
          - active
          - paused
          - archived
      Theme:
        type: string
        label: テーマ
        editable: true
        options:
          - light
          - dark
          - auto
      Language:
        type: string
        label: 言語
        editable: true
        options:
          - ja
          - en
          - zh
          - ko
      MessageCount:
        type: int
        label: メッセージ数
        editable: false
      TotalTokens:
        type: int
        label: 総トークン数
        editable: false
      SystemPrompt:
        type: textarea
        label: システムプロンプト
        editable: true
      Notes:
        type: textarea
        label: メモ
        editable: true
      IsPublic:
        type: bool
        label: 公開会話
        editable: true

    # ── 一覧表示列 ────────────────────────────────────────────
    columns:
      Id:
        type: int
        identity: true
        label: ID
        sortable: true
      Title:
        type: string
        required: true
        label: 会話タイトル
        searchable: true
        sortable: true
      ModelId:
        type: int
        label: モデルID
        hidden: true
      ModelName:
        type: string
        label: AIモデル
        expression: models.DisplayName
        searchable: true
        sortable: true
      Status:
        type: string
        required: true
        label: ステータス
        sortable: true
        optionLabels:
          active: "🟢 アクティブ"
          paused: "⏸️ 一時停止"
          archived: "📦 アーカイブ"
      Theme:
        type: string
        label: テーマ
        sortable: true
        optionLabels:
          light: "☀️ ライト"
          dark: "🌙 ダーク"
          auto: "🔄 自動"
      Language:
        type: string
        label: 言語
        sortable: true
        optionLabels:
          ja: "🇯🇵 日本語"
          en: "🇬🇧 English"
          zh: "🇨🇳 中文"
          ko: "🇰🇷 한국어"
      MessageCount:
        type: int
        label: メッセージ数
        sortable: true
      TotalTokens:
        type: int
        label: トークン数
        sortable: true
      IsPublic:
        type: bool
        label: 公開
        sortable: true
      CreatedAt:
        type: datetime
        label: 作成日
        sortable: true
      UpdatedAt:
        type: datetime
        label: 更新日
        sortable: true

    # ── フィルター（全タイプのデモ） ─────────────────────────
    filters:
      Status:
        type: toggle-group
        label: ステータス
        optionLabels:
          active: "🟢 アクティブ"
          paused: "⏸️ 一時停止"
          archived: "📦 アーカイブ"
      ModelId:
        type: dropdown
        label: AIモデル
        expression: conversations.ModelId
        foreignKey:
          entity: ai_models
          displayColumn: DisplayName
      Theme:
        type: dropdown
        label: テーマ
        options:
          - light
          - dark
          - auto
      Language:
        type: dropdown
        label: 言語
        options:
          - ja
          - en
          - zh
          - ko
      Title:
        type: like
        label: タイトル検索
      IsPublic:
        type: bool
        label: 公開のみ
      MessageCount:
        type: number-range
        label: メッセージ数範囲
        expression: conversations.MessageCount
      CreatedAt:
        type: date-range
        label: 作成日範囲
        expression: conversations.CreatedAt

    # ── 組み込みフック ────────────────────────────────────────
    hooks:
      beforeCreate:
        - normalize_title
      afterCreate:
        - audit_log
      beforeUpdate:
        - normalize_title
      afterUpdate:
        - audit_log
      beforeDelete:
        - audit_log

    # ── エンティティ間ナビゲーション ─────────────────────────
    links:
      messages:
        label: メッセージ
        targetEntity: messages
        filter:
          ConversationId: Id
      ai_models:
        label: AIモデル詳細
        targetEntity: ai_models
        filter:
          Id: ModelId

    # ── カスタムアクション ──────────────────────────────────
    actions:
      export_conversation:
        label: "会話をエクスポート"
        scope: row
        confirm: "この会話をエクスポートしますか？"
        handler: assistant_hub_export_conversation
      clear_messages:
        label: "メッセージ削除"
        scope: row
        confirm: "この会話のメッセージをすべて削除しますか？この操作は取り消せません。"
        handler: assistant_hub_clear_messages
      archive_old:
        label: "古い会話をアーカイブ"
        scope: header
        confirm: "30日以上前の非アクティブな会話をアーカイブしますか？"
        handler: assistant_hub_archive_old
      bulk_cleanup:
        label: "メッセージクリーンアップ"
        scope: header
        confirm: "全会話のメッセージを整理しますか？"
        handler: assistant_hub_bulk_cleanup

    # ── エクスポート（CSV / JSON / PDF） ────────────────────
    exports:
      conversations_csv:
        label: "会話一覧 CSV"
        format: csv
        filename: "conversations_{date:yyyyMMdd}.csv"
        columns:
          - Title
          - Status
          - Language
          - MessageCount
          - TotalTokens
          - CreatedAt

      conversations_json:
        label: "全会話 JSON"
        format: json
        filename: "conversations_{date:yyyyMMdd}.json"

      active_conversations_pdf:
        label: "アクティブ会話 PDF"
        format: pdf
        filename: "conversations_active_{date:yyyyMMdd}.pdf"
        columns:
          - Title
          - Status
          - Language
          - MessageCount
          - TotalTokens
          - CreatedAt
        pdf:
          title: "AI Assistant Hub - アクティブ会話一覧"
          pageSize: A4
          orientation: landscape
          headerColor: "#1E3A8A"
          oddRowColor: "#DBEAFE"
          showPageNumbers: true
          showGeneratedAt: true
          columns:
            - key: Title
              width: 35
            - key: Status
              width: 12
              align: center
            - key: Language
              width: 10
              align: center
            - key: MessageCount
              width: 12
              align: right
            - key: TotalTokens
              width: 12
              align: right
            - key: CreatedAt
              width: 19
              align: center

    # ── フォーム・フィルターレイアウト ────────────────────────
    layout:
      forms:
        columns: 2
        order:
          - Title
          - ModelId
          - Status
          - Theme
          - Language
          - IsPublic
          - SystemPrompt
          - Notes
          - MessageCount
          - TotalTokens
      filters:
        columns: 4
        order:
          - Status
          - ModelId
          - Theme
          - Language
          - Title
          - IsPublic
          - MessageCount
          - CreatedAt

    # ── ページング ────────────────────────────────────────────
    paging:
      pageSize: 20
      mode: numbered
      enableCount: true

imports: []
entities:
  user_settings:
    table: user_settings
    key: Id
    displayName: ユーザー設定
    description: ユーザーのパーソナライズ設定を管理します
    softDelete: false
    isPublic: false

    # ── フォーム ────────────────────────────────────────────
    forms:
      UserId:
        type: string
        required: true
        label: ユーザーID
        editable: true
      Theme:
        type: string
        required: true
        label: UI テーマ
        editable: true
        options:
          - light
          - dark
          - auto
      Language:
        type: string
        required: true
        label: 言語
        editable: true
        options:
          - ja
          - en
          - zh
          - ko
      DefaultModel:
        type: string
        label: デフォルト AIモデル
        editable: true
      DefaultTemperature:
        type: decimal
        label: デフォルト温度（0.0-2.0）
        editable: true
        precision: 2
      DefaultTopP:
        type: decimal
        label: デフォルト Top P（0.0-1.0）
        editable: true
        precision: 2
      DefaultMaxTokens:
        type: int
        label: デフォルト最大トークン
        editable: true
      NotificationsEnabled:
        type: bool
        label: 通知を有効化
        editable: true
      AutoSaveEnabled:
        type: bool
        label: 自動保存
        editable: true
      ShowSystemPrompt:
        type: bool
        label: システムプロンプト表示
        editable: true
      EnableCodeHighlight:
        type: bool
        label: コードハイライト有効
        editable: true
      EnableMathRendering:
        type: bool
        label: 数式レンダリング有効
        editable: true
      FontSize:
        type: string
        label: フォントサイズ
        editable: true
        options:
          - small
          - medium
          - large
      MessageDensity:
        type: string
        label: メッセージ密度
        editable: true
        options:
          - compact
          - normal
          - spacious
      HistoryRetentionDays:
        type: int
        label: 履歴保持日数
        editable: true
      MaxConversations:
        type: int
        label: 最大会話数
        editable: true
      PreferredHour:
        type: int
        label: 優先時間帯（0-23）
        editable: true
      Notes:
        type: textarea
        label: メモ
        editable: true

    # ── 一覧表示列 ────────────────────────────────────────────
    columns:
      Id:
        type: int
        identity: true
        label: ID
        sortable: true
      UserId:
        type: string
        required: true
        label: ユーザーID
        searchable: true
        sortable: true
        dbColumn: user_id
      user_id:
        type: string
        label: ユーザーID
        hidden: true
      Theme:
        type: string
        required: true
        label: テーマ
        sortable: true
        optionLabels:
          light: "☀️ ライト"
          dark: "🌙 ダーク"
          auto: "🔄 自動"
      Language:
        type: string
        required: true
        label: 言語
        sortable: true
        optionLabels:
          ja: "🇯🇵 日本語"
          en: "🇬🇧 English"
          zh: "🇨🇳 中文"
          ko: "🇰🇷 한국어"
      DefaultModel:
        type: string
        label: デフォルト AIモデル
        searchable: true
        sortable: true
      DefaultTemperature:
        type: decimal
        label: デフォルト温度
        sortable: true
        precision: 2
      DefaultTopP:
        type: decimal
        label: デフォルト Top P
        sortable: true
        precision: 2
      DefaultMaxTokens:
        type: int
        label: デフォルト最大トークン
        sortable: true
      NotificationsEnabled:
        type: bool
        label: 通知
        sortable: true
      AutoSaveEnabled:
        type: bool
        label: 自動保存
        sortable: true
      ShowSystemPrompt:
        type: bool
        label: システムプロンプト
        sortable: true
      FontSize:
        type: string
        label: フォントサイズ
        sortable: true
      MessageDensity:
        type: string
        label: メッセージ密度
        sortable: true
      CreatedAt:
        type: datetime
        label: 作成日
        sortable: true
      UpdatedAt:
        type: datetime
        label: 更新日
        sortable: true

    # ── フィルター ──────────────────────────────────────────
    filters:
      Theme:
        type: toggle-group
        label: テーマ
        optionLabels:
          light: "☀️ ライト"
          dark: "🌙 ダーク"
          auto: "🔄 自動"
      Language:
        type: dropdown
        label: 言語
        options:
          - ja
          - en
          - zh
          - ko
      DefaultModel:
        type: like
        label: デフォルト AIモデル検索
      NotificationsEnabled:
        type: bool
        label: 通知有効のみ
      AutoSaveEnabled:
        type: bool
        label: 自動保存有効のみ
      FontSize:
        type: dropdown
        label: フォントサイズ
        options:
          - small
          - medium
          - large
      MessageDensity:
        type: dropdown
        label: メッセージ密度
        options:
          - compact
          - normal
          - spacious
      DefaultTemperature:
        type: number-range
        label: デフォルト温度範囲
        expression: user_settings.DefaultTemperature
      HistoryRetentionDays:
        type: number-range
        label: 履歴保持日数範囲
        expression: user_settings.HistoryRetentionDays
      CreatedAt:
        type: date-range
        label: 作成日範囲
        expression: user_settings.CreatedAt

    # ── 組み込みフック ────────────────────────────────────────
    hooks:
      afterCreate:
        - audit_log
      afterUpdate:
        - audit_log

    # ── カスタムアクション ──────────────────────────────────
    actions:
      reset_defaults:
        label: "デフォルト設定にリセット"
        scope: row
        confirm: "この設定をデフォルトにリセットしますか？"
        handler: assistant_hub_reset_user_settings
      export_settings:
        label: "設定をエクスポート"
        scope: row
        handler: assistant_hub_export_user_settings
      import_settings:
        label: "設定をインポート"
        scope: row
        handler: assistant_hub_import_user_settings
        inputs:
          - name: SettingsFile
            type: file
            label: 設定ファイル（JSON）
            required: true
            allowedExtensions: ".json"
      batch_update_theme:
        label: "テーマを一括変更"
        scope: header
        inputs:
          - name: NewTheme
            type: string
            label: 新しいテーマ
            required: true
            options:
              - light
              - dark
              - auto
        handler: assistant_hub_batch_update_theme

    # ── エクスポート ────────────────────────────────────────
    exports:
      settings_csv:
        label: "設定一覧 CSV"
        format: csv
        filename: "user_settings_{date:yyyyMMdd}.csv"
        columns:
          - UserId
          - Theme
          - Language
          - DefaultModel
          - NotificationsEnabled
          - AutoSaveEnabled

      settings_json:
        label: "設定 JSON"
        format: json
        filename: "user_settings_{date:yyyyMMdd}.json"

      settings_pdf:
        label: "設定レポート PDF"
        format: pdf
        filename: "user_settings_{date:yyyyMMdd}.pdf"
        columns:
          - UserId
          - Theme
          - Language
          - DefaultModel
          - NotificationsEnabled
          - AutoSaveEnabled
        pdf:
          title: "User Settings Report"
          pageSize: A4
          orientation: landscape
          headerColor: "#7C3AED"
          oddRowColor: "#EDE9FE"
          showPageNumbers: true
          showGeneratedAt: true
          columns:
            - key: UserId
              width: 20
            - key: Theme
              width: 12
              align: center
            - key: Language
              width: 12
              align: center
            - key: DefaultModel
              width: 25
            - key: NotificationsEnabled
              width: 14
              align: center
            - key: AutoSaveEnabled
              width: 14
              align: center

    # ── フォーム・フィルターレイアウト ────────────────────────
    layout:
      forms:
        columns: 2
        order:
          - UserId
          - Theme
          - Language
          - DefaultModel
          - DefaultTemperature
          - DefaultTopP
          - DefaultMaxTokens
          - NotificationsEnabled
          - AutoSaveEnabled
          - ShowSystemPrompt
          - EnableCodeHighlight
          - EnableMathRendering
          - FontSize
          - MessageDensity
          - HistoryRetentionDays
          - MaxConversations
          - PreferredHour
          - Notes
      filters:
        columns: 4
        order:
          - Theme
          - Language
          - DefaultModel
          - NotificationsEnabled
          - AutoSaveEnabled
          - FontSize
          - MessageDensity
          - DefaultTemperature
          - HistoryRetentionDays
          - CreatedAt

    # ── ページング ────────────────────────────────────────────
    paging:
      pageSize: 20
      mode: numbered
      enableCount: true

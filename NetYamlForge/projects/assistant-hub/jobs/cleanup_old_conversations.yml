jobs:
  cleanup_old_conversations:
    displayName: "古い会話のクリーンアップ"
    description: "90日以上前のアーカイブ済み会話とそのメッセージを削除します。毎日 23:00 (JST) に実行。"
    enabled: true

    schedule:
      cron: "0 23 * * *"
      timezone: "Asia/Tokyo"

    type: sql_to_csv
    settings:
      sqlFile: jobs/sql/cleanup_old_conversations.sql
      outputFile: "jobs/output/cleanup_{date:yyyyMMdd}.csv"
      includeHeader: true
      delimiter: ","

    onFailure:
      retryCount: 1
      retryInterval: 300
      logError: true

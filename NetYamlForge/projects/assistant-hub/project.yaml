name: assistant-hub
displayName: "Assistant Hub"
description: "マルチAI統合チャットプラットフォーム。会話履歴・ユーザー設定・AI選択機能を備えたWeb UI"
version: "1.0.0"

aiHints:
  primaryLanguage: ja-JP
  notes:
    - "複数のAIプロバイダーを統合したチャットシステム"
    - "会話履歴・メッセージ管理・ユーザー設定を備える"
    - "レスポンシブUI対応（デスクトップ・モバイル）"

database:
  type: sqlite
  path: database/assistant-hub.db

features:
  multiLanguage: true
  userAuthentication: true
  dashboard: true
  pages: false

layout:
  dashboardTheme: workspace
  header:
    title: "Assistant Hub"
  navigation:
    showDashboard: true
    entities:
      - conversation
      - message
      - ai_provider
      - user_setting
    items:
      - label: ダッシュボード
        controller: Dashboard
        action: Index
        icon: 📊
        section: Overview
      - label: チャット
        url: /assistant-hub/DynamicEntity/Index?entity=conversation
        icon: 💬
        section: Chat
      - label: メッセージ一覧
        url: /assistant-hub/DynamicEntity/Index?entity=message
        icon: 💭
        section: Chat
      - label: AI プロバイダー
        url: /assistant-hub/DynamicEntity/Index?entity=ai_provider
        icon: 🤖
        section: Settings
      - label: ユーザー設定
        url: /assistant-hub/DynamicEntity/Index?entity=user_setting
        icon: ⚙️
        section: Settings

home_page:
  icon: "💬"
  tagline: "複数のAIと会話。あらゆる質問に即座に答える"
  tags: [ChatGPT, Claude, Gemini, AI統合, マルチモデル]

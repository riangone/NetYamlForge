name: ai-debate
displayName: "AI Debate Platform"
description: "2つの AI が指定テーマについて対話し、共通の見解を導き出すプラットフォーム"
version: "1.0.0"

database:
  type: sqlite
  path: database/ai-debate.db

features:
  multiLanguage: false
  userAuthentication: true
  dashboard: false
  pages: false

layout:
  dashboardTheme: workspace
  header:
    title: "AI Debate Platform"
  navigation:
    showDashboard: false
    entities: []
    items:
      - label: ディベート
        url: /ai-debate/AIDebate/Index
        icon: 🤖
        section: AI Debate

home_page:
  icon: "🤖"
  tagline: "AI同士がテーマについて対話・議論します"
  tags: [AI, Debate, Discussion, LLM]

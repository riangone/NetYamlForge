entities:
  company:
    table: company
    key: id
    displayName: 公司
    displayNameKey: company_display
    displayNameI18n:
      ja: 会社
      en: Company
      zh: 公司

    paging:
      pageSize: 20
      mode: numbered

    columns:
      id: { type: int, identity: true, label: 'ID', sortable: true }
      name: { type: string, required: true, label: '公司名称', searchable: true, sortable: true }
      industry: { type: string, label: '行业', sortable: true }
      website: { type: string, label: '网站' }
      phone: { type: string, label: '电话' }
      email: { type: string, label: '邮箱', sortable: true }
      employeeCount: { type: int, label: '员工数', sortable: true }
      rating: { type: string, label: '评级', sortable: true }
      createdAt: { type: string, label: '创建时间', sortable: true }

    forms:
      name: { type: string, required: true, label: '公司名称', editable: true }
      industry: { type: string, label: '行业', editable: true }
      website: { type: string, label: '网站', editable: true }
      phone: { type: string, label: '电话', editable: true }
      email: { type: string, label: '邮箱', editable: true }
      employeeCount: { type: int, label: '员工数', editable: true }
      rating: { type: string, label: '评级', editable: true, enum: ['A', 'B', 'C', 'D'] }
      createdAt: { type: string, label: '创建时间', editable: false }

    filters:
      industry: { type: text, label: '行业' }
      rating: { type: dropdown, label: '评级', options: ['A', 'B', 'C', 'D'] }

    hooks:
      beforeCreate:
        - trim:name
        - now:createdAt
      beforeUpdate:
        - trim:name

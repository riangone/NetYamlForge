# 仪表板配置
dashboard:
  title: 联系人管理仪表板
  description: 快速查看联系人和交互概况
  
  sections:
    - type: stats
      title: 快速统计
      cards:
        - title: 联系人总数
          query: SELECT COUNT(*) FROM contact
          icon: users
          color: blue
          link: /contact-manager/contact
        
        - title: 公司总数
          query: SELECT COUNT(*) FROM company
          icon: building
          color: green
          link: /contact-manager/company
        
        - title: 待跟进交互
          query: SELECT COUNT(*) FROM interaction WHERE status = 'planned' AND scheduledAt <= date('now', '+7 days')
          icon: calendar
          color: orange
          link: /contact-manager/interaction
        
        - title: 高优先级联系人
          query: SELECT COUNT(*) FROM contact WHERE priority = 'high' AND status = 'active'
          icon: star
          color: red
          link: /contact-manager/contact?priority=high
    
    - type: table
      title: 最近添加的联系人
      query: |
        SELECT 
          c.fullName as 姓名，
          c.title as 职位，
          co.name as 公司，
          c.email as 邮箱，
          c.phone as 电话，
          c.createdAt as 创建时间
        FROM contact c
        LEFT JOIN company co ON co.id = c.companyId
        ORDER BY c.createdAt DESC
        LIMIT 5
      linkColumn: 姓名
      linkPattern: /contact-manager/contact/edit/{id}
    
    - type: table
      title: 即将到来的交互
      query: |
        SELECT 
          i.subject as 主题，
          c.fullName as 联系人，
          i.type as 类型，
          i.scheduledAt as 计划时间，
          i.priority as 优先级
        FROM interaction i
        LEFT JOIN contact c ON c.id = i.contactId
        WHERE i.status = 'planned' AND i.scheduledAt >= date('now')
        ORDER BY i.scheduledAt ASC
        LIMIT 5
      linkColumn: 主题
      linkPattern: /contact-manager/interaction/edit/{id}
    
    - type: chart
      title: 本周交互概览
      chartType: bar
      query: |
        SELECT 
          CASE strftime('%w', scheduledAt)
            WHEN '0' THEN '周日'
            WHEN '1' THEN '周一'
            WHEN '2' THEN '周二'
            WHEN '3' THEN '周三'
            WHEN '4' THEN '周四'
            WHEN '5' THEN '周五'
            WHEN '6' THEN '周六'
          END as label,
          COUNT(*) as value
        FROM interaction
        WHERE scheduledAt >= date('now', '-6 days')
        GROUP BY strftime('%w', scheduledAt)
        ORDER BY strftime('%w', scheduledAt)

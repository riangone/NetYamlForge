stats:
  - label: 公司总数
    entity: company
    aggregate: count
    icon: 🏢
    color: badge-primary

  - label: 联系人总数
    entity: contact
    aggregate: count
    icon: 👥
    color: badge-success

  - label: 活跃联系人
    entity: contact
    aggregate: count
    filter: "status = 'active'"
    icon: ✅
    color: badge-accent

  - label: 待跟进交互
    entity: interaction
    aggregate: count
    filter: "status = 'planned'"
    icon: 📅
    color: badge-warning

  - label: 本周新增联系人
    entity: contact
    aggregate: count
    filter: "createdAt >= datetime('now', '-7 days')"
    icon: 🆕
    color: badge-info

  - label: 已完成交互
    entity: interaction
    aggregate: count
    filter: "status = 'completed'"
    icon: ✔️
    color: badge-primary

charts:
  - title: 联系人状态分布
    type: doughnut
    entity: contact
    valueAggregate: count
    groupExpression: status
    orderBy: value
    orderDir: desc

  - title: 交互类型统计
    type: bar
    entity: interaction
    valueAggregate: count
    groupExpression: type
    orderBy: value
    orderDir: desc

  - title: 联系人优先级分布
    type: pie
    entity: contact
    valueAggregate: count
    groupExpression: priority

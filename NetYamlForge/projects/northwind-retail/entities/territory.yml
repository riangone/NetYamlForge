      RegionID: { type: int, required: true, label: 地域 }
    forms:
      TerritoryID: { type: string, required: true, label: テリトリーID, editable: true }
      TerritoryDescription: { type: string, required: true, label: テリトリー名, editable: true }
      RegionID:
        type: int
        required: true
        label: 地域
        editable: true
        foreignKey:
          entity: region
          displayColumn: RegionDescription
    filters: {}
    links: {}

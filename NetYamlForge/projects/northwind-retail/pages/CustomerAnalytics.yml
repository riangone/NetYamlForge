title: 顧客分析ダッシュボード
sections:
  - id: customer_kpi
    component: stat_cards
    sourceType: custom
    source: |
      SELECT '総顧客数' AS metric_name,
             CAST(COUNT(*) AS TEXT) AS metric_value,
             '👥' AS metric_icon, NULL
      FROM Customers
      UNION ALL
      SELECT 'アクティブ顧客（注文あり）',
             CAST(COUNT(DISTINCT CustomerID) AS TEXT),
             '🏢',
             NULL
      FROM Orders
      UNION ALL
      SELECT '平均注文額',
             '$' || CAST(ROUND(AVG(order_totals.total), 2) AS TEXT),
             '💰',
             NULL
      FROM (
        SELECT o.CustomerID, SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)) AS total
        FROM Orders o
        INNER JOIN "Order Details" od ON o.OrderID = od.OrderID
        GROUP BY o.CustomerID
      ) order_totals
      UNION ALL
      SELECT '最多注文顧客の注文数',
             CAST(MAX(cust_orders.cnt) AS TEXT),
             '🏆',
             NULL
      FROM (
        SELECT COUNT(*) AS cnt FROM Orders GROUP BY CustomerID
      ) cust_orders
    columns: [metric_name, metric_value, metric_icon, metric_delta]

  - id: top_customers_by_revenue
    component: bar_chart
    sourceType: custom
    source: |
      SELECT c.CompanyName AS label,
             ROUND(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)), 2) AS value
      FROM Customers c
      INNER JOIN Orders o ON c.CustomerID = o.CustomerID
      INNER JOIN "Order Details" od ON o.OrderID = od.OrderID
      GROUP BY c.CustomerID
      ORDER BY value DESC
      LIMIT 10
    columns: [label, value]
    xField: label
    yField: value

  - id: customers_by_country
    component: pie_chart
    sourceType: custom
    source: |
      SELECT Country AS label,
             COUNT(*) AS value
      FROM Customers
      GROUP BY Country
      ORDER BY value DESC
    columns: [label, value]
    xField: label
    yField: value

  - id: customer_order_frequency
    component: table
    sourceType: custom
    source: |
      SELECT c.CompanyName AS 会社名,
             c.Country AS 国,
             c.City AS 市区町村,
             COUNT(o.OrderID) AS 注文件数,
             ROUND(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)), 2) AS 購入総額,
             ROUND(AVG(od.UnitPrice * od.Quantity * (1 - od.Discount)), 2) AS 平均購入額
      FROM Customers c
      LEFT JOIN Orders o ON c.CustomerID = o.CustomerID
      LEFT JOIN "Order Details" od ON o.OrderID = od.OrderID
      GROUP BY c.CustomerID
      ORDER BY 購入総額 DESC
      LIMIT 20
    columns: [会社名, 国, 市区町村, 注文件数, 購入総額, 平均購入額]

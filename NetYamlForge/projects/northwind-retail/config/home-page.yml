    url: /northwind-retail/DynamicEntity/Index?entity=order
    style: btn-outline
    icon: 📋
  - label: 客户中心
    url: /northwind-retail/Page/Customer360
    style: btn-outline
    icon: 🎯
  - label: 商品目录

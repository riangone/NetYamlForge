name: calendar-ui-lab
displayName: Calendar Ui Lab
version: "1.0.0"
database:
  type: sqlite
  path: database/calendar-ui-lab.db
features:
  multiLanguage: true
  userAuthentication: true
calendar:
  japanHoliday:
    provider: hybrid
    apiUrlTemplate: https://date.nager.at/api/v3/PublicHolidays/{year}/JP
    apiTimeoutMs: 4000

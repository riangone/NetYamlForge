title: Calendar Workbench
description: Responsive calendar UI with multi-source holiday overlays.
template: CalendarWorkbench
titleKey: projects.calendar-ui-lab.pages.calendarWorkbench.title
descriptionKey: projects.calendar-ui-lab.pages.calendarWorkbench.description

calendarUi:
  mobileMonthCount: 1
  desktopMinMonthCount: 2
  desktopMaxMonthCount: 6
  showJapanHolidays: true
  showChineseLunar: true
  thirdPartyHolidays:
    - date: '2026-03-14'
      name: OSS Festival Day
      source: partner-feed
    - date: '2026-04-22'
      name: Earth Action Day
      source: open-data
  customHolidays:
    - date: '2026-03-18'
      name: Team Offsite
      source: custom
    - date: '2026-05-01'
      name: Company Foundation Day
      source: custom

ui:
  page:
    layout: single
    density: comfortable

sections:
  - id: calendar_seed
    title: Calendar Seed
    sourceType: custom
    source: SELECT 1 AS Seed
    columns: [Seed]
    pageSize: 1
    editable: false
    readOnly: true

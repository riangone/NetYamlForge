entities:
  post_tag:
    table: 'post_tags'
    key: 'id'
    displayName: 'Post Tag'
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order: ['post_id', 'tag_id']
      filters:
        columns: 4
        order: []
    columns:
      id: { type: int, identity: true, label: 'Id', sortable: true }
      post_id: { type: int, required: true, label: 'Post Id', sortable: true }
      tag_id: { type: int, required: true, label: 'Tag Id', sortable: true }
    forms:
      post_id:
        type: int
        required: true
        label: 'Post Id'
        editable: true
        foreignKey:
          entity: post
          displayColumn: 'title'
      tag_id:
        type: int
        required: true
        label: 'Tag Id'
        editable: true
        foreignKey:
          entity: tag
          displayColumn: 'name'
    filters: {}
    links: {}

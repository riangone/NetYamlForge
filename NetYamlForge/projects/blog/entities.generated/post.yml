entities:
  post:
    table: 'posts'
    key: 'post_id'
    displayName: 'Post'
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order: ['title', 'slug', 'content', 'excerpt', 'status', 'category_id', 'author', 'featured', 'allow_comments', 'view_count', 'published_at', 'created_at', 'updated_at']
      filters:
        columns: 4
        order: []
    columns:
      post_id: { type: int, identity: true, label: 'Post Id', sortable: true }
      title: { type: string, required: true, label: 'Title', searchable: true, sortable: true }
      slug: { type: string, required: true, label: 'Slug', searchable: true, sortable: true }
      content: { type: string, required: true, label: 'Content', searchable: true, sortable: true }
      excerpt: { type: string, label: 'Excerpt', searchable: true, sortable: true }
      status: { type: string, label: 'Status', searchable: true, sortable: true }
      category_id: { type: int, label: 'Category Id', sortable: true }
      author: { type: string, label: 'Author', searchable: true, sortable: true }
      featured: { type: string, label: 'Featured', searchable: true, sortable: true }
      allow_comments: { type: string, label: 'Allow Comments', searchable: true, sortable: true }
      view_count: { type: int, label: 'View Count', sortable: true }
      published_at: { type: string, label: 'Published At', searchable: true, sortable: true }
      created_at: { type: string, label: 'Created At', searchable: true, sortable: true }
      updated_at: { type: string, label: 'Updated At', searchable: true, sortable: true }
    forms:
      title: { type: string, required: true, label: 'Title', editable: true }
      slug: { type: string, required: true, label: 'Slug', editable: true }
      content: { type: string, required: true, label: 'Content', editable: true }
      excerpt: { type: string, label: 'Excerpt', editable: true }
      status: { type: string, label: 'Status', editable: true }
      category_id:
        type: int
        label: 'Category Id'
        editable: true
        foreignKey:
          entity: category
          displayColumn: 'name'
      author: { type: string, label: 'Author', editable: true }
      featured: { type: string, label: 'Featured', editable: true }
      allow_comments: { type: string, label: 'Allow Comments', editable: true }
      view_count: { type: int, label: 'View Count', editable: true }
      published_at: { type: string, label: 'Published At', editable: true }
      created_at: { type: string, label: 'Created At', editable: true }
      updated_at: { type: string, label: 'Updated At', editable: true }
    filters: {}
    links: {}

name: blog
displayName: "Blog"
description: "記事・カテゴリ・タグ・コメントを管理するブログシステム"
version: "2.0.0"

aiHints:
  primaryLanguage: zh-CN
  authRequired: true
  customHooks:
    - generate_slug        # タイトルから Slug を自動生成
    - set_published_at     # Status=published 時に PublishedAt を設定
    - sanitize_content     # コンテンツの XSS サニタイズ
    - send_comment_notify  # コメント投稿時に管理者へ通知
  notes:
    - "post.status の値: draft / published / archived"
    - "comment.status の値: pending / approved / spam"
    - "post.featured_flag: 0=通常, 1=特集記事"

database:
  type: sqlite
  path: database/blog.db

features:
  multiLanguage: true
  userAuthentication: true
  dashboard: true
  pages: true

layout:
  theme: light
  dashboardTheme: workspace
  header:
    title: "Blog"
  navigation:
    showDashboard: true
    entities:
      - post
      - category
      - tag
      - comment
    items:
      - label: ダッシュボード
        controller: Dashboard
        action: Index
        icon: 📊
        section: 概要
      - label: 公開ブログ
        url: /blog
        icon: 🌐
        section: 概要
      - label: ホーム
        url: /blog/Page/Home
        icon: 🏠
        section: 概要
      - label: 分析
        url: /blog/Page/Analytics
        icon: 📈
        section: 概要
      - label: 記事一覧
        url: /blog/DynamicEntity/Index?entity=post
        icon: 📝
        section: コンテンツ
      - label: 編集フロー
        url: /blog/Page/Editorial
        icon: 🗂️
        section: コンテンツ
      - label: カテゴリ管理
        url: /blog/DynamicEntity/Index?entity=category
        icon: 📂
        section: 設定
      - label: タグ管理
        url: /blog/DynamicEntity/Index?entity=tag
        icon: 🏷️
        section: 設定
      - label: コメント管理
        url: /blog/DynamicEntity/Index?entity=comment
        icon: 💬
        section: 設定
      - label: 定期処理
        controller: BatchJob
        action: Index
        icon: ⚙️
        section: 設定

home_page:
  icon: "📝"
  tagline: "記事・カテゴリ・タグ・コメントを一元管理"
  tags: [Blog, CMS, Articles, Comments]

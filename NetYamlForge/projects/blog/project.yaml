name: blog
displayName: Blog CMS
version: "1.0.0"

# AI向けヒント: このプロジェクトに変更を加える前に必ず参照すること
aiHints:
  primaryLanguage: ja-JP
  authRequired: true
  customHooks:
    - blog_post_slug_generator     # 記事作成時にtitleからslugを自動生成
    - blog_post_published_notification  # 公開時に通知を送信
    - blog_comment_spam_check      # コメントのスパムチェック
  notes:
    - "post.slug は blog_post_slug_generator が自動生成するため forms に含めなくてよい"
    - "コメント承認フロー: status=pending → approved/spam の遷移のみ許可"

database:
  type: sqlite
  path: database/blog.db
features:
  multiLanguage: true
  userAuthentication: true
layout:
  dashboardTheme: minimal
  view: views/_Layout.cshtml
  header:
    title: Blog CMS
  navigation:
    showDashboard: true
    entities:
      - post
    items:
      - label: Dashboard
        controller: Dashboard
        action: Index
        icon: 📊
      - label: Posts
        url: /blog/DynamicEntity/Index?entity=post
        icon: 📝

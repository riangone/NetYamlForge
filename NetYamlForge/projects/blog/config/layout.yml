# Blog プロジェクト用レイアウト設定
# このファイルは省略可能です。設定しない場合は標準レイアウト（Views/Shared/_Layout.cshtml）が使用されます。

# ヘッダー設定
header:
  title: Blog CMS
  # logo: /images/blog-logo.png  # ロゴ画像（省略可）

# ナビゲーション設定
navigation:
  # ダッシュボードリンクを表示する（デフォルト：true）
  showDashboard: true

  # 表示するエンティティを制限（省略時はすべての公開エンティティ）
  entities:
    - post

  # カスタムナビゲーション項目
  items:
    - label: Blog
      url: /blog
      icon: 📝
    - label: Posts
      url: /blog/DynamicEntity/Index?entity=post
      icon: 📑
    - label: Admin Only Menu
      controller: Users
      action: Index
      adminOnly: true
      icon: 🔒

# フッター設定（省略可）
footer:
  text: "© 2026 Blog CMS. All rights reserved."

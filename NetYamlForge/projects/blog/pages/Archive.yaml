title: "文章归档"
description: "按月份查看所有文章"
isPublic: true

sections:
  - id: archive_stats
    title: "📊 归档概览"
    component: stat_cards
    sourceType: custom
    source: |
      SELECT 
        '总文章数' AS metric_name,
        COUNT(*) AS metric_value,
        '📝' AS metric_icon,
        NULL AS metric_delta
      FROM posts
      WHERE status = 'published'
      UNION ALL
      SELECT 
        '累计分类' AS metric_name,
        COUNT(*) AS metric_value,
        '📂' AS metric_icon,
        NULL
      FROM categories
      UNION ALL
      SELECT 
        '活跃标签' AS metric_name,
        COUNT(*) AS metric_value,
        '🏷️' AS metric_icon,
        NULL
      FROM tags
    columns: [metric_name, metric_value, metric_icon, metric_delta]

  - id: archive_list
    title: "📅 时间轴"
    component: table
    sourceType: custom
    source: |
      SELECT 
        strftime('%Y年%m月', published_at) AS month_label,
        strftime('%Y-%m', published_at) AS month_val,
        COUNT(*) AS post_count,
        '/blog/Page/Home?month=' || strftime('%Y-%m', published_at) AS url
      FROM posts
      WHERE status = 'published'
      GROUP BY month_label, month_val
      ORDER BY month_val DESC
    columns: [month_label, post_count]
    actions:
      - label: "进入该月文章"
        url: "{url}"
        class: "btn-ghost btn-sm"

title: "文章标签"
description: "按标签发现内容"
isPublic: true

sections:
  - id: tag_cloud
    title: "🏷️ 所有标签"
    component: cards
    sourceType: custom
    source: |
      SELECT 
        t.id,
        t.name AS title,
        '共 ' || COUNT(pt.post_id) || ' 篇文章' AS description,
        '# ' AS icon,
        '/blog/Page/Home?tag_id=' || t.id AS url
      FROM tags t
      JOIN post_tags pt ON t.id = pt.tag_id
      JOIN posts p ON pt.post_id = p.id
      WHERE p.status = 'published'
      GROUP BY t.id
      ORDER BY COUNT(pt.post_id) DESC
    columns: [id, title, description, icon, url]
    titleField: title
    descriptionField: description
    iconField: icon
    urlField: url

title: 記事公開管理
title_en: Post Management

template: PostDashboard

sections:
  - id: drafts
    title: 下書き
    type: custom
    sourceType: custom
    source: |
      SELECT post_id, title, author, created_at, updated_at
      FROM posts
      WHERE status = 'draft'
      ORDER BY updated_at DESC
    columns:
      - post_id
      - title
      - author
      - created_at
      - updated_at
    targetTable: posts
    targetPrimaryKey: post_id
    updatableFields:
      - status
      - published_at
    pageSize: 50
    editable: false
    readOnly: true

  - id: published
    title: 公開中
    type: custom
    sourceType: custom
    source: |
      SELECT post_id, title, author, published_at, view_count
      FROM posts
      WHERE status = 'published'
      ORDER BY published_at DESC
    columns:
      - post_id
      - title
      - author
      - published_at
      - view_count
    targetTable: posts
    targetPrimaryKey: post_id
    updatableFields:
      - status
    pageSize: 50
    editable: false
    readOnly: true

  - id: archived
    title: アーカイブ
    type: custom
    sourceType: custom
    source: |
      SELECT post_id, title, author, updated_at
      FROM posts
      WHERE status = 'archived'
      ORDER BY updated_at DESC
    columns:
      - post_id
      - title
      - author
      - updated_at
    targetTable: posts
    targetPrimaryKey: post_id
    updatableFields:
      - status
    pageSize: 50
    editable: false
    readOnly: true

title: 記事公開管理
title_en: Post Management

template: PostDashboard

sections:
  - id: drafts
    title: 下書き
    type: custom
    source_type: custom
    source: |
      SELECT post_id, title, author, created_at, updated_at
      FROM posts
      WHERE status = 'draft'
      ORDER BY updated_at DESC
    columns:
      - post_id
      - title
      - author
      - created_at
      - updated_at
    target_table: posts
    target_primary_key: post_id
    updatable_fields:
      - status
      - published_at
    page_size: 50
    editable: false
    read_only: true

  - id: published
    title: 公開中
    type: custom
    source_type: custom
    source: |
      SELECT post_id, title, author, published_at, view_count
      FROM posts
      WHERE status = 'published'
      ORDER BY published_at DESC
    columns:
      - post_id
      - title
      - author
      - published_at
      - view_count
    target_table: posts
    target_primary_key: post_id
    updatable_fields:
      - status
    page_size: 50
    editable: false
    read_only: true

  - id: archived
    title: アーカイブ
    type: custom
    source_type: custom
    source: |
      SELECT post_id, title, author, updated_at
      FROM posts
      WHERE status = 'archived'
      ORDER BY updated_at DESC
    columns:
      - post_id
      - title
      - author
      - updated_at
    target_table: posts
    target_primary_key: post_id
    updatable_fields:
      - status
    page_size: 50
    editable: false
    read_only: true

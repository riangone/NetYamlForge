title: コメント審査キュー
title_en: Comment Moderation

template: CommentQueue

sections:
  - id: pending
    title: 承認待ちコメント
    type: custom
    sourceType: custom
    source: |
      SELECT c.comment_id, c.author_name, c.author_email, c.content,
             c.created_at, p.title AS post_title, p.post_id
      FROM comments c
      JOIN posts p ON c.post_id = p.post_id
      WHERE c.status = 'pending'
      ORDER BY c.created_at ASC
    columns:
      - comment_id
      - author_name
      - author_email
      - content
      - created_at
      - post_title
      - post_id
    targetTable: comments
    targetPrimaryKey: comment_id
    updatableFields:
      - status
    pageSize: 50
    editable: false
    readOnly: true

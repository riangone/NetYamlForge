title: ブログ
title_en: Blog
description: 公開されているブログ記事の一覧です

template: BlogList

main_table: posts

sections:
  - id: posts
    title: 記事一覧
    type: custom
    source_type: custom
    source: |
      SELECT p.post_id, p.title, p.slug, p.excerpt, p.author,
             p.published_at, p.view_count,
             c.name AS category_name, c.color AS category_color
      FROM posts p
      LEFT JOIN categories c ON p.category_id = c.category_id
      WHERE p.status = 'published'
      ORDER BY p.published_at DESC
    columns:
      - post_id
      - title
      - slug
      - excerpt
      - author
      - published_at
      - view_count
      - category_name
      - category_color
    page_size: 9
    editable: false
    read_only: true
    filters:
      title:
        label: タイトルで検索
        type: like

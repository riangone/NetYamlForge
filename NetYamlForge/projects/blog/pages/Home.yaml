title: "博客首页"
description: "欢迎来到我的个人博客"
isPublic: true

sections:
  - id: hero
    title: "✨ 探索技术与生活"
    component: markdown
    sourceType: custom
    source: "SELECT 'hero' AS id"
    content: |
      <div class="hero bg-base-100 rounded-box p-10 mb-6">
        <div class="hero-content text-center">
          <div class="max-w-md">
            <h1 class="text-5xl font-bold">欢迎来到我的博客</h1>
            <p class="py-6">分享关于技术、架构和生活的思考。在这里，你可以找到深度的技术文章和随笔。</p>
            <div class="flex gap-2 justify-center">
              <a href="/blog/Page/Search" class="btn btn-outline">🔍 搜索文章</a>
              <a href="/blog/Page/Archive" class="btn btn-outline">📅 文章归档</a>
              <a href="/blog/Page/Tags" class="btn btn-outline">🏷️ 标签云</a>
            </div>
          </div>
        </div>
      </div>

  - id: categories
    title: "📚 热门分类"
    component: cards
    sourceType: custom
    source: |
      SELECT 
        id,
        name AS title,
        description,
        '📁' AS icon,
        '/blog/Page/Home?category_id=' || id AS url
      FROM categories
      LIMIT 6
    columns: [id, title, description, icon, url]
    titleField: title
    descriptionField: description
    iconField: icon
    urlField: url

  - id: post_list
    title: "🕒 发现文章"
    component: card_list
    sourceType: custom
    source: |
      SELECT 
        p.id,
        p.title,
        p.summary AS subtitle,
        c.name AS badge,
        '发布于 ' || p.published_at AS description,
        '/blog/Page/PostDetail?id=' || p.id AS url
      FROM posts p
      LEFT JOIN categories c ON p.category_id = c.id
      WHERE p.status = 'published'
        AND (@category_id IS NULL OR p.category_id = @category_id)
        AND (@tag_id IS NULL OR EXISTS (SELECT 1 FROM post_tags pt WHERE pt.post_id = p.id AND pt.tag_id = @tag_id))
        AND (@month IS NULL OR strftime('%Y-%m', p.published_at) = @month)
      ORDER BY p.published_at DESC
      LIMIT 20
    columns: [id, title, subtitle, badge, description, url]
    titleField: title
    subtitleField: subtitle
    badgeField: badge
    descriptionField: description
    actions:
      - label: "阅读更多"
        url: "{url}"
        class: "btn-primary"

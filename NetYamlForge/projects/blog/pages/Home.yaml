title: ブログ ホーム
description: "KPI サマリー・最新記事・コメント状況を一覧で確認"

sections:
  # KPI サマリーカード
  - id: kpi_summary
    title: コンテンツ KPI
    component: stat_cards
    sourceType: custom
    source: |
      SELECT '総記事数'      AS metric_name, CAST(COUNT(*) AS TEXT)                                        AS metric_value, '📝' AS metric_icon, NULL AS metric_delta FROM Post
      UNION ALL
      SELECT '公開中',        CAST(COUNT(*) AS TEXT), '✅', NULL FROM Post WHERE Status='published'
      UNION ALL
      SELECT '下書き',        CAST(COUNT(*) AS TEXT), '✏️', NULL FROM Post WHERE Status='draft'
      UNION ALL
      SELECT '総閲覧数',      CAST(SUM(ViewCount) AS TEXT), '👁️', NULL FROM Post WHERE Status='published'
      UNION ALL
      SELECT '承認待ちコメント', CAST(COUNT(*) AS TEXT), '⏳', NULL FROM Comment WHERE Status='pending'
      UNION ALL
      SELECT '総コメント数',  CAST(COUNT(*) AS TEXT), '💬', NULL FROM Comment WHERE Status='approved'
    columns: [metric_name, metric_value, metric_icon, metric_delta]
    labelField: metric_name
    valueField: metric_value
    iconField: metric_icon
    deltaField: metric_delta
    pageSize: 10
    editable: false
    readOnly: true

  # 最新公開記事
  - id: recent_published
    title: 最近公開された記事
    component: table
    sourceType: custom
    source: |
      SELECT
        p.Id,
        p.Title    AS タイトル,
        bc.Name    AS カテゴリ,
        p.AuthorName AS 著者,
        p.ViewCount  AS 閲覧数,
        p.PublishedAt AS 公開日時
      FROM Post p
      LEFT JOIN BlogCategory bc ON p.CategoryId = bc.Id
      WHERE p.Status = 'published'
      ORDER BY p.PublishedAt DESC
      LIMIT 10
    columns: [Id, タイトル, カテゴリ, 著者, 閲覧数, 公開日時]
    pageSize: 10
    editable: false
    readOnly: true

  # 特集記事
  - id: featured_posts
    title: 特集記事
    component: table
    sourceType: custom
    source: |
      SELECT
        p.Id,
        p.Title     AS タイトル,
        bc.Name     AS カテゴリ,
        p.AuthorName AS 著者,
        p.ViewCount  AS 閲覧数,
        p.PublishedAt AS 公開日時
      FROM Post p
      LEFT JOIN BlogCategory bc ON p.CategoryId = bc.Id
      WHERE p.FeaturedFlag = 1 AND p.Status = 'published'
      ORDER BY p.ViewCount DESC
    columns: [Id, タイトル, カテゴリ, 著者, 閲覧数, 公開日時]
    pageSize: 10
    editable: false
    readOnly: true

  # 人気記事ランキング（閲覧数）
  - id: top_posts
    title: 人気記事ランキング（閲覧数）
    component: leaderboard
    sourceType: custom
    source: |
      SELECT
        p.Title        AS post_title,
        bc.Name        AS category_name,
        p.ViewCount    AS view_count
      FROM Post p
      LEFT JOIN BlogCategory bc ON p.CategoryId = bc.Id
      WHERE p.Status = 'published'
      ORDER BY p.ViewCount DESC
      LIMIT 10
    columns: [post_title, category_name, view_count]
    nameField: post_title
    valueField: view_count
    avatarField: category_name
    pageSize: 10
    editable: false
    readOnly: true

  # カテゴリ別記事数
  - id: category_dist
    title: カテゴリ別記事数
    component: bar_chart
    sourceType: custom
    source: |
      SELECT bc.Name AS label, COUNT(p.Id) AS value
      FROM BlogCategory bc
      LEFT JOIN Post p ON p.CategoryId = bc.Id AND p.Status = 'published'
      GROUP BY bc.Id, bc.Name
      ORDER BY bc.SortOrder
    columns: [label, value]
    xField: label
    yField: value
    color: "rgba(99,102,241,0.75)"
    pageSize: 20
    editable: false
    readOnly: true

  # 承認待ちコメント
  - id: pending_comments
    title: 承認待ちコメント
    component: table
    sourceType: custom
    source: |
      SELECT
        c.Id,
        p.Title      AS 記事タイトル,
        c.AuthorName AS 投稿者,
        c.Content    AS コメント,
        c.CreatedAt  AS 投稿日時
      FROM Comment c
      LEFT JOIN Post p ON c.PostId = p.Id
      WHERE c.Status = 'pending'
      ORDER BY c.CreatedAt ASC
    columns: [Id, 記事タイトル, 投稿者, コメント, 投稿日時]
    pageSize: 10
    editable: false
    readOnly: true

title: 記事詳細
description: "個別記事表示 — ログイン不要"
isPublic: true

sections:
  # 記事本文（@id を URL クエリから受け取る）
  - id: post
    title: 記事
    component: table
    sourceType: custom
    source: |
      SELECT
        p.Id,
        p.Title,
        p.Slug,
        p.Summary,
        p.Content,
        p.CoverImage,
        bc.Id    AS CategoryId,
        bc.Name  AS CategoryName,
        bc.Color AS CategoryColor,
        p.AuthorName,
        p.PublishedAt,
        p.ViewCount
      FROM Post p
      LEFT JOIN BlogCategory bc ON p.CategoryId = bc.Id
      WHERE p.Id = @id AND p.Status = 'published'
      LIMIT 1
    columns: [Id, Title, Slug, Summary, Content, CoverImage, CategoryId, CategoryName, CategoryColor, AuthorName, PublishedAt, ViewCount]
    pageSize: 1
    editable: false
    readOnly: true

  # この記事のタグ
  - id: post_tags
    title: タグ
    component: table
    sourceType: custom
    source: |
      SELECT t.Id, t.Name
      FROM Tag t
      INNER JOIN PostTag pt ON t.Id = pt.TagId
      WHERE pt.PostId = @id
      ORDER BY t.Name
    columns: [Id, Name]
    pageSize: 20
    editable: false
    readOnly: true

  # 承認済みコメント
  - id: comments
    title: コメント
    component: table
    sourceType: custom
    source: |
      SELECT
        c.Id,
        c.AuthorName,
        c.Content,
        c.CreatedAt
      FROM Comment c
      WHERE c.PostId = @id AND c.Status = 'approved'
      ORDER BY c.CreatedAt ASC
    columns: [Id, AuthorName, Content, CreatedAt]
    pageSize: 50
    editable: false
    readOnly: true

  # コメント投稿フォーム
  - id: comment_form
    title: コメントを投稿する
    component: comment_form
    sourceType: none

  # 関連記事（同じカテゴリ）
  - id: related
    title: 関連記事
    component: table
    sourceType: custom
    source: |
      SELECT
        p.Id,
        p.Title,
        p.AuthorName,
        p.PublishedAt,
        bc.Name AS CategoryName
      FROM Post p
      LEFT JOIN BlogCategory bc ON p.CategoryId = bc.Id
      WHERE p.CategoryId = (SELECT CategoryId FROM Post WHERE Id = @id)
        AND p.Id != @id
        AND p.Status = 'published'
      ORDER BY p.PublishedAt DESC
      LIMIT 4
    columns: [Id, Title, AuthorName, PublishedAt, CategoryName]
    pageSize: 4
    editable: false
    readOnly: true

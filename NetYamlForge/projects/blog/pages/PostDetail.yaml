title: "文章详情"
description: "正在阅读文章"
isPublic: true

sections:
  - id: post_content
    title: "📖 文章内容"
    component: markdown
    sourceType: custom
    source: |
      SELECT 
        '# ' || title || CHAR(10) || 
        '> 发布于 ' || published_at || ' | 分类: ' || (SELECT name FROM categories WHERE id = posts.category_id) || CHAR(10) ||
        CHAR(10) ||
        content AS markdown_content
      FROM posts
      WHERE id = @id
    columns: [markdown_content]
    contentField: markdown_content

  - id: post_tags
    title: "🏷️ 标签"
    component: markdown
    sourceType: custom
    source: |
      SELECT GROUP_CONCAT('<a href="/blog/Page/Home?tag_id=' || t.id || '" class="badge badge-outline mx-1">' || t.name || '</a>', ' ') AS tags_html
      FROM tags t
      JOIN post_tags pt ON t.id = pt.tag_id
      WHERE pt.post_id = @id
    columns: [tags_html]
    contentField: tags_html

  - id: related_posts
    title: "🔗 相关文章"
    component: card_list
    sourceType: custom
    source: |
      SELECT 
        p.id,
        p.title,
        p.summary AS subtitle,
        '相关' AS badge,
        '/blog/Page/PostDetail?id=' || p.id AS url
      FROM posts p
      WHERE p.category_id = (SELECT category_id FROM posts WHERE id = @id)
        AND p.id <> @id
        AND p.status = 'published'
      LIMIT 3
    columns: [id, title, subtitle, badge, url]
    titleField: title
    subtitleField: subtitle
    badgeField: badge
    actions:
      - label: "阅读"
        url: "{url}"
        class: "btn-ghost btn-sm"

  - id: comments
    title: "💬 评论"
    component: table
    sourceType: custom
    source: |
      SELECT 
        u.display_name AS user,
        c.content,
        c.created_at AS date
      FROM comments c
      LEFT JOIN blog_users u ON c.author_id = u.id
      WHERE c.post_id = @id AND c.status = 'approved'
      ORDER BY c.created_at DESC
    columns: [user, content, date]
    pageSize: 50

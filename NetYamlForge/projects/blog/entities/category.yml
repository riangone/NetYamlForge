imports: []
entities:
  category:
    table: BlogCategory
    key: Id
    displayName: カテゴリ
    softDelete: false
    isPublic: false

    forms:
      Name:
        type: string
        required: true
        label: カテゴリ名
        editable: true
      Slug:
        type: string
        required: true
        label: スラッグ
        editable: true
      Description:
        type: textarea
        label: 説明
        editable: true
      Color:
        type: color
        label: カラー
        editable: true
      SortOrder:
        type: int
        label: 表示順
        editable: true

    columns:
      Id:
        type: int
        identity: true
        label: ID
        sortable: true
      Name:
        type: string
        label: カテゴリ名
        searchable: true
        sortable: true
      Slug:
        type: string
        label: スラッグ
        searchable: true
        sortable: false
      Description:
        type: string
        label: 説明
        searchable: true
        sortable: false
      Color:
        type: color
        label: カラー
        sortable: false
      SortOrder:
        type: int
        label: 表示順
        sortable: true
      CreatedAt:
        type: datetime
        label: 作成日時
        sortable: true

    paging:
      pageSize: 20
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 2
        order:
          - Name
          - Slug
          - Color
          - SortOrder
          - Description
      filters:
        columns: 2
        order:
          - Name

    filters:
      Name:
        type: like
        label: カテゴリ名

    links:
      posts:
        label: 記事一覧
        targetEntity: post
        filter:
          CategoryId: Id

imports: []
entities:
  tag:
    table: Tag
    key: Id
    displayName: タグ
    softDelete: false
    isPublic: false

    forms:
      Name:
        type: string
        required: true
        label: タグ名
        editable: true
      Slug:
        type: string
        required: true
        label: スラッグ
        editable: true

    columns:
      Id:
        type: int
        identity: true
        label: ID
        sortable: true
      Name:
        type: string
        label: タグ名
        searchable: true
        sortable: true
      Slug:
        type: string
        label: スラッグ
        searchable: true
        sortable: false
      CreatedAt:
        type: datetime
        label: 作成日時
        sortable: true

    paging:
      pageSize: 30
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 2
        order:
          - Name
          - Slug
      filters:
        columns: 2
        order:
          - Name

    filters:
      Name:
        type: like
        label: タグ名

  japan_it_news_briefing:
    displayName: "日本IT業界 毎日ニュース簡報"
    description: "毎朝6時にZenn・Qiita・DevelopersIO・gihyo.jpをもとに日本IT業界の重要ニュース簡報を自動生成します"
    type: "automated_blog_generator"
    enabled: true
    schedule:
      cron: "0 6 * * *"
      timezone: "Asia/Tokyo"
    settings:
      params:
        target: "日本IT業界"
        categoryId: "5"
        tags: "IT, テクノロジー, ニュース, 日本IT, 開発者向け"
        author: "AI News Bot"
        language: "ja-JP"
        prompt: |
          あなたは日本のIT業界に精通したテクノロジーライターです。
          本日（{date}）の日本IT業界における重要ニュース・注目トレンドの簡報記事を作成してください。

          【最重要ルール】
          プロンプトの最後尾に「### 【重要・提供データ】実際の最新記事ソース」として、各サイトの「実際の記事タイトル」と「実際のURL」のリストが提供されます。
          あなたは各サイトのセクション（Zenn, Qiita, DevelopersIO, gihyo.jp）において、**必ずそのリスト内に実在する記事の中から2〜3件を選び、提供された通りの正しいタイトルと完全なURLを使用して**紹介してください。
          リストに存在しない架空のタイトルや、デタラメなURL（ハルシネーション）を絶対に捏造してはなりません。

          【記事構成】必ず以下の順番で書いてください：

          ## 本日のIT業界トレンド概要
          2〜3文で全体のトレンドを要約。

          ## 📰 各サイト注目トピック

          必ず以下4サイトを**それぞれ独立したセクション**として掲載し、提供された実際の記事リストから2〜3件のトピックを列挙してください。

          ### 🔹 Zenn (https://zenn.dev/)
          - **[実際の記事タイトル](実際の記事URL)** — 100字以内の概要
          - **[実際の記事タイトル](実際の記事URL)** — 100字以内の概要

          ### 🔹 Qiita (https://qiita.com/)
          - **[実際の記事タイトル](実際の記事URL)** — 100字以内の概要
          - **[実際の記事タイトル](実際の記事URL)** — 100字以内の概要

          ### 🔹 DevelopersIO (https://dev.classmethod.jp/)
          - **[実際の記事タイトル](実際の記事URL)** — 100字以内の概要
          - **[実際の記事タイトル](実際の記事URL)** — 100字以内の概要

          ### 🔹 gihyo.jp (https://gihyo.jp/)
          - **[実際の記事タイトル](実際の記事URL)** — 100字以内の概要
          - **[実際の記事タイトル](実際の記事URL)** — 100字以内の概要

          ### 🔹 その他（任意）
          InfoQ Japan・ITmedia・@IT などから注目記事があれば1〜2件追加可。

          ## 💡 開発者・エンジニアへの示唆
          今週・本日のトレンドから開発者が押さえるべきアクションポイントを3点以内で箇条書き。

          ## まとめ
          2〜3文でまとめ。

          【重要ルール】
          - 必ず提供された「実際の最新記事ソース」に記載されている実在のタイトルとURLを根拠とし、架空の記事タイトルやデタラメなURL、ハルシネーション（AIの嘘）を絶対に捏造しないでください。
          - もし特定のサイトの取得結果がエラー等で空である場合は、架空の個別記事リンクを絶対に作成せず、実在する各サイトのトップページやトレンド一覧ページ（例：`https://zenn.dev/` , `https://qiita.com/trend`）へリンクさせてください。
          - 各トピックのURLは必ず `https://` から始まる完全なURLを記載すること（ルートドメインのみは不可）
          - マークダウンの `[テキスト](URL)` 形式でリンクを必ず埋め込むこと
          - 言語: 日本語で執筆

          出力形式は以下のJSONのみとしてください（マークダウン本文をcontentに含める）:
          {
            "title": "【IT簡報】YYYY年MM月DD日 日本IT業界の注目ニュース",
            "summary": "Zenn・Qiita・DevelopersIO・gihyo.jp から本日の日本IT業界注目トピックをお届けします",
            "content": "マークダウン形式の本文（各サイトセクション＋リンク付きトピック含む）",
            "slug": "it-news-briefing"
          }


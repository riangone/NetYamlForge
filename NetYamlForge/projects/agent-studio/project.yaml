name: agent-studio
displayName: "🤖 Agent Studio (Self-Evolution)"
version: "1.1.0"
description: "NetYamlForge 自举演进工作台 — 3 CLI 角色随机编排系统"

database:
  type: sqlite
  path: database/agent-studio.db

features:
  multiLanguage: true
  userAuthentication: true
  dashboard: true
  pages: true
  api: true

layout:
  theme: synthwave
  dashboardTheme: workspace

  landingPageByRole:
    viewer: /agent-studio/Page/HomePage
    editor: /agent-studio/Page/HomePage
    admin:  /agent-studio/Page/HomePage

  navigation:
    showDashboard: true
    showPages: true
    showEntities: true
    entities: [agent_task, agent_task_log]
    items:
      - label: 🚀 演进协同工作台 (主页)
        url: /agent-studio/Page/HomePage
        icon: Sparkles
        section: 协同中心
        roles: [viewer, editor, admin]
      - label: 演进任务管理 (CRUD)
        url: /agent-studio/DynamicEntity/Index?entity=agent_task
        icon: List
        section: 运维管理
        roles: [viewer, editor, admin]
      - label: 角色执行日志 (CRUD)
        url: /agent-studio/DynamicEntity/Index?entity=agent_task_log
        icon: Terminal
        section: 运维管理
        roles: [viewer, editor, admin]

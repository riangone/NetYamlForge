name: b2b-order-ops
displayName: B2B受発注管理パック
version: 1.1.0
database:
  type: sqlite
  path: ../northwind-sqlite3/database/northwind.db
features:
  multiLanguage: true
  userAuthentication: true
layout:
  dashboardTheme: ops
  header:
    title: B2B受発注管理パック
  navigation:
    showDashboard: true
    entities:
    - order
    - orderdetail
    - product
    - customer
    - supplier
    - employee
    - shipper
    - category
    items:
    - label: Dashboard
      controller: Dashboard
      action: Index
      icon: 📊
      labelKey: projects.b2b-order-ops.project.layout.navigation.items.0.label
    - label: Order Operations
      url: /b2b-order-ops/DynamicEntity/Index?entity=order
      icon: 📦
      labelKey: projects.b2b-order-ops.project.layout.navigation.items.1.label
    - label: Order Workbench
      url: /b2b-order-ops/Page/OrderWorkbench
      icon: 🧩
      labelKey: projects.b2b-order-ops.project.layout.navigation.items.2.label
    - label: Fulfillment Queue
      url: /b2b-order-ops/Page/FulfillmentQueue
      icon: 🚚
      labelKey: projects.b2b-order-ops.project.layout.navigation.items.3.label
    - label: Replenishment Plan
      url: /b2b-order-ops/Page/ReplenishmentPlan
      icon: 🏭
      labelKey: projects.b2b-order-ops.project.layout.navigation.items.4.label
    - label: Customer Risk Radar
      url: /b2b-order-ops/Page/CustomerRiskRadar
      icon: ⚠️
      labelKey: projects.b2b-order-ops.project.layout.navigation.items.5.label

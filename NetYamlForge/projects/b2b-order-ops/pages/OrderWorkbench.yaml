title: 受発注ワークベンチ
description: 受注ヘッダと受注明細を同一画面で確認する実装例です。

mainTable: Orders

ui:
  page:
    layout: two-pane
    density: comfortable

sections:
  - id: orders
    title: 受注一覧
    sourceType: custom
    source: |
      SELECT
        o.OrderId,
        c.CompanyName AS Customer,
        o.OrderDate,
        o.RequiredDate,
        o.Status,
        ROUND(SUM(od.UnitPrice * od.Quantity * (1 - od.Discount)), 2) AS TotalAmount
      FROM Orders o
      JOIN Customers c ON o.CustomerId = c.CustomerId
      JOIN OrderDetails od ON o.OrderId = od.OrderId
      GROUP BY o.OrderId, c.CompanyName, o.OrderDate, o.RequiredDate, o.Status
      ORDER BY o.OrderDate DESC, o.OrderId DESC
    columns:
      - OrderId
      - Customer
      - OrderDate
      - RequiredDate
      - Status
      - TotalAmount
    pageSize: 20
    editable: false
    readOnly: true
    filters:
      Customer:
        label: 顧客
        type: like
      Status:
        label: ステータス
        type: eq
    ui:
      component: DataTable
      selectable: single

  - id: order_details
    title: 受注明細
    sourceType: custom
    source: |
      SELECT
        od.OrderDetailId,
        od.OrderId,
        p.ProductName,
        od.UnitPrice,
        od.Quantity,
        od.Discount,
        ROUND((od.UnitPrice * od.Quantity) * (1 - od.Discount), 2) AS LineTotal
      FROM OrderDetails od
      JOIN Products p ON od.ProductId = p.ProductId
      ORDER BY od.OrderDetailId DESC
    columns:
      - OrderDetailId
      - OrderId
      - ProductName
      - UnitPrice
      - Quantity
      - Discount
      - LineTotal
    pageSize: 25
    editable: false
    readOnly: true
    filters:
      OrderId:
        label: 受注ID
        type: eq
      ProductName:
        label: 商品名
        type: like
    ui:
      component: DataTable
      selectable: none

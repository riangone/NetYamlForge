title: 在庫補充計画 / Replenishment Plan
description: 欠品リスクに対して推奨補充数量と仕入先を提示します。

main_table: Products

sections:
  - id: product_replenishment
    title: 補充対象商品
    type: custom
    source_type: custom
    source: |
      SELECT
        p.ProductId,
        p.ProductName,
        s.CompanyName AS Supplier,
        c.CategoryName AS Category,
        p.UnitsInStock,
        p.ReorderLevel,
        COALESCE(SUM(CASE WHEN o.Status IN ('Open', 'Delayed') THEN od.Quantity ELSE 0 END), 0) AS PendingQty,
        CASE
          WHEN p.UnitsInStock <= p.ReorderLevel
            THEN (p.ReorderLevel - p.UnitsInStock) + COALESCE(SUM(CASE WHEN o.Status IN ('Open', 'Delayed') THEN od.Quantity ELSE 0 END), 0)
          ELSE COALESCE(SUM(CASE WHEN o.Status IN ('Open', 'Delayed') THEN od.Quantity ELSE 0 END), 0)
        END AS SuggestedOrderQty
      FROM Products p
      LEFT JOIN Suppliers s ON p.SupplierId = s.SupplierId
      LEFT JOIN Categories c ON p.CategoryId = c.CategoryId
      LEFT JOIN OrderDetails od ON p.ProductId = od.ProductId
      LEFT JOIN Orders o ON od.OrderId = o.OrderId
      WHERE p.Discontinued = 0
      GROUP BY p.ProductId, p.ProductName, s.CompanyName, c.CategoryName, p.UnitsInStock, p.ReorderLevel
      HAVING SuggestedOrderQty > 0
      ORDER BY SuggestedOrderQty DESC, p.UnitsInStock ASC
    columns:
      - ProductId
      - ProductName
      - Supplier
      - Category
      - UnitsInStock
      - ReorderLevel
      - PendingQty
      - SuggestedOrderQty
    page_size: 50
    editable: false
    read_only: true
    filters:
      Supplier:
        label: 仕入先
        type: like
      Category:
        label: カテゴリ
        type: like
      ProductName:
        label: 商品名
        type: like

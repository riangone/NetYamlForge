hero:
  eyebrow: Inventory Workspace
  title: 智能库存与供应链管理平台
  description: 实时跟踪库存变动，优化仓储效率，集成供应商管理与产品生命周期监控。
  primaryActionLabel: 进入看板
  primaryActionUrl: /inventory/Dashboard
  secondaryActionLabel: 产品目录
  secondaryActionUrl: /inventory/DynamicEntity/List/product
  highlights:
    - 多仓储协同
    - 移动流水跟踪
    - 智能水位预警
    - 供应商集成

metrics:
  - label: 在库产品
    value: "Auto"
    trend: "实时同步"
    tone: text-primary
  - label: 仓储中心
    value: "Multiple"
    trend: "全域覆盖"
    tone: text-success
  - label: 库存周转
    value: "High"
    trend: "效率领先"
    tone: text-secondary

capabilities:
  - icon: 📦
    title: 多仓储管理
    description: 支持全球多仓库协同，实时更新各库区的库存水位与库龄状态。
    badge: 核心
  - icon: 🔄
    title: 移动流水跟踪
    description: 精确记录入库、出库、调拨及盘点的每一笔流转，确保账实相符。
    badge: 流程
  - icon: ⚠️
    title: 智能预警机制
    description: 自动监控低库存与超期库存，及时触发补货通知与风险预警。
    badge: 智能
  - icon: 🤝
    title: 供应商协同
    description: 集成供应商准入、考核及订单执行，优化上游供应链效率。
    badge: 扩展

quickActions:
  - label: 库存总览
    url: /inventory/Dashboard
    style: btn-primary
    icon: 📊
  - label: 产品列表
    url: /inventory/DynamicEntity/List/product
    style: btn-outline
    icon: 🧩
  - label: 仓储详情
    url: /inventory/DynamicEntity/List/warehouse
    style: btn-outline
    icon: 🏠
  - label: 变动记录
    url: /inventory/DynamicEntity/List/stock_movement
    style: btn-ghost
    icon: 📝

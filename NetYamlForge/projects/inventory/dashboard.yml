stats:
  - label: 総商品数
    entity: product
    aggregate: count
    icon: 📦
    color: badge-primary
  - label: 有効商品
    entity: product
    aggregate: count
    icon: ✅
    color: badge-success
  - label: カテゴリ数
    entity: category
    aggregate: count
    icon: 🏷️
    color: badge-secondary
  - label: 在庫総数
    entity: product
    aggregate: sum
    column: Stock
    icon: 📊
    color: badge-accent
  - label: 最小在庫割れ
    entity: product
    aggregate: count
    icon: ⚠️
    color: badge-error
  - label: 本月庫移動数
    entity: stockmovement
    aggregate: count
    icon: 🔄
    color: badge-info

charts:
  - title: 商品カテゴリ別在庫数
    type: doughnut
    entity: product
    valueAggregate: sum
    valueColumn: Stock
    labelJoinEntity: category
    labelJoinKey: CategoryId
    labelJoinDisplay: Name
    orderBy: value
    orderDir: desc
    limit: 10

  - title: 月別在庫移動推移
    type: line
    entity: stockmovement
    valueAggregate: sum
    valueColumn: Quantity
    groupExpression: strftime('%Y-%m', CreatedAt)
    orderBy: label
    orderDir: asc
    limit: 12

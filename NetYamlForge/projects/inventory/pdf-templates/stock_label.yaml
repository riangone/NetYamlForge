# 在庫確認書 帳票テンプレート
# Stock エンティティの pdfTemplate: stock_label で参照されます。
name: stock_label
filenameTemplate: "在庫確認書_{date:yyyyMMdd}.pdf"
pageSize: A4
orientation: portrait
margins: [36, 42, 36, 42]

theme:
  primaryColor: "1e8449"
  labelColor: "27ae60"
  labelTextColor: "ffffff"
  subtleBackground: "eafaf1"
  oddRowColor: "f4fdf7"
  borderColor: "a9dfbf"

dataSources:
  recentMovements:
    query: "SELECT sm.MovedAt, sm.MovementType, sm.Quantity, sm.UnitPrice, sm.Reason FROM StockMovement sm WHERE sm.ProductId = @ProductId AND sm.WarehouseId = @WarehouseId ORDER BY sm.MovedAt DESC LIMIT 10"

sections:
  # ── ドキュメントヘッダー（タイトル | 確認日ボックス） ───────────────────
  - type: row
    columnWidths: [60, 40]
    marginBottom: 2
    cells:
      - vAlign: middle
        elements:
          - type: paragraph
            text: "在　庫　確　認　書"
            fontSize: 20
            color: primary
            align: center
      - vAlign: bottom
        paddingLeft: 12
        elements:
          - type: labelTable
            columnWidths: [38, 62]
            labelBackground: subtle
            labelTextColor: null
            borderWeight: 0.5
            cellPadding: 3
            fontSize: 8
            rows:
              - label: "在庫ID"
                field: Id
              - label: "更新日"
                field: UpdatedAt

  # ── 太い区切り線 ─────────────────────────────────────────────────────────
  - type: line
    lineWeight: 2
    color: primary
    marginTop: 4
    marginBottom: 8

  # ── 商品情報 | 在庫情報 ──────────────────────────────────────────────────
  - type: row
    columnWidths: [50, 50]
    marginBottom: 12
    cells:
      - vAlign: top
        elements:
          - type: labelTable
            columnWidths: [36, 64]
            labelBackground: label
            labelTextColor: labelText
            borderWeight: 0.5
            cellPadding: 4
            fontSize: 9
            rows:
              - label: "商品コード"
                field: ProductCode
              - label: "商品名"
                field: ProductName
              - label: "カテゴリ"
                field: CategoryName
      - vAlign: top
        paddingLeft: 8
        elements:
          - type: labelTable
            columnWidths: [36, 64]
            labelBackground: label
            labelTextColor: labelText
            borderWeight: 0.5
            cellPadding: 4
            fontSize: 9
            rows:
              - label: "倉庫"
                field: WarehouseName
              - label: "在庫数量"
                field: Quantity
                format: quantity
              - label: "更新日"
                field: UpdatedAt

  # ── 区切り線 ─────────────────────────────────────────────────────────────
  - type: line
    lineWeight: 0.5
    color: primary
    marginBottom: 6

  # ── 直近入出庫履歴 ────────────────────────────────────────────────────────
  - type: paragraph
    text: "直近入出庫履歴"
    fontSize: 10
    bold: true
    color: primary
    marginBottom: 4

  - type: dataTable
    dataSource: recentMovements
    minRows: 8
    borderWeight: 0.5
    cellPadding: 3
    fontSize: 8.5
    labelBackground: label
    labelTextColor: labelText
    oddRowBackground: oddRow
    columns:
      - field: MovedAt
        label: "入出庫日"
        width: 20
        align: center
      - field: MovementType
        label: "種別"
        width: 15
        align: center
      - field: Quantity
        label: "数量"
        width: 15
        align: right
        format: quantity
      - field: UnitPrice
        label: "単価（円）"
        width: 20
        align: right
        format: currency
      - field: Reason
        label: "理由"
        width: 30
        align: left

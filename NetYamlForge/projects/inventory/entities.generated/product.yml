entities:
  product:
    table: 'product'
    key: 'id'
    displayName: 'Product'
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order: ['name', 'sku', 'category_id', 'supplier_id', 'price', 'stock_qty', 'reorder_level']
      filters:
        columns: 4
        order: []
    columns:
      id: { type: int, identity: true, label: 'Id', sortable: true }
      name: { type: string, required: true, label: 'Name', searchable: true, sortable: true }
      sku: { type: string, required: true, label: 'Sku', searchable: true, sortable: true }
      category_id: { type: int, label: 'Category Id', sortable: true }
      supplier_id: { type: int, label: 'Supplier Id', sortable: true }
      price: { type: decimal, label: 'Price', sortable: true }
      stock_qty: { type: int, label: 'Stock Qty', sortable: true }
      reorder_level: { type: int, label: 'Reorder Level', sortable: true }
    forms:
      name: { type: string, required: true, label: 'Name', editable: true }
      sku: { type: string, required: true, label: 'Sku', editable: true }
      category_id:
        type: int
        label: 'Category Id'
        editable: true
        foreignKey:
          entity: category
          displayColumn: 'name'
      supplier_id:
        type: int
        label: 'Supplier Id'
        editable: true
        foreignKey:
          entity: supplier
          displayColumn: 'name'
      price: { type: decimal, label: 'Price', editable: true }
      stock_qty: { type: int, label: 'Stock Qty', editable: true }
      reorder_level: { type: int, label: 'Reorder Level', editable: true }
    filters: {}
    links: {}

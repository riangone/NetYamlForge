entities:
  supplier:
    table: 'supplier'
    key: 'id'
    displayName: 'Supplier'
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order: ['name', 'email', 'phone', 'country', 'status']
      filters:
        columns: 4
        order: []
    columns:
      id: { type: int, identity: true, label: 'Id', sortable: true }
      name: { type: string, required: true, label: 'Name', searchable: true, sortable: true }
      email: { type: string, required: true, label: 'Email', searchable: true, sortable: true }
      phone: { type: string, label: 'Phone', searchable: true, sortable: true }
      country: { type: string, label: 'Country', searchable: true, sortable: true }
      status: { type: string, label: 'Status', searchable: true, sortable: true }
    forms:
      name: { type: string, required: true, label: 'Name', editable: true }
      email: { type: string, required: true, label: 'Email', editable: true }
      phone: { type: string, label: 'Phone', editable: true }
      country: { type: string, label: 'Country', editable: true }
      status: { type: string, label: 'Status', editable: true }
    filters: {}
    links: {}

title: 在庫状況
description: 商品別の在庫状況とアラートを一覧表示
main_table: Products

ui:
  page:
    layout: single
    density: comfortable

sections:
  # 在庫アラートセクション
  - id: stock_alerts
    title: ⚠️ 最小在庫割れアラート
    source_type: custom
    source: |
      SELECT 
        p.Id,
        p.Name as ProductName,
        c.Name as CategoryName,
        p.Stock as CurrentStock,
        p.MinStock as MinStock,
        p.MinStock - p.Stock as Shortage
      FROM Products p
      LEFT JOIN Categories c ON p.CategoryId = c.Id
      WHERE p.IsActive = 1 AND p.Stock < p.MinStock
      ORDER BY Shortage DESC
    columns:
      - ProductName
      - CategoryName
      - CurrentStock
      - MinStock
      - Shortage
    page_size: 10
    editable: false
    read_only: true
    ui:
      component: DataTable
      selectable: none

  # 商品別在庫一覧
  - id: product_stock_list
    title: 📦 商品別在庫一覧
    source_type: custom
    source: |
      SELECT 
        p.Id,
        p.Name as ProductName,
        c.Name as CategoryName,
        p.Price as UnitPrice,
        p.Stock as Stock,
        p.Stock * p.Price as StockValue,
        CASE 
          WHEN p.Stock = 0 THEN '在庫切れ'
          WHEN p.Stock < p.MinStock THEN '在庫不足'
          WHEN p.Stock < p.MinStock * 2 THEN '要注意'
          ELSE '正常'
        END as StockStatus
      FROM Products p
      LEFT JOIN Categories c ON p.CategoryId = c.Id
      WHERE p.IsActive = 1
      ORDER BY StockValue DESC
    columns:
      - ProductName
      - CategoryName
      - UnitPrice
      - Stock
      - StockValue
      - StockStatus
    page_size: 20
    editable: false
    read_only: true
    ui:
      component: DataTable
      selectable: single

  # カテゴリ別集計
  - id: category_summary
    title: 🏷️ カテゴリ別集計
    source_type: custom
    source: |
      SELECT 
        c.Name as CategoryName,
        COUNT(p.Id) as ProductCount,
        SUM(p.Stock) as TotalStock,
        SUM(p.Stock * p.Price) as TotalValue,
        AVG(p.Price) as AvgPrice
      FROM Categories c
      LEFT JOIN Products p ON c.Id = p.CategoryId AND p.IsActive = 1
      GROUP BY c.Id, c.Name
      ORDER BY TotalValue DESC
    columns:
      - CategoryName
      - ProductCount
      - TotalStock
      - TotalValue
      - AvgPrice
    page_size: 10
    editable: false
    read_only: true
    ui:
      component: DataTable
      selectable: none

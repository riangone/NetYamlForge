entities:
  category:
    table: Categories
    key: Id
    displayName: カテゴリ
    displayColumn: Name
    softDelete: false
    paging:
      pageSize: 10
      mode: numbered
    layout:
      forms:
        columns: 1
        order:
        - Name
        - Description
      filters:
        columns: 1
        order:
        - Name
    columns:
      Id:
        type: int
        identity: true
        label: ID
        searchable: false
        sortable: true
      Name:
        type: string
        label: カテゴリ名
        searchable: true
        sortable: true
      Description:
        type: string
        label: 説明
        multiline: true
      CreatedAt:
        type: string
        label: 作成日
        readonly: true
    forms:
      Name:
        type: string
        label: カテゴリ名
        editable: true
        required: true
      Description:
        type: string
        label: 説明
        editable: true
        multiline: true
    filters:
      Name:
        type: text
        label: カテゴリ名
        expression: Categories.Name
    hooks:
      beforeDelete: [check_category_usage]
    confirmation:
      create: 新しいカテゴリを登録してよろしいですか？
      update: カテゴリ情報を更新してよろしいですか？
      delete: このカテゴリを削除してもよろしいですか？

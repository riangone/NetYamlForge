imports: []
entities:
  warehouse:
    table: Warehouse
    key: Id
    displayName: 倉庫
    softDelete: false
    isPublic: false

    joins: []

    forms:
      Name:
        type: string
        required: true
        label: 倉庫名
        editable: true
      Location:
        type: string
        label: 所在地
        editable: true
      Description:
        type: textarea
        label: 説明
        editable: true

    columns:
      Id:
        type: int
        identity: true
        label: ID
        sortable: true
      Name:
        type: string
        required: true
        label: 倉庫名
        searchable: true
        sortable: true
      Location:
        type: string
        label: 所在地
        searchable: true
        sortable: true
      Description:
        type: string
        label: 説明
        searchable: true
        sortable: false

    paging:
      pageSize: 20
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 2
        order: [Name, Location, Description]
      filters:
        columns: 2
        order: [Name, Location]

    filters:
      Name:
        type: like
        label: 倉庫名
      Location:
        type: like
        label: 所在地

    links:
      stocks:
        label: 在庫一覧
        targetEntity: stock
        filter:
          WarehouseId: Id

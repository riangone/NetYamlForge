entities:
  product:
    table: Products
    key: Id
    displayName: 商品
    displayColumn: Name
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order:
        - Name
        - CategoryId
        - Price
        - Stock
        - MinStock
        - IsActive
      filters:
        columns: 3
        order:
        - Name
        - CategoryId
        - IsActive
    columns:
      Id:
        type: int
        identity: true
        label: ID
        searchable: false
        sortable: true
      Name:
        type: string
        label: 商品名
        searchable: true
        sortable: true
      CategoryId:
        type: int
        label: カテゴリ
        foreignKey:
          entity: category
          displayColumn: Name
      Price:
        type: decimal
        label: 価格
        format: "¥{0:N0}"
      Stock:
        type: int
        label: 在庫数
      MinStock:
        type: int
        label: 最小在庫
      IsActive:
        type: bool
        label: 有効
      CreatedAt:
        type: string
        label: 作成日
        readonly: true
      UpdatedAt:
        type: string
        label: 更新日
        readonly: true
    forms:
      Name:
        type: string
        label: 商品名
        editable: true
        required: true
      CategoryId:
        type: int
        label: カテゴリ
        editable: true
        dropdown: true
      Price:
        type: decimal
        label: 価格
        editable: true
        required: true
        min: 0
      Stock:
        type: int
        label: 在庫数
        editable: true
        min: 0
      MinStock:
        type: int
        label: 最小在庫
        editable: true
        min: 0
      IsActive:
        type: bool
        label: 有効
        editable: true
    filters:
      Name:
        type: text
        label: 商品名
        expression: Products.Name
      CategoryId:
        type: select
        label: カテゴリ
        expression: Products.CategoryId
        dropdown: true
      IsActive:
        type: bool
        label: 有効/無効
        expression: Products.IsActive
    links:
      stockMovements:
        label: 在庫移動履歴
        targetEntity: stockmovement
        filter:
          ProductId: Id
    hooks:
      beforeCreate: [validate_product_price, check_stock_threshold]
      beforeUpdate: [validate_product_price, check_stock_threshold]
      afterCreate: [check_stock_threshold]
      afterUpdate: [check_stock_threshold]
    confirmation:
      create: 新しい商品を登録してよろしいですか？
      update: 商品情報を更新してよろしいですか？
      delete: この商品を削除してもよろしいですか？

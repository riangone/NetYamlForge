entities:
  supplier:
    table: supplier
    key: id
    displayName: 仕入先
    displayNameI18n: {ja-JP: 仕入先, zh-CN: 供应商, en-US: Supplier}
    columns:
      id:
        type: int
        identity: true
        label: ID
        sortable: true
        hidden: false
      name:
        type: string
        required: true
        label: 仕入先名
        labelI18n: {ja-JP: 仕入先名, zh-CN: 供应商名称, en-US: Supplier Name}
        searchable: true
        sortable: true
        hidden: false
      email:
        type: string
        required: true
        label: メール
        labelI18n: {ja-JP: メール, zh-CN: 邮箱, en-US: Email}
        searchable: true
        sortable: true
        hidden: false
      phone:
        type: string
        label: 電話
        labelI18n: {ja-JP: 電話, zh-CN: 电话, en-US: Phone}
        searchable: true
        hidden: false
      country:
        type: string
        label: 国
        labelI18n: {ja-JP: 国, zh-CN: 国家, en-US: Country}
        searchable: true
        sortable: true
        hidden: false
      status:
        type: string
        label: ステータス
        labelI18n: {ja-JP: ステータス, zh-CN: 状态, en-US: Status}
        sortable: true
        hidden: false
    forms:
      name:
        type: string
        required: true
        label: 仕入先名
        editable: true
        hidden: false
      email:
        type: string
        required: true
        label: メール
        editable: true
        hidden: false
      phone:
        type: string
        required: false
        label: 電話
        editable: true
        hidden: false
      country:
        type: string
        required: false
        label: 国
        editable: true
        hidden: false
      status:
        type: string
        required: false
        label: ステータス
        editable: true
        hidden: false
    layout:
      forms:
        columns: 2
        order: [name, email, phone, country, status]
      filters:
        columns: 3
        order: [status]
    filters:
      status:
        type: dropdown
        label: ステータス
        options: [active, inactive]
    hooks:
      beforeCreate:
        - validate_required
        - validate_email
        - trim
      beforeUpdate:
        - validate_required
        - validate_email
        - trim

entities:
  stock_movement:
    table: stock_movement
    key: id
    displayName: 在庫移動
    displayNameI18n: {ja-JP: 在庫移動, zh-CN: 库存移动, en-US: Stock Movement}
    joins:
      - type: left
        table: product
        alias: p
        on: "stock_movement.product_id = p.id"
    columns:
      id:
        type: int
        identity: true
        label: ID
        sortable: true
        hidden: false
      product_id:
        type: int
        required: true
        label: 商品ID
        labelI18n: {ja-JP: 商品ID, zh-CN: 商品ID, en-US: Product ID}
        hidden: false
      product_name:
        type: string
        expression: "p.name"
        label: 商品名
        labelI18n: {ja-JP: 商品名, zh-CN: 商品名称, en-US: Product Name}
        searchable: true
        hidden: false
      quantity:
        type: int
        required: true
        label: 数量
        labelI18n: {ja-JP: 数量, zh-CN: 数量, en-US: Quantity}
        sortable: true
        hidden: false
      movement_type:
        type: string
        required: true
        label: 移動種別
        labelI18n: {ja-JP: 移動種別, zh-CN: 移动类型, en-US: Movement Type}
        sortable: true
        hidden: false
      reason:
        type: string
        label: 理由
        labelI18n: {ja-JP: 理由, zh-CN: 原因, en-US: Reason}
        searchable: true
        hidden: false
      created_at:
        type: string
        required: true
        label: 作成日時
        labelI18n: {ja-JP: 作成日時, zh-CN: 创建时间, en-US: Created At}
        sortable: true
        hidden: false
      created_by:
        type: string
        label: 作成者
        labelI18n: {ja-JP: 作成者, zh-CN: 创建人, en-US: Created By}
        searchable: true
        hidden: false
    forms:
      product_id:
        type: int
        required: true
        label: 商品ID
        editable: true
        hidden: false
      quantity:
        type: int
        required: true
        label: 数量
        editable: true
        hidden: false
      movement_type:
        type: string
        required: true
        label: 移動種別
        editable: true
        hidden: false
      reason:
        type: string
        required: false
        label: 理由
        editable: true
        hidden: false
      created_by:
        type: string
        required: false
        label: 作成者
        editable: true
        hidden: false
    layout:
      forms:
        columns: 2
        order: [product_id, quantity, movement_type, reason, created_by]
      filters:
        columns: 3
        order: [movement_type]
    filters:
      movement_type:
        type: dropdown
        label: 移動種別
        options: [in, out, adjustment]
    hooks:
      beforeCreate:
        - validate_required
        - validate_stock_out
        - now
      afterCreate:
        - update_product_stock
        - audit_log

imports: []
entities:
  stockmovement:
    table: StockMovements
    key: Id
    keys: []
    displayName: 在庫移動
    displayColumn: Reason
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
    columns:
      Id:
        type: int
        identity: true
        label: ID
        searchable: false
        sortable: true
      ProductId:
        type: int
        label: 商品
        foreignKey:
          entity: product
          displayColumn: Name
      Quantity:
        type: int
        label: 数量
      MovementType:
        type: string
        label: 移動種別
      Reason:
        type: string
        label: 理由
      CreatedAt:
        type: string
        label: 移動日時
        readonly: true
    forms:
      ProductId:
        type: int
        label: 商品
        editable: true
        required: true
        dropdown: true
      Quantity:
        type: int
        label: 数量
        editable: true
        required: true
      MovementType:
        type: string
        label: 移動種別
        editable: true
        required: true
      Reason:
        type: string
        label: 理由
        editable: true
        multiline: true
    filters:
      ProductId:
        type: select
        label: 商品
        expression: StockMovements.ProductId
        dropdown: true
      MovementType:
        type: select
        label: 移動種別
        expression: StockMovements.MovementType
    hooks:
      beforeCreate:
        - update_product_stock
      afterCreate:
        - check_stock_threshold
    confirmation:
      create: 在庫移動を登録してよろしいですか？
      update: 在庫移動情報を更新してよろしいですか？
      delete: この在庫移動記録を削除してもよろしいですか？

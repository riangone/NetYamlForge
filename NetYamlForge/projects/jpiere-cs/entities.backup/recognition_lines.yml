imports: []
entities:
  recognition_lines:
    table: recognition_lines
    key: id
    displayName: 売上計上明細
    softDelete: false
    isPublic: false

    joins:
      - type: left
        table: recognitions
        alias: r
        on: recognition_lines.recognition_id = r.id
      - type: left
        table: products
        alias: p
        on: recognition_lines.product_id = p.id

    forms:
      recognition_id:
        type: int
        required: true
        label: 売上計上
        editable: true
        foreignKey:
          entity: recognitions
          displayColumn: document_no
      line_no:
        type: int
        required: true
        label: 行番号
        editable: true
      contract_line_id:
        type: int
        label: 契約明細
        editable: true
        foreignKey:
          entity: contract_lines
          displayColumn: id
      product_id:
        type: int
        label: 商品
        editable: true
        foreignKey:
          entity: products
          displayColumn: name
      description:
        type: textarea
        label: 説明
        editable: true
      qty_recognized:
        type: decimal
        required: true
        label: 計上数量
        editable: true
      unit_price:
        type: decimal
        label: 単価
        editable: true
      line_amt:
        type: decimal
        label: 明細金額
        editable: true
      tax_rate:
        type: decimal
        label: 消費税率
        editable: true
      period_from:
        type: date
        label: 対象期間（開始）
        editable: true
      period_to:
        type: date
        label: 対象期間（終了）
        editable: true
      is_active:
        type: boolean
        label: 有効
        editable: true

    columns:
      id:
        type: int
        identity: true
        label: ID
        sortable: true
      recognition_no:
        type: string
        label: 計上番号
        expression: r.document_no
        searchable: true
        sortable: true
      line_no:
        type: int
        required: true
        label: 行番号
        sortable: true
      product_name:
        type: string
        label: 商品
        expression: p.name
        searchable: true
      qty_recognized:
        type: decimal
        required: true
        label: 計上数量
        sortable: true
      line_amt:
        type: decimal
        label: 明細金額
        sortable: true
      period_from:
        type: date
        label: 期間開始
        sortable: true

    paging:
      pageSize: 25
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 2
        order:
          - recognition_id
          - line_no
          - contract_line_id
          - product_id
          - qty_recognized
          - unit_price
          - line_amt
          - tax_rate
          - period_from
          - period_to
          - description
          - is_active
      filters:
        columns: 3
        order:
          - recognition_id

    filters:
      recognition_id:
        type: dropdown
        label: 売上計上
        expression: recognition_lines.recognition_id
        foreignKey:
          entity: recognitions
          displayColumn: document_no

imports: []
entities:
  contract_templates:
    table: contract_templates
    key: id
    displayName: 契約テンプレート
    softDelete: false
    isPublic: false

    joins:
      - type: left
        table: contract_categories
        alias: cc
        on: contract_templates.contract_category_id = cc.id

    forms:
      code:
        type: string
        required: true
        label: テンプレートコード
        editable: true
      name:
        type: string
        required: true
        label: テンプレート名
        editable: true
      contract_type:
        type: string
        required: true
        label: 契約種別
        editable: true
        options:
          - PUR
          - SAL
          - BOT
        optionLabels:
          PUR: 購買契約
          SAL: 販売契約
          BOT: 両方
      contract_category_id:
        type: int
        required: true
        label: 契約カテゴリ
        editable: true
        foreignKey:
          entity: contract_categories
          displayColumn: name
      description:
        type: textarea
        label: 説明
        editable: true
      default_payment_term_days:
        type: int
        label: デフォルト支払期日（日数）
        editable: true
      auto_renewal:
        type: boolean
        label: 自動更新
        editable: true
      is_active:
        type: boolean
        label: 有効
        editable: true

    columns:
      id:
        type: int
        identity: true
        label: ID
        sortable: true
      code:
        type: string
        required: true
        label: コード
        searchable: true
        sortable: true
      name:
        type: string
        required: true
        label: テンプレート名
        searchable: true
        sortable: true
      contract_type:
        type: string
        label: 契約種別
        sortable: true
      category_name:
        type: string
        label: カテゴリ
        expression: cc.name
        searchable: true
      auto_renewal:
        type: boolean
        label: 自動更新
      is_active:
        type: boolean
        label: 有効
        sortable: true

    paging:
      pageSize: 25
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 2
        order:
          - code
          - name
          - contract_type
          - contract_category_id
          - default_payment_term_days
          - auto_renewal
          - description
          - is_active
      filters:
        columns: 3
        order:
          - contract_category_id
          - code
          - name

    filters:
      contract_category_id:
        type: dropdown
        label: カテゴリ
        expression: contract_templates.contract_category_id
        foreignKey:
          entity: contract_categories
          displayColumn: name
      code:
        type: like
        label: コード
      name:
        type: like
        label: テンプレート名

## 🔐 セキュリティ設定

### API キー管理

**⚠️ 重要**: API キーは環境変数で管理し、git にコミットしないでください。

```bash
# .env ファイル（gitignore 対象）
ANTHROPIC_API_KEY=sk-ant-xxxxx
QWEN_API_KEY=sk-xxxxx
GOOGLE_API_KEY=xxxxx
```

```json
// appsettings.json
{
  "AiWindow": {
    "Claude": {
      "ApiKey": "${ANTHROPIC_API_KEY}"  // 環境変数を参照
    }
  }
}
```

### 権限分離

- 各役割はアクセス許可外のエンティティを参照不可
- データ操作は読み取り基本、操作は権限必要
- 監査証跡は全操作で記録


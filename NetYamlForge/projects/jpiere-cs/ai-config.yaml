# JPiere AI 配置ガイド

> **バージョン**: 1.0  
> **作成日**: 2026-04-07  
> **プロジェクト**: JPiere 契約サービス

---

## 📋 基本設定

### appsettings.json 配置

```json
{
  "AiWindow": {
    // 基本設定
    "ProjectName": "jpiere-cs",
    "DealerName": "JPiere AI アシスタント",
    "BusinessHours": "月〜金 9:00-18:00",

    // AI プロバイダー設定
    "ProviderPriority": ["claude", "qwen", "gemini", "ollama"],

    // Claude 設定
    "Claude": {
      "ApiKey": "${ANTHROPIC_API_KEY}",
      "Model": "claude-haiku-4-5-20251001",
      "MaxTokens": 1024
    },

    // CLI 優先モード（開発用）
    "CliFirst": true,
    "CliTimeoutSeconds": 3600,

    // 機能フラグ
    "EnableProactiveSuggestions": true,
    "EnableSentimentAnalysis": true,
    "EnableEscalation": true,
    "EnableAutoTodoCreation": true,

    // 分析しきい値
    "MaxRecommendations": 5,
    "EscalationSentimentThreshold": -0.5,
    "LowConfidenceThreshold": 0.6,
    "AutoTodoCreationMinConfidence": 0.8
  }
}
```

---

## 🎯 機能フラグ説明

| フラグ | 説明 | デフォルト |
|-------|------|----------|
| `EnableProactiveSuggestions` | 積極的な提案機能を有効化 | `true` |
| `EnableSentimentAnalysis` | 感情分析を有効化 | `true` |
| `EnableEscalation` | エスカレーション機能を有効化 | `true` |
| `EnableAutoTodoCreation` | AI からの自動 TODO 作成を有効化 | `true` |

---

## 📊 しきい値設定

| 設定 | 説明 | デフォルト |
|-----|------|----------|
| `MaxRecommendations` | 推奨アクションの最大表示数 | `5` |
| `EscalationSentimentThreshold` | エスカレーション感情しきい値 | `-0.5` |
| `LowConfidenceThreshold` | 低信頼度しきい値 | `0.6` |
| `AutoTodoCreationMinConfidence` | 自動 TODO 作成最低信頼度 | `0.8` |

---

## 👥 役割別設定

### 役割一覧

| 役割 ID | 役割名 | 説明 |
|---------|--------|------|
| `employee` | 一般社員 | 全般的な業務サポート |
| `contract_manager` | 契約担当 | 契約・見積・請求の管理 |
| `accountant` | 会計担当 | 仕訳・会計・資金管理 |
| `purchaser` | 購買担当 | 購買フロー管理 |
| `approver` | 承認者 | 承認ワークフロー管理 |
| `admin` | 管理者 | システム全体管理 |

### 役割別アクセス許可

| エンティティ | employee | contract_manager | accountant | purchaser | approver | admin |
|-------------|----------|------------------|------------|-----------|----------|-------|
| contracts | 参照(自身) | 全部 | 参照 | ❌ | 参照 | 全部 |
| estimations | 参照(自身) | 全部 | 参照 | ❌ | 参照 | 全部 |
| bills | 参照(関連) | 全部 | 全部 | ❌ | 参照 | 全部 |
| journals | ❌ | ❌ | 全部 | ❌ | ❌ | 全部 |
| accounts | ❌ | ❌ | 参照 | ❌ | ❌ | 全部 |
| purchase_orders | ❌ | ❌ | 参照 | 全部 | 参照 | 全部 |
| approval_requests | ❌ | ❌ | ❌ | ❌ | 全部 | 全部 |
| todos | 参照/更新(自身) | 参照/作成(関連) | ❌ | ❌ | 参照/更新(関連) | 全部 |


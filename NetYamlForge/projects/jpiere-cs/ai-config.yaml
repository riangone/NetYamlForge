## 🔄 動作原理

### フレームワーク AI との統合

1. **システムプロンプトの読み込み**
   - `JpiereChatService` が `skills/jpiere/` からプロンプトを読み込む
   - ユーザー役割に応じて適切なファイルを選択

2. **ツール呼び出し**
   - `query_data` ツールで DB からデータを取得
   - 取得したデータを基に分析・推奨アクションを生成

3. **応答生成**
   - 独立ドキュメントのテンプレートに従って回答を構築
   - 詳細ページへのリンクを自動追加

### 設定の優先順位

```
環境変数 > appsettings.Production.json > appsettings.json
```


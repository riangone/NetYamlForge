## 📈 効果測定指標

| 指標 | 説明 | 目標値 |
|-----|------|--------|
| 采纳率 | 推奨アクションの採用率 | >60% |
| 解決率 | AI 単独解決率 | >70% |
| エスカレーション率 | 人工引継ぎ比率 | <15% |
| 响应时间 | AI 平均応答時間 | <3 秒 |
| 満足度 | ユーザー評価（1-5） | >4.0 |
| 感情改善率 | 会話終了時感情スコア改善 | >+0.3 |


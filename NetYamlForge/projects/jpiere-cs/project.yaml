name: jpiere-cs
displayName: JPiere 契約サービス
description: JPiere Contract Service - 日本企業向け契約・見積・請求管理システム
version: "1.0.0"

database:
  type: sqlite
  path: database/jpiere-cs.db

features:
  multiLanguage: true
  userAuthentication: true
  dashboard: true
  pages: true
  crud: true
  api: true
  export: true
  batchJobs: true

theme:
  primaryColor: "#1a5276"
  accentColor: "#2980b9"
  logo: jpiere-logo.png

layout:
  dashboardTheme: workspace

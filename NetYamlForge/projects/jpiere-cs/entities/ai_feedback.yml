entities:
  ai_feedback:
    table: ai_feedback
    key: id
    displayName: AI フィードバック
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
      enableCount: true

    columns:
      id: { type: int, identity: true, label: ID, sortable: true }
      feedback_id: { type: string, length: 64, required: true, label: フィードバック ID, searchable: true, sortable: true }
      conversation_id: { type: string, length: 64, required: true, label: 会話 ID, searchable: true, sortable: true }
      message_id: { type: string, length: 64, label: メッセージ ID, searchable: true, sortable: true }
      user_id: { type: string, length: 64, required: true, label: ユーザー ID, searchable: true, sortable: true }
      rating: { type: int, required: true, label: 評価, sortable: true }
      category: { type: string, length: 32, label: カテゴリ, searchable: true, sortable: true }
      feedback_text: { type: text, label: フィードバック内容, searchable: true }
      sentiment: { type: string, length: 16, label: 感情分類, searchable: true, sortable: true }
      ai_analysis: { type: text, label: AI 分析 }
      resolved: { type: int, label: 対応済み, sortable: true }
      resolved_by: { type: string, length: 64, label: 対応者, searchable: true, sortable: true }
      resolved_at: { type: datetime, label: 対応日時, sortable: true }
      resolution_notes: { type: text, label: 対応メモ }
      created_at: { type: datetime, required: true, label: 作成日時, sortable: true }
      updated_at: { type: datetime, required: true, label: 更新日時, sortable: true }

    forms:
      feedback_id: { type: string, required: true, label: フィードバック ID, editable: true }
      conversation_id: { type: string, required: true, label: 会話 ID, editable: true }
      message_id: { type: string, label: メッセージ ID, editable: true }
      user_id: { type: string, required: true, label: ユーザー ID, editable: true }
      rating: { type: int, required: true, label: 評価 (1-5), editable: true }
      category: { type: select, label: カテゴリ, editable: true, options: [accuracy, helpfulness, speed, clarity, tone, other] }
      feedback_text: { type: textarea, label: フィードバック内容, editable: true }
      sentiment: { type: select, label: 感情分類, editable: true, options: [positive, neutral, negative] }
      resolved: { type: int, label: 対応済み, editable: true }
      resolved_by: { type: string, label: 対応者, editable: true }
      resolved_at: { type: datetime, label: 対応日時, editable: true }
      resolution_notes: { type: textarea, label: 対応メモ, editable: true }

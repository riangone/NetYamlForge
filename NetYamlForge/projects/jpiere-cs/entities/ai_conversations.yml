entities:
  ai_conversations:
    table: ai_conversations
    key: id
    displayName: AI 会話セッション
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
      enableCount: true

    columns:
      id: { type: int, identity: true, label: ID, sortable: true }
      conversation_id: { type: string, length: 64, required: true, label: 会話 ID, searchable: true, sortable: true }
      channel: { type: string, length: 32, required: true, label: チャネル, searchable: true, sortable: true }
      status: { type: string, length: 16, required: true, label: ステータス, searchable: true, sortable: true }
      user_id: { type: string, length: 64, label: ユーザー ID, searchable: true, sortable: true }
      user_role: { type: string, length: 32, label: ユーザー役割, searchable: true, sortable: true }
      linked_contract_id: { type: int, label: 関連契約 ID, sortable: true }
      linked_bill_id: { type: int, label: 関連請求 ID, sortable: true }
      linked_estimation_id: { type: int, label: 関連見積 ID, sortable: true }
      last_intent: { type: string, length: 64, label: 最終意図, searchable: true, sortable: true }
      last_confidence: { type: decimal, precision: 5, scale: 4, label: 最終信頼度, sortable: true }
      sentiment_score: { type: decimal, precision: 5, scale: 4, label: 感情スコア, sortable: true }
      guest_session_id: { type: string, length: 64, label: ゲストセッション ID, searchable: true, sortable: true }
      customer_id: { type: string, length: 64, label: 顧客 ID, searchable: true, sortable: true }
      started_at: { type: datetime, required: true, label: 開始時刻, sortable: true }
      ended_at: { type: datetime, label: 終了時刻, sortable: true }
      message_count: { type: int, label: メッセージ数, sortable: true }
      escalation_count: { type: int, label: エスカレーション数, sortable: true }
      created_at: { type: datetime, required: true, label: 作成日時, sortable: true }
      updated_at: { type: datetime, required: true, label: 更新日時, sortable: true }

    forms:
      conversation_id: { type: string, required: true, label: 会話 ID, editable: true }
      channel: { type: select, required: true, label: チャネル, editable: true, options: [web, api, mobile] }
      status: { type: select, required: true, label: ステータス, editable: true, options: [active, completed, escalated, closed] }
      user_id: { type: string, label: ユーザー ID, editable: true }
      user_role: { type: select, label: ユーザー役割, editable: true, options: [employee, contract_manager, accountant, purchaser, approver, admin, guest] }
      last_intent: { type: string, label: 最終意図, editable: true }
      sentiment_score: { type: decimal, label: 感情スコア, editable: true }
      started_at: { type: datetime, required: true, label: 開始時刻, editable: true }
      ended_at: { type: datetime, label: 終了時刻, editable: true }
      message_count: { type: int, label: メッセージ数, editable: true }

    hooks:
      beforeCreate:
        - validate_ai_conversation
        - set_conversation_timestamps
      beforeUpdate:
        - validate_ai_conversation
        - update_conversation_updated_at

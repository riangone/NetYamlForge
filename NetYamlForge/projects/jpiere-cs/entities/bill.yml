entities:
  bill:
    table: 'bills'
    key: 'id'
    displayName: 'Bill'
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order: ['document_no', 'doc_status', 'business_partner_id', 'date_billed', 'date_due', 'date_sent', 'payment_rule', 'payment_term_days', 'currency', 'total_lines', 'grand_total', 'tax_base_amt', 'tax_amt', 'pay_amt', 'outstanding_amt', 'description', 'linked_contract_id', 'is_active', 'created_at', 'updated_at']
      filters:
        columns: 4
        order: []
    columns:
      id: { type: int, identity: true, label: 'Id', sortable: true }
      document_no: { type: string, required: true, label: 'Document No', searchable: true, sortable: true }
      doc_status: { type: string, label: 'Doc Status', searchable: true, sortable: true }
      business_partner_id: { type: int, required: true, label: 'Business Partner Id', sortable: true }
      date_billed: { type: string, label: 'Date Billed', searchable: true, sortable: true }
      date_due: { type: string, label: 'Date Due', searchable: true, sortable: true }
      date_sent: { type: string, label: 'Date Sent', searchable: true, sortable: true }
      payment_rule: { type: string, label: 'Payment Rule', searchable: true, sortable: true }
      payment_term_days: { type: int, label: 'Payment Term Days', sortable: true }
      currency: { type: string, label: 'Currency', searchable: true, sortable: true }
      total_lines: { type: decimal, label: 'Total Lines', sortable: true }
      grand_total: { type: decimal, label: 'Grand Total', sortable: true }
      tax_base_amt: { type: decimal, label: 'Tax Base Amt', sortable: true }
      tax_amt: { type: decimal, label: 'Tax Amt', sortable: true }
      pay_amt: { type: decimal, label: 'Pay Amt', sortable: true }
      outstanding_amt: { type: decimal, label: 'Outstanding Amt', sortable: true }
      description: { type: string, label: 'Description', searchable: true, sortable: true }
      linked_contract_id: { type: int, label: 'Linked Contract Id', sortable: true }
      is_active: { type: int, label: 'Is Active', sortable: true }
      created_at: { type: string, label: 'Created At', searchable: true, sortable: true }
      updated_at: { type: string, label: 'Updated At', searchable: true, sortable: true }
    forms:
      document_no: { type: string, required: true, label: 'Document No', editable: true }
      doc_status: { type: string, label: 'Doc Status', editable: true }
      business_partner_id:
        type: int
        required: true
        label: 'Business Partner Id'
        editable: true
        foreignKey:
          entity: business_partner
          displayColumn: 'name'
      date_billed: { type: string, label: 'Date Billed', editable: true }
      date_due: { type: string, label: 'Date Due', editable: true }
      date_sent: { type: string, label: 'Date Sent', editable: true }
      payment_rule: { type: string, label: 'Payment Rule', editable: true }
      payment_term_days: { type: int, label: 'Payment Term Days', editable: true }
      currency: { type: string, label: 'Currency', editable: true }
      total_lines: { type: decimal, label: 'Total Lines', editable: true }
      grand_total: { type: decimal, label: 'Grand Total', editable: true }
      tax_base_amt: { type: decimal, label: 'Tax Base Amt', editable: true }
      tax_amt: { type: decimal, label: 'Tax Amt', editable: true }
      pay_amt: { type: decimal, label: 'Pay Amt', editable: true }
      outstanding_amt: { type: decimal, label: 'Outstanding Amt', editable: true }
      description: { type: string, label: 'Description', editable: true }
      linked_contract_id:
        type: int
        label: 'Linked Contract Id'
        editable: true
        foreignKey:
          entity: contract
          displayColumn: 'name'
      is_active: { type: int, label: 'Is Active', editable: true }
      created_at: { type: string, label: 'Created At', editable: true }
      updated_at: { type: string, label: 'Updated At', editable: true }
    filters: {}
    links: {}
    hooks:
      beforeCreate:
        - bill_document_no
        - bill_due_date
        - bill_outstanding
      beforeUpdate:
        - bill_outstanding
      afterUpdate:
        - bill_complete
        - bill_reverse

entities:
  ai_messages:
    table: ai_messages
    key: id
    displayName: AI メッセージ
    softDelete: false
    paging:
      pageSize: 50
      mode: numbered
      enableCount: true

    columns:
      id: { type: int, identity: true, label: ID, sortable: true }
      message_id: { type: string, length: 64, required: true, label: メッセージ ID, searchable: true, sortable: true }
      conversation_id: { type: string, length: 64, required: true, label: 会話 ID, searchable: true, sortable: true }
      sender: { type: string, length: 16, required: true, label: 送信者, searchable: true, sortable: true }
      content: { type: text, required: true, label: メッセージ内容, searchable: true }
      intent: { type: string, length: 64, label: 意図, searchable: true, sortable: true }
      confidence_score: { type: decimal, precision: 5, scale: 4, label: 信頼度, sortable: true }
      sentiment_score: { type: decimal, precision: 5, scale: 4, label: 感情スコア, sortable: true }
      tool_called: { type: string, length: 32, label: 呼び出しツール, searchable: true, sortable: true }
      tool_response: { type: text, label: ツール応答 }
      related_entity: { type: string, length: 64, label: 関連エンティティ, searchable: true, sortable: true }
      related_entity_id: { type: int, label: 関連エンティティ ID, sortable: true }
      sent_at: { type: datetime, required: true, label: 送信時刻, sortable: true }
      created_at: { type: datetime, required: true, label: 作成日時, sortable: true }
      updated_at: { type: datetime, required: true, label: 更新日時, sortable: true }

    forms:
      message_id: { type: string, required: true, label: メッセージ ID, editable: true }
      conversation_id: { type: string, required: true, label: 会話 ID, editable: true }
      sender: { type: select, required: true, label: 送信者, editable: true, options: [user, ai, system] }
      content: { type: textarea, required: true, label: メッセージ内容, editable: true }
      intent: { type: string, label: 意図, editable: true }
      tool_called: { type: select, label: 呼び出しツール, editable: true, options: [query_data, create_record, update_record, approve_record, none] }
      sent_at: { type: datetime, required: true, label: 送信時刻, editable: true }

entities:
  payment:
    table: 'payments'
    key: 'id'
    displayName: '入金/支払'
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order: ['document_no', 'payment_type', 'doc_status', 'business_partner_id', 'payment_date', 'payment_method', 'pay_amt', 'bill_id', 'ap_invoice_id', 'description', 'is_active', 'created_at', 'updated_at']
      filters:
        columns: 4
        order: []
    columns:
      id: { type: int, identity: true, label: 'Id', sortable: true }
      document_no: { type: string, required: true, label: '支払番号', searchable: true, sortable: true }
      payment_type: { type: string, required: true, label: '種別', searchable: true, sortable: true }
      doc_status: { type: string, required: true, label: '状態', searchable: true, sortable: true }
      business_partner_id: { type: int, required: true, label: '取引先', sortable: true }
      payment_date: { type: string, required: true, label: '支払日', searchable: true, sortable: true }
      payment_method: { type: string, label: '支払方法', searchable: true, sortable: true }
      pay_amt: { type: decimal, label: '支払額', sortable: true }
      bill_id: { type: int, label: '請求書ID', sortable: true }
      ap_invoice_id: { type: int, label: '仕入請求ID', sortable: true }
      description: { type: string, label: '備考', searchable: true, sortable: true }
      is_active: { type: int, label: '有効', sortable: true }
      created_at: { type: string, label: '作成日', searchable: true, sortable: true }
      updated_at: { type: string, label: '更新日', searchable: true, sortable: true }
    forms:
      document_no: { type: string, required: true, label: '支払番号', editable: true }
      payment_type:
        type: string
        required: true
        label: '種別'
        editable: true
        options:
          - AR
          - AP
        optionLabels:
          AR: 入金
          AP: 支払
      doc_status:
        type: string
        required: true
        label: '状態'
        editable: true
        options:
          - DR
          - CO
          - VO
        optionLabels:
          DR: 下書き
          CO: 確定
          VO: 無効
      business_partner_id:
        type: int
        required: true
        label: '取引先'
        editable: true
        foreignKey:
          entity: business_partner
          displayColumn: 'name'
      payment_date: { type: string, required: true, label: '支払日', editable: true }
      payment_method:
        type: string
        label: '支払方法'
        editable: true
        options:
          - T
          - C
          - CH
        optionLabels:
          T: 銀行振込
          C: クレジット
          CH: 小切手
      pay_amt: { type: decimal, label: '支払額', editable: true }
      bill_id:
        type: int
        label: '請求書ID'
        editable: true
        foreignKey:
          entity: bill
          displayColumn: 'document_no'
      ap_invoice_id:
        type: int
        label: '仕入請求ID'
        editable: true
        foreignKey:
          entity: ap_invoice
          displayColumn: 'document_no'
      description: { type: string, label: '備考', editable: true }
      is_active: { type: int, label: '有効', editable: true }
      created_at: { type: string, label: '作成日', editable: true }
      updated_at: { type: string, label: '更新日', editable: true }
    filters: {}
    links: {}

entities:
  ai_handovers:
    table: ai_handovers
    key: id
    displayName: AI 人工引継ぎ
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
      enableCount: true

    columns:
      id: { type: int, identity: true, label: ID, sortable: true }
      handover_id: { type: string, length: 64, required: true, label: 引継ぎ ID, searchable: true, sortable: true }
      conversation_id: { type: string, length: 64, required: true, label: 会話 ID, searchable: true, sortable: true }
      user_id: { type: string, length: 64, required: true, label: ユーザー ID, searchable: true, sortable: true }
      user_role: { type: string, length: 32, label: ユーザー役割, searchable: true, sortable: true }
      reason: { type: string, length: 128, required: true, label: 引継ぎ理由, searchable: true, sortable: true }
      reason_detail: { type: text, label: 理由詳細, searchable: true }
      priority: { type: string, length: 16, required: true, label: 優先度, sortable: true }
      target_department: { type: string, length: 32, required: true, label: 対象部門, searchable: true, sortable: true }
      assigned_to: { type: string, length: 64, label: 担当者, searchable: true, sortable: true }
      status: { type: string, length: 16, required: true, label: ステータス, searchable: true, sortable: true }
      assigned_at: { type: datetime, label: 割り当て日時, sortable: true }
      started_at: { type: datetime, label: 対応開始日時, sortable: true }
      completed_at: { type: datetime, label: 対応完了日時, sortable: true }
      notes: { type: text, label: 対応メモ, searchable: true }
      sentiment_score: { type: decimal, precision: 5, scale: 4, label: 感情スコア, sortable: true }
      resolution_time_minutes: { type: int, label: 解決時間（分）, sortable: true }
      user_satisfaction: { type: int, label: ユーザー満足度, sortable: true }
      created_at: { type: datetime, required: true, label: 作成日時, sortable: true }
      updated_at: { type: datetime, required: true, label: 更新日時, sortable: true }

    forms:
      handover_id: { type: string, required: true, label: 引継ぎ ID, editable: true }
      conversation_id: { type: string, required: true, label: 会話 ID, editable: true }
      user_id: { type: string, required: true, label: ユーザー ID, editable: true }
      user_role: { type: select, label: ユーザー役割, editable: true, options: [employee, contract_manager, accountant, purchaser, approver, admin, guest] }
      reason: { type: select, required: true, label: 引継ぎ理由, editable: true, options: [complaint, urgent, complex_query, low_confidence, negative_sentiment, manual_request, system_error] }
      reason_detail: { type: textarea, label: 理由詳細, editable: true }
      priority: { type: select, required: true, label: 優先度, editable: true, options: [high, medium, low] }
      target_department: { type: select, required: true, label: 対象部門, editable: true, options: [contract, billing, accounting, purchasing, management, support] }
      assigned_to: { type: string, label: 担当者, editable: true }
      status: { type: select, required: true, label: ステータス, editable: true, options: [pending, in_progress, completed, closed, cancelled] }
      notes: { type: textarea, label: 対応メモ, editable: true }
      user_satisfaction: { type: int, label: ユーザー満足度, editable: true }

entities:
  ai_knowledge:
    table: ai_knowledge
    key: id
    displayName: AI ナレッジベース
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
      enableCount: true

    columns:
      id: { type: int, identity: true, label: ID, sortable: true }
      knowledge_id: { type: string, length: 64, required: true, label: ナレッジ ID, searchable: true, sortable: true }
      category: { type: string, length: 32, required: true, label: カテゴリ, searchable: true, sortable: true }
      subcategory: { type: string, length: 64, label: サブカテゴリ, searchable: true, sortable: true }
      title: { type: string, length: 256, required: true, label: タイトル, searchable: true, sortable: true }
      question: { type: text, label: 質問, searchable: true }
      answer: { type: text, required: true, label: 回答, searchable: true }
      tags: { type: text, label: タグ, searchable: true }
      target_roles: { type: text, label: 対象役割, searchable: true }
      related_entities: { type: text, label: 関連エンティティ }
      usage_count: { type: int, label: 使用回数, sortable: true }
      helpful_count: { type: int, label: 役に立った数, sortable: true }
      not_helpful_count: { type: int, label: 役に立たなかった数, sortable: true }
      status: { type: string, length: 16, required: true, label: ステータス, searchable: true, sortable: true }
      created_by: { type: string, length: 64, label: 作成者, searchable: true, sortable: true }
      updated_by: { type: string, length: 64, label: 更新者, searchable: true, sortable: true }
      created_at: { type: datetime, required: true, label: 作成日時, sortable: true }
      updated_at: { type: datetime, required: true, label: 更新日時, sortable: true }

    forms:
      knowledge_id: { type: string, required: true, label: ナレッジ ID, editable: true }
      category: { type: select, required: true, label: カテゴリ, editable: true, options: [faq, procedure, business_rule, master_info, template, troubleshooting] }
      subcategory: { type: string, label: サブカテゴリ, editable: true }
      title: { type: string, required: true, label: タイトル, editable: true }
      question: { type: textarea, label: 質問, editable: true }
      answer: { type: textarea, required: true, label: 回答, editable: true }
      tags: { type: string, label: タグ, editable: true }
      target_roles: { type: string, label: 対象役割, editable: true }
      status: { type: select, required: true, label: ステータス, editable: true, options: [draft, active, deprecated, archived] }

# AI ナレッジベース定義
# バージョン: 1.0
# 作成日: 2026-04-07

name: ai_knowledge
displayName: "AI ナレッジベース"
description: "FAQ・操作手順・業務ルール・マスタ情報などの知識を蓄積"

# データベース設定
tableName: ai_knowledge
primaryKey: id

# 機能設定
features:
  searchable: true
  filterable: true
  sortable: true
  exportable: true
  apiEnabled: true
  auditLog: true

# フィールド定義
fields:
  # 基本フィールド
  - name: id
    type: integer
    primaryKey: true
    autoIncrement: true
    displayName: "ID"
    hidden: true

  - name: knowledge_id
    type: string
    maxLength: 64
    displayName: "ナレッジ ID"
    required: true
    unique: true
    description: "一意のナレッジ識別子 (例: KB-xxxx)"
    index: true

  # 分類情報
  - name: category
    type: string
    maxLength: 32
    displayName: "カテゴリ"
    required: true
    lookup:
      values:
        - faq: "FAQ"
        - procedure: "操作手順"
        - business_rule: "業務ルール"
        - master_info: "マスタ情報"
        - template: "テンプレート"
        - troubleshooting: "トラブルシューティング"
    description: "ナレッジカテゴリ"
    index: true

  - name: subcategory
    type: string
    maxLength: 64
    displayName: "サブカテゴリ"
    description: "詳細分類"
    index: true

  # コンテンツ
  - name: title
    type: string
    maxLength: 256
    displayName: "タイトル"
    required: true
    description: "ナレッジタイトル"
    searchable: true

  - name: question
    type: text
    displayName: "質問"
    description: "想定される質問内容"
    searchable: true

  - name: answer
    type: text
    displayName: "回答"
    required: true
    description: "回答内容"
    searchable: true

  - name: tags
    type: text
    displayName: "タグ"
    description: "カンマ区切りのタグリスト"
    searchable: true

  # 対象情報
  - name: target_roles
    type: text
    displayName: "対象役割"
    description: "カンマ区切りの対象役割リスト (例: employee,contract_manager)"

  - name: related_entities
    type: text
    displayName: "関連エンティティ"
    description: "カンマ区切りの関連エンティティリスト"

  # 統計情報
  - name: usage_count
    type: integer
    displayName: "使用回数"
    defaultValue: 0
    description: "このナレッジが参照された回数"
    index: true

  - name: helpful_count
    type: integer
    displayName: "役に立った数"
    defaultValue: 0
    description: "ユーザーが役に立ったと評価した回数"

  - name: not_helpful_count
    type: integer
    displayName: "役に立たなかった数"
    defaultValue: 0
    description: "ユーザーが役に立たなかったと評価した回数"

  # ステータス
  - name: status
    type: string
    maxLength: 16
    displayName: "ステータス"
    required: true
    defaultValue: "active"
    lookup:
      values:
        - draft: "下書き"
        - active: "有効"
        - deprecated: "非推奨"
        - archived: "アーカイブ"
    description: "ナレッジステータス"
    index: true

  # 時間情報
  - name: created_at
    type: datetime
    displayName: "作成日時"
    required: true
    autoGenerate: true
    index: true

  - name: updated_at
    type: datetime
    displayName: "更新日時"
    required: true
    autoGenerate: true

  - name: created_by
    type: string
    maxLength: 64
    displayName: "作成者"
    description: "作成者 ID"

  - name: updated_by
    type: string
    maxLength: 64
    displayName: "更新者"
    description: "更新者 ID"

# リスト表示設定
listView:
  columns:
    - field: knowledge_id
      width: 120
    - field: category
      width: 120
    - field: title
      width: 300
    - field: usage_count
      width: 100
    - field: helpful_count
      width: 100
    - field: status
      width: 100
    - field: created_at
      width: 150

  filters:
    - field: category
      type: dropdown
    - field: status
      type: dropdown
    - field: target_roles
      type: multiselect
    - field: usage_count
      type: range
      min: 0

  sorting:
    default:
      field: usage_count
      direction: desc

# バリデーション
validation:
  rules:
    - field: knowledge_id
      required: true
      pattern: "^KB-[a-zA-Z0-9]+$"
      message: "ナレッジ ID は KB-xxxx 形式で指定してください"
    
    - field: title
      maxLength: 256
      message: "タイトルは256文字以内で指定してください"
    
    - field: answer
      required: true
      message: "回答は必須です"

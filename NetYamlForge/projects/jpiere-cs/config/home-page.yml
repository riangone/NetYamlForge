hero:
  eyebrow: JPiere Cloud Services
  title: JPiere 智能云财务与企业资源计划
  description: 集成财务核算、采购管理、合同执行与库存移动于一体的企业级开源 ERP 最佳实践方案。
  primaryActionLabel: 管理中心
  primaryActionUrl: /jpiere-cs/Dashboard
  secondaryActionLabel: 财务凭证
  secondaryActionUrl: /jpiere-cs/DynamicEntity/List/journal
  highlights:
    - 财务自动化
    - 供应链协同
    - 合约生命周期
    - 多维度核算


  - label: 记账状态
    value: "Standard"
    trend: "合规核算"
    tone: text-primary
  - label: 流程节点
    value: "Workflow"
    trend: "严谨审批"
    tone: text-success
  - label: 资源负载
    value: "Global"
    trend: "全域视角"
    tone: text-secondary

capabilities:
  - icon: 💰
    title: 财务自动化
    description: 涵盖会计凭证自动生成、AP/AR 发票处理及支付结算的闭环财务管理流。
    badge: 核心
  - icon: ⛓️
    title: 供应链深度协同
    description: 无缝集成采购申请、订单、收货与库存移动，确保业务流与资金流高度统一。
    badge: 供应链
  - icon: 📜
    title: 合约全生命周期
    description: 从合同模板定义、起草、审批到履约阶段的标准化管理，降低经营合规风险。
    badge: 合规
  - icon: 🏗️
    title: 多维业务实体
    description: 支持复杂的业务伙伴、产品分类及多层级审批流配置，适配多样化业务模式。
    badge: 扩展


title: 契約詳細
description: "契約ヘッダ情報と明細・請求・売上計上・TODOの関連データを表示"

sections:
  # 契約ヘッダ情報テーブル
  - id: contract_header
    title: 契約情報
    component: table
    sourceType: custom
    source: |
      SELECT
        c.document_no AS 契約番号,
        c.name AS 契約名称,
        CASE c.contract_type
          WHEN 'SAL' THEN '販売契約'
          WHEN 'PUR' THEN '購買契約'
          WHEN 'BOT' THEN '両方'
        END AS 種別,
        CASE c.doc_status
          WHEN 'DR' THEN '下書き'
          WHEN 'IN' THEN '進行中'
          WHEN 'CO' THEN '確定'
          WHEN 'CL' THEN '解約'
          WHEN 'VO' THEN '無効'
        END AS 書類状態,
        CASE c.contract_status
          WHEN 'WP' THEN '交渉中'
          WHEN 'AC' THEN '有効'
          WHEN 'EX' THEN '期限切れ'
          WHEN 'CA' THEN '解約'
        END AS 契約状態,
        bp.name AS 取引先,
        c.period_date_from AS 開始日,
        c.period_date_to AS 終了日,
        c.total_doc_amt AS 契約総額,
        c.monthly_revenue_amt AS 月次売上
      FROM contracts c
      JOIN business_partners bp ON c.business_partner_id = bp.id
      WHERE c.id = @entityId
    columns: [契約番号, 契約名称, 種別, 書類状態, 契約状態, 取引先, 開始日, 終了日, 契約総額, 月次売上]
    pageSize: 1
    editable: false
    readOnly: true

  # 契約明細タブ
  - id: contract_lines
    title: 契約明細
    component: table
    sourceType: custom
    source: |
      SELECT
        cl.line_no AS 行番,
        p.name AS 商品,
        cl.description AS 説明,
        cl.qty AS 数量,
        cl.uom AS 単位,
        cl.unit_price AS 単価,
        cl.line_amt AS 明細金額,
        cl.billing_policy AS 請求方法,
        cl.billing_start_date AS 請求開始日,
        cl.billing_end_date AS 請求終了日
      FROM contract_lines cl
      LEFT JOIN products p ON cl.product_id = p.id
      WHERE cl.contract_id = @entityId AND cl.is_active = 1
      ORDER BY cl.line_no ASC
    columns: [行番, 商品, 説明, 数量, 単位, 単価, 明細金額, 請求方法, 請求開始日, 請求終了日]
    pageSize: 20
    editable: false
    readOnly: true

  # 関連請求
  - id: related_bills
    title: 関連請求
    component: table
    sourceType: custom
    source: |
      SELECT
        b.document_no AS 請求番号,
        CASE b.doc_status
          WHEN 'DR' THEN '下書き'
          WHEN 'CO' THEN '確定'
          WHEN 'VO' THEN '無効'
        END AS 状態,
        b.date_billed AS 請求日,
        b.date_due AS 支払期限,
        b.grand_total AS 請求額,
        b.pay_amt AS 入金額,
        b.outstanding_amt AS 残高
      FROM bills b
      WHERE b.linked_contract_id = @entityId AND b.is_active = 1
      ORDER BY b.date_billed DESC
    columns: [請求番号, 状態, 請求日, 支払期限, 請求額, 入金額, 残高]
    pageSize: 10
    editable: false
    readOnly: true

  # 関連売上計上
  - id: related_recognitions
    title: 関連売上計上
    component: table
    sourceType: custom
    source: |
      SELECT
        r.document_no AS 計上番号,
        CASE r.doc_status
          WHEN 'DR' THEN '下書き'
          WHEN 'CO' THEN '確定'
          WHEN 'VO' THEN '無効'
        END AS 状態,
        r.date_acct AS 計上日,
        r.grand_total AS 計上金額
      FROM recognitions r
      WHERE r.linked_contract_id = @entityId AND r.is_active = 1
      ORDER BY r.date_acct DESC
    columns: [計上番号, 状態, 計上日, 計上金額]
    pageSize: 10
    editable: false
    readOnly: true

  # 関連TODO
  - id: related_todos
    title: 関連TODO
    component: table
    sourceType: custom
    source: |
      SELECT
        t.title AS タイトル,
        CASE t.todo_status
          WHEN 'NY' THEN '未着手'
          WHEN 'IP' THEN '進行中'
          WHEN 'DN' THEN '完了'
          WHEN 'CA' THEN 'キャンセル'
        END AS 状態,
        tc.name AS カテゴリ,
        t.assigned_to AS 担当者,
        t.scheduled_start AS 予定開始
      FROM todos t
      LEFT JOIN todo_categories tc ON t.todo_category_id = tc.id
      WHERE t.linked_contract_id = @entityId AND t.is_active = 1
      ORDER BY t.scheduled_start DESC
    columns: [タイトル, 状態, カテゴリ, 担当者, 予定開始]
    pageSize: 10
    editable: false
    readOnly: true

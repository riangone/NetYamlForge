    en-US: Extend with hooks and business logic while keeping the platform stable and reusable.
    zh-CN: 支持 Hook 与业务逻辑扩展，保持平台稳定同时满足项目定制化。
    ja-JP: Hook と業務ロジックで拡張しつつ、プラットフォームの安定性と再利用性を維持します。

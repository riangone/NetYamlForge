name: vocab-game
displayName: Vocabulary Game
version: "1.0.0"

database:
  type: sqlite
  path: database/vocab-game.db

features:
  multiLanguage: true
  userAuthentication: true
  dashboard: true
  pages: true

layout:
  dashboardTheme: workspace
  header:
    title: "Vocabulary Game"
  navigation:
    showDashboard: true
    entities:
      - vocab_word
      - learning_record
    items:
      - label: Home
        url: /vocab-game
        icon: 🏠
      - label: 单词挑战
        url: /vocab-game/Page/Game
        icon: 🎮
      - label: Dashboard
        controller: Dashboard
        action: Index
        icon: 📊

home_page:
  icon: "🗂️"
  tagline: "Vocabulary Game - 背单词游戏"
  tags: []

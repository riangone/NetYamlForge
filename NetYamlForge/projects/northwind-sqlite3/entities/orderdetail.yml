imports: []
entities:
  orderdetail:
    table: OrderDetails
    key: OrderDetailId
    keys: []
    displayName: Order Detail
    joins:
    - type: left
      table: Orders
      alias: o
      true: OrderDetails.OrderId = o.OrderId
    - type: left
      table: Products
      alias: p
      true: OrderDetails.ProductId = p.ProductId
    forms:
      OrderId:
        type: int
        identity: false
        required: true
        label: Order
        searchable: false
        sortable: false
        editable: true
        foreignKey:
          entity: order
          displayColumn: Id
          displayColumns:
          - OrderId
          - OrderDate
          - Status
          query: 'SELECT OrderId AS Id, OrderId, OrderDate, Status

            FROM Orders

            '
          picker: false
          multiPicker: false
        hidden: false
      ProductId:
        type: int
        identity: false
        required: true
        label: Product
        searchable: false
        sortable: false
        editable: true
        foreignKey:
          entity: product
          displayColumn: Id
          displayColumns:
          - ProductName
          - UnitPrice
          - UnitsInStock
          query: 'SELECT ProductId AS Id, ProductName, UnitPrice, UnitsInStock

            FROM Products

            WHERE Discontinued = 0

            '
          picker: true
          multiPicker: false
        hidden: false
      UnitPrice:
        type: decimal
        identity: false
        required: true
        label: Unit Price
        searchable: false
        sortable: false
        editable: true
        hidden: false
      Quantity:
        type: int
        identity: false
        required: true
        label: Quantity
        searchable: false
        sortable: false
        editable: true
        hidden: false
      Discount:
        type: decimal
        identity: false
        required: false
        label: Discount
        searchable: false
        sortable: false
        editable: true
        hidden: false
    columns:
      OrderDetailId:
        type: int
        identity: true
        required: false
        label: ID
        searchable: false
        sortable: true
        editable: true
        hidden: false
      OrderId:
        type: int
        identity: false
        required: true
        label: Order
        searchable: false
        sortable: true
        editable: true
        hidden: true
      OrderSummary:
        type: string
        identity: true
        required: false
        label: Order
        searchable: true
        sortable: true
        editable: true
        expression: o.OrderId || ' / ' || o.OrderDate || ' / ' || o.Status
        hidden: false
      ProductId:
        type: int
        identity: false
        required: true
        label: Product
        searchable: false
        sortable: true
        editable: true
        hidden: true
      ProductName:
        type: string
        identity: true
        required: false
        label: Product
        searchable: true
        sortable: true
        editable: true
        expression: p.ProductName
        hidden: false
      UnitPrice:
        type: decimal
        identity: false
        required: true
        label: Unit Price
        searchable: false
        sortable: true
        editable: true
        hidden: false
      Quantity:
        type: int
        identity: false
        required: true
        label: Quantity
        searchable: false
        sortable: true
        editable: true
        hidden: false
      Discount:
        type: decimal
        identity: false
        required: false
        label: Discount
        searchable: false
        sortable: true
        editable: true
        hidden: false
      LineTotal:
        type: decimal
        identity: true
        required: false
        label: Line Total
        searchable: false
        sortable: true
        editable: true
        expression: (OrderDetails.UnitPrice * OrderDetails.Quantity) * (1 - OrderDetails.Discount)
        hidden: false
    paging:
      pageSize: 15
      mode: numbered
      enableCount: true
    layout:
      forms:
        columns: 2
        order:
        - OrderId
        - ProductId
        - UnitPrice
        - Quantity
        - Discount
      filters:
        columns: 4
        order:
        - OrderId
        - ProductId
        - Quantity
    softDelete: false
    isPublic: true
    filters:
      OrderId:
        type: entity-picker
        label: Order
        expression: OrderDetails.OrderId
        foreignKey:
          entity: order
          displayColumn: Id
          displayColumns:
          - OrderId
          - OrderDate
          - Status
          picker: false
          multiPicker: false
      ProductId:
        type: dropdown
        label: Product
        expression: OrderDetails.ProductId
        foreignKey:
          entity: product
          displayColumn: Id
          displayColumns:
          - ProductName
          - UnitPrice
          picker: false
          multiPicker: false
      Quantity:
        type: range
        label: Quantity
        expression: OrderDetails.Quantity
    links:
      order:
        label: Order
        targetEntity: order
        filter:
          OrderId: OrderId
      product:
        label: Product
        targetEntity: product
        filter:
          ProductId: ProductId
    isCompositeKey: false
    displayNameKey: projects.northwind-sqlite3.entities.orderdetail.entities.orderdetail.displayName

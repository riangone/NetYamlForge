entities:
  supplier:
    table: Suppliers
    key: SupplierId
    displayName: Supplier
    softDelete: false
    paging:
      pageSize: 12
      mode: numbered
    layout:
      forms:
        columns: 2
        order:
        - CompanyName
        - ContactName
        - Country
        - Phone
        - Active
      filters:
        columns: 3
        order:
        - Country
        - Active
    columns:
      SupplierId:
        type: int
        identity: true
        label: ID
        sortable: true
      CompanyName:
        type: string
        required: true
        label: Company
        searchable: true
        sortable: true
      ContactName:
        type: string
        label: Contact
        searchable: true
        sortable: true
      Country:
        type: string
        label: Country
        searchable: true
        sortable: true
      Phone:
        type: string
        label: Phone
        searchable: true
        sortable: false
      Active:
        type: bool
        label: Active
        sortable: true
    forms:
      CompanyName:
        type: string
        required: true
        label: Company
        editable: true
      ContactName:
        type: string
        label: Contact
        editable: true
      Country:
        type: string
        label: Country
        editable: true
      Phone:
        type: string
        label: Phone
        editable: true
      Active:
        type: bool
        label: Active
        editable: true
    filters:
      Country:
        type: multi-select
        label: Country
        options:
        - UK
        - USA
        - Japan
      Active:
        type: dropdown
        label: Active
        options:
        - 1
        - 0
    links:
      products:
        label: Products
        targetEntity: product
        filter:
          SupplierId: SupplierId
    displayNameKey: projects.northwind-sqlite3.entities.supplier.entities.supplier.displayName

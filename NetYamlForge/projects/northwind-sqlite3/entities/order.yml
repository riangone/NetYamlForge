imports: []
entities:
  order:
    table: Orders
    key: OrderId
    keys: []
    displayName: Order
    joins:
    - type: left
      table: Customers
      alias: c
      true: Orders.CustomerId = c.CustomerId
    - type: left
      table: Employees
      alias: e
      true: Orders.EmployeeId = e.EmployeeId
    - type: left
      table: Shippers
      alias: s
      true: Orders.ShipperId = s.ShipperId
    forms:
      CustomerId:
        type: int
        identity: false
        required: true
        label: Customer
        searchable: false
        sortable: false
        editable: true
        foreignKey:
          entity: customer
          displayColumn: Id
          displayColumns:
          - CompanyName
          - ContactName
          - Country
          query: 'SELECT CustomerId AS Id, CompanyName, ContactName, Country

            FROM Customers

            WHERE Active = 1

            '
          picker: true
          multiPicker: false
        hidden: false
      EmployeeId:
        type: int
        identity: false
        required: true
        label: Employee
        searchable: false
        sortable: false
        editable: true
        foreignKey:
          entity: employee
          displayColumn: Id
          displayColumns:
          - LastName
          - FirstName
          - Title
          query: 'SELECT EmployeeId AS Id, LastName, FirstName, Title

            FROM Employees

            '
          picker: false
          multiPicker: false
        hidden: false
      OrderDate:
        type: date
        identity: false
        required: true
        label: Order Date
        searchable: false
        sortable: false
        editable: true
        hidden: false
      RequiredDate:
        type: date
        identity: false
        required: false
        label: Required Date
        searchable: false
        sortable: false
        editable: true
        hidden: false
      ShippedDate:
        type: date
        identity: false
        required: false
        label: Shipped Date
        searchable: false
        sortable: false
        editable: true
        hidden: false
      ShipperId:
        type: int
        identity: false
        required: false
        label: Shipper
        searchable: false
        sortable: false
        editable: true
        foreignKey:
          entity: shipper
          displayColumn: Id
          displayColumns:
          - CompanyName
          picker: false
          multiPicker: false
        hidden: false
      Freight:
        type: decimal
        identity: false
        required: false
        label: Freight
        searchable: false
        sortable: false
        editable: true
        hidden: false
      ShipCountry:
        type: string
        identity: false
        required: false
        label: Ship Country
        searchable: false
        sortable: false
        editable: true
        hidden: false
      Status:
        type: string
        identity: false
        required: false
        label: Status
        searchable: false
        sortable: false
        editable: true
        options:
        - Open
        - Shipped
        - Delayed
        - Cancelled
        hidden: false
      RelatedProductIds:
        type: string
        identity: false
        required: false
        label: Related Products
        searchable: false
        sortable: false
        editable: true
        foreignKey:
          entity: product
          displayColumn: Id
          displayColumns:
          - ProductName
          - UnitPrice
          - UnitsInStock
          query: 'SELECT ProductId AS Id, ProductName, UnitPrice, UnitsInStock

            FROM Products

            WHERE Discontinued = 0

            '
          picker: false
          multiPicker: true
        hidden: false
    columns:
      OrderId:
        type: int
        identity: true
        required: false
        label: ID
        searchable: false
        sortable: true
        editable: true
        hidden: false
      CustomerId:
        type: int
        identity: false
        required: true
        label: Customer
        searchable: false
        sortable: true
        editable: true
        hidden: true
      CustomerName:
        type: string
        identity: true
        required: false
        label: Customer
        searchable: true
        sortable: true
        editable: true
        expression: c.CompanyName || ' / ' || c.ContactName
        hidden: false
      EmployeeId:
        type: int
        identity: false
        required: true
        label: Employee
        searchable: false
        sortable: true
        editable: true
        hidden: true
      EmployeeName:
        type: string
        identity: true
        required: false
        label: Employee
        searchable: true
        sortable: true
        editable: true
        expression: e.LastName || ', ' || e.FirstName
        hidden: false
      OrderDate:
        type: date
        identity: false
        required: true
        label: Order Date
        searchable: false
        sortable: true
        editable: true
        hidden: false
      RequiredDate:
        type: date
        identity: false
        required: false
        label: Required Date
        searchable: false
        sortable: true
        editable: true
        hidden: false
      ShippedDate:
        type: date
        identity: false
        required: false
        label: Shipped Date
        searchable: false
        sortable: true
        editable: true
        hidden: false
      ShipperId:
        type: int
        identity: false
        required: false
        label: Shipper
        searchable: false
        sortable: true
        editable: true
        hidden: true
      ShipperName:
        type: string
        identity: true
        required: false
        label: Shipper
        searchable: true
        sortable: true
        editable: true
        expression: s.CompanyName
        hidden: false
      Freight:
        type: decimal
        identity: false
        required: false
        label: Freight
        searchable: false
        sortable: true
        editable: true
        hidden: false
      ShipCountry:
        type: string
        identity: false
        required: false
        label: Ship Country
        searchable: true
        sortable: true
        editable: true
        hidden: false
      Status:
        type: string
        identity: false
        required: false
        label: Status
        searchable: true
        sortable: true
        editable: true
        hidden: false
      RelatedProductIds:
        type: string
        identity: false
        required: false
        label: Related Products
        searchable: false
        sortable: false
        editable: true
        hidden: true
    paging:
      pageSize: 12
      mode: numbered
      enableCount: false
    layout:
      forms:
        columns: 2
        order:
        - CustomerId
        - EmployeeId
        - OrderDate
        - RequiredDate
        - ShippedDate
        - ShipperId
        - Freight
        - ShipCountry
        - Status
        - RelatedProductIds
      filters:
        columns: 4
        order:
        - CustomerId
        - EmployeeId
        - ShipCountry
        - Status
        - OrderDate
    softDelete: false
    isPublic: true
    filters:
      CustomerId:
        type: entity-picker
        label: Customer
        expression: Orders.CustomerId
        foreignKey:
          entity: customer
          displayColumn: Id
          displayColumns:
          - CompanyName
          - ContactName
          - Country
          query: 'SELECT CustomerId AS Id, CompanyName, ContactName, Country

            FROM Customers

            WHERE Active = 1

            '
          picker: false
          multiPicker: false
      EmployeeId:
        type: dropdown
        label: Employee
        expression: Orders.EmployeeId
        foreignKey:
          entity: employee
          displayColumn: Id
          displayColumns:
          - LastName
          - FirstName
          - Title
          picker: false
          multiPicker: false
      ShipCountry:
        type: multi-select
        label: Ship Country
        options:
        - Germany
        - UK
        - USA
        - Brazil
        - Canada
        - France
        - Italy
      Status:
        type: dropdown
        label: Status
        options:
        - Open
        - Shipped
        - Delayed
        - Cancelled
      OrderDate:
        type: date-range
        label: Order Date
        expression: Orders.OrderDate
    links:
      customer:
        label: Customer
        targetEntity: customer
        filter:
          CustomerId: CustomerId
      employee:
        label: Employee
        targetEntity: employee
        filter:
          EmployeeId: EmployeeId
      details:
        label: Order Details
        targetEntity: orderdetail
        filter:
          OrderId: OrderId
    isCompositeKey: false
    displayNameKey: projects.northwind-sqlite3.entities.order.entities.order.displayName

title: 配送遅延監視
title_en: Shipping Delay Monitor
description: 出荷遅延と期限超過受注を確認します。

mainTable: Orders

sections:
  - id: delayed_orders
    title: 遅延受注
    type: custom
    sourceType: custom
    source: |
      SELECT
        o.OrderId,
        c.CompanyName AS Customer,
        (e.LastName || ', ' || e.FirstName) AS Employee,
        o.OrderDate,
        o.RequiredDate,
        o.ShippedDate,
        o.Status,
        o.ShipCountry,
        CAST(julianday(COALESCE(o.ShippedDate, date('now'))) - julianday(o.RequiredDate) AS INT) AS DelayDays
      FROM Orders o
      LEFT JOIN Customers c ON o.CustomerId = c.CustomerId
      LEFT JOIN Employees e ON o.EmployeeId = e.EmployeeId
      WHERE o.RequiredDate IS NOT NULL
        AND COALESCE(o.ShippedDate, date('now')) > o.RequiredDate
    columns:
      - OrderId
      - Customer
      - Employee
      - OrderDate
      - RequiredDate
      - ShippedDate
      - Status
      - ShipCountry
      - DelayDays
    pageSize: 50
    editable: false
    readOnly: true
    filters:
      Customer:
        label: 顧客
        type: like
      Status:
        label: ステータス
        type: select
        options:
          Open: Open
          Delayed: Delayed
          Shipped: Shipped

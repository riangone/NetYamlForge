title: 低在庫アラート
title_en: Low Stock Alert
description: 再発注レベルを下回る商品を監視します。

mainTable: Products

sections:
  - id: low_stock
    title: 要対応商品
    type: custom
    sourceType: custom
    source: |
      SELECT
        p.ProductId,
        p.ProductName,
        s.CompanyName AS Supplier,
        c.CategoryName AS Category,
        p.UnitsInStock,
        p.ReorderLevel,
        (p.ReorderLevel - p.UnitsInStock) AS Shortage
      FROM Products p
      LEFT JOIN Suppliers s ON p.SupplierId = s.SupplierId
      LEFT JOIN Categories c ON p.CategoryId = c.CategoryId
      WHERE p.Discontinued = 0
        AND p.UnitsInStock <= p.ReorderLevel
    columns:
      - ProductId
      - ProductName
      - Supplier
      - Category
      - UnitsInStock
      - ReorderLevel
      - Shortage
    pageSize: 50
    editable: false
    readOnly: true
    filters:
      ProductName:
        label: 商品名
        type: like
      Supplier:
        label: 仕入先
        type: like

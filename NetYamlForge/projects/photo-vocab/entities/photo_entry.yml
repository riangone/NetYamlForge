imports: []
entities:
  photo_entry:
    table: PhotoEntry
    key: Id
    displayName: 学习图片
    softDelete: false
    isPublic: false
    api: enabled

    forms:
      AnnotationLanguage:
        type: select
        required: true
        label: 标注语言
        labelKey: projects.photo-vocab.entity.photo_entry.fields.annotationLanguage
        editable: true
        options:
          - zh-CN
          - en-US
          - ja-JP
          - ko-KR
        optionLabels:
          zh-CN: 简体中文
          en-US: English
          ja-JP: 日本語
          ko-KR: 한국어
      ImageBase64:
        type: string
        label: 上传图片
        labelKey: projects.photo-vocab.entity.photo_entry.fields.imageBase64
        editable: true
        placeholder: "点击或拖拽上传图片"
      ImageThumbnailBase64:
        type: string
        label: 缩略图片数据
        labelKey: projects.photo-vocab.entity.photo_entry.fields.imageThumbnailBase64
        editable: true
      Caption:
        type: textarea
        label: AI 图片描述
        labelKey: projects.photo-vocab.entity.photo_entry.fields.caption
        editable: true
        placeholder: "保存后由 AI 自动生成"
      WordCount:
        type: int
        label: 提取单词数
        labelKey: projects.photo-vocab.entity.photo_entry.fields.wordCount
        editable: true

    columns:
      Id:
        type: int
        identity: true
        label: ID
        labelKey: projects.photo-vocab.entity.photo_entry.fields.id
        sortable: true
      AnnotationLanguage:
        type: string
        label: 标注语言
        labelKey: projects.photo-vocab.entity.photo_entry.fields.annotationLanguage
        sortable: true
      ImageBase64:
        type: string
        label: 图片数据
        labelKey: projects.photo-vocab.entity.photo_entry.fields.imageBase64
      ImageThumbnailBase64:
        type: string
        label: 缩略图片数据
        labelKey: projects.photo-vocab.entity.photo_entry.fields.imageThumbnailBase64
      Caption:
        type: string
        label: AI 图片描述
        labelKey: projects.photo-vocab.entity.photo_entry.fields.caption
        searchable: true
      WordCount:
        type: int
        label: 提取单词数
        labelKey: projects.photo-vocab.entity.photo_entry.fields.wordCount
        sortable: true
      CreatedAt:
        type: datetime
        label: 上传时间
        labelKey: projects.photo-vocab.entity.photo_entry.fields.createdAt
        sortable: true

    hooks:
      beforeCreate:
        - now:CreatedAt
        - analyze_photo_and_extract_vocab
      afterCreate:
        - analyze_photo_and_extract_vocab

    paging:
      pageSize: 12
      mode: numbered
      enableCount: true

    layout:
      forms:
        columns: 1
        order:
          - AnnotationLanguage
          - ImageBase64
          - Caption
      filters:
        columns: 2
        order:
          - AnnotationLanguage

    filters:
      AnnotationLanguage:
        type: dropdown
        label: 标注语言
        labelKey: projects.photo-vocab.entity.photo_entry.fields.annotationLanguage
        options:
          - zh-CN
          - en-US
          - ja-JP
          - ko-KR

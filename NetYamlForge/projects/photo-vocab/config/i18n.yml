  projects.photo-vocab.pages.PhotoUpload.form.createDesc:
    en-US: 'Pick any annotation language — the AI will write a caption and a few vocabulary words for you to learn.'
    zh-CN: '标注语言可以任意选择，AI 会自动生成图片描述并挑选几个单词供你背诵。'
    ja-JP: '注釈言語は自由に選べます。AI が画像の説明と、覚えるための単語をいくつか自動生成します。'
    ko-KR: '주석 언어는 자유롭게 선택할 수 있습니다. AI가 사진 설명과 외울 단어 몇 개를 자동으로 생성합니다.'

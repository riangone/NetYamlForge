entities:
  version:
    table: version
    key: id
    displayName: バージョン
    displayNameI18n:
      ja-JP: バージョン
      zh-CN: 版本
      en-US: Version
    joins:
      - type: left
        table: rm_project
        alias: p
        on: "version.project_id = p.id"
    columns:
      id:
        type: int
        identity: true
        label: ID
        sortable: true
        hidden: false
      project_id:
        type: int
        required: true
        label: プロジェクトID
        labelI18n: {ja-JP: プロジェクトID, zh-CN: 项目ID, en-US: Project ID}
        hidden: false
      project_name:
        type: string
        expression: "p.name"
        label: プロジェクト
        labelI18n: {ja-JP: プロジェクト, zh-CN: 项目, en-US: Project}
        searchable: true
        hidden: false
      name:
        type: string
        required: true
        label: バージョン名
        labelI18n: {ja-JP: バージョン名, zh-CN: 版本名称, en-US: Version Name}
        searchable: true
        sortable: true
        hidden: false
      description:
        type: string
        label: 説明
        labelI18n: {ja-JP: 説明, zh-CN: 描述, en-US: Description}
        searchable: true
        hidden: false
      status:
        type: string
        label: ステータス
        labelI18n: {ja-JP: ステータス, zh-CN: 状态, en-US: Status}
        sortable: true
        hidden: false
      due_date:
        type: date
        label: 期日
        labelI18n: {ja-JP: 期日, zh-CN: 截止日期, en-US: Due Date}
        sortable: true
        hidden: false
      created_on:
        type: string
        label: 作成日時
        labelI18n: {ja-JP: 作成日時, zh-CN: 创建时间, en-US: Created On}
        sortable: true
        hidden: false
    forms:
      project_id:
        type: int
        required: true
        label: プロジェクトID
        editable: true
        hidden: false
      name:
        type: string
        required: true
        label: バージョン名
        editable: true
        hidden: false
      description:
        type: string
        required: false
        label: 説明
        editable: true
        hidden: false
      status:
        type: string
        required: false
        label: ステータス
        editable: true
        hidden: false
      due_date:
        type: date
        required: false
        label: 期日
        editable: true
        hidden: false
    layout:
      forms:
        columns: 2
        order: [project_id, name, description, status, due_date]
      filters:
        columns: 3
        order: [project_id, status]
    filters:
      project_id:
        type: like
        label: プロジェクトID
      status:
        type: dropdown
        label: ステータス
        options: [open, locked, closed]
    hooks:
      beforeCreate:
        - validate_required
        - trim
      beforeUpdate:
        - validate_required
        - trim

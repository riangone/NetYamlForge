entities:
  wiki_page:
    table: wiki_page
    key: id
    displayName: Wikiページ
    displayNameI18n:
      ja-JP: Wikiページ
      zh-CN: Wiki页面
      en-US: Wiki Page
    joins:
      - type: left
        table: rm_project
        alias: p
        on: "wiki_page.project_id = p.id"
    columns:
      id:
        type: int
        identity: true
        label: ID
        sortable: true
        hidden: false
      project_id:
        type: int
        required: true
        label: プロジェクトID
        labelI18n: {ja-JP: プロジェクトID, zh-CN: 项目ID, en-US: Project ID}
        hidden: false
      project_name:
        type: string
        expression: "p.name"
        label: プロジェクト
        labelI18n: {ja-JP: プロジェクト, zh-CN: 项目, en-US: Project}
        searchable: true
        hidden: false
      title:
        type: string
        required: true
        label: タイトル
        labelI18n: {ja-JP: タイトル, zh-CN: 标题, en-US: Title}
        searchable: true
        sortable: true
        hidden: false
      content:
        type: string
        label: 内容 (Markdown)
        labelI18n: {ja-JP: 内容 (Markdown), zh-CN: 内容 (Markdown), en-US: Content (Markdown)}
        searchable: true
        hidden: false
      author:
        type: string
        required: true
        label: 最終更新者
        labelI18n: {ja-JP: 最終更新者, zh-CN: 最后编辑者, en-US: Author}
        searchable: true
        sortable: true
        hidden: false
      created_on:
        type: string
        label: 作成日時
        labelI18n: {ja-JP: 作成日時, zh-CN: 创建时间, en-US: Created On}
        sortable: true
        hidden: false
      updated_on:
        type: string
        label: 更新日時
        labelI18n: {ja-JP: 更新日時, zh-CN: 更新时间, en-US: Updated On}
        sortable: true
        hidden: false
    forms:
      project_id:
        type: int
        required: true
        label: プロジェクトID
        editable: true
        hidden: false
      title:
        type: string
        required: true
        label: タイトル
        editable: true
        hidden: false
      content:
        type: string
        required: false
        label: 内容 (Markdown)
        editable: true
        hidden: false
      author:
        type: string
        required: true
        label: 最終更新者
        editable: true
        hidden: false
    layout:
      forms:
        columns: 2
        order: [project_id, title, content, author]
      filters:
        columns: 3
        order: [author]
    filters:
      author:
        type: like
        label: 最終更新者
    hooks:
      beforeCreate:
        - validate_required
        - trim
      beforeUpdate:
        - validate_required
        - trim

entities:
  issue:
    table: issue
    key: id
    displayName: チケット
    displayNameI18n:
      ja-JP: チケット
      zh-CN: 工单
      en-US: Issue
    joins:
      - type: left
        table: rm_project
        alias: proj
        on: "issue.project_id = proj.id"
      - type: left
        table: tracker
        alias: tr
        on: "issue.tracker_id = tr.id"
      - type: left
        table: issue_status
        alias: st
        on: "issue.status_id = st.id"
      - type: left
        table: issue_priority
        alias: pri
        on: "issue.priority_id = pri.id"
    columns:
      id:
        type: int
        identity: true
        label: ID
        sortable: true
        hidden: false
      project_id:
        type: int
        required: true
        label: プロジェクトID
        labelI18n: {ja-JP: プロジェクトID, zh-CN: 项目ID, en-US: Project ID}
        hidden: false
      project_name:
        type: string
        expression: "proj.name"
        label: プロジェクト
        labelI18n: {ja-JP: プロジェクト, zh-CN: 项目, en-US: Project}
        searchable: true
        hidden: false
      tracker_id:
        type: int
        required: true
        label: トラッカーID
        labelI18n: {ja-JP: トラッカーID, zh-CN: 跟踪器ID, en-US: Tracker ID}
        hidden: false
      tracker_name:
        type: string
        expression: "tr.name"
        label: トラッカー
        labelI18n: {ja-JP: トラッカー, zh-CN: 跟踪器, en-US: Tracker}
        sortable: true
        hidden: false
      status_id:
        type: int
        required: true
        label: ステータスID
        labelI18n: {ja-JP: ステータスID, zh-CN: 状态ID, en-US: Status ID}
        hidden: false
      status_name:
        type: string
        expression: "st.name"
        label: ステータス
        labelI18n: {ja-JP: ステータス, zh-CN: 状态, en-US: Status}
        sortable: true
        hidden: false
      priority_id:
        type: int
        required: true
        label: 優先度ID
        labelI18n: {ja-JP: 優先度ID, zh-CN: 优先级ID, en-US: Priority ID}
        hidden: false
      priority_name:
        type: string
        expression: "pri.name"
        label: 優先度
        labelI18n: {ja-JP: 優先度, zh-CN: 优先级, en-US: Priority}
        sortable: true
        hidden: false
      subject:
        type: string
        required: true
        label: タイトル
        labelI18n: {ja-JP: タイトル, zh-CN: 标题, en-US: Subject}
        searchable: true
        sortable: true
        hidden: false
      description:
        type: string
        label: 説明
        labelI18n: {ja-JP: 説明, zh-CN: 描述, en-US: Description}
        searchable: true
        hidden: false
      assigned_to:
        type: string
        label: 担当者
        labelI18n: {ja-JP: 担当者, zh-CN: 负责人, en-US: Assigned To}
        searchable: true
        sortable: true
        hidden: false
      author:
        type: string
        required: true
        label: 作成者
        labelI18n: {ja-JP: 作成者, zh-CN: 作者, en-US: Author}
        searchable: true
        sortable: true
        hidden: false
      category_id:
        type: int
        label: カテゴリID
        labelI18n: {ja-JP: カテゴリID, zh-CN: 类别ID, en-US: Category ID}
        hidden: false
      version_id:
        type: int
        label: バージョンID
        labelI18n: {ja-JP: バージョンID, zh-CN: 版本ID, en-US: Version ID}
        hidden: false
      start_date:
        type: date
        label: 開始日
        labelI18n: {ja-JP: 開始日, zh-CN: 开始日期, en-US: Start Date}
        sortable: true
        hidden: false
      due_date:
        type: date
        label: 期日
        labelI18n: {ja-JP: 期日, zh-CN: 截止日期, en-US: Due Date}
        sortable: true
        hidden: false
      done_ratio:
        type: int
        label: 進捗率(%)
        labelI18n: {ja-JP: 進捗率(%), zh-CN: 完成比例(%), en-US: Done(%)}
        sortable: true
        hidden: false
      estimated_hours:
        type: decimal
        label: 予定工数(h)
        labelI18n: {ja-JP: 予定工数(h), zh-CN: 预计工时(h), en-US: Est. Hours}
        sortable: true
        hidden: false
      created_on:
        type: string
        label: 作成日時
        labelI18n: {ja-JP: 作成日時, zh-CN: 创建时间, en-US: Created On}
        sortable: true
        hidden: false
      updated_on:
        type: string
        label: 更新日時
        labelI18n: {ja-JP: 更新日時, zh-CN: 更新时间, en-US: Updated On}
        sortable: true
        hidden: false
      closed_on:
        type: string
        label: クローズ日時
        labelI18n: {ja-JP: クローズ日時, zh-CN: 关闭时间, en-US: Closed On}
        sortable: true
        hidden: false
    forms:
      project_id:
        type: int
        required: true
        label: プロジェクトID
        editable: true
        hidden: false
      tracker_id:
        type: int
        required: true
        label: トラッカーID
        editable: true
        hidden: false
      status_id:
        type: int
        required: true
        label: ステータスID
        editable: true
        hidden: false
      priority_id:
        type: int
        required: true
        label: 優先度ID
        editable: true
        hidden: false
      subject:
        type: string
        required: true
        label: タイトル
        editable: true
        hidden: false
      description:
        type: string
        required: false
        label: 説明
        editable: true
        hidden: false
      assigned_to:
        type: string
        required: false
        label: 担当者
        editable: true
        hidden: false
      author:
        type: string
        required: true
        label: 作成者
        editable: true
        hidden: false
      category_id:
        type: int
        required: false
        label: カテゴリID
        editable: true
        hidden: false
      version_id:
        type: int
        required: false
        label: バージョンID
        editable: true
        hidden: false
      start_date:
        type: date
        required: false
        label: 開始日
        editable: true
        hidden: false
      due_date:
        type: date
        required: false
        label: 期日
        editable: true
        hidden: false
      done_ratio:
        type: int
        required: false
        label: 進捗率(%)
        editable: true
        hidden: false
      estimated_hours:
        type: decimal
        required: false
        label: 予定工数(h)
        editable: true
        hidden: false
    layout:
      forms:
        columns: 2
        order: [project_id, tracker_id, status_id, priority_id, subject, description, assigned_to, author, category_id, version_id, start_date, due_date, done_ratio, estimated_hours]
      filters:
        columns: 3
        order: [assigned_to, tracker_id, status_id]
    filters:
      assigned_to:
        type: like
        label: 担当者
      tracker_id:
        type: like
        label: トラッカーID
      status_id:
        type: like
        label: ステータスID
    hooks:
      beforeCreate:
        - validate_required
        - now
        - trim
      beforeUpdate:
        - validate_required
        - validate_issue_status_transition
        - now
        - trim
      afterUpdate:
        - set_issue_closed_on

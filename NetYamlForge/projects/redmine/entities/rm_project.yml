entities:
  rm_project:
    table: rm_project
    key: id
    displayName: プロジェクト
    displayNameI18n:
      ja-JP: プロジェクト
      zh-CN: 项目
      en-US: Project
    columns:
      id:
        type: int
        identity: true
        label: ID
        sortable: true
        hidden: false
      name:
        type: string
        required: true
        label: プロジェクト名
        labelI18n: {ja-JP: プロジェクト名, zh-CN: 项目名称, en-US: Name}
        searchable: true
        sortable: true
        hidden: false
      identifier:
        type: string
        required: true
        label: 識別子
        labelI18n: {ja-JP: 識別子, zh-CN: 标识符, en-US: Identifier}
        searchable: true
        sortable: true
        hidden: false
      description:
        type: string
        label: 説明
        labelI18n: {ja-JP: 説明, zh-CN: 描述, en-US: Description}
        searchable: true
        hidden: false
      status:
        type: int
        label: ステータス
        labelI18n: {ja-JP: ステータス, zh-CN: 状态, en-US: Status}
        sortable: true
        hidden: false
      homepage:
        type: string
        label: ホームページ
        labelI18n: {ja-JP: ホームページ, zh-CN: 主页, en-US: Homepage}
        hidden: false
      is_public:
        type: int
        label: 公開
        labelI18n: {ja-JP: 公開, zh-CN: 公开, en-US: Public}
        hidden: false
      created_on:
        type: string
        label: 作成日時
        labelI18n: {ja-JP: 作成日時, zh-CN: 创建时间, en-US: Created On}
        sortable: true
        hidden: false
      updated_on:
        type: string
        label: 更新日時
        labelI18n: {ja-JP: 更新日時, zh-CN: 更新时间, en-US: Updated On}
        sortable: true
        hidden: false
    forms:
      name:
        type: string
        required: true
        label: プロジェクト名
        editable: true
        hidden: false
      identifier:
        type: string
        required: true
        label: 識別子
        editable: true
        hidden: false
      description:
        type: string
        required: false
        label: 説明
        editable: true
        hidden: false
      status:
        type: int
        required: false
        label: ステータス
        editable: true
        hidden: false
      homepage:
        type: string
        required: false
        label: ホームページ
        editable: true
        hidden: false
      is_public:
        type: int
        required: false
        label: 公開
        editable: true
        hidden: false
    layout:
      forms:
        columns: 2
        order: [name, identifier, description, status, homepage, is_public]
    hooks:
      beforeCreate:
        - validate_required
        - trim
      beforeUpdate:
        - validate_required
        - trim

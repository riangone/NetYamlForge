entities:
  member:
    table: member
    key: id
    displayName: メンバー
    displayNameI18n:
      ja-JP: メンバー
      zh-CN: 成员
      en-US: Member
    joins:
      - type: left
        table: rm_project
        alias: p
        on: "member.project_id = p.id"
    columns:
      id:
        type: int
        identity: true
        label: ID
        sortable: true
        hidden: false
      project_id:
        type: int
        required: true
        label: プロジェクトID
        labelI18n: {ja-JP: プロジェクトID, zh-CN: 项目ID, en-US: Project ID}
        hidden: false
      project_name:
        type: string
        expression: "p.name"
        label: プロジェクト
        labelI18n: {ja-JP: プロジェクト, zh-CN: 项目, en-US: Project}
        searchable: true
        hidden: false
      username:
        type: string
        required: true
        label: ユーザー名
        labelI18n: {ja-JP: ユーザー名, zh-CN: 用户名, en-US: Username}
        searchable: true
        sortable: true
        hidden: false
      role:
        type: string
        label: ロール
        labelI18n: {ja-JP: ロール, zh-CN: 角色, en-US: Role}
        sortable: true
        hidden: false
      created_on:
        type: string
        label: 参加日時
        labelI18n: {ja-JP: 参加日時, zh-CN: 加入时间, en-US: Joined On}
        sortable: true
        hidden: false
    forms:
      project_id:
        type: int
        required: true
        label: プロジェクトID
        editable: true
        hidden: false
      username:
        type: string
        required: true
        label: ユーザー名
        editable: true
        hidden: false
      role:
        type: string
        required: false
        label: ロール
        editable: true
        hidden: false
    layout:
      forms:
        columns: 2
        order: [project_id, username, role]
      filters:
        columns: 3
        order: [project_id, role]
    filters:
      project_id:
        type: like
        label: プロジェクトID
      role:
        type: dropdown
        label: ロール
        options: [manager, developer, reporter, guest]
    hooks:
      beforeCreate:
        - validate_required
        - trim
      beforeUpdate:
        - validate_required
        - trim

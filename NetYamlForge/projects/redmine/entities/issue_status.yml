entities:
  issue_status:
    table: issue_status
    key: id
    displayName: ステータス
    displayNameI18n:
      ja-JP: ステータス
      zh-CN: 状态
      en-US: Issue Status
    columns:
      id:
        type: int
        identity: true
        label: ID
        sortable: true
        hidden: false
      name:
        type: string
        required: true
        label: 名前
        labelI18n: {ja-JP: 名前, zh-CN: 名称, en-US: Name}
        searchable: true
        sortable: true
        hidden: false
      is_closed:
        type: int
        label: クローズ状態
        labelI18n: {ja-JP: クローズ状態, zh-CN: 已关闭, en-US: Is Closed}
        sortable: true
        hidden: false
      position:
        type: int
        label: 表示順
        labelI18n: {ja-JP: 表示順, zh-CN: 排序, en-US: Position}
        sortable: true
        hidden: false
    forms:
      name:
        type: string
        required: true
        label: 名前
        editable: true
        hidden: false
      is_closed:
        type: int
        required: false
        label: クローズ状態
        editable: true
        hidden: false
      position:
        type: int
        required: false
        label: 表示順
        editable: true
        hidden: false
    layout:
      forms:
        columns: 2
        order: [name, is_closed, position]
    hooks:
      beforeCreate:
        - validate_required
        - trim
      beforeUpdate:
        - validate_required
        - trim

entities:
  issue_category:
    table: issue_category
    key: id
    displayName: カテゴリ
    displayNameI18n:
      ja-JP: カテゴリ
      zh-CN: 类别
      en-US: Category
    joins:
      - type: left
        table: rm_project
        alias: p
        on: "issue_category.project_id = p.id"
    columns:
      id:
        type: int
        identity: true
        label: ID
        sortable: true
        hidden: false
      project_id:
        type: int
        required: true
        label: プロジェクトID
        labelI18n: {ja-JP: プロジェクトID, zh-CN: 项目ID, en-US: Project ID}
        hidden: false
      project_name:
        type: string
        expression: "p.name"
        label: プロジェクト
        labelI18n: {ja-JP: プロジェクト, zh-CN: 项目, en-US: Project}
        searchable: true
        hidden: false
      name:
        type: string
        required: true
        label: カテゴリ名
        labelI18n: {ja-JP: カテゴリ名, zh-CN: 类别名称, en-US: Category Name}
        searchable: true
        sortable: true
        hidden: false
    forms:
      project_id:
        type: int
        required: true
        label: プロジェクトID
        editable: true
        hidden: false
      name:
        type: string
        required: true
        label: カテゴリ名
        editable: true
        hidden: false
    layout:
      forms:
        columns: 2
        order: [project_id, name]
      filters:
        columns: 3
        order: [project_id]
    filters:
      project_id:
        type: like
        label: プロジェクトID
    hooks:
      beforeCreate:
        - validate_required
        - trim
      beforeUpdate:
        - validate_required
        - trim

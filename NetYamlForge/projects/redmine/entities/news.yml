entities:
  news:
    table: news
    key: id
    displayName: ニュース
    displayNameI18n:
      ja-JP: ニュース
      zh-CN: 新闻
      en-US: News
    joins:
      - type: left
        table: rm_project
        alias: p
        on: "news.project_id = p.id"
    columns:
      id:
        type: int
        identity: true
        label: ID
        sortable: true
        hidden: false
      project_id:
        type: int
        required: true
        label: プロジェクトID
        labelI18n: {ja-JP: プロジェクトID, zh-CN: 项目ID, en-US: Project ID}
        hidden: false
      project_name:
        type: string
        expression: "p.name"
        label: プロジェクト
        labelI18n: {ja-JP: プロジェクト, zh-CN: 项目, en-US: Project}
        searchable: true
        hidden: false
      title:
        type: string
        required: true
        label: タイトル
        labelI18n: {ja-JP: タイトル, zh-CN: 标题, en-US: Title}
        searchable: true
        sortable: true
        hidden: false
      summary:
        type: string
        label: 要約
        labelI18n: {ja-JP: 要約, zh-CN: 摘要, en-US: Summary}
        searchable: true
        hidden: false
      description:
        type: string
        label: 本文
        labelI18n: {ja-JP: 本文, zh-CN: 内容, en-US: Description}
        searchable: true
        hidden: false
      author:
        type: string
        required: true
        label: 投稿者
        labelI18n: {ja-JP: 投稿者, zh-CN: 作者, en-US: Author}
        searchable: true
        sortable: true
        hidden: false
      created_on:
        type: string
        label: 投稿日時
        labelI18n: {ja-JP: 投稿日時, zh-CN: 发布时间, en-US: Published At}
        sortable: true
        hidden: false
    forms:
      project_id:
        type: int
        required: true
        label: プロジェクトID
        editable: true
        hidden: false
      title:
        type: string
        required: true
        label: タイトル
        editable: true
        hidden: false
      summary:
        type: string
        required: false
        label: 要約
        editable: true
        hidden: false
      description:
        type: string
        required: false
        label: 本文
        editable: true
        hidden: false
      author:
        type: string
        required: true
        label: 投稿者
        editable: true
        hidden: false
    layout:
      forms:
        columns: 2
        order: [project_id, title, summary, description, author]
      filters:
        columns: 3
        order: [author]
    filters:
      author:
        type: like
        label: 投稿者
    hooks:
      beforeCreate:
        - validate_required
        - trim
      beforeUpdate:
        - validate_required
        - trim

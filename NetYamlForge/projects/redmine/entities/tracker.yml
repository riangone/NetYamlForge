entities:
  tracker:
    table: tracker
    key: id
    displayName: トラッカー
    displayNameI18n:
      ja-JP: トラッカー
      zh-CN: 跟踪器
      en-US: Tracker
    columns:
      id:
        type: int
        identity: true
        label: ID
        sortable: true
        hidden: false
      name:
        type: string
        required: true
        label: 名前
        labelI18n: {ja-JP: 名前, zh-CN: 名称, en-US: Name}
        searchable: true
        sortable: true
        hidden: false
      position:
        type: int
        label: 表示順
        labelI18n: {ja-JP: 表示順, zh-CN: 排序, en-US: Position}
        sortable: true
        hidden: false
      is_in_roadmap:
        type: int
        label: ロードマップ表示
        labelI18n: {ja-JP: ロードマップ表示, zh-CN: 路线图显示, en-US: In Roadmap}
        hidden: false
    forms:
      name:
        type: string
        required: true
        label: 名前
        editable: true
        hidden: false
      position:
        type: int
        required: false
        label: 表示順
        editable: true
        hidden: false
      is_in_roadmap:
        type: int
        required: false
        label: ロードマップ表示
        editable: true
        hidden: false
    layout:
      forms:
        columns: 2
        order: [name, position, is_in_roadmap]
    hooks:
      beforeCreate:
        - validate_required
        - trim
      beforeUpdate:
        - validate_required
        - trim

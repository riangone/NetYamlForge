entities:
  forum:
    table: forum
    key: id
    displayName: フォーラム
    displayNameI18n:
      ja-JP: フォーラム
      zh-CN: 论坛
      en-US: Forum
    joins:
      - type: left
        table: rm_project
        alias: p
        on: "forum.project_id = p.id"
    columns:
      id:
        type: int
        identity: true
        label: ID
        sortable: true
        hidden: false
      project_id:
        type: int
        required: true
        label: プロジェクトID
        labelI18n: {ja-JP: プロジェクトID, zh-CN: 项目ID, en-US: Project ID}
        hidden: false
      project_name:
        type: string
        expression: "p.name"
        label: プロジェクト
        labelI18n: {ja-JP: プロジェクト, zh-CN: 项目, en-US: Project}
        searchable: true
        hidden: false
      name:
        type: string
        required: true
        label: フォーラム名
        labelI18n: {ja-JP: フォーラム名, zh-CN: 论坛名称, en-US: Forum Name}
        searchable: true
        sortable: true
        hidden: false
      description:
        type: string
        label: 説明
        labelI18n: {ja-JP: 説明, zh-CN: 描述, en-US: Description}
        searchable: true
        hidden: false
    forms:
      project_id:
        type: int
        required: true
        label: プロジェクトID
        editable: true
        hidden: false
      name:
        type: string
        required: true
        label: フォーラム名
        editable: true
        hidden: false
      description:
        type: string
        required: false
        label: 説明
        editable: true
        hidden: false
    layout:
      forms:
        columns: 2
        order: [project_id, name, description]
    hooks:
      beforeCreate:
        - validate_required
        - trim
      beforeUpdate:
        - validate_required
        - trim

name: redmine
displayName: Redmine Clone
displayNameI18n:
  ja-JP: プロジェクト管理 (Redmine風)
  zh-CN: 项目管理系统 (Redmine风)
  en-US: Project Management (Redmine-style)

database:
  type: sqlite
  path: database/redmine.db

features:
  dashboard: true
  i18n: true

defaultLocale: ja-JP
supportedLocales: [ja-JP, zh-CN, en-US]

nav:
  - label: ダッシュボード
    labelKey: nav.dashboard
    href: /redmine/Dashboard/Index
    icon: 📊
  - label: チケット
    labelKey: nav.issue
    href: /redmine/DynamicEntity/Index?entity=issue
    icon: 🎫
  - label: プロジェクト
    labelKey: nav.rm_project
    href: /redmine/DynamicEntity/Index?entity=rm_project
    icon: 📁
  - label: 作業時間
    labelKey: nav.time_entry
    href: /redmine/DynamicEntity/Index?entity=time_entry
    icon: ⏱️
  - label: バージョン
    labelKey: nav.version
    href: /redmine/DynamicEntity/Index?entity=version
    icon: 🏷️
  - label: ニュース
    labelKey: nav.news
    href: /redmine/DynamicEntity/Index?entity=news
    icon: 📰
  - label: Wiki
    labelKey: nav.wiki_page
    href: /redmine/DynamicEntity/Index?entity=wiki_page
    icon: 📖
  - label: フォーラム
    labelKey: nav.forum
    href: /redmine/DynamicEntity/Index?entity=forum
    icon: 💬
  - label: メンバー
    labelKey: nav.member
    href: /redmine/DynamicEntity/Index?entity=member
    icon: 👥
  - label: トラッカー
    labelKey: nav.tracker
    href: /redmine/DynamicEntity/Index?entity=tracker
    icon: ⚙️
  - label: ステータス
    labelKey: nav.issue_status
    href: /redmine/DynamicEntity/Index?entity=issue_status
    icon: ⚙️
  - label: 優先度
    labelKey: nav.issue_priority
    href: /redmine/DynamicEntity/Index?entity=issue_priority
    icon: ⚙️

aiHints:
  customHooks:
    - set_issue_closed_on
    - validate_issue_status_transition
  notes:
    - "issue はシステムの中心エンティティ。project/tracker/status/priority への JOIN を保持すること"
    - "status_id が is_closed=1 のステータスに変更されたとき closed_on を自動設定する"
    - "ステータス遷移: 新規→進行中→解決済み→完了 / 新規→却下"
    - "time_entry.hours は正の数値のみ許可"
    - "rm_project.identifier は一意・変更禁止"
  protectedEntities:
    - issue
    - time_entry

layout:
  dashboardTheme: workspace

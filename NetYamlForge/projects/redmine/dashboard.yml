stats:
- label: "オープンチケット"
  labelKey: "projects.redmine.dashboard.stats.0.label"
  entity: issue
  aggregate: count
  column: id
  filter: "closed_on IS NULL"
  icon: "🎫"
  color: "badge-primary"

- label: "本日クローズ"
  labelKey: "projects.redmine.dashboard.stats.1.label"
  entity: issue
  aggregate: count
  column: id
  filter: "date(closed_on) = date('now')"
  icon: "✅"
  color: "badge-success"

- label: "期限切れ"
  labelKey: "projects.redmine.dashboard.stats.2.label"
  entity: issue
  aggregate: count
  column: id
  filter: "due_date < date('now') AND closed_on IS NULL"
  icon: "⚠️"
  color: "badge-error"

- label: "アクティブプロジェクト"
  labelKey: "projects.redmine.dashboard.stats.3.label"
  entity: rm_project
  aggregate: count
  column: id
  filter: "status = 1"
  icon: "📁"
  color: "badge-info"

- label: "今週の作業時間(h)"
  labelKey: "projects.redmine.dashboard.stats.4.label"
  entity: time_entry
  aggregate: sum
  column: hours
  filter: "spent_on >= date('now', '-7 days')"
  icon: "⏱️"
  color: "badge-warning"

charts:
- title: "ステータス別チケット数"
  titleKey: "projects.redmine.dashboard.charts.0.title"
  type: doughnut
  entity: issue
  groupExpression: "status_id"
  valueAggregate: count
  valueColumn: id
  filter: "closed_on IS NULL"
  colorsJson: |
    ["rgba(76,175,80,0.8)","rgba(33,150,243,0.8)","rgba(255,193,7,0.8)","rgba(255,87,34,0.8)","rgba(158,158,158,0.8)","rgba(244,67,54,0.8)"]

- title: "優先度別チケット数"
  titleKey: "projects.redmine.dashboard.charts.1.title"
  type: bar
  entity: issue
  groupExpression: "priority_id"
  valueAggregate: count
  valueColumn: id
  filter: "closed_on IS NULL"
  colorBg: "rgba(244, 67, 54, 0.7)"
  colorBorder: "rgb(244, 67, 54)"

- title: "トラッカー別チケット数"
  titleKey: "projects.redmine.dashboard.charts.2.title"
  type: bar
  entity: issue
  groupExpression: "tracker_id"
  valueAggregate: count
  valueColumn: id
  colorBg: "rgba(54, 162, 235, 0.7)"
  colorBorder: "rgb(54, 162, 235)"

- title: "プロジェクト別作業時間"
  titleKey: "projects.redmine.dashboard.charts.3.title"
  type: bar
  entity: time_entry
  groupExpression: "project_id"
  valueAggregate: sum
  valueColumn: hours
  colorBg: "rgba(255, 159, 64, 0.7)"
  colorBorder: "rgb(255, 159, 64)"

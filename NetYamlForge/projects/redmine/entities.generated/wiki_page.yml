entities:
  wiki_page:
    table: 'wiki_page'
    key: 'id'
    displayName: 'Wiki Page'
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order: ['project_id', 'title', 'content', 'author', 'created_on', 'updated_on']
      filters:
        columns: 4
        order: []
    columns:
      id: { type: int, identity: true, label: 'Id', sortable: true }
      project_id: { type: int, required: true, label: 'Project Id', sortable: true }
      title: { type: string, required: true, label: 'Title', searchable: true, sortable: true }
      content: { type: string, label: 'Content', searchable: true, sortable: true }
      author: { type: string, required: true, label: 'Author', searchable: true, sortable: true }
      created_on: { type: string, label: 'Created On', searchable: true, sortable: true }
      updated_on: { type: string, label: 'Updated On', searchable: true, sortable: true }
    forms:
      project_id:
        type: int
        required: true
        label: 'Project Id'
        editable: true
        foreignKey:
          entity: rm_project
          displayColumn: 'name'
      title: { type: string, required: true, label: 'Title', editable: true }
      content: { type: string, label: 'Content', editable: true }
      author: { type: string, required: true, label: 'Author', editable: true }
      created_on: { type: string, label: 'Created On', editable: true }
      updated_on: { type: string, label: 'Updated On', editable: true }
    filters: {}
    links: {}

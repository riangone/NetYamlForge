    table: 'member'
    key: 'id'
    displayName: 'Member'
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order: ['project_id', 'username', 'role', 'created_on']
      filters:
        columns: 4
        order: []
    columns:
      id: { type: int, identity: true, label: 'Id', sortable: true }
      project_id: { type: int, required: true, label: 'Project Id', sortable: true }
      username: { type: string, required: true, label: 'Username', searchable: true, sortable: true }
      role: { type: string, label: 'Role', searchable: true, sortable: true }
      created_on: { type: string, label: 'Created On', searchable: true, sortable: true }
    forms:
      project_id:
        type: int
        required: true
        label: 'Project Id'
        editable: true
        foreignKey:
          entity: rm_project
          displayColumn: 'name'
      username: { type: string, required: true, label: 'Username', editable: true }
      role: { type: string, label: 'Role', editable: true }
      created_on: { type: string, label: 'Created On', editable: true }
    filters: {}
    links: {}

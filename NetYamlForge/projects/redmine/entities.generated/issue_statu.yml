entities:
  issue_statu:
    table: 'issue_status'
    key: 'id'
    displayName: 'Issue Statu'
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order: ['name', 'is_closed', 'position']
      filters:
        columns: 4
        order: []
    columns:
      id: { type: int, identity: true, label: 'Id', sortable: true }
      name: { type: string, required: true, label: 'Name', searchable: true, sortable: true }
      is_closed: { type: int, label: 'Is Closed', sortable: true }
      position: { type: int, label: 'Position', sortable: true }
    forms:
      name: { type: string, required: true, label: 'Name', editable: true }
      is_closed: { type: int, label: 'Is Closed', editable: true }
      position: { type: int, label: 'Position', editable: true }
    filters: {}
    links: {}

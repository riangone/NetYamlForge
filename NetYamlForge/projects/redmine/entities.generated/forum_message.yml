entities:
  forum_message:
    table: 'forum_message'
    key: 'id'
    displayName: 'Forum Message'
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order: ['forum_id', 'parent_id', 'author', 'subject', 'content', 'created_on']
      filters:
        columns: 4
        order: []
    columns:
      id: { type: int, identity: true, label: 'Id', sortable: true }
      forum_id: { type: int, required: true, label: 'Forum Id', sortable: true }
      parent_id: { type: int, label: 'Parent Id', sortable: true }
      author: { type: string, required: true, label: 'Author', searchable: true, sortable: true }
      subject: { type: string, required: true, label: 'Subject', searchable: true, sortable: true }
      content: { type: string, label: 'Content', searchable: true, sortable: true }
      created_on: { type: string, label: 'Created On', searchable: true, sortable: true }
    forms:
      forum_id:
        type: int
        required: true
        label: 'Forum Id'
        editable: true
        foreignKey:
          entity: forum
          displayColumn: 'name'
      parent_id: { type: int, label: 'Parent Id', editable: true }
      author: { type: string, required: true, label: 'Author', editable: true }
      subject: { type: string, required: true, label: 'Subject', editable: true }
      content: { type: string, label: 'Content', editable: true }
      created_on: { type: string, label: 'Created On', editable: true }
    filters: {}
    links: {}

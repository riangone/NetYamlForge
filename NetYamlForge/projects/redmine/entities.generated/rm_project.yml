entities:
  rm_project:
    table: 'rm_project'
    key: 'id'
    displayName: 'Rm Project'
    softDelete: false
    paging:
      pageSize: 20
      mode: numbered
    layout:
      forms:
        columns: 2
        order: ['name', 'identifier', 'description', 'status', 'homepage', 'is_public', 'created_on', 'updated_on']
      filters:
        columns: 4
        order: []
    columns:
      id: { type: int, identity: true, label: 'Id', sortable: true }
      name: { type: string, required: true, label: 'Name', searchable: true, sortable: true }
      identifier: { type: string, required: true, label: 'Identifier', searchable: true, sortable: true }
      description: { type: string, label: 'Description', searchable: true, sortable: true }
      status: { type: int, label: 'Status', sortable: true }
      homepage: { type: string, label: 'Homepage', searchable: true, sortable: true }
      is_public: { type: int, label: 'Is Public', sortable: true }
      created_on: { type: string, label: 'Created On', searchable: true, sortable: true }
      updated_on: { type: string, label: 'Updated On', searchable: true, sortable: true }
    forms:
      name: { type: string, required: true, label: 'Name', editable: true }
      identifier: { type: string, required: true, label: 'Identifier', editable: true }
      description: { type: string, label: 'Description', editable: true }
      status: { type: int, label: 'Status', editable: true }
      homepage: { type: string, label: 'Homepage', editable: true }
      is_public: { type: int, label: 'Is Public', editable: true }
      created_on: { type: string, label: 'Created On', editable: true }
      updated_on: { type: string, label: 'Updated On', editable: true }
    filters: {}
    links: {}

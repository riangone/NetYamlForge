apiVersion: skills.netyamlforge.io/v1
kind: Skill
metadata:
  name: scaffold-batch-job
  version: "1.0.0"
  displayName: バッチジョブ生成
  description: |
    cron スケジュールで動作するバッチジョブの雛形を生成します。
    SQL ベース（sql_to_csv）または C# カスタムハンドラーの
    2 つのテンプレートから選択できます。
  category: scaffolding
  tier: 4
  icon: "⏰"
  tags:
    - batch-jobs
    - scheduling
    - cron
    - automation
  author: NetYamlForge Team
  createdAt: "2026-04-16T00:00:00Z"
  updatedAt: "2026-04-16T00:00:00Z"

spec:
  # 入力パラメータ定義
  inputs:
    required:
      - project
      - name
    properties:
      project:
        type: string
        description: |
          プロジェクト名（kebab-case）
          バッチジョブが属するプロジェクトを指定
        pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
        minLength: 3
        maxLength: 64
        example: "my-project"

      name:
        type: string
        description: |
          ジョブ名（snake_case）
          例: daily_report, weekly_sync, batch_cleanup
        pattern: "^[a-z0-9][a-z0-9_]*[a-z0-9]$"
        minLength: 3
        maxLength: 128
        example: "daily_report"

      type:
        type: string
        enum:
          - sql_to_csv
          - custom_handler
        description: |
          ジョブタイプ
          - sql_to_csv: SQL 実行結果を CSV に出力（シンプル）
          - custom_handler: C# IBatchJobHandler 実装（複雑なロジック向け）
        default: "sql_to_csv"
        example: "sql_to_csv"

      display-name:
        type: string
        description: |
          ジョブ表示名（日本語対応）
          UI やログで表示される名前
        minLength: 1
        maxLength: 128
        example: "日次レポート生成"

      schedule:
        type: string
        description: |
          cron スケジュール式（標準 Unix cron 形式）
          5 フィールド: 分 時 日 月 曜日
          例: "0 2 * * *" = 毎日 02:00
        pattern: "^(\\*|\\d+|\\d+-\\d+|\\*/\\d+)(\\s+(\\*|\\d+|\\d+-\\d+|\\*/\\d+)){4}$"
        default: "0 2 * * *"
        example: "0 2 * * *"

      with-hook:
        type: boolean
        description: |
          true の場合、実行前フック（前処理・バリデーション）も生成
          false の場合、ジョブ定義とハンドラーのみ生成
        default: true
        example: true

  # 実行の前提条件
  requirements:
    dotnetVersion: ">=10.0.0"
    tools:
      - dotnet
      - git
    projectExists: true
    fileExists:
      - "projects/{project}/project.yaml"
      - "projects/{project}/jobs/"

  # 実行ステップ
  execution:
    type: dotnet-cli
    steps:
      - name: "パラメータ検証"
        type: validation
        description: |
          ジョブ名・スケジュール式・タイプの妥当性をチェック
        command: |
          dotnet run --project NetYamlForge \
            -- --validate-batch-job \
               --project={project} \
               --name={name} \
               --type={type} \
               --schedule="{schedule}"
        onError: abort
        timeout: 30

      - name: "ジョブ定義生成"
        type: execution
        description: |
          jobs/{name}.yml を生成
          cron スケジュール・リトライ設定・タイプ設定を含む
        command: |
          dotnet run --project NetYamlForge \
            -- --scaffold-batch-job \
               --project={project} \
               --name={name} \
               --type={type} \
               --schedule="{schedule}" \
               --display-name="{display-name}"
        onError: abort
        timeout: 60

      - name: "SQL テンプレート生成（sql_to_csv 時）"
        type: execution
        description: |
          type=sql_to_csv の場合、jobs/sql/{name}.sql テンプレートを生成
        command: |
          dotnet run --project NetYamlForge \
            -- --scaffold-batch-job-sql \
               --project={project} \
               --name={name}
        onError: continue
        timeout: 30

      - name: "C# ハンドラー生成（custom_handler 時）"
        type: execution
        description: |
          type=custom_handler の場合、Hooks/{name}BatchJobHandler.cs を生成
        command: |
          dotnet run --project NetYamlForge \
            -- --scaffold-batch-job-handler \
               --project={project} \
               --name={name} \
               {% if with_hook %}--with-hook{% endif %}
        onError: continue
        timeout: 60

      - name: "ビルド検証"
        type: validation
        description: |
          生成されたコードがビルド可能か確認
        command: |
          dotnet build --configuration Debug \
            --no-restore \
            /p:TreatWarningsAsErrors=false
        onError: abort
        timeout: 180

  # 出力仕様
  outputs:
    successCriteria:
      - "dotnet コマンド終了コード: 0"
      - "ジョブ定義ファイルが生成された"
      - "type に応じた関連ファイルが生成された"
      - "ビルド成功"

    outputFormat:
      type: markdown
      structure:
        summary: |
          実行サマリー
          - ジョブ名・表示名
          - タイプ・スケジュール
          - 生成ファイル一覧
        generatedFiles: |
          生成されたファイル
          - ジョブ定義ファイル
          - SQL/C# ファイル
        configuration: |
          ジョブ設定の詳細
          - cron スケジュール例
          - リトライ設定
          - タイムアウト設定
        nextSteps: "推奨される次のアクション"
        notes: |
          注意事項
          - project.yaml への登録方法
          - 実行前に確認すべき事項

    files:
      - pattern: "projects/{project}/jobs/{name}.yml"
        description: |
          ジョブ定義ファイル
          - cron スケジュール
          - ジョブタイプ
          - リトライ・タイムアウト設定

      - pattern: "projects/{project}/jobs/sql/{name}.sql"
        description: |
          SQL クエリテンプレート（sql_to_csv 型のみ）
          - 実行 SQL
          - CSV 出力形式

      - pattern: "projects/{project}/Hooks/{name}BatchJobHandler.cs"
        description: |
          C# カスタムハンドラー（custom_handler 型のみ）
          - IBatchJobHandler 実装
          - Execute メソッド

      - pattern: "projects/{project}/Hooks/{name}_BeforeHook.cs"
        description: |
          実行前フック（--with-hook 時）
          - バリデーション
          - 前処理

  # 許可ツール
  allowedTools:
    - bash
    - dotnet
    - file-read
    - file-write
    - file-edit
    - file-glob
    - git

  # 学習・改善フィードバック
  learning:
    successMetrics:
      - name: job_generation_success
        type: boolean
        description: "ジョブ生成が成功したか"

      - name: build_success
        type: boolean
        description: "生成コードがビルド成功したか"

      - name: execution_time
        type: time
        unit: seconds
        target: 60
        description: "全体実行時間の目標"

    feedbackTemplate: |
      ジョブ生成結果のフィードバック（任意）:
      
      1. ジョブ生成は期待通りでしたか？
         - [ ] はい
         - [ ] いいえ
         - [ ] 部分的
      
      2. 生成されたテンプレートの有用性:
         - [ ] 高い（そのまま使用可能）
         - [ ] 中程度（カスタマイズが必要）
         - [ ] 低い（大幅に修正が必要）
      
      3. cron スケジュール設定は正確でしたか？
         - [ ] はい
         - [ ] いいえ
         - [ ] 未確認
      
      4. 改善提案（オプション）:
         [ここに改善提案を記入]

    improvementLog:
      - date: "2026-04-16T00:00:00Z"
        change: "初版リリース"
        impact: "バッチジョブ定義の自動生成が可能"

# 依存関係
dependencies:
  requires:
    - new-project
  recommends:
    - run-tests
    - build-check

# 既知の問題・制限事項
limitations:
  - description: |
      SQL テンプレート（sql_to_csv）の自動生成は基本的なスケルトンのみ
    workaround: |
      生成後に jobs/sql/{name}.sql を手動で実装してください

  - description: |
      複雑なビジネスロジックを必要とするジョブは custom_handler 推奨
    workaround: |
      type=custom_handler で生成し、IBatchJobHandler を実装してください

  - description: |
      cron スケジュール式の複雑な条件（例: 最終金曜日）は表現できない
    workaround: |
      ジョブ定義生成後に手動で schedule フィールドを調整してください

  - description: |
      ジョブ名が既に存在する場合、上書きされる可能性がある
    workaround: |
      既存ファイルのバックアップを作成してから実行してください

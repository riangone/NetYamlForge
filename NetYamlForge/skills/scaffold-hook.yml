apiVersion: skills.netyamlforge.io/v1
kind: Skill
metadata:
  name: scaffold-hook
  version: "1.0.0"
  displayName: フック生成
  description: |
    IEntityHook インターフェイス実装クラスを自動生成します。
    BeforeAsync（DB操作前）と AfterAsync（DB操作後）の雛形を生成し、
    カスタムビジネスロジック実装の基盤を提供します。
  category: scaffolding
  tier: 3
  icon: "🔗"
  tags:
    - hooks
    - business-logic
    - scaffolding
    - automation
  author: NetYamlForge Team
  createdAt: "2026-04-16T00:00:00Z"
  updatedAt: "2026-04-16T00:00:00Z"

spec:
  # 入力パラメータ定義
  inputs:
    required:
      - name
      - project
    properties:
      name:
        type: string
        description: |
          フック名（PascalCase）
          例: ValidateOrder, AuditTrail, SendNotification
        pattern: "^[A-Z][a-zA-Z0-9]*$"
        minLength: 3
        maxLength: 128
        example: "ValidateOrder"

      project:
        type: string
        description: |
          プロジェクト名（kebab-case）
          フックが属するプロジェクトを指定
        pattern: "^[a-z0-9][a-z0-9-]*[a-z0-9]$"
        minLength: 3
        maxLength: 64
        example: "my-project"

      with-tests:
        type: boolean
        description: |
          true の場合、xUnit テストファイルも同時に生成
          false の場合、フッククラスのみ生成
        default: false
        example: false

      entity-name:
        type: string
        description: |
          フックが対象とするエンティティ名（オプション）
          指定すると、生成テンプレートがそのエンティティ特有の処理を含める
        pattern: "^[a-zA-Z_][a-zA-Z0-9_]*$"
        minLength: 1
        maxLength: 128
        example: "Order"

  # 実行の前提条件
  requirements:
    dotnetVersion: ">=10.0.0"
    tools:
      - dotnet
      - git
    projectExists: true
    fileExists:
      - "projects/{project}/project.yaml"
      - "projects/{project}/Hooks/"

  # 実行ステップ
  execution:
    type: dotnet-cli
    steps:
      - name: "パラメータ検証"
        type: validation
        description: |
          フック名が有効な PascalCase か、プロジェクトが存在するかチェック
        command: |
          dotnet run --project NetYamlForge \
            -- --validate-hook-name --name={name} \
               --project={project}
        onError: abort
        timeout: 30

      - name: "フッククラス生成"
        type: execution
        description: |
          IEntityHook 実装クラスのテンプレートを生成
          BeforeAsync と AfterAsync メソッドを含む
        command: |
          dotnet run --project NetYamlForge \
            -- --scaffold-hook \
               --name={name} \
               --project={project} \
               {% if entity_name %}--entity-name={entity_name}{% endif %}
        onError: abort
        timeout: 60

      - name: "テストファイル生成（オプション）"
        type: execution
        description: |
          --with-tests が指定されている場合、xUnit テストファイルを生成
        command: |
          dotnet run --project NetYamlForge \
            -- --scaffold-hook \
               --name={name} \
               --project={project} \
               --with-tests
        onError: continue
        timeout: 60

      - name: "ビルド検証"
        type: validation
        description: |
          生成されたコードがビルド可能か確認
        command: |
          dotnet build --configuration Debug \
            --no-restore \
            /p:TreatWarningsAsErrors=false
        onError: abort
        timeout: 180

  # 出力仕様
  outputs:
    successCriteria:
      - "dotnet コマンド終了コード: 0"
      - "フッククラスファイルが生成された"
      - "コード生成エラーなし"
      - "ビルド成功"

    outputFormat:
      type: markdown
      structure:
        summary: |
          実行サマリー
          - 生成フッククラス名
          - ファイルパス
          - テスト生成状況
        generatedFiles: |
          生成されたファイル一覧
          - メインフッククラス
          - テストファイル（生成された場合）
        codeTemplate: |
          生成コードの主な構造
          - BeforeAsync メソッド
          - AfterAsync メソッド
          - 依存関係の例
        nextSteps: "推奨される次のアクション"
        notes: "注意事項・確認事項"

    files:
      - pattern: "projects/{project}/Hooks/{name}Hook.cs"
        description: |
          生成されたフッククラス
          - IEntityHook インターフェイス実装
          - BeforeAsync メソッド（DB操作前）
          - AfterAsync メソッド（DB操作後）
          - コメント付きテンプレート

      - pattern: "NetYamlForge.Tests/Hooks/{name}HookTests.cs"
        description: |
          生成されたテストファイル（--with-tests 時）
          - 正常系テスト
          - 異常系テスト
          - フィールド欠落テスト

  # 許可ツール
  allowedTools:
    - bash
    - dotnet
    - file-read
    - file-write
    - file-edit
    - file-glob
    - git

  # 学習・改善フィードバック
  learning:
    successMetrics:
      - name: execution_time
        type: time
        unit: seconds
        target: 60
        description: "全体実行時間の目標"

      - name: code_generation_success
        type: boolean
        description: "コード生成が成功したか"

      - name: build_success
        type: boolean
        description: "生成コードがビルド成功したか"

    feedbackTemplate: |
      実行結果のフィードバック（任意）:
      
      1. フック生成は期待通りでしたか？
         - [ ] はい
         - [ ] いいえ
         - [ ] 部分的
      
      2. 生成されたテンプレートの有用性:
         - [ ] 高い（そのまま実装開始可能）
         - [ ] 中程度（カスタマイズが必要）
         - [ ] 低い（大幅に修正が必要）
      
      3. テスト生成の有用性（--with-tests の場合）:
         - [ ] 高い
         - [ ] 中程度
         - [ ] 低い
      
      4. 改善提案（オプション）:
         [ここに改善提案を記入]

    improvementLog:
      - date: "2026-04-16T00:00:00Z"
        change: "初版リリース"
        impact: "IEntityHook 実装クラスの自動生成が可能"

# 依存関係
dependencies:
  requires:
    - new-project
  recommends:
    - run-tests
    - build-check

# 既知の問題・制限事項
limitations:
  - description: |
      生成テンプレートは汎用的な雛形であり、
      ビジネスロジックの完全実装は含まれていない
    workaround: |
      生成後に BeforeAsync / AfterAsync メソッドの実装を完成させてください

  - description: |
      複数エンティティに関連するフックの場合、
      生成テンプレートはシングルエンティティ想定
    workaround: |
      必要に応じてテンプレートをカスタマイズしてください

  - description: |
      フック名が既に存在する場合、上書きされる可能性がある
    workaround: |
      既存ファイルのバックアップを作成してから実行してください

  - description: |
      テスト生成時、カスタムアサーションやモック設定が完全でない場合がある
    workaround: |
      生成テストを参考に、必要に応じてカスタマイズしてください
